name: BB63 Pilot D1 schema only (NO DATA / NO DEPLOY)
on:
  push:
    branches:
      - feature/bb63-current-memory-version-20261103
    paths:
      - 'scripts/bb63-d1-schema-readonly.mjs'
      - '.github/workflows/bb63-d1-schema-readonly.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  schema-only:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate fixed SQL and ensure no data-reading or mutating commands
        run: |
          node --check scripts/bb63-d1-schema-readonly.mjs
          grep -F "FROM sqlite_master" scripts/bb63-d1-schema-readonly.mjs
          ! grep -E "(['\"](DELETE|UPDATE|INSERT|DROP|ALTER|CREATE|REPLACE|TRUNCATE)[[:space:]])" scripts/bb63-d1-schema-readonly.mjs
      - name: Inspect exact live Core D1 schema by fixed metadata SELECT only
        env:
          TALERA_V62_CF_READ_TOKEN: ${{ secrets.TALERA_V62_CLOUDFLARE_READ_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/bb63-d1-schema-readonly.mjs
      - name: Save sanitized schema evidence only
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: bb63-core-d1-schema-${{ github.sha }}
          path: .talera-bb63-evidence/d1-schema-readonly.json
          if-no-files-found: warn
          retention-days: 45
