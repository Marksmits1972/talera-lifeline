name: BB63 existing version activation precheck — read-only
on:
  push:
    branches:
      - feature/bb63-current-memory-version-20261103
    paths:
      - 'scripts/bb63-activate-existing-versions.mjs'
      - 'releases/bb63-final-activation-20261103.json'
      - '.github/workflows/bb63-existing-version-precheck.yml'
permissions:
  contents: read
jobs:
  verified-existing-versions-only:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate version-only script syntax
        run: node --check scripts/bb63-activate-existing-versions.mjs
      - name: Read two existing saved Worker versions and verify active rollback state (NO CHANGE)
        env:
          TALERA_BB63_CF_TOKEN: ${{ secrets.TALERA_V62_CLOUDFLARE_READ_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/bb63-activate-existing-versions.mjs --check
      - name: Preserve metadata only
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: bb63-existing-version-precheck-${{ github.sha }}
          path: .talera-bb63-evidence/bb63-activation-result.json
          if-no-files-found: warn
          retention-days: 30
