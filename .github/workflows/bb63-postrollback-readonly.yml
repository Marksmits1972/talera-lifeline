name: BB63 inspect failed rollout versions and public HTTP (NO DEPLOY)
on:
  push:
    branches:
      - feature/bb63-current-memory-version-20261103
    paths:
      - 'scripts/bb63-postrollback-readonly.mjs'
      - '.github/workflows/bb63-postrollback-readonly.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  read-only-release-investigation:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Confirm syntax
        run: node --check scripts/bb63-postrollback-readonly.mjs
      - name: GET only public HTTP status and V62/Core version metadata
        env:
          TALERA_BB63_CF_TOKEN: ${{ secrets.TALERA_V62_CLOUDFLARE_READ_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/bb63-postrollback-readonly.mjs
      - name: Save sanitized report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: bb63-postrollback-readonly-${{ github.sha }}
          path: .talera-bb63-evidence/bb63-postrollback-readonly.json
          retention-days: 30
          if-no-files-found: warn
