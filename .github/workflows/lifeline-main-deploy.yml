name: TALERA LifeLine — safe Cloudflare API deploy

on:
  push:
    branches:
      - work/r19h2-lifeline-main-20261014
    paths:
      - 'experiments/lifeline-main/**'
      - '.github/workflows/lifeline-main-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: talera-lifeline-main-development
  cancel-in-progress: false

jobs:
  deploy:
    name: Validate and publish isolated test Worker
    runs-on: ubuntu-latest
    timeout-minutes: 12
    if: vars.TALERA_LIFELINE_DEPLOY_ENABLED == 'true'
    environment: talera-lifeline-development
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify exact isolated branch and Worker target
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/work/r19h2-lifeline-main-20261014'
          node --input-type=module <<'JS'
          import {readFileSync} from 'node:fs';
          const config = JSON.parse(readFileSync('experiments/lifeline-main/wrangler.jsonc','utf8'));
          if (config.name !== 'talera-r19-lifeline-main-dev' || config.main !== 'worker.js') {
            throw Error('Unsafe Cloudflare Worker name or entrypoint; abort');
          }
          if (config.d1_databases || config.r2_buckets || config.routes) {
            throw Error('Unexpected production bindings or routes; abort');
          }
          JS
      - name: Run isolated tests
        run: |
          node --test test/lifeline-main.test.mjs
          node --check experiments/lifeline-main/worker.js
      - name: Validate Cloudflare credentials configured
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          test -n "$CF_TOKEN" || { echo 'Missing CLOUDFLARE_API_TOKEN secret'; exit 1; }
          test -n "$CF_ACCOUNT" || { echo 'Missing CLOUDFLARE_ACCOUNT_ID secret'; exit 1; }
      - name: Deploy test Worker only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          # A multiline pasted account ID is normalized without showing its value in logs.
          CLOUDFLARE_ACCOUNT_ID="$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr -d '[:space:]')"
          export CLOUDFLARE_ACCOUNT_ID
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          npx wrangler deploy --config experiments/lifeline-main/wrangler.jsonc
      - name: Verify original PWA URL, all three pages and persistent local memory contract
        shell: bash
        run: |
          set -euo pipefail
          # The URL and manifest identity MUST remain unchanged so installed iPhone
          # apps continue using their original IndexedDB origin and stored photos.
          BASE='https://talera-r19-lifeline-main-dev.mark-a39.workers.dev'
          sleep 3
          curl -fsSL --retry 8 --retry-delay 2 --retry-all-errors "$BASE/api/version" -o /tmp/talera-main-version.json
          grep -q 'phone-display-unified-nav-20261016-r4' /tmp/talera-main-version.json
          curl -fsSL --retry 8 --retry-delay 2 --retry-all-errors "$BASE/manifest.webmanifest" -o /tmp/talera-main-manifest.json
          grep -q '"start_url":"/"' /tmp/talera-main-manifest.json
          grep -q '"scope":"/"' /tmp/talera-main-manifest.json
          grep -q '"id":"/"' /tmp/talera-main-manifest.json
          curl -fsSL --retry 8 --retry-delay 2 --retry-all-errors "$BASE/" -o /tmp/talera-main-home.html
          grep -q 'talera-reference-catalog' /tmp/talera-main-home.html
          grep -q 'talera-local-timeline-integration' /tmp/talera-main-home.html
          grep -q 'talera-memory-store-v1' /tmp/talera-main-home.html
          grep -q 'Hoofdnavigatie TALERA' /tmp/talera-main-home.html
          curl -fsSL --retry 8 --retry-delay 2 --retry-all-errors "$BASE/present?memory=50" -o /tmp/talera-main-presentation.html
          grep -q 'talera-unified-navigation' /tmp/talera-main-presentation.html
          grep -q 'talera-local-memory-adapter' /tmp/talera-main-presentation.html
          grep -q 'memoryStoryScroll' /tmp/talera-main-presentation.html
          grep -q 'talera-memory-id-navigation' /tmp/talera-main-presentation.html
          curl -fsSL --retry 8 --retry-delay 2 --retry-all-errors "$BASE/present?memory=local-acceptance-smoke" -o /tmp/talera-main-local-presentation.html
          grep -q 'talera-local-memory-adapter' /tmp/talera-main-local-presentation.html
          curl -fsSL --retry 8 --retry-delay 2 --retry-all-errors "$BASE/tell" -o /tmp/talera-main-tell.html
          grep -q 'talera-memory-store-v1' /tmp/talera-main-tell.html
          grep -q 'taleraTellNav' /tmp/talera-main-tell.html
          grep -q 'talera-unified-navigation' /tmp/talera-main-tell.html
          grep -q 'id="mediaStage"' /tmp/talera-main-tell.html
          grep -q 'id="moment"' /tmp/talera-main-tell.html
          curl -fsSL --retry 8 --retry-delay 2 --retry-all-errors "$BASE/sw.js" -o /tmp/talera-main-sw.js
          grep -q 'addEventListener' /tmp/talera-main-sw.js
          ! grep -q 'indexedDB.deleteDatabase' /tmp/talera-main-home.html
          ! grep -q 'indexedDB.deleteDatabase' /tmp/talera-main-presentation.html
          echo "Same-origin PWA update verified. IndexedDB contents never accessed by this workflow."
