name: TALERA LifeLine — safe Cloudflare API deploy

on:
  push:
    branches:
      - work/r19h2-lifeline-main-20261014
    paths:
      - 'experiments/lifeline-main/**'
      - '.github/workflows/lifeline-main-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: talera-lifeline-main-development
  cancel-in-progress: false

jobs:
  deploy:
    name: Validate and publish isolated test Worker
    runs-on: ubuntu-latest
    timeout-minutes: 12
    if: vars.TALERA_LIFELINE_DEPLOY_ENABLED == 'true'
    environment: talera-lifeline-development
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify exact isolated branch and Worker target
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/work/r19h2-lifeline-main-20261014'
          node --input-type=module <<'JS'
          import {readFileSync} from 'node:fs';
          const config = JSON.parse(readFileSync('experiments/lifeline-main/wrangler.jsonc','utf8'));
          if (config.name !== 'talera-r19-lifeline-main-dev' || config.main !== 'worker.js') {
            throw Error('Unsafe Cloudflare Worker name or entrypoint; abort');
          }
          if (config.d1_databases || config.r2_buckets || config.routes) {
            throw Error('Unexpected production bindings or routes; abort');
          }
          JS
      - name: Run isolated tests
        run: |
          node --test test/lifeline-main.test.mjs
          node --check experiments/lifeline-main/worker.js
      - name: Validate Cloudflare credentials configured
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          test -n "$CF_TOKEN" || { echo 'Missing CLOUDFLARE_API_TOKEN secret'; exit 1; }
          test -n "$CF_ACCOUNT" || { echo 'Missing CLOUDFLARE_ACCOUNT_ID secret'; exit 1; }
      - name: Deploy test Worker only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          # A multiline pasted account ID is normalized without showing its value in logs.
          CLOUDFLARE_ACCOUNT_ID="$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr -d '[:space:]')"
          export CLOUDFLARE_ACCOUNT_ID
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          npx wrangler deploy --config experiments/lifeline-main/wrangler.jsonc
      - name: Verify homepage and API after deploy
        shell: bash
        env:
          TEST_URL: ${{ vars.TALERA_LIFELINE_TEST_URL }}
        run: |
          TEST_URL="${TEST_URL:-https://talera-r19-lifeline-main-dev.mark-a39.workers.dev}"
          echo "Checking freshly deployed worker endpoint availability: $TEST_URL"
          sleep 3
          curl --fail --silent --show-error --retry 3 --retry-all-errors "$TEST_URL/" -o /tmp/talera-lifeline-home.html
          grep -q 'TALERA — Mijn levenslijn' /tmp/talera-lifeline-home.html
          grep -q 'rel="manifest"' /tmp/talera-lifeline-home.html
          echo "Checking manifest.webmanifest"
          curl --fail --silent --show-error --retry 6 --retry-delay 2 --retry-all-errors "$TEST_URL/manifest.webmanifest" -o /tmp/talera-lifeline-manifest.json
          grep -q '"display":"standalone"' /tmp/talera-lifeline-manifest.json
          echo "Checking pwa-192.png"
          curl --fail --silent --show-error --retry 6 --retry-delay 2 --retry-all-errors "$TEST_URL/pwa-192.png" -o /tmp/talera-lifeline-icon.png
          test "$(file --mime-type -b /tmp/talera-lifeline-icon.png)" = "image/png"
          echo "Checking sw.js"
          curl --fail --silent --show-error --retry 6 --retry-delay 2 --retry-all-errors "$TEST_URL/sw.js" -o /tmp/talera-lifeline-sw.js
          grep -q 'addEventListener' /tmp/talera-lifeline-sw.js
          grep -q "installGesture(ageLane,'year')" /tmp/talera-lifeline-home.html
          grep -q "installGesture(monthLane,'month')" /tmp/talera-lifeline-home.html
          grep -q "installGesture(storyLane,'story')" /tmp/talera-lifeline-home.html
          grep -q 'href="/tell"' /tmp/talera-lifeline-home.html
          grep -q 'href="/present?visual=weekend-amsterdam"' /tmp/talera-lifeline-home.html
          curl --fail --silent --show-error --retry 3 --retry-all-errors "$TEST_URL/api/demo-memories" -o /tmp/talera-lifeline-memories.json
          grep -q '"id":50' /tmp/talera-lifeline-memories.json
          curl --fail --silent --show-error --retry 3 --retry-all-errors "$TEST_URL/present?visual=weekend-amsterdam" -o /tmp/talera-lifeline-present.html
          grep -q 'taleraPageNav' /tmp/talera-lifeline-present.html
          grep -q 'talera-visual-demo-handoff' /tmp/talera-lifeline-present.html
          curl --fail --silent --show-error --retry 3 --retry-all-errors "$TEST_URL/present?visual=lifeline" -o /tmp/talera-lifeline-dynamic-presentation.html
          grep -q 'talera-lifeline-session-handoff' /tmp/talera-lifeline-dynamic-presentation.html
          curl --fail --silent --show-error --retry 3 --retry-all-errors "$TEST_URL/tell" -o /tmp/talera-lifeline-tell.html
          grep -q 'taleraTellNav' /tmp/talera-lifeline-tell.html
          echo "Checking V9 approved logo, PWA update script and new version API"
          grep -q 'talera-brand-v9.png' /tmp/talera-lifeline-home.html
          grep -q 'talera-version-check-v9' /tmp/talera-lifeline-home.html
          curl --fail --silent --show-error --retry 3 --retry-all-errors "$TEST_URL/api/version" -o /tmp/talera-lifeline-version.json
          grep -q 'talera-lifeline-v9-brand-auto-update-20261015' /tmp/talera-lifeline-version.json
          curl --fail --silent --show-error --retry 3 --retry-all-errors "$TEST_URL/talera-brand-v9.png" -o /tmp/talera-lifeline-brand.png
          test "$(file --mime-type -b /tmp/talera-lifeline-brand.png)" = "image/png"
          curl --fail --silent --show-error --retry 3 --retry-all-errors "$TEST_URL/talera-brand-v9.svg" -o /tmp/talera-lifeline-brand.svg
          grep -q '<svg' /tmp/talera-lifeline-brand.svg
          grep -q 'talera-version-check-v9' /tmp/talera-lifeline-tell.html
          echo "All three independent routes, approved logo, update code and demo API respond."
