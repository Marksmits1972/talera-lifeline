name: TALERA LifeLine — safe Cloudflare API deploy

on:
  push:
    branches:
      - work/r19h2-lifeline-main-20261014
    paths:
      - 'experiments/lifeline-main/**'
      - '.github/workflows/lifeline-main-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: talera-lifeline-main-development
  cancel-in-progress: false

jobs:
  deploy:
    name: Validate and publish isolated test Worker
    runs-on: ubuntu-latest
    timeout-minutes: 12
    if: vars.TALERA_LIFELINE_DEPLOY_ENABLED == 'true'
    environment: talera-lifeline-development
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify exact isolated branch and Worker target
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/work/r19h2-lifeline-main-20261014'
          node --input-type=module <<'JS'
          import {readFileSync} from 'node:fs';
          const config = JSON.parse(readFileSync('experiments/lifeline-main/wrangler.jsonc','utf8'));
          if (config.name !== 'talera-r19-lifeline-main-dev' || config.main !== 'worker.js') {
            throw Error('Unsafe Cloudflare Worker name or entrypoint; abort');
          }
          if (config.d1_databases || config.r2_buckets || config.routes) {
            throw Error('Unexpected production bindings or routes; abort');
          }
          JS
      - name: Run isolated tests
        run: |
          node --test test/lifeline-main.test.mjs
          node --check experiments/lifeline-main/worker.js
      - name: Validate Cloudflare credentials configured
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          test -n "$CF_TOKEN" || { echo 'Missing CLOUDFLARE_API_TOKEN secret'; exit 1; }
          test -n "$CF_ACCOUNT" || { echo 'Missing CLOUDFLARE_ACCOUNT_ID secret'; exit 1; }
      - name: Deploy test Worker only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          # A multiline pasted account ID is normalized without showing its value in logs.
          CLOUDFLARE_ACCOUNT_ID="$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr -d '[:space:]')"
          export CLOUDFLARE_ACCOUNT_ID
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          npx wrangler deploy --config experiments/lifeline-main/wrangler.jsonc
      - name: Verify homepage and API after deploy
        shell: bash
        env:
          TEST_URL: ${{ vars.TALERA_LIFELINE_TEST_URL }}
        run: |
          TEST_URL="${TEST_URL:-https://talera-r19-lifeline-main-dev.mark-a39.workers.dev}"
          curl --fail --silent --show-error --retry 3 --retry-all-errors "$TEST_URL/" -o /tmp/talera-lifeline-home.html
          grep -q 'Mijn levenslijn' /tmp/talera-lifeline-home.html
          curl --fail --silent --show-error --retry 3 --retry-all-errors "$TEST_URL/api/demo-memories" -o /tmp/talera-lifeline-memories.json
          grep -q '"id":50' /tmp/talera-lifeline-memories.json
          curl --fail --silent --show-error --retry 3 --retry-all-errors "$TEST_URL/present?memory=1" -o /tmp/talera-lifeline-present.html
          grep -q 'taleraPageNav' /tmp/talera-lifeline-present.html
          curl --fail --silent --show-error --retry 3 --retry-all-errors "$TEST_URL/tell" -o /tmp/talera-lifeline-tell.html
          grep -q 'taleraTellNav' /tmp/talera-lifeline-tell.html
          echo "All three independent routes and demo API respond."
