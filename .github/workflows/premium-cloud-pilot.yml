name: TALERA Premium cloud pilot tests

on:
  push:
    branches:
      - feature/v62-premium-cloud-synthetic-pilot-20261102
    paths:
      - "src/core/premium-*"
      - "src/mijn-talera/**"
      - "test/premium-*.test.mjs"
      - ".github/workflows/premium-cloud-pilot.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  premium-cloud:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check Premium route, media and restore contracts
        run: node --test test/premium-*.test.mjs
