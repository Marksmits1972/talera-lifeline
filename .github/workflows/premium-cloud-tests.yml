name: Premium cloud module tests
on:
  push:
    branches:
      - feature/v62-mijn-profiel-accountoverzicht-20261101
    paths:
      - 'src/core/premium-*.mjs'
      - 'src/mijn-talera/premium-*.mjs'
      - 'src/mijn-talera/menu-integration.txt'
      - 'src/mijn-talera/worker.js'
      - 'test/v62-app-entry-http-smoke.mjs'
      - 'test/premium-*.test.mjs'
      - 'test/premium-eu-pilot-http-smoke.mjs'
      - '.github/workflows/premium-cloud-tests.yml'
  workflow_dispatch:
jobs:
  premium-cloud:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check TALERA menu script syntax
        run: node --check --input-type=commonjs < src/mijn-talera/menu-integration.txt
      - run: node --test test/premium-cloud-auth.test.mjs test/premium-cloud-readiness.test.mjs test/premium-cloud-routes.test.mjs test/premium-private-upload.test.mjs test/premium-cloud-e2e-fixture.test.mjs test/premium-sync-queue.test.mjs test/premium-indexeddb-bridge.test.mjs test/premium-sync-coordinator.test.mjs test/premium-cloud-pilot.test.mjs test/premium-cloud-core-adapter.test.mjs test/premium-eu-pilot-patch.test.mjs test/premium-cloud-integration-patch.test.mjs test/premium-private-records.test.mjs test/premium-records-coordinator.test.mjs test/premium-sync-audit.test.mjs test/premium-multipart-media.test.mjs test/premium-restore-verifier.test.mjs test/premium-cloud-restore-preview.test.mjs test/premium-cloud-integrity.test.mjs test/premium-cloud-restore-atomic.test.mjs test/premium-restore-stage.test.mjs
      - name: Verify public V62 entry opens TALERA
        run: node test/v62-app-entry-http-smoke.mjs
      - name: Verify closed pilot rejects anonymous requests
        env:
          TALERA_CORE_STAGING_URL: https://talera-clean-core-staging-20261030.mark-a39.workers.dev
        run: node test/premium-eu-pilot-http-smoke.mjs
