name: TALERA regression checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Date flow regressions
        run: node --test test/workblad-date-flow.test.mjs
      - name: Target handoff regressions
        run: node --test test/timeline-target-handoff.test.mjs
      - name: Create-edit cycle regressions
        run: node --test test/manual-timeline-handoff.test.mjs
      - name: Full regression suite
        run: node --test test/*.test.mjs
