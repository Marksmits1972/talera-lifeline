name: TALERA isolated autonomous D1 reserve activation every 5 minutes
on:
  push:
    branches: [feature/d1-autocapacity-cron-staging-20261108]
    paths:
      - r20-dev/d1-capacity-monitor-staging/**
      - r20-dev/d1-router-staging/capacity-policy.mjs
      - r20-dev/d1-router-staging/shard-catalog.json
      - .github/workflows/talera-d1-autocapacity-cron-staging.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: talera-d1-staging-monitor-release
  cancel-in-progress: false
jobs:
  deploy_monitor:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify every pressure decision offline, including missing data
        run: |
          node --check r20-dev/d1-capacity-monitor-staging/monitor.worker.mjs
          node --check r20-dev/d1-capacity-monitor-staging/build-config.mjs
          node --test r20-dev/d1-capacity-monitor-staging/monitor.worker.test.mjs
          node --test r20-dev/d1-router-staging/capacity-policy.test.mjs
      - name: Validate Cloudflare GitHub authentication, mask account scope
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          CLEAN_ID="$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr -cd 'a-fA-F0-9')"
          test "${#CLEAN_ID}" -eq 32
          echo "::add-mask::$CLEAN_ID"
          printf 'CLOUDFLARE_ACCOUNT_ID=%s\n' "$CLEAN_ID" >> "$GITHUB_ENV"
      - name: Generate bindings ONLY for isolated D1 directory and analytics
        run: node r20-dev/d1-capacity-monitor-staging/build-config.mjs
      - name: Deploy private Cloudflare CRON watcher, no public route
        run: |
          npx --yes wrangler@4.145.0 deploy --config r20-dev/d1-capacity-monitor-staging/wrangler.generated.jsonc
