name: TALERA Free 10M - static code delivery + privacy controls

on:
  push:
    branches: [feature/free-10m-static-asset-delivery-20261108]
    paths:
      - 'r20-dev/free-10m-delivery/**'
      - '.github/workflows/talera-free-10m-static.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build_and_verify_free_code:
    name: Free code split from approved PWA; private data never cached
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Build only from two anonymous snapshots of approved TALERA test candidate
        run: node r20-dev/free-10m-delivery/build.mjs
      - name: Execute exact-source, personal-data and API routing tests
        run: node --test r20-dev/free-10m-delivery/free-delivery.test.mjs
      - name: Validate Cloudflare Worker compilation without deploying
        run: |
          npm ci
          npx wrangler deploy --dry-run --config r20-dev/free-10m-delivery/wrangler.jsonc --outdir .talera-free-buildcheck
      - name: Run real local Cloudflare Worker plus static assets, bounded requests only
        run: node r20-dev/free-10m-delivery/local-runtime.mjs
      - name: Preserve anonymous build measurements
        uses: actions/upload-artifact@v4
        with:
          name: talera-free-10m-code-delivery-build-only
          path: |
            r20-dev/free-10m-delivery/generated/build-report.json
            r20-dev/free-10m-delivery/generated/runtime-report.json
          retention-days: 14
