name: TALERA Free auth - one isolated real EU Cloudflare staging check

on:
  push:
    branches: [feature/free-10m-auth-do-pilot-20261108]
    paths:
      - '.github/workflows/talera-free-auth-real-stage.yml'
      - 'r20-dev/free-10m-auth-pilot/auth-live-smoke.mjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: talera-free-auth-new-staging-isolated
  cancel-in-progress: false

jobs:
  isolated_real_eu_auth:
    name: First small EU Durable Objects auth test (NOT capacity test)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install project-locked Wrangler
        run: npm ci
      - name: Confirm Worker is isolated, EU-scoped, and cannot access legacy D1
        run: |
          node -e "
          const fs=require('node:fs');
          const x=JSON.parse(fs.readFileSync('r20-dev/free-10m-auth-pilot/wrangler.staging.jsonc','utf8'));
          if(x.name!=='talera-free-auth-do-staging-20261108' || x.vars?.AUTH_STORAGE_JURISDICTION!=='eu' || x.d1_databases?.length || x.services?.length || x.r2_buckets?.length)process.exit(1);
          if(x.main!=='./auth-pilot-worker.mjs' || !x.workers_dev || x.durable_objects?.bindings?.length!==5)process.exit(1);
          "
      - name: Confirm Cloudflare staging credentials available
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || exit 1
          CLEAN_ID="$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr -cd 'a-fA-F0-9')"
          test "${#CLEAN_ID}" -eq 32 || exit 1
          echo "::add-mask::$CLEAN_ID"
          printf 'CLOUDFLARE_ACCOUNT_ID=%s\n' "$CLEAN_ID" >> "$GITHUB_ENV"
      - name: Run pure local security and compatibility tests
        run: node --test r20-dev/free-10m-auth-pilot/auth-util.test.mjs
      - name: Deploy ONLY the new test Worker; closed until secrets are set
        run: npx --no-install wrangler deploy --config r20-dev/free-10m-auth-pilot/wrangler.staging.jsonc
      - name: Generate disposable masked keys for this fictional staging run
        run: |
          ACCOUNT_KEY="$(openssl rand -hex 32)"
          STAGING_KEY="$(openssl rand -hex 32)"
          echo "::add-mask::$ACCOUNT_KEY"
          echo "::add-mask::$STAGING_KEY"
          printf 'AUTH_NAMESPACE_KEY=%s\n' "$ACCOUNT_KEY" >> "$GITHUB_ENV"
          printf 'STAGING_ACCESS_KEY=%s\n' "$STAGING_KEY" >> "$GITHUB_ENV"
      - name: Seal staging before protected calls
        run: |
          printf '%s' "$STAGING_ACCESS_KEY" | npx --no-install wrangler secret put STAGING_ACCESS_KEY --config r20-dev/free-10m-auth-pilot/wrangler.staging.jsonc
          printf '%s' "$AUTH_NAMESPACE_KEY" | npx --no-install wrangler secret put AUTH_NAMESPACE_KEY --config r20-dev/free-10m-auth-pilot/wrangler.staging.jsonc
      - name: Allow edge configuration to settle before authenticated test
        run: sleep 8
      - name: Verify two fake accounts plus 1/5/20 bounded real EU Cloudflare session reads
        run: node r20-dev/free-10m-auth-pilot/auth-live-smoke.mjs
      - name: Store bounded real Cloudflare staging measurements
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: talera-free-real-eu-120-session-requests
          path: r20-dev/free-10m-auth-pilot/generated/auth-remote-result.json
          retention-days: 14
