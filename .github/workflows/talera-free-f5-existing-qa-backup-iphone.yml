name: TALERA Free F5 - isolated ordinary photo carousel, original narration preserved
# Push only on this dedicated integration branch. No official PWA or customer media.
on:
  push:
    branches: [feature/free-f5-local-backup-ui-20261110]
    paths:
      - '.github/workflows/talera-free-f5-existing-qa-backup-iphone.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: talera-free-f5-storage-only-iphone-qa-20261109
  cancel-in-progress: false

jobs:
  protected_backup_qa:
    name: Same QA origin, same seven DOs and five secret values, rollback on failure
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      F5_STAGE_NAME: talera-free-f5-storage-qa-20261109
      F5_STAGE_HOST: talera-free-f5-storage-qa-20261109.mark-a39.workers.dev
      F5_INVITE_HASH: d85c9339c034b39bd31a94c94bb92d4970dbe50685f74eb49952b19c79e880a2
      F5_INVITE_EXPIRES: '1794942000000'
      F5_PREVIOUS_VERSION: a02e1180-2c33-407e-a6b6-90d9fa0baab6
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Pin tested code and exact original official/QA boundaries
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 4ba7829aac46145487a61d95fff31925bf069117 HEAD
          git merge-base --is-ancestor 5bec152f1984078e06a59fa08e571cf5951b7ad9 HEAD
          git merge-base --is-ancestor a1c39e532c36894609f980fee0242eb1e6f59922 HEAD
          git merge-base --is-ancestor 0be78b8346f982237db65dc4ca81efcef48efc97 HEAD
          git diff --exit-code 4ba7829aac46145487a61d95fff31925bf069117 HEAD -- r20-dev/free-10m-delivery/ r20-dev/free-10m-f5/f5-local-scope.mjs r20-dev/free-10m-f5/f5-editor-video-mute-guard.mjs
          test -n "$CLOUDFLARE_API_TOKEN"
          CLEAN_ID="$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr -cd 'a-fA-F0-9')"
          test "${#CLEAN_ID}" -eq 32
          echo "::add-mask::$CLEAN_ID"
          echo "CLOUDFLARE_ACCOUNT_ID=$CLEAN_ID" >> "$GITHUB_ENV"
          test "$F5_STAGE_NAME" = talera-free-f5-storage-qa-20261109
          echo 'Approved player/editor/local-scope unchanged; no official PWA changes'
      - name: Verify current isolated Cloudflare QA version, five secrets, seven namespaces
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const a=process.env.CLOUDFLARE_ACCOUNT_ID,n=process.env.F5_STAGE_NAME;
          const root='https://api.cloudflare.com/client/v4/accounts/'+a+'/workers/scripts/'+n;
          async function get(path){
            const r=await fetch(root+path,{headers:{Authorization:'Bearer '+process.env.CLOUDFLARE_API_TOKEN}});
            if(!r.ok)throw Error('Cloudflare QA read failed '+path+': '+r.status);
            const data=await r.json();if(!data.success)throw Error('Cloudflare QA rejected '+path);
            return data.result;
          }
          const [s,d]=await Promise.all([get('/settings'),get('/deployments')]);
          const bindings=s.bindings||[];
          const typed=t=>bindings.filter(b=>b.type===t);
          const DO=['AUTH_ACCOUNTS','AUTH_EMAILS','AUTH_HANDLES','AUTH_SESSIONS','AUTH_RATES','SOCIAL_MEMORY','SOCIAL_POINTER'];
          const SECRETS=['STAGING_F5_KEY','STAGING_ACCESS_KEY','STAGING_SOCIAL_KEY','AUTH_NAMESPACE_KEY','DEMO_IDENTITY_KEY'];
          if(JSON.stringify(typed('durable_object_namespace').map(b=>b.name).sort())!==JSON.stringify([...DO].sort())||
             JSON.stringify(typed('secret_text').map(b=>b.name).sort())!==JSON.stringify([...SECRETS].sort())||
             typed('assets').length!==1||
             bindings.length!==17||
             bindings.find(b=>b.name==='F5_EASY_INVITE_SHA256')?.text!==process.env.F5_INVITE_HASH||
             bindings.find(b=>b.name==='F5_EASY_INVITE_EXPIRES')?.text!==process.env.F5_INVITE_EXPIRES||
             bindings.find(b=>b.name==='AUTH_STORAGE_JURISDICTION')?.text!=='eu'||
             bindings.find(b=>b.name==='SOCIAL_STORAGE_JURISDICTION')?.text!=='eu')
            throw Error('Existing QA bindings/secrets/invite changed; refuse deploy');
          const latest=d.deployments?.[0]?.versions;
          if(!Array.isArray(latest)||latest.length!==1||latest[0].percentage!==100||
             latest[0].version_id!==process.env.F5_PREVIOUS_VERSION)
            throw Error('Expected approved QA Worker version was replaced; refuse deploy');
          console.log('Exact current QA Worker version + 7 original DOs + 5 original secrets + invitation hash confirmed');
          NODE
          # Existing Free candidate already uses ordinary account login.
          for path in /mijn-leven /present; do
            code="$(curl --max-time 20 -sS -o /dev/null -w '%{http_code}' "https://$F5_STAGE_HOST$path")"
            test "$code" = 200
          done
          for path in / /__f5/backup; do
            code="$(curl --max-time 20 -sS -o /dev/null -w '%{http_code}' "https://$F5_STAGE_HOST$path")"
            if [ "$path" = / ]; then test "$code" = 302; else test "$code" = 401; fi
          done
          curl --max-time 20 -fsS "https://$F5_STAGE_HOST/__f5/health" > /tmp/f5-preflight-health.json
          node -e "const x=require('/tmp/f5-preflight-health.json'); if(!x.ok||x.closedQa!==false||x.personalRegistrationPilot!==true||x.officialTaleraConnected!==false)process.exit(1)"
      - name: Pinned installation
        run: npm ci
      - name: Rebuild exact approved anonymous assets plus separate browser-only recovery files
        run: |
          node r20-dev/free-10m-delivery/build.mjs
          node r20-dev/free-10m-f5/f5-public-assets.mjs
      - name: Verify separate ordinary photo carousel and untouched original narrated player
        shell: bash
        run: |
          set -euo pipefail
          node --check r20-dev/free-10m-f5/f5-worker.mjs
          node --check r20-dev/free-10m-f5/f5-public-assets.mjs
          node --check r20-dev/free-10m-f5/f5-backup-controller.mjs
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import path from 'node:path';
          import {verifiedPublicSupport as map} from './r20-dev/free-10m-f5/generated/public-template-map.mjs';
          const root='r20-dev/free-10m-delivery/public';
          const read=name=>fs.readFileSync(path.join(root,map[name].replace(/^\//,'')));
          for(const [name,size] of Object.entries({
            '/apple-touch-icon.png':180,'/pwa-192.png':192,'/pwa-512.png':512
          })){
            assert.ok(map[name],'Missing original '+name);
            const b=read(name);
            assert.equal(b.subarray(0,8).toString('hex'),'89504e470d0a1a0a');
            assert.deepEqual([b.readUInt32BE(16),b.readUInt32BE(20)],[size,size]);
          }
          const manifest=JSON.parse(read('/manifest.webmanifest').toString());
          assert.deepEqual(manifest.icons.map(i=>[i.src,i.sizes,i.type]),[
            ['/pwa-192.png','192x192','image/png'],
            ['/pwa-512.png','512x512','image/png']
          ]);
          assert.ok(manifest.start_url&&manifest.name,'Original app identity must remain');
          const worker=fs.readFileSync('r20-dev/free-10m-f5/f5-worker.mjs','utf8');
          assert.ok(!worker.includes('if(!await hasQaAccess(request,env))return deny();'),
            'Temporary QA browser gate must not protect the normal app');
          assert.ok(worker.includes("if(AUTH_PATHS.has(p))return accountApi(request,env)"),
            'Original account routes must remain unchanged');
          assert.ok(worker.includes("const actor=sessionToken?await sessionAccount(request,env):null;"),
            'Expired sessions must lead to ordinary login');
          assert.ok(worker.includes("if(sessionToken&&!actor)headers.set('set-cookie',sessionCookie('',0));"),
            'Only expired cookie must be cleared');
          assert.ok(worker.includes("if(!actor)return deny(401,'Aanmelden vereist voor lokale back-up')"),
            'Private backup must remain account gated');
          assert.ok(worker.includes("if(!actor)return deny(401,'Sessie verlopen; meld je opnieuw aan')"),
            'Private player must remain account gated');
          const start=worker.indexOf('function allowedLocalUiSearch(url){');
          const end=worker.indexOf('const F5_BROWSER_CSP=[',start);
          assert.ok(start>0&&end>start,'Pure UI routing guard must be available');
          const routeFns=Function('PUBLIC_PAGES','LOCAL_STORY_ID',
            worker.slice(start,end)+'; return {allowedLocalUiSearch,canonicalReferralUiPath};')(
            new Set(['/mijn-leven','/meldingen','/present','/tell']),/^local-[a-z0-9-]{8,90}$/i);
          const clean=(u,method='GET')=>
            routeFns.canonicalReferralUiPath(new URL('https://talera.example'+u),method);
          for(const [input,expected] of [
            ['/present?talera_menu=hub&utm_source=chatgpt','/present?talera_menu=hub'],
            ['/present?talera_menu=hub&ref=chatgpt','/present?talera_menu=hub'],
            ['/mijn-leven?utm_source=chatgpt','/mijn-leven'],
            ['/meldingen?ref=chatgpt','/meldingen'],
            ['/present?year=1985&utm_source=chatgpt','/present?year=1985'],
            ['/present?decade=1980&utm_source=chatgpt','/present?decade=1980'],
            ['/tell?ref=chatgpt','/tell'],
            ['/present?memory=local-12345678&utm_medium=share','/present?memory=local-12345678'],
            ['/api/me?utm_source=chatgpt',null],
            ['/present?talera_menu=hub&token=leak',null],
            ['/present?talera_menu=hub&memory=local-12345678',null],
            ['/present?memory=not-a-local-id&ref=chatgpt',null],
            ['/present?talera_menu=wrong&ref=chatgpt',null]
          ]) assert.equal(clean(input),expected,input);
          assert.equal(clean('/present?talera_menu=hub&utm_source=chatgpt','POST'),null);
          // The original Home shortcuts were previously rejected as 404.
          const accepts=u=>routeFns.allowedLocalUiSearch(
            new URL('https://talera.example'+u));
          for(const url of ['/present?theme=Familie','/present?theme=Sport',
            '/present?theme=Werk%20%26%20passies',
            '/present?year=1985','/present?decade=1980',
            '/present?memory=3','/present?memory=1031',
            '/present?memory=local-12345678','/present?talera_menu=hub'])
            assert.ok(accepts(url),'Original Home deep-link blocked: '+url);
          for(const url of ['/present?theme=',
            '/present?theme=%3Cscript%3E','/present?theme=Familie&token=leak',
            '/present?year=12','/present?year=9999',
            '/present?decade=1987','/present?memory=0',
            '/present?memory=../../api/me','/present?year=1985&token=hack',
            '/api/me?year=1985','/meldingen?token=hack'])
            assert.ok(!accepts(url),'Untrusted URL must not be enabled: '+url);
          assert.ok(worker.includes("sourcePath=pathname==='/meldingen'?'/mijn-leven':pathname"),
            'Use the existing Home template for the existing notifications tab');
          assert.ok(worker.includes('const privateHtml=homeScreen?personalizeHome(original,date):'),
            'Notifications must retain verified account birthdate');
          assert.ok(worker.includes('const scoped=scopeLocalMemories(privateHtml,await privateAccountScope(actor.id));'),
            'All personal pages retain per-account local data scope');
          assert.ok(worker.includes("if(p==='/gedeeld'&&m==='GET'&&!url.search)"),
            'Retired Gedeeld link must lead to the existing Notifications tab');
          assert.ok(worker.includes("location:'/present?year='+year"),
            'Original decade shortcut must reuse existing year navigation');
          // Contract proof on the EXACT packaged authenticated /present HTML.
          // All browser-only photo inputs stay transient; no account or memory is created.
          const {referencePages:refs}=await import('./r20-dev/free-10m-f5/generated/public-template-map.mjs');
          const readRef=route=>fs.readFileSync(path.join(root,refs[route].replace(/^\//,'')),'utf8');
          const originalHome=fs.readFileSync('r20-dev/free-10m-delivery/generated/reference-mijn-leven.html','utf8');
          const ownerHome=readRef('/mijn-leven');
          // The new homepage must show only the authenticated owner's own
          // photos. Reference records remain in the original timeline, never gallery.
          const ownedStyle='<style id="talera-owned-topic-only-home">';
          assert.ok(ownerHome.includes(ownedStyle),'Previous protected local-only home CSS lost');
          assert.ok(ownerHome.includes('<style id="talera-own-life-gallery-style">'),
           'New year/photo gallery style must be on the original Home route');
          assert.ok(originalHome.includes('id="v18-eras-grid"'),
           'Original V18 sample-era grid source must be identifiable');
          assert.ok(!ownerHome.includes('id="v18-eras-grid"')&&
           ownerHome.includes('id="talera-life-gallery-rows"'),
           'Original big year tiles must be REPLACED, not duplicated');
          assert.ok(ownerHome.includes('id="v17-year-slider"')&&
           ownerHome.includes('id="navMine"')&&ownerHome.includes('id="navNotifications"'),
           'Do not modify existing timeline and navigation');
          const oldReferenceAppend="  examples.forEach(o=>mkCard(o,$('demoCards')));";
          const removedReferenceAppend='  // Reference stories remain available in the existing hero/year timeline.';
          assert.equal(originalHome.split(oldReferenceAppend).length,2,
           'Exactly one original sample card append must be identified');
          assert.ok(ownerHome.includes(removedReferenceAppend)&&
           !ownerHome.includes(oldReferenceAppend),
           'Home may not append sample memories into personal photo rows');
          const galleryOpen='<script id="talera-home-gallery-script">';
          const gs=ownerHome.indexOf(galleryOpen),ge=ownerHome.indexOf('</script>',gs);
          assert.ok(gs>0&&ge>gs,'New gallery must be in the existing Home');
          const galleryCode=ownerHome.slice(gs+galleryOpen.length,ge);
          assert.doesNotThrow(()=>new Function(galleryCode),'New gallery JS syntax');
          assert.ok(galleryCode.includes("row.source!=='pwa-local'")&&
           galleryCode.includes("store.displayUrl(photo.item.key)")&&
           galleryCode.includes("'/present?memory='")&&
           !galleryCode.includes('picsum.photos')&&
           !galleryCode.includes('window.__taleraReferenceMemories'),
           'Only original local media IDs and existing story links may appear');
          assert.ok(galleryCode.includes("phrase('example')")&&
           galleryCode.includes("if(!photos.length)")&&
           galleryCode.includes("new Set()"),
           'A fresh account shows a small no-fake-photo example, never gallery fillers');
          assert.ok(galleryCode.includes("rootMargin:'260px 260px'")&&
           galleryCode.includes("scrollIntoView")===false,
           'Load only nearby gallery photos; do not create another story player');
          const refreshMarker='async function refresh(){';
          const ownRefresh=ownerHome.indexOf(refreshMarker);
          const ownTail=ownerHome.indexOf('window.__taleraTopics={',ownRefresh);
          assert.ok(ownRefresh>0&&ownTail>ownRefresh,'Original topics refresh remains');
          const topicCode=ownerHome.slice(ownRefresh,ownTail);
          assert.ok(topicCode.includes("source==='pwa-local'")&&
           topicCode.includes('window.__taleraHomeGallery?.render(rows)')&&
           topicCode.includes('return {records:rows.length,gallery:true};'),
           'Reuse one authenticated local story list and never create sample tiles');
          const lifePickerStart=galleryCode.indexOf('function spread(pool,group){');
          const lifePickerEnd=galleryCode.indexOf('function release(){',lifePickerStart);
          assert.ok(lifePickerStart>0&&lifePickerEnd>lifePickerStart,'Time-distributed picker is required');
          const pick=new Function('picks',galleryCode.slice(lifePickerStart,lifePickerEnd)+';return spread;')(new Map());
          const years=Array.from({length:21},(_,i)=>{
           const year=1980+i*2;
           return {row:{id:'local-test-'+i,date:year+'-01-01'},item:{key:'photo-'+i},
            when:Date.UTC(year,0,1),year};
          });
          const picked=pick(years,'topic:familie');
          assert.equal(picked.length,10,'At most ten photographs per gallery');
          assert.equal(new Set(picked.map(p=>p.year)).size,10,
           'The selected photos must represent many different periods');
          assert.deepEqual(pick(years,'topic:familie').map(p=>p.item.key),
           picked.map(p=>p.item.key),'No reshuffle during the same Home visit');
          assert.ok(picked.every(p=>years.includes(p)),
           'Selection can only reference existing original media');
          assert.ok(!ownerHome.includes('id="talera-new-player"'),
           'No new slideshow or competing presentation engine allowed');
          console.log('TALERA_FREE_HOME_LIFE_GALLERIES_OWNER_ONLY_YEAR_TOPIC_EMPTY_STATE_NO_FAKE_PICTURES');
          console.log('TALERA_FREE_HOME_TEN_TIME_DISTRIBUTED_LOCAL_MEDIA_IDS_ORIGINAL_PRESENTATION_LINKS');
          // The owner's screenshot shows the three live home buttons
          // occupying 3/4 of a legacy FOUR-column grid. Repair exactly ONE
          // CSS declaration for both logged-in and logged-out home, with no
          // menu destination, label, class, callback or style changed.
          const oldGrid='.flow-nav{grid-template-columns:repeat(4,minmax(0,1fr))!important}';
          const threeGrid='.flow-nav{grid-template-columns:repeat(3,minmax(0,1fr))!important}';
          assert.equal(originalHome.split(oldGrid).length,2,
            'Approved home must contain exactly one original four-slot menu');
          for(const id of ['navMine','navShared','navNotifications','navMore'])
            assert.ok(originalHome.includes('id="'+id+'"'),'Existing nav '+id+' missing');
          assert.ok(originalHome.includes('.flow-nav a[href^="/gedeeld"]{display:none!important}')||
            /id="navShared"[^>]*style="display:\\s*none;?"/.test(originalHome),
            'The retired Gedeeld link must remain hidden by original CSS or inline style');
          const from=worker.indexOf('const OLD_HOME_NAV_GRID=');
          const until=worker.indexOf('const AUTH_PATHS=',from);
          assert.ok(from>0&&until>from,'Scoped three-tab nav helper missing');
          const centerThree=new Function(worker.slice(from,until)+
            ';return evenlySpaceThreeHomeTabs;')();
          const corrected=centerThree(originalHome);
          assert.equal(corrected.split(threeGrid).length,2,
            'Bottom bar must use exactly three equal columns');
          assert.ok(!corrected.includes(oldGrid),'Four empty grid slots must be gone');
          assert.equal(corrected.replace(threeGrid,oldGrid),originalHome,
            'The sole home change must be the grid-column count');
          assert.throws(()=>centerThree(originalHome.replace('id="navMore"','id="changed"')),
            /TALERA_HOME_NAV_SOURCE_DRIFT/);
          assert.ok(worker.includes("const threeTabHome=homeScreen?evenlySpaceThreeHomeTabs(silenced):silenced;"),
            'Signed-in Home must receive the same three-slot grid');
          assert.ok(worker.includes('evenlySpaceThreeHomeTabs(await r.text())'),
            'Signed-out Home must receive the same three-slot grid');
          assert.ok(originalHome.includes('id="notificationView"'));
          assert.ok(originalHome.includes('id="navNotifications"'));
          console.log('TALERA_EXISTING_NAV_AND_SHORTCUT_ROUTES_ACCESSIBLE_NO_NEW_UI');
          console.log('TALERA_THREE_EQUAL_NAV_SLOTS_IN_BOTH_ACCOUNT_STATES_ONLY_CSS_CHANGED');

          const before=fs.readFileSync('r20-dev/free-10m-delivery/generated/reference-present.html','utf8');
          const present=readRef('/present');
          // A direct Home story link used to paint the default reference
          // memory 50 BEFORE R19 selected ?memory=3 / local IndexedDB.
          const fromGuard=worker.indexOf('function hideUnselectedEntryPhoto(');
          const toGuard=worker.indexOf('\nconst AUTH_PATHS=',fromGuard);
          assert.ok(fromGuard>0&&toGuard>fromGuard,'Direct memory entry guard must be scoped');
          const safeRoute=u=>u.pathname==='/present'&&u.searchParams.size===1&&
            u.searchParams.has('memory');
          const gate=new Function('LOCAL_STORY_ID','allowedLocalUiSearch',
            worker.slice(fromGuard,toGuard)+';return hideUnselectedEntryPhoto;')(
            /^local-[a-z0-9-]{8,90}$/i,safeRoute);
          const rootUrl='https://talera.example/present';
          assert.equal(gate(present,rootUrl),present,
            'Ordinary presentation without a specific story must not change');
          for(const suffix of ['?year=1985','?theme=Familie','?memory=999'])
            assert.equal(gate(present,rootUrl+suffix),present,
              'Existing year/topic and unsupported legacy selectors remain unmodified');
          const gated=gate(present,rootUrl+'?memory=3');
          assert.ok(gated.includes('id="talera-direct-memory-entry-guard"'));
          assert.ok(gated.includes('id="talera-direct-memory-entry-style"'));
          assert.equal(gated.replace(/<script id="talera-direct-memory-entry-guard">[\s\S]*?<\/script><style id="talera-direct-memory-entry-style">[\s\S]*?<\/style>/,'')
              ,present,'Only the immediate entry guard may change the approved presentation');
          assert.ok(gated.indexOf('talera-direct-memory-entry-guard')<
            gated.indexOf('id="memoryPhotoA"'),
            'Wrong first photo must be hidden before it can paint');
          // Original Home has /present?memory=1031 in its year-preview list.
          // That reference is already part of the original 450-item timeline
          // but R19's bridge incorrectly rejected all IDs above 50.
          const referenceGate=gate(present,rootUrl+'?memory=1031');
          assert.ok(referenceGate.includes('id="talera-direct-memory-entry-guard"'),
            'Existing Home story 1031 must also suppress wrong startup frame');
          assert.ok(referenceGate.includes(
            'if(!Number.isInteger(id)||!((id>=1&&id<=50)||(id>=1001&&id<=1450)))return;'),
            'R19 must select already-existing reference ID 1031, not invent another story');
          assert.ok(!referenceGate.includes('if(!Number.isInteger(id)||id<1||id>50)return;'),
            'The old 1..50 limit may not orphan original Home quick links');
          assert.equal(gate(present,rootUrl+'?memory=1451'),present,
            'No unapproved reference IDs are enabled');
          const localGate=gate(present,rootUrl+'?memory=local-12345678');
          assert.ok(localGate.includes('const requested="local-12345678";'));
          assert.ok(worker.includes('const storyEntryHtml=hideUnselectedEntryPhoto(converted.html,request.url);'),
            'Personal private account pages must receive first-frame protection');
          assert.ok(worker.includes('hideUnselectedEntryPhoto(await r.text(),request.url)'),
            'Anonymous Home example links must receive identical protection');
          const innerScript=gated.match(/<script id="talera-direct-memory-entry-guard">([\s\S]*?)<\/script>/)?.[1];
          assert.ok(innerScript,'Original same presentation must include entry guard');
          const visibleClass=new Set();let frameCounter=0,intervalTick,cleaned=false;
          const classList={add:k=>visibleClass.add(k),remove:k=>visibleClass.delete(k)};
          let active={id:50,image:'wrong-reference-image',_photoLoading:false};
          let foreground='wrong-reference-image',imageReady=true;
          const dom={documentElement:{classList},getElementById:k=>k==='memoryPhotoA'?{
            getAttribute:()=>foreground,complete:imageReady,naturalWidth:imageReady?800:0}:null};
          const entryBrowser={__taleraTimelineRuntime:{currentMemory:()=>active},addEventListener:()=>{}};
          new Function('window','document','setInterval','clearInterval','requestAnimationFrame',
            innerScript)(entryBrowser,dom,fn=>(intervalTick=fn,1),()=>{cleaned=true},
            fn=>{frameCounter++;fn()});
          assert.ok(visibleClass.has('talera-direct-memory-entering'),
            'The wrong reference image MUST be hidden before R19 selects the story');
          assert.equal(typeof intervalTick,'function');
          intervalTick();
          assert.ok(visibleClass.has('talera-direct-memory-entering'),
            'Default memory 50 may never be shown when opening memory 3');
          active={id:3,image:'expected-owner-selection',_photoLoading:false};
          intervalTick();
          assert.ok(visibleClass.has('talera-direct-memory-entering'),
            'After target selection, the wrong old bitmap may not be shown');
          foreground='expected-owner-selection';imageReady=false;
          intervalTick();
          assert.ok(visibleClass.has('talera-direct-memory-entering'),
            'Target not yet decoded cannot reveal presentation photo');
          imageReady=true;intervalTick();
          assert.ok(!visibleClass.has('talera-direct-memory-entering'),
            'Reveal exactly the requested fully loaded photo after original writeMemory');
          assert.ok(frameCounter>=2&&cleaned,'Guard must release only after two paint frames');
          console.log('TALERA_DIRECT_STORY_ENTRY_NO_WRONG_REFERENCE_FRAME_R19_LOCAL');
          // Theme selection only affects the same RH19/V3 presentation engine.
          const topicScope=present.indexOf('const taleraMatchesScope = m =>');
          const scopeEnd=present.indexOf(';',topicScope);
