name: TALERA Free F5 - photo-only presentation autoplay on SAME candidate
# Push only on this dedicated integration branch. No official PWA or customer media.
on:
  push:
    branches: [feature/free-f5-local-backup-ui-20261110]
    paths:
      - '.github/workflows/talera-free-f5-existing-qa-backup-iphone.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: talera-free-f5-storage-only-iphone-qa-20261109
  cancel-in-progress: false

jobs:
  protected_backup_qa:
    name: Same QA origin, same seven DOs and five secret values, rollback on failure
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      F5_STAGE_NAME: talera-free-f5-storage-qa-20261109
      F5_STAGE_HOST: talera-free-f5-storage-qa-20261109.mark-a39.workers.dev
      F5_INVITE_HASH: d85c9339c034b39bd31a94c94bb92d4970dbe50685f74eb49952b19c79e880a2
      F5_INVITE_EXPIRES: '1794942000000'
      F5_PREVIOUS_VERSION: b42244e3-cf6f-44cb-a409-d30d8c039a6e
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Pin tested code and exact original official/QA boundaries
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 4ba7829aac46145487a61d95fff31925bf069117 HEAD
          git merge-base --is-ancestor 5bec152f1984078e06a59fa08e571cf5951b7ad9 HEAD
          git merge-base --is-ancestor a1c39e532c36894609f980fee0242eb1e6f59922 HEAD
          git merge-base --is-ancestor 0be78b8346f982237db65dc4ca81efcef48efc97 HEAD
          git diff --exit-code 4ba7829aac46145487a61d95fff31925bf069117 HEAD -- r20-dev/free-10m-delivery/ r20-dev/free-10m-f5/f5-local-scope.mjs r20-dev/free-10m-f5/f5-editor-video-mute-guard.mjs
          test -n "$CLOUDFLARE_API_TOKEN"
          CLEAN_ID="$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr -cd 'a-fA-F0-9')"
          test "${#CLEAN_ID}" -eq 32
          echo "::add-mask::$CLEAN_ID"
          echo "CLOUDFLARE_ACCOUNT_ID=$CLEAN_ID" >> "$GITHUB_ENV"
          test "$F5_STAGE_NAME" = talera-free-f5-storage-qa-20261109
          echo 'Approved player/editor/local-scope unchanged; no official PWA changes'
      - name: Verify current isolated Cloudflare QA version, five secrets, seven namespaces
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const a=process.env.CLOUDFLARE_ACCOUNT_ID,n=process.env.F5_STAGE_NAME;
          const root='https://api.cloudflare.com/client/v4/accounts/'+a+'/workers/scripts/'+n;
          async function get(path){
            const r=await fetch(root+path,{headers:{Authorization:'Bearer '+process.env.CLOUDFLARE_API_TOKEN}});
            if(!r.ok)throw Error('Cloudflare QA read failed '+path+': '+r.status);
            const data=await r.json();if(!data.success)throw Error('Cloudflare QA rejected '+path);
            return data.result;
          }
          const [s,d]=await Promise.all([get('/settings'),get('/deployments')]);
          const bindings=s.bindings||[];
          const typed=t=>bindings.filter(b=>b.type===t);
          const DO=['AUTH_ACCOUNTS','AUTH_EMAILS','AUTH_HANDLES','AUTH_SESSIONS','AUTH_RATES','SOCIAL_MEMORY','SOCIAL_POINTER'];
          const SECRETS=['STAGING_F5_KEY','STAGING_ACCESS_KEY','STAGING_SOCIAL_KEY','AUTH_NAMESPACE_KEY','DEMO_IDENTITY_KEY'];
          if(JSON.stringify(typed('durable_object_namespace').map(b=>b.name).sort())!==JSON.stringify([...DO].sort())||
             JSON.stringify(typed('secret_text').map(b=>b.name).sort())!==JSON.stringify([...SECRETS].sort())||
             typed('assets').length!==1||
             bindings.length!==17||
             bindings.find(b=>b.name==='F5_EASY_INVITE_SHA256')?.text!==process.env.F5_INVITE_HASH||
             bindings.find(b=>b.name==='F5_EASY_INVITE_EXPIRES')?.text!==process.env.F5_INVITE_EXPIRES||
             bindings.find(b=>b.name==='AUTH_STORAGE_JURISDICTION')?.text!=='eu'||
             bindings.find(b=>b.name==='SOCIAL_STORAGE_JURISDICTION')?.text!=='eu')
            throw Error('Existing QA bindings/secrets/invite changed; refuse deploy');
          const latest=d.deployments?.[0]?.versions;
          if(!Array.isArray(latest)||latest.length!==1||latest[0].percentage!==100||
             latest[0].version_id!==process.env.F5_PREVIOUS_VERSION)
            throw Error('Expected approved QA Worker version was replaced; refuse deploy');
          console.log('Exact current QA Worker version + 7 original DOs + 5 original secrets + invitation hash confirmed');
          NODE
          # Existing Free candidate already uses ordinary account login.
          for path in /mijn-leven /present; do
            code="$(curl --max-time 20 -sS -o /dev/null -w '%{http_code}' "https://$F5_STAGE_HOST$path")"
            test "$code" = 200
          done
          for path in / /__f5/backup; do
            code="$(curl --max-time 20 -sS -o /dev/null -w '%{http_code}' "https://$F5_STAGE_HOST$path")"
            if [ "$path" = / ]; then test "$code" = 302; else test "$code" = 401; fi
          done
          curl --max-time 20 -fsS "https://$F5_STAGE_HOST/__f5/health" > /tmp/f5-preflight-health.json
          node -e "const x=require('/tmp/f5-preflight-health.json'); if(!x.ok||x.closedQa!==false||x.personalRegistrationPilot!==true||x.officialTaleraConnected!==false)process.exit(1)"
      - name: Pinned installation
        run: npm ci
      - name: Rebuild exact approved anonymous assets plus separate browser-only recovery files
        run: |
          node r20-dev/free-10m-delivery/build.mjs
          node r20-dev/free-10m-f5/f5-public-assets.mjs
      - name: Check original photos-only presentation timer and private boundaries (no accounts created)
        shell: bash
        run: |
          set -euo pipefail
          node --check r20-dev/free-10m-f5/f5-worker.mjs
          node --check r20-dev/free-10m-f5/f5-public-assets.mjs
          node --check r20-dev/free-10m-f5/f5-backup-controller.mjs
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import path from 'node:path';
          import {verifiedPublicSupport as map} from './r20-dev/free-10m-f5/generated/public-template-map.mjs';
          const root='r20-dev/free-10m-delivery/public';
          const read=name=>fs.readFileSync(path.join(root,map[name].replace(/^\//,'')));
          for(const [name,size] of Object.entries({
            '/apple-touch-icon.png':180,'/pwa-192.png':192,'/pwa-512.png':512
          })){
            assert.ok(map[name],'Missing original '+name);
            const b=read(name);
            assert.equal(b.subarray(0,8).toString('hex'),'89504e470d0a1a0a');
            assert.deepEqual([b.readUInt32BE(16),b.readUInt32BE(20)],[size,size]);
          }
          const manifest=JSON.parse(read('/manifest.webmanifest').toString());
          assert.deepEqual(manifest.icons.map(i=>[i.src,i.sizes,i.type]),[
            ['/pwa-192.png','192x192','image/png'],
            ['/pwa-512.png','512x512','image/png']
          ]);
          assert.ok(manifest.start_url&&manifest.name,'Original app identity must remain');
          const worker=fs.readFileSync('r20-dev/free-10m-f5/f5-worker.mjs','utf8');
          assert.ok(!worker.includes('if(!await hasQaAccess(request,env))return deny();'),
            'Temporary QA browser gate must not protect the normal app');
          assert.ok(worker.includes("if(AUTH_PATHS.has(p))return accountApi(request,env)"),
            'Original account routes must remain unchanged');
          assert.ok(worker.includes("const actor=sessionToken?await sessionAccount(request,env):null;"),
            'Expired sessions must lead to ordinary login');
          assert.ok(worker.includes("if(sessionToken&&!actor)headers.set('set-cookie',sessionCookie('',0));"),
            'Only expired cookie must be cleared');
          assert.ok(worker.includes("if(!actor)return deny(401,'Aanmelden vereist voor lokale back-up')"),
            'Private backup must remain account gated');
          assert.ok(worker.includes("if(!actor)return deny(401,'Sessie verlopen; meld je opnieuw aan')"),
            'Private player must remain account gated');
          const start=worker.indexOf('function allowedLocalUiSearch(url){');
          const end=worker.indexOf('const F5_BROWSER_CSP=[',start);
          assert.ok(start>0&&end>start,'Pure UI routing guard must be available');
          const routeFns=Function('PUBLIC_PAGES','LOCAL_STORY_ID',
            worker.slice(start,end)+'; return {canonicalReferralUiPath};')(
            new Set(['/mijn-leven','/present','/tell']),/^local-[a-z0-9-]{8,90}$/i);
          const clean=(u,method='GET')=>
            routeFns.canonicalReferralUiPath(new URL('https://talera.example'+u),method);
          for(const [input,expected] of [
            ['/present?talera_menu=hub&utm_source=chatgpt','/present?talera_menu=hub'],
            ['/present?talera_menu=hub&ref=chatgpt','/present?talera_menu=hub'],
            ['/mijn-leven?utm_source=chatgpt','/mijn-leven'],
            ['/tell?ref=chatgpt','/tell'],
            ['/present?memory=local-12345678&utm_medium=share','/present?memory=local-12345678'],
            ['/api/me?utm_source=chatgpt',null],
            ['/present?talera_menu=hub&token=leak',null],
            ['/present?talera_menu=hub&memory=local-12345678',null],
            ['/present?memory=not-a-local-id&ref=chatgpt',null],
            ['/present?talera_menu=wrong&ref=chatgpt',null]
          ]) assert.equal(clean(input),expected,input);
          assert.equal(clean('/present?talera_menu=hub&utm_source=chatgpt','POST'),null);
          // Contract proof on the EXACT packaged authenticated /present HTML.
          // All browser-only photo inputs stay transient; no account or memory is created.
          const {referencePages:refs}=await import('./r20-dev/free-10m-f5/generated/public-template-map.mjs');
          const readRef=route=>fs.readFileSync(path.join(root,refs[route].replace(/^\//,'')),'utf8');
          for(const route of ['/mijn-leven','/tell']){
            const original=fs.readFileSync('r20-dev/free-10m-delivery/generated/reference-'+
              (route==='/tell'?'tell':'mijn-leven')+'.html','utf8');
            assert.equal(readRef(route),original,'Only /present may change');
          }
          const before=fs.readFileSync('r20-dev/free-10m-delivery/generated/reference-present.html','utf8');
          const present=readRef('/present');
          assert.ok(before.includes('    scheduleAuto(memory);\n  });'),'Original timer source missing');
          assert.ok(present.includes('  let pendingAutoPhoto=null,photoAutoSerial=0;'));
          assert.ok(present.includes('showPhoto(memory,next,true); // The original WORKING tap path.'));
          assert.ok(present.includes("if(changed||(!autoStartTimer&&!autoInterval&&!pendingAutoPhoto))scheduleAuto(memory);"));
          assert.ok(!before.includes('pendingAutoPhoto'),'Original template must be unmodified');
          assert.ok(present.includes('function taleraInlineOrdinaryStep('));
          const start=present.indexOf('  let pendingAutoPhoto=null,photoAutoSerial=0;');
          const end=present.indexOf('  window.__taleraV31SelectPhoto=',start);
          assert.ok(start>0&&end>start);
          let images=[],painted=[],dots=[],armed=0;
          class ManualImage{
            constructor(){this.loaded=false;this.complete=false;images.push(this)}
            set src(value){this.url=value}
            get naturalWidth(){return this.loaded?60:0}
            finish(){this.loaded=true;this.complete=true;this.onload?.()}
          }
          const memory={id:'transient-local-photo',_taleraLocal:true,
            _photoIndex:0,image:'one',photos:['one','two'],
            _zeroItems:[],_zeroFrames:[]};
          const func=new Function('runtime','settleVisiblePhoto','renderDots','scheduleAuto','Image','window',
            present.slice(start,end)+';return showPhoto;');
          const show=func({currentMemory:()=>memory},
            m=>painted.push(m.image),m=>dots.push(m._photoIndex),
            ()=>{armed++},ManualImage,{__taleraLocalFrameChanged:()=>{}});
          show(memory,1,false);
          assert.equal(memory._photoIndex,0,'Never move dot before photo ready');
          assert.equal(images.length,1);
          show(memory,1,false);
          assert.equal(images.length,1,'Pending photo must not be loaded twice');
          images[0].finish();
          assert.equal(memory._photoIndex,1,'Loaded photo must use manual commit');
          assert.equal(memory.image,'two');
          assert.deepEqual(painted,['two']);
          assert.deepEqual(dots,[1]);
          assert.equal(armed,1,'Reschedule original timer exactly once');
          show(memory,0,true);
          assert.equal(memory._photoIndex,0,'Original tap behavior must remain');
          const narrated={...memory,id:'narrated',_zeroItems:[{kind:'audio'}]};
          show(narrated,1,false);
          assert.equal(images.length,1,'Never change narrated photo timing');
          console.log('TALERA_PHOTO_ONLY_AUTOPLAY_LOADED_BEFORE_VISIBLE_COMMIT');
          console.log('TALERA_REFERRAL_PARAMS_CANONICALIZED_ONLY_ON_SAFE_UI_PAGES');
          console.log('TALERA_NORMAL_APP_ENTRY_OK; PRIVATE_DATA_STILL_AUTH_GATED; NO_ACCOUNTS_CREATED');
          NODE
      - name: Build identical seven-DO deployment config without re-creating or changing secrets
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const path='r20-dev/free-10m-f5/wrangler.staging.jsonc';
          const c=JSON.parse(fs.readFileSync(path,'utf8'));
          const wanted=['FreeAuthAccount','FreeAuthEmail','FreeAuthHandle','FreeAuthSession','FreeAuthRate','FreeSocialMemory','FreeSocialSharePointer'];
          if(c.name!=='talera-free-f5-combined-stage-20261108'||
             JSON.stringify(c.durable_objects?.bindings?.map(b=>b.class_name))!==JSON.stringify(wanted)||
             c.d1_databases?.length||c.r2_buckets?.length||c.services?.length||
             c.vars?.AUTH_STORAGE_JURISDICTION!=='eu'||
             c.vars?.SOCIAL_STORAGE_JURISDICTION!=='eu'||
             Number(c.vars?.F5_EASY_INVITE_EXPIRES)<=Date.now())
            throw Error('Unexpected Free QA config: no changes allowed');
          c.name=process.env.F5_STAGE_NAME;
          c.migrations=[{tag:'free-f5-storage-iphone-qa-20261109-v1',new_sqlite_classes:wanted}];
          c.vars.F5_EASY_INVITE_SHA256=process.env.F5_INVITE_HASH;
          c.vars.F5_EASY_INVITE_EXPIRES=process.env.F5_INVITE_EXPIRES;
          c.keep_vars=true;
          fs.writeFileSync('r20-dev/free-10m-f5/wrangler.backup-iphone.generated.jsonc',JSON.stringify(c,null,2)+'\n');
          console.log('Same F5 QA name, same migration/DOs/secret values, no new resource');
          NODE
      - name: Dry-run only this original QA Worker package
        run: npx --no-install wrangler deploy --dry-run --config r20-dev/free-10m-f5/wrangler.backup-iphone.generated.jsonc --outdir .talera-f5-backup-iphone-dryrun
      - name: Deploy ONLY existing private QA Worker with no secret rotation or data migration
        id: deploy
        run: npx --no-install wrangler deploy --keep-vars --config r20-dev/free-10m-f5/wrangler.backup-iphone.generated.jsonc
      - name: Assert public sign-in app and private data boundaries on the SAME origin
        shell: bash
        run: |
          set -euo pipefail
          sleep 7
          curl --max-time 20 -fsS "https://$F5_STAGE_HOST/__f5/health" > /tmp/f5-backup-health.json
          node -e "const x=require('/tmp/f5-backup-health.json');if(!x.ok||x.closedQa!==false||x.personalRegistrationPilot!==true||x.realAccountsCertified!==false||x.officialTaleraConnected!==false||x.tenMillionProven!==false)process.exit(1)"
          # Normal users can load the app without invitation. No accounts created.
          for path in /mijn-leven /present /tell '/present?talera_menu=hub' \
            /manifest.webmanifest /apple-touch-icon.png \
            /__clean/menu-integration.mjs /sw.js; do
            code="$(curl --max-time 20 -sS -o /dev/null -w '%{http_code}' "https://$F5_STAGE_HOST$path")"
            test "$code" = 200
          done
          # User's in-app 404 is reproducible with appended link parameters.
          for request in '/present?talera_menu=hub&utm_source=chatgpt' \
            '/present?talera_menu=hub&ref=chatgpt' \
            '/mijn-leven?utm_source=chatgpt'; do
            case "$request" in
              /mijn-leven*) wanted=/mijn-leven ;;
              *) wanted='/present?talera_menu=hub' ;;
            esac
            result="$(curl --max-time 20 -sS -D /tmp/talera-route-headers -o /dev/null -w '%{http_code}' "https://$F5_STAGE_HOST$request")"
            test "$result" = 302
            actual="$(tr -d '\r' </tmp/talera-route-headers | sed -n 's/^[Ll]ocation: //p' | head -1)"
            test "$actual" = "$wanted"
            result="$(curl --max-time 20 -sS -L -o /dev/null -w '%{http_code}' "https://$F5_STAGE_HOST$request")"
            test "$result" = 200
          done
          for path in '/api/me?utm_source=chatgpt' \
            '/present?talera_menu=hub&token=forbidden' \
            '/present?talera_menu=hub&memory=local-12345678'; do
            code="$(curl --max-time 20 -sS -o /dev/null -w '%{http_code}' "https://$F5_STAGE_HOST$path")"
            test "$code" = 404
          done
          # Account content, private media and social owner lists require real login.
          for path in /api/me /api/profile/birthdate /api/memories \
            /api/shares /api/my-grants /__f5/backup \
            '/vertelmodus-embed?mode=present' /__f5/backup-controller.mjs; do
            code="$(curl --max-time 20 -sS -o /dev/null -w '%{http_code}' "https://$F5_STAGE_HOST$path")"
            test "$code" = 401
          done
          for path in /__f5/start /__f5/entry; do
            code="$(curl --max-time 20 -sS -o /dev/null -w '%{http_code}' "https://$F5_STAGE_HOST$path")"
            test "$code" = 302
          done
          # iOS can request install artwork without login cookies. Nothing personal is public.
          for size in 180 192 512; do
            if [ "$size" = 180 ]; then route=/apple-touch-icon.png; else route="/pwa-$size.png"; fi
            curl --max-time 20 -fsS "https://$F5_STAGE_HOST$route" -o "/tmp/talera-logo-$size.png"
            ICON_SIZE="$size" node - <<'NODE'
          const fs=require('node:fs'),assert=require('node:assert/strict');
          const n=Number(process.env.ICON_SIZE),b=fs.readFileSync('/tmp/talera-logo-'+n+'.png');
          assert.equal(b.subarray(0,8).toString('hex'),'89504e470d0a1a0a');
          assert.deepEqual([b.readUInt32BE(16),b.readUInt32BE(20)],[n,n]);
          NODE
          done
          curl --max-time 20 -fsS "https://$F5_STAGE_HOST/manifest.webmanifest" -o /tmp/talera-logo-manifest.json
          node -e "const x=require('/tmp/talera-logo-manifest.json');if(!x.icons.some(i=>i.src==='/pwa-192.png')||!x.icons.some(i=>i.src==='/pwa-512.png'))process.exit(1)"
          echo 'TALERA_ORIGINAL_ICON_PUBLIC; PRIVATE_APP_REMAINS_PROTECTED'
          echo 'TALERA_FREE_SINGLE_APP_NORMAL_ENTRY_OK: no invitations, no fake accounts, private APIs still require login'
      - name: Restore prior proven QA Worker if deployment or postdeploy validation fails
        if: ${{ failure() && (steps.deploy.outcome == 'success' || steps.deploy.outcome == 'failure') }}
        run: |
          npx --no-install wrangler rollback --name "$F5_STAGE_NAME" --message "Restore iPhone-approved TALERA F5 QA after backup staging failure" --config r20-dev/free-10m-f5/wrangler.backup-iphone.generated.jsonc
