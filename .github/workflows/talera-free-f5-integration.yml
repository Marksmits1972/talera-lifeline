              assert.ok(!/Test 081|talera-500-fotoband-|TALERA_STRESS_MEMORIES/i.test(html),
                'Bundled example story remains: '+route);
              assert.ok(!/https:\/\/picsum\.photos\/seed\/talera-(?:v11-clean|500-fotoband)-/i.test(html),
                'Internet sample-photo link remains: '+route);
              if(route==='/mijn-leven'){
                assert.ok(html.includes('window.__taleraReferenceMemories=[];'));
                if(collection===referencePages){
                  assert.ok(html.includes('id="talera-owner-delete-on-request"')&&
                    html.includes("wis-alle-verhalen")&&
                    !html.includes("talera-clear-confirm-button"),
                    'Owner single-use reset missing from signed-in Home');
                }else{
                  assert.ok(html.includes('id="talera-owner-delete-on-request"')&&
                    html.includes("wis-alle-verhalen"),
                    'Owner one-time same-device reset missing from guest Home');
                }
              }
              if(route==='/present')assert.ok(html.includes('const MEMORIES = [];'));
              pages++;
            }
          }
          assert.equal(pages,6);
          console.log('ALL_SIX_REAL_USER_AND_SIGNED_OUT_TALERA_PAGES_ZERO_STORIES_ZERO_SAMPLE_PHOTO_LINKS');
          NODE
      - name: Prepare original Worker without unverified email binding or account migration
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';import assert from 'node:assert/strict';
          const before=JSON.parse(fs.readFileSync('/tmp/talera-empty-stories-preflight.json','utf8')).bindings;
          const c=JSON.parse(fs.readFileSync('r20-dev/free-10m-f5/wrangler.staging.jsonc','utf8'));
          assert.equal(c.name,'talera-free-f5-combined-stage-20261108');
          c.name=process.env.F5_STAGE_NAME;
          delete c.send_email;
          delete c.vars.TALERA_RESET_FROM;
          const names=['AUTH_STORAGE_JURISDICTION','SOCIAL_STORAGE_JURISDICTION',
            'F5_EASY_INVITE_SHA256','F5_EASY_INVITE_EXPIRES'];
          assert.deepEqual(Object.keys(c.vars).sort(),names.slice().sort());
          for(const name of names){
            const live=before.find(x=>x.name===name&&x.type==='plain_text');
            assert.ok(live?.text,'Missing original nonsecret value '+name);
            c.vars[name]=live.text;
          }
          const expected=['FreeAuthAccount','FreeAuthEmail','FreeAuthHandle','FreeAuthSession',
            'FreeAuthRate','FreeSocialMemory','FreeSocialSharePointer'];
          assert.deepEqual(c.durable_objects.bindings.map(x=>x.class_name),expected);
          assert.ok(!c.d1_databases?.length&&!c.r2_buckets?.length&&!c.services?.length);
          c.migrations=[{tag:'free-f5-storage-iphone-qa-20261109-v1',new_sqlite_classes:expected}];
          c.keep_vars=true;
          fs.writeFileSync('r20-dev/free-10m-f5/wrangler.owner-empty.generated.jsonc',
            JSON.stringify(c,null,2)+'\n');
          console.log('PRESERVE_ORIGINAL_ACCOUNT_STORES_MEDIA_IDS_SECRETS_WITH_NO_EMAIL_PROVIDER_CHANGE');
          NODE
          npx --no-install wrangler deploy --dry-run \
            --config r20-dev/free-10m-f5/wrangler.owner-empty.generated.jsonc \
            --outdir .talera-owner-empty-dryrun
      - name: Confirm unchanged live QA version immediately before update
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const accountId=process.env.CLOUDFLARE_ACCOUNT_ID.replace(/[^a-fA-F0-9]/g,'');
          const uri='https://api.cloudflare.com/client/v4/accounts/'+accountId+'/workers/scripts/'+
            process.env.F5_STAGE_NAME+'/deployments';
          const response=await fetch(uri,{headers:{Authorization:'Bearer '+process.env.CLOUDFLARE_API_TOKEN},
            signal:AbortSignal.timeout(20000)});
          assert.equal(response.status,200);
          const j=await response.json();assert.equal(j.success,true);
          assert.deepEqual(j.result.deployments?.[0]?.versions?.map(x=>[x.version_id,x.percentage]),
            [[process.env.F5_EXPECTED_LIVE_VERSION,100]],'App changed while checking, do not overwrite');
          NODE
      - name: Publish zero-example TALERA to SAME currently used app origin
        id: deployed
        run: npx --no-install wrangler deploy --keep-vars --config r20-dev/free-10m-f5/wrangler.owner-empty.generated.jsonc
      - name: Verify live blank stories, same private account bindings and app routes
        run: |
          set -euo pipefail
          for route in /mijn-leven /present /tell; do
            test "$(curl -fsS --max-time 25 -o /dev/null -w '%{http_code}' "https://$F5_STAGE_HOST$route")" = 200
          done
          test "$(curl -sS --max-time 25 -o /dev/null -w '%{http_code}' "https://$F5_STAGE_HOST/__f5/backup")" = 401
          # The edge may briefly serve the preceding version right after
          # deployment succeeds. Verify the NEW guest script after propagation,
          # not on the first subsecond old-cache response.
          found=0
          for attempt in $(seq 1 12); do
            code=$(curl -sS --max-time 25 -o /tmp/talera-guest-wipe.html -w '%{http_code}' \
              "https://$F5_STAGE_HOST/mijn-leven?wis-alle-verhalen=nu" || echo 000)
            if [ "$code" = 200 ] && grep -Fq 'id="talera-owner-delete-on-request"' /tmp/talera-guest-wipe.html; then
              found=1
              echo "TALERA_REAL_GUEST_RESET_URL_ACTIVE_ATTEMPT=$attempt"
              break
            fi
            echo "TALERA_RESET_EDGE_NOT_YET_VISIBLE_ATTEMPT=$attempt CODE=$code"
            sleep 3
          done
          test "$found" = 1
          # The distinct PATH cannot be stripped as query or hash by the iPhone
          # in-app browser. It must render the original TALERA Home with the
          # exact existing signed-out local-story cleanup script.
          fresh=0
          for attempt in $(seq 1 12); do
            code=$(curl -sS --max-time 25 -o /tmp/talera-cleanup-path.html -w '%{http_code}' \
              "https://$F5_STAGE_HOST/mijn-leven/opschonen-cfd3450b58ef9410b64a26cc84c2045c" || echo 000)
            if [ "$code" = 200 ] && grep -Fq "talera-owner-delete-on-request" /tmp/talera-cleanup-path.html &&
                grep -Fq "talera-free-owner-cleanup-cfd3450b58ef9410b64a26cc84c2045c" /tmp/talera-cleanup-path.html; then
              fresh=1
              echo "OWNER_RESET_REAL_PATH_SAME_TALERA_APP_ACTIVE_ATTEMPT=$attempt"
              break
            fi
            echo "OWNER_RESET_PATH_NOT_YET_VISIBLE_ATTEMPT=$attempt CODE=$code"
            sleep 3
          done
          test "$fresh" = 1
          curl -fsS --max-time 25 "https://$F5_STAGE_HOST/mijn-leven" >/tmp/talera-empty-home.html
          curl -fsS --max-time 25 "https://$F5_STAGE_HOST/present" >/tmp/talera-empty-present.html
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';import fs from 'node:fs';
          const home=fs.readFileSync('/tmp/talera-empty-home.html','utf8');
          const present=fs.readFileSync('/tmp/talera-empty-present.html','utf8');
          assert.ok(home.includes('window.__taleraReferenceMemories=[];')&&present.includes('const MEMORIES = [];'));
          assert.ok(present.includes('const rows=[]; // Login required: no local media read.'));
          for(const html of [home,present]){
            assert.ok(!/Test 081|talera-500-fotoband-|TALERA_STRESS_MEMORIES/i.test(html));
            assert.ok(!/https:\/\/picsum\.photos\/seed\/talera-(?:v11-clean|500-fotoband)-/i.test(html));
          }
          const accountId=process.env.CLOUDFLARE_ACCOUNT_ID.replace(/[^a-fA-F0-9]/g,'');
          const base='https://api.cloudflare.com/client/v4/accounts/'+accountId+
            '/workers/scripts/'+process.env.F5_STAGE_NAME;
          const get=async suffix=>{
            const r=await fetch(base+suffix,{headers:{Authorization:'Bearer '+process.env.CLOUDFLARE_API_TOKEN},
              signal:AbortSignal.timeout(20000)});
            assert.equal(r.status,200);const d=await r.json();assert.equal(d.success,true);return d.result;
          };
          const [s,d]=await Promise.all([get('/settings'),get('/deployments')]);
          const norm=x=>({name:x.name,type:x.type,class_name:x.class_name||null,
            namespace_id:x.namespace_id||null,text:x.text||null});
          const sort=a=>a.map(norm).sort((a,b)=>a.name.localeCompare(b.name));
          const before=JSON.parse(fs.readFileSync('/tmp/talera-empty-stories-preflight.json','utf8')).bindings;
          assert.deepEqual(sort(s.bindings||[]),before,'Any secret/account binding difference must roll back');
          assert.equal(d.deployments?.[0]?.versions?.length,1);
          assert.equal(d.deployments[0].versions[0].percentage,100);
          assert.notEqual(d.deployments[0].versions[0].version_id,process.env.F5_EXPECTED_LIVE_VERSION);
          console.log('OWNER_AUTHORIZED_EMPTY_TALERA_LIVE_SAME_ORIGIN_ZERO_EXAMPLES_17_BINDINGS_UNCHANGED');
          NODE
      - name: Restore previous TALERA version if deploy or postdeploy verification fails
        if: ${{ failure() && (steps.deployed.outcome == 'success' || steps.deployed.outcome == 'failure') }}
        run: npx --no-install wrangler rollback --name "$F5_STAGE_NAME" --message "Restore previous TALERA QA after failed no-example release" --config r20-dev/free-10m-f5/wrangler.owner-empty.generated.jsonc

