      - name: Recheck deployment version immediately before writing
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const u='https://api.cloudflare.com/client/v4/accounts/'+process.env.CLOUDFLARE_ACCOUNT_ID+'/workers/scripts/'+process.env.F5_STAGE_NAME+'/deployments';
          const r=await fetch(u,{headers:{Authorization:'Bearer '+process.env.CLOUDFLARE_API_TOKEN},signal:AbortSignal.timeout(20000)});
          assert.equal(r.status,200);
          const j=await r.json();assert.equal(j.success,true);
          assert.deepEqual(j.result.deployments?.[0]?.versions?.map(x=>[x.version_id,x.percentage]),[[process.env.F5_ACTIVE_VERSION,100]]);
          NODE
      - name: Publish this exact library candidate to the ALREADY EXISTING TALERA acceptance origin
        id: deploy
        run: npx --no-install wrangler deploy --keep-vars --config r20-dev/free-10m-f5/wrangler.library-acceptance.generated.jsonc
      - name: Check real app routes, private backup guard and all unchanged bindings
        shell: bash
        run: |
          set -euo pipefail
          for path in /mijn-leven /present /tell; do
            test "$(curl --max-time 25 -sS -o /dev/null -w '%{http_code}' "https://$F5_STAGE_HOST$path")" = 200
          done
          test "$(curl --max-time 25 -sS -o /dev/null -w '%{http_code}' "https://$F5_STAGE_HOST/__f5/backup")" = 401
          # Verify the actual anonymous login-fallback, not only HTTP 200.
          # This was the path that leaked 500 example stories on an expired session.
          curl --max-time 25 -fsS "https://$F5_STAGE_HOST/mijn-leven" >/tmp/talera-f5-empty-home.html
          curl --max-time 25 -fsS "https://$F5_STAGE_HOST/present" >/tmp/talera-f5-empty-present.html
          curl --max-time 25 -fsS "https://$F5_STAGE_HOST/__f5/health" >/tmp/talera-library-qa-health.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';import assert from 'node:assert/strict';
          const guestHome=fs.readFileSync('/tmp/talera-f5-empty-home.html','utf8');
          const guestPresent=fs.readFileSync('/tmp/talera-f5-empty-present.html','utf8');
          assert.ok(guestHome.includes('window.__taleraReferenceMemories=[];')&&
            guestHome.includes('rows=[];')&&guestPresent.includes('const MEMORIES = [];'),
            'EXPIRED_SESSION_MUST_SHOW_EMPTY_TALERA_NOT_EXAMPLES');
          for(const page of [guestHome,guestPresent]){
            assert.ok(!page.includes('Test 081')&&
              !page.includes('talera-500-fotoband-')&&
              !page.includes('TALERA_STRESS_MEMORIES'),
              'PUBLISHED_ANONYMOUS_PAGE_HAS_OLD_SAMPLE_CATALOG');
          }
          console.log('SAME_ORIGIN_GUEST_0_EXAMPLES_POSTDEPLOY_PASS');
          const h=JSON.parse(fs.readFileSync('/tmp/talera-library-qa-health.json','utf8'));
          assert.equal(h.ok,true);assert.equal(h.officialTaleraConnected,false);
          const root='https://api.cloudflare.com/client/v4/accounts/'+process.env.CLOUDFLARE_ACCOUNT_ID+'/workers/scripts/'+process.env.F5_STAGE_NAME;
          const hdr={Authorization:'Bearer '+process.env.CLOUDFLARE_API_TOKEN};
          const req=async suffix=>{
            const r=await fetch(root+suffix,{headers:hdr,signal:AbortSignal.timeout(20000)});
            assert.equal(r.status,200);
            const j=await r.json();assert.equal(j.success,true);return j.result;
          };
          const [s,d]=await Promise.all([req('/settings'),req('/deployments')]);
          const normalize=b=>({name:b.name,type:b.type,class_name:b.class_name||null,namespace_id:b.namespace_id||null,text:b.text||null});
          const current=(s.bindings||[]).map(normalize).sort((a,b)=>a.name.localeCompare(b.name));
          const before=JSON.parse(fs.readFileSync('/tmp/talera-library-preflight.json','utf8')).bindings;
          assert.deepEqual(current,before,'Protect accounts, secrets, files and invite after publish');
          const versions=d.deployments?.[0]?.versions;
          assert.equal(versions?.length,1);
          assert.equal(versions?.[0]?.percentage,100);
          assert.notEqual(versions?.[0]?.version_id,process.env.F5_ACTIVE_VERSION);
          console.log('SAME_TALERA_ORIGIN_LIBRARY_ACCEPTANCE_PUBLISHED; IPHONE_TEST_STILL_OPEN');
          NODE
      - name: Restore preceding TALERA QA Worker on post-deploy failure
        if: ${{ failure() && (steps.deploy.outcome == 'success' || steps.deploy.outcome == 'failure') }}
        run: npx --no-install wrangler rollback --name "$F5_STAGE_NAME" --message "Restore previous TALERA QA after zero-demo guest-shell verification failure" --config r20-dev/free-10m-f5/wrangler.library-acceptance.generated.jsonc
