name: TALERA Free F5 - isolated single-origin integration tests

on:
  push:
    branches: [feature/free-10m-f5-integrated-staging-20261108, feature/free-f5-approved-20261111-backup-only, feature/free-f5-independent-narrator-20261112, feature/free-f5-narrator-story-swipe-20261113, feature/free-f5-library-boundary-20261117]
    paths:
      - 'r20-dev/free-10m-f5/**'
      - 'r20-dev/free-10m-auth-pilot/**'
      - '.github/workflows/talera-free-f5-integration.yml'
  pull_request:
    branches: [feature/free-10m-social-memory-do-20261108]
    paths:
      - 'r20-dev/free-10m-f5/**'
      - '.github/workflows/talera-free-f5-integration.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  f5_world_settlement_selection:
    name: Verify independent settlements from exact frozen GeoNames source, same TALERA Free, no publish
    if: ${{ github.event_name == 'push' && github.ref_name == 'feature/free-f5-library-boundary-20261117' && github.event.head_commit.message == 'prepare-TALERA-free-world-independent-settlements-20261127' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Pin the original verified source and exclude only explicitly unsuitable place categories
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = d1002ac0fabde1fd4777be09b7008632e9f1fb6b
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --retry 2 --max-time 600 --max-filesize 1000000000 https://download.geonames.org/export/dump/allCountries.zip -o "$RUNNER_TEMP/world.zip"
          echo "6a0850259892fa149f51a1ae0204d1654b1db7739886ef88127b986931d9dcd5  $RUNNER_TEMP/world.zip" | sha256sum -c -
          src=r20-dev/free-10m-f5
          python3 "$src/f5-offline-world-data-build.py" "$RUNNER_TEMP/world.zip" "$RUNNER_TEMP/settlements" --exclude-districts
          node "$src/f5-offline-world-data-benchmark.mjs" "$RUNNER_TEMP/settlements" "$src/f5-offline-locality-data.bin"
      - name: Verify exact counts and unchanged separate geographic layer
        run: |
          set -euo pipefail
          python3 - <<'PYDATA'
          import os, pathlib, json, hashlib
          prior=pathlib.Path("r20-dev/free-10m-f5/f5-world-data")
          current=pathlib.Path(os.environ['RUNNER_TEMP'])/'settlements'
          a=json.loads((prior/'world-manifest.json').read_text())
          b=json.loads((current/'world-manifest.json').read_text())
          assert a['sourceSha256']==b['sourceSha256']
          assert b['settlementPolicy']=='independent-settlement-v1'
          assert b['layers']['populated']['records']==a['layers']['populated']['records']-a['featureCounts']['P.PPLX']-a['featureCounts']['P.']
          assert b['excluded']['non_independent_settlement_or_unknown']==a['featureCounts']['P.PPLX']+a['featureCounts']['P.']
          assert b['layers']['travel']==a['layers']['travel']
          assert all(p['bytes']<24*1024*1024 for p in b['layers']['populated']['parts'])
          print('TALERA_WORLD_SETTLEMENT_POLICY_VERIFIED',b['layers']['populated']['records'],b['excluded']['non_independent_settlement_or_unknown'])
          PYDATA
      - name: Freeze exact filtered public selection in same source branch, preserving previous frozen commit
        run: |
          set -euo pipefail
          root=r20-dev/free-10m-f5/f5-world-settlement-data
          mkdir "$root"
          cp "$RUNNER_TEMP/settlements/world-manifest.json" "$root/"
          python3 - <<'PYDATA'
          import os, pathlib, json, shutil
          root=pathlib.Path('r20-dev/free-10m-f5/f5-world-settlement-data')
          m=json.loads((root/'world-manifest.json').read_text())
          for p in m['layers']['populated']['parts']:
            shutil.copyfile(pathlib.Path(os.environ['RUNNER_TEMP'])/'settlements'/p['file'],root/p['file'])
          PYDATA
          git add "$root"
          git diff --cached --name-only
          test -z "$(git diff --cached --name-only | grep -v '^r20-dev/free-10m-f5/f5-world-settlement-data/' || true)"
          test "$(git ls-remote origin "refs/heads/$GITHUB_REF_NAME" | cut -f1)" = "$GITHUB_SHA"
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Freeze exact independent settlement selection; previous GeoNames data unchanged; no deploy'
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
          echo "TALERA_WORLD_INDEPENDENT_SETTLEMENT_DATA_COMMIT=$(git rev-parse HEAD)"

  f5_freeze_global_geonames_data:
    name: Freeze exact verified public GeoNames data in the existing Free branch, no deploy
    if: ${{ github.event_name == 'push' && github.ref_name == 'feature/free-f5-library-boundary-20261117' && github.event.head_commit.message == 'freeze-TALERA-free-verified-global-geonames-data-20261127' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Retrieve exact already verified public data artifact (not a new download)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = 5471a1ae1048665b0cf79306383924d1ff777bb4
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/15234455917/zip" > "$RUNNER_TEMP/world.zip"
          echo "fdf5c9439867f6f6d4ad983d225ca26e41eff7ab72f417e64bb597edc03b531e  $RUNNER_TEMP/world.zip" | sha256sum -c -
          mkdir "$RUNNER_TEMP/world"
          unzip -q "$RUNNER_TEMP/world.zip" -d "$RUNNER_TEMP/world"
          test "$(cat "$RUNNER_TEMP/world/source.sha")" = 5471a1ae1048665b0cf79306383924d1ff777bb4
          test "$(sha256sum r20-dev/free-10m-f5/f5-offline-locality-data.bin | cut -d' ' -f1)" = 5f5e7a13226670435ce8ef028bc97f50542047b5e7bac0b7b3591aef24b737ae
      - name: Verify the complete exact dataset again, including baseline-first policy
        run: |
          set -euo pipefail
          src=r20-dev/free-10m-f5
          node "$src/f5-offline-world-data-benchmark.mjs" "$RUNNER_TEMP/world" "$src/f5-offline-locality-data.bin"
      - name: Preserve only eight public binary parts and attribution manifest on SAME branch
        run: |
          set -euo pipefail
          root=r20-dev/free-10m-f5/f5-world-data
          test ! -e "$root"
          mkdir "$root"
          cp "$RUNNER_TEMP/world/world-manifest.json" "$root/"
          cp "$RUNNER_TEMP/world"/places-*.bin "$root/"
          test "$(find "$root" -type f | wc -l)" = 9
          git add "$root"
          git diff --cached --name-only
          test "$(git diff --cached --name-only | wc -l)" = 9
          test "$(git ls-remote origin "refs/heads/$GITHUB_REF_NAME" | cut -f1)" = "$GITHUB_SHA"
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Freeze exact measured GeoNames world data; no product integration or deployment'
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
          echo "TALERA_EXACT_WORLD_DATA_FROZEN_COMMIT=$(git rev-parse HEAD)"

  f5_prepare_global_geonames_data:
    name: Measure and prepare full GeoNames public offline data for SAME TALERA Free, no deploy
    if: ${{ github.event_name == 'push' && github.ref_name == 'feature/free-f5-library-boundary-20261117' && github.event.head_commit.message == 'prepare-TALERA-free-global-geonames-data-20261127' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download official public world extract, no keys, preserve existing source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = bf19f7f189c250e1f356f5b0a2e36e04ebcf3749
          test "$(sha256sum r20-dev/free-10m-f5/f5-offline-locality-data.bin | cut -d' ' -f1)" = 5f5e7a13226670435ce8ef028bc97f50542047b5e7bac0b7b3591aef24b737ae
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --retry 2 --max-time 600 --max-filesize 1000000000 https://download.geonames.org/export/dump/allCountries.zip -o "$RUNNER_TEMP/geonames-allCountries.zip"
          echo "TALERA_WORLD_ARCHIVE_BYTES=$(stat -c %s "$RUNNER_TEMP/geonames-allCountries.zip")"
          sha256sum "$RUNNER_TEMP/geonames-allCountries.zip"
      - name: Build immutable compact parts and independent travel-feature selection from real full dataset
        run: |
          set -euo pipefail
          src=r20-dev/free-10m-f5
          mkdir -p "$RUNNER_TEMP/talera-world"
          python3 "$src/f5-offline-world-data-build.py" "$RUNNER_TEMP/geonames-allCountries.zip" "$RUNNER_TEMP/talera-world"
          printf '%s\n' "$GITHUB_SHA" > "$RUNNER_TEMP/talera-world/source.sha"
      - name: Verify every coordinate and checksum, compare actual published resolver, measure real index lookup
        run: |
          set -euo pipefail
          src=r20-dev/free-10m-f5
          node "$src/f5-offline-world-data-benchmark.mjs" "$RUNNER_TEMP/talera-world" "$src/f5-offline-locality-data.bin" | tee "$RUNNER_TEMP/talera-world/benchmark.log"
      - name: Retain exact public data package for existing TALERA candidate ONLY
        uses: actions/upload-artifact@v4
        with:
          name: talera-free-world-geonames-public-data
          path: ${{ runner.temp }}/talera-world/
          if-no-files-found: error
          retention-days: 30
          compression-level: 6

  f5_candidate_package:
    name: Build and archive the exact TALERA Free candidate once
    if: ${{ github.ref_name == 'feature/free-f5-library-boundary-20261117' && github.event.head_commit.message != 'qa-deploy-TALERA-free-compact-backup-exact-tested-now-20261124' && github.event.head_commit.message != 'qa-restore-TALERA-free-official-morning-anchor-20261125' && github.event.head_commit.message != 'qa-deploy-TALERA-free-worldwide-places-exact-green-20261128' && github.event.head_commit.message != 'qa-deploy-TALERA-free-presentation-only-exact-green-20261128' && github.event.head_commit.message != 'qa-deploy-TALERA-free-presentation-only-video-timing-exact-green-20261128' && github.event.head_commit.message != 'qa-deploy-TALERA-free-compact-location-both-engines-exact-green-20261128' && github.event.head_commit.message != 'prepare-TALERA-free-global-geonames-data-20261127' && github.event.head_commit.message != 'freeze-TALERA-free-verified-global-geonames-data-20261127' && github.event.head_commit.message != 'prepare-TALERA-free-world-independent-settlements-20261127' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    permissions:
      contents: read
    outputs:
      archive_sha256: ${{ steps.package.outputs.sha256 }}
    env:
      F5_EXACT_SOURCE_SHA: ${{ github.event_name == 'push' && github.event.head_commit.message == 'test-TALERA-free-presentation-only-video-runtime-id-20261128' && 'ebaff8d61273d5b4c8b25ea8ac89a4350082e39a' || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.event.head_commit.message == 'test-TALERA-free-presentation-only-video-runtime-id-20261128' && 'ebaff8d61273d5b4c8b25ea8ac89a4350082e39a' || '' }}
          persist-credentials: false
          fetch-depth: ${{ github.event.head_commit.message == 'test-TALERA-free-presentation-only-video-runtime-id-20261128' && 2 || 1 }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies and build public TALERA once
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$F5_EXACT_SOURCE_SHA"
          if [ "$F5_EXACT_SOURCE_SHA" = "ebaff8d61273d5b4c8b25ea8ac89a4350082e39a" ]; then
            test "$(git rev-parse HEAD^)" = "83648055027121dfb3fac150443d43d189fbf6d4"
            test "$(git diff --name-only HEAD^ HEAD)" = "$(printf '%s\n' r20-dev/free-10m-f5/f5-ordinary-presentation.browser.test.mjs r20-dev/free-10m-f5/f5-ordinary-video-isolation.browser.test.mjs r20-dev/free-10m-f5/f5-public-assets.mjs)"
            echo TALERA_PRESENTATION_ONLY_SOURCE_VERIFIED "$F5_EXACT_SOURCE_SHA"
          fi
          test -z "$(git ls-files r20-dev/free-10m-delivery/public r20-dev/free-10m-delivery/generated r20-dev/free-10m-f5/generated)"
          npm ci
          node r20-dev/free-10m-delivery/build.mjs
          node r20-dev/free-10m-f5/f5-public-assets.mjs
          node --test r20-dev/free-10m-f5/f5-language.test.mjs r20-dev/free-10m-f5/f5-memory-location.test.mjs r20-dev/free-10m-f5/f5-offline-locality.test.mjs
      - name: Archive allowlisted anonymous software outputs and bind to exact commit
        id: package
        run: |
          set -euo pipefail
          roots=(r20-dev/free-10m-delivery/public r20-dev/free-10m-delivery/generated r20-dev/free-10m-f5/generated)
          for root in "${roots[@]}"; do
            test -d "$root"
            test -z "$(find "$root" ! -type d ! -type f -print)"
            test -z "$(find "$root" -type f \( -name '*.env' -o -name '.env*' -o -name '*.sqlite*' -o -name '*.db' -o -name '*cookie*' -o -name '*secret*' -o -name 'f5-results.json' \) -print)"
          done
          # These files are generated solely from approved anonymous public app sources.
          # Archive before any browser, account, Worker or database tests run.
          out="$RUNNER_TEMP/talera-candidate-package"
          mkdir -p "$out"
          tar --sort=name --owner=0 --group=0 --numeric-owner -czf "$out/candidate.tar.gz" "${roots[@]}"
          printf '%s\n' "$F5_EXACT_SOURCE_SHA" > "$out/source.sha"
          (cd "$out" && sha256sum candidate.tar.gz > archive.sha256)
          digest="$(cut -d' ' -f1 "$out/archive.sha256")"
          echo "sha256=$digest" >> "$GITHUB_OUTPUT"
          echo "TALERA_CANDIDATE_ARCHIVE_SHA256=$digest SOURCE=$F5_EXACT_SOURCE_SHA"
      - name: Retain immutable exact candidate for independent tests and explicit release
        uses: actions/upload-artifact@v4
        with:
          name: talera-free-f5-candidate-package
          path: ${{ runner.temp }}/talera-candidate-package/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  f5_actual_registration_button:
    name: Diagnose real TALERA account confirmation button in SAME app
    needs: f5_candidate_package
    if: ${{ github.ref_name == 'feature/free-f5-library-boundary-20261117' && github.event.head_commit.message != 'qa-deploy-TALERA-free-compact-backup-exact-tested-now-20261124' && github.event.head_commit.message != 'qa-restore-TALERA-free-official-morning-anchor-20261125' && github.event.head_commit.message != 'qa-deploy-TALERA-free-worldwide-places-exact-green-20261128' && github.event.head_commit.message != 'qa-deploy-TALERA-free-presentation-only-exact-green-20261128' && github.event.head_commit.message != 'qa-deploy-TALERA-free-presentation-only-video-timing-exact-green-20261128' && github.event.head_commit.message != 'qa-deploy-TALERA-free-compact-location-both-engines-exact-green-20261128' && github.event.head_commit.message != 'prepare-TALERA-free-global-geonames-data-20261127' && github.event.head_commit.message != 'freeze-TALERA-free-verified-global-geonames-data-20261127' && github.event.head_commit.message != 'prepare-TALERA-free-world-independent-settlements-20261127' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    permissions:
      contents: read
    env:
      F5_EXACT_SOURCE_SHA: ${{ github.event_name == 'push' && github.event.head_commit.message == 'test-TALERA-free-presentation-only-video-runtime-id-20261128' && 'ebaff8d61273d5b4c8b25ea8ac89a4350082e39a' || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.event.head_commit.message == 'test-TALERA-free-presentation-only-video-runtime-id-20261128' && 'ebaff8d61273d5b4c8b25ea8ac89a4350082e39a' || '' }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Download the same immutable TALERA candidate
        uses: actions/download-artifact@v4
        with:
          name: talera-free-f5-candidate-package
          path: ${{ runner.temp }}/talera-candidate-package
      - name: Verify exact commit and package SHA256 before independent tests
        env:
          EXPECTED_ARCHIVE_SHA256: ${{ needs.f5_candidate_package.outputs.archive_sha256 }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/talera-candidate-package"
          test "$(git rev-parse HEAD)" = "$F5_EXACT_SOURCE_SHA"
          test "$(cat "$out/source.sha")" = "$F5_EXACT_SOURCE_SHA"
          test "${#EXPECTED_ARCHIVE_SHA256}" -eq 64
          test "$(sha256sum "$out/candidate.tar.gz" | cut -d' ' -f1)" = "$EXPECTED_ARCHIVE_SHA256"
          (cd "$out" && sha256sum -c archive.sha256)
          tar -xzf "$out/candidate.tar.gz"
          echo "TALERA_TESTS_USE_EXACT_CANDIDATE_SHA256=$EXPECTED_ARCHIVE_SHA256 SOURCE=$F5_EXACT_SOURCE_SHA"
      - name: Run existing synthetic account browser regression without unrelated photo-slider checks
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const path='r20-dev/free-10m-f5/f5-browser-account-isolation.mjs';
          const original=fs.readFileSync(path,'utf8');
          const token='chromium.launch({headless:true})';
          assert.equal(original.split(token).length,2);
          fs.writeFileSync(path,original.replace(token,
            'chromium.launch({channel:"chrome",headless:true})'));
          NODE
          node r20-dev/free-10m-f5/f5-browser-account-isolation.mjs

  f5_isolated_local:
    name: F5 - real local Worker, seven DOs, existing PWA anonymous shell
    needs: f5_candidate_package
    if: ${{ !cancelled() && (github.ref_name != 'feature/free-f5-library-boundary-20261117' || needs.f5_candidate_package.result == 'success') && (github.event_name != 'push' || github.event.head_commit.message != 'qa-deploy-TALERA-free-compact-backup-exact-tested-now-20261124' && github.event.head_commit.message != 'qa-restore-TALERA-free-official-morning-anchor-20261125' && github.event.head_commit.message != 'qa-deploy-TALERA-free-worldwide-places-exact-green-20261128' && github.event.head_commit.message != 'qa-deploy-TALERA-free-presentation-only-exact-green-20261128' && github.event.head_commit.message != 'qa-deploy-TALERA-free-presentation-only-video-timing-exact-green-20261128' && github.event.head_commit.message != 'qa-deploy-TALERA-free-compact-location-both-engines-exact-green-20261128' && github.event.head_commit.message != 'prepare-TALERA-free-global-geonames-data-20261127' && github.event.head_commit.message != 'freeze-TALERA-free-verified-global-geonames-data-20261127' && github.event.head_commit.message != 'prepare-TALERA-free-world-independent-settlements-20261127') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    env:
      F5_EXACT_SOURCE_SHA: ${{ github.event_name == 'push' && github.event.head_commit.message == 'test-TALERA-free-presentation-only-video-runtime-id-20261128' && 'ebaff8d61273d5b4c8b25ea8ac89a4350082e39a' || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.event.head_commit.message == 'test-TALERA-free-presentation-only-video-runtime-id-20261128' && 'ebaff8d61273d5b4c8b25ea8ac89a4350082e39a' || '' }}
          fetch-depth: 0 # Required for exact 11-Nov approved restoration commit proof
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install existing locked Cloudflare Wrangler
        run: npm ci
      - name: Build approved public code using only six anonymous GETs
        if: ${{ github.ref_name != 'feature/free-f5-library-boundary-20261117' }}
        run: node r20-dev/free-10m-delivery/build.mjs
      - name: Package only public PWA references and stable external JavaScript
        if: ${{ github.ref_name != 'feature/free-f5-library-boundary-20261117' }}
        run: node r20-dev/free-10m-f5/f5-public-assets.mjs
      - name: Download the same immutable TALERA candidate
        if: ${{ github.ref_name == 'feature/free-f5-library-boundary-20261117' }}
        uses: actions/download-artifact@v4
        with:
          name: talera-free-f5-candidate-package
          path: ${{ runner.temp }}/talera-candidate-package
      - name: Verify exact commit and package SHA256 before independent tests
        if: ${{ github.ref_name == 'feature/free-f5-library-boundary-20261117' }}
        env:
          EXPECTED_ARCHIVE_SHA256: ${{ needs.f5_candidate_package.outputs.archive_sha256 }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/talera-candidate-package"
          test "$(git rev-parse HEAD)" = "$F5_EXACT_SOURCE_SHA"
          test "$(cat "$out/source.sha")" = "$F5_EXACT_SOURCE_SHA"
          test "${#EXPECTED_ARCHIVE_SHA256}" -eq 64
          test "$(sha256sum "$out/candidate.tar.gz" | cut -d' ' -f1)" = "$EXPECTED_ARCHIVE_SHA256"
          (cd "$out" && sha256sum -c archive.sha256)
          tar -xzf "$out/candidate.tar.gz"
          echo "TALERA_TESTS_USE_EXACT_CANDIDATE_SHA256=$EXPECTED_ARCHIVE_SHA256 SOURCE=$F5_EXACT_SOURCE_SHA"
      - name: Inspect exact existing service worker for safe offline design (read-only)
        run: node r20-dev/free-10m-f5/f5-sw-cache-audit.mjs
      - name: Verify read-only TALERA library gateway preserves original IDs and bytes
        run: |
          node r20-dev/free-10m-f5/f5-library-access.test.mjs
          node r20-dev/free-10m-f5/f5-geonames.test.mjs
          node r20-dev/free-10m-f5/f5-timeline-loupe.test.mjs
          node r20-dev/free-10m-f5/f5-storage-only-contract.test.mjs
          node --test r20-dev/free-10m-f5/f5-edit-return.test.mjs
          node r20-dev/free-10m-f5/f5-desktop-memory-transition.test.mjs
      - name: Test account password recovery on same underlying Durable Objects with fake local mail
        run: |
