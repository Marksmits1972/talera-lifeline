          c.vars.F5_EASY_INVITE_EXPIRES=process.env.F5_INVITE_EXPIRES;
          c.keep_vars=true;
          fs.writeFileSync('r20-dev/free-10m-f5/wrangler.backup-iphone.generated.jsonc',JSON.stringify(c,null,2)+'\n');
          console.log('SAME_EXISTING_WORKER_ONLY_NO_NEW_APP_ORIGIN');
