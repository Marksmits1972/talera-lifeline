      - name: Prepare existing seven-DO original-origin deployment config
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const file='r20-dev/free-10m-f5/wrangler.staging.jsonc';
          const c=JSON.parse(fs.readFileSync(file,'utf8'));
          const wanted=['FreeAuthAccount','FreeAuthEmail','FreeAuthHandle','FreeAuthSession','FreeAuthRate','FreeSocialMemory','FreeSocialSharePointer'];
          if(c.name!=='talera-free-f5-combined-stage-20261108'||
            JSON.stringify(c.durable_objects?.bindings?.map(b=>b.class_name))!==JSON.stringify(wanted)||
            c.d1_databases?.length||c.r2_buckets?.length||c.services?.length||
            c.vars?.AUTH_STORAGE_JURISDICTION!=='eu'||c.vars?.SOCIAL_STORAGE_JURISDICTION!=='eu'||
