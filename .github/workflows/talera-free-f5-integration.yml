               grep -Fq 'max-height:var(--talera-tag-visible-height,88px)!important' /tmp/talera-layout-guest.html &&
               grep -Fq 'grid-template-columns:minmax(0,1.2fr) minmax(0,1fr)!important;' /tmp/talera-layout-guest.html &&
               grep -Fq 'talera:tag-selection' /tmp/talera-layout-guest.html; then
              guest_layout_visible=1
