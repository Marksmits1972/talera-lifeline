name: TALERA Free F5 - isolated single-origin integration tests

on:
  push:
    branches: [feature/free-10m-f5-integrated-staging-20261108, feature/free-f5-approved-20261111-backup-only, feature/free-f5-independent-narrator-20261112, feature/free-f5-narrator-story-swipe-20261113]
    paths:
      - 'r20-dev/free-10m-f5/**'
      - '.github/workflows/talera-free-f5-integration.yml'
  pull_request:
    branches: [feature/free-10m-social-memory-do-20261108]
    paths:
      - 'r20-dev/free-10m-f5/**'
      - '.github/workflows/talera-free-f5-integration.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  f5_isolated_local:
    name: F5 - real local Worker, seven DOs, existing PWA anonymous shell
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Required for exact 11-Nov approved restoration commit proof
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install existing locked Cloudflare Wrangler
        run: npm ci
      - name: Build approved public code using only six anonymous GETs
        run: node r20-dev/free-10m-delivery/build.mjs
      - name: Package only public PWA references and stable external JavaScript
        run: node r20-dev/free-10m-f5/f5-public-assets.mjs
      - name: Verify independent narration media IDs, timing and no shared presentation controls
        run: node r20-dev/free-10m-f5/f5-independent-narrator.test.mjs
      - name: Verify source-exact 11 November backup-only connection
        run: |
          if [ "$GITHUB_REF_NAME" = feature/free-f5-independent-narrator-20261112 ] || [ "$GITHUB_REF_NAME" = feature/free-f5-narrator-story-swipe-20261113 ]; then
            git merge-base --is-ancestor 3292ede23e7e4929ae4dd89fa9a10379c0583cb0 HEAD
            git diff --exit-code 3292ede23e7e4929ae4dd89fa9a10379c0583cb0 HEAD -- r20-dev/free-10m-delivery/ r20-dev/free-10m-f5/f5-local-scope.mjs r20-dev/free-10m-f5/f5-portable-idb.mjs r20-dev/free-10m-f5/f5-portable-archive.mjs r20-dev/free-10m-f5/f5-edit-cue-rebind.mjs
            # The approved backup UI wording is immutable; media/storage codecs remain source-exact.
            if [ "$GITHUB_REF_NAME" = feature/free-f5-narrator-story-swipe-20261113 ]; then
              test "$(git rev-parse HEAD:r20-dev/free-10m-f5/f5-local-backup-page.mjs)" = "3d0fd5b8e290aa83347bf5c4eec2f1091777022f"
              test "$(git rev-parse HEAD:r20-dev/free-10m-f5/f5-backup-controller.mjs)" = "e01dc1b7bab00fc38125fc525f65a357a931c061"
            else
              git diff --exit-code 3292ede23e7e4929ae4dd89fa9a10379c0583cb0 HEAD -- r20-dev/free-10m-f5/f5-backup-controller.mjs r20-dev/free-10m-f5/f5-local-backup-page.mjs
            fi
          else
          git merge-base --is-ancestor 985dd1be2886db12fc7164e1e3ab52977cd7ba5d HEAD
          git diff --exit-code 985dd1be2886db12fc7164e1e3ab52977cd7ba5d HEAD -- r20-dev/free-10m-f5/f5-worker.mjs r20-dev/free-10m-f5/f5-local-scope.mjs r20-dev/free-10m-f5/f5-portable-idb.mjs r20-dev/free-10m-f5/f5-portable-archive.mjs r20-dev/free-10m-f5/f5-backup-controller.mjs r20-dev/free-10m-f5/f5-local-backup-page.mjs
          fi
          node r20-dev/free-10m-f5/f5-account-switch-regression.mjs
          node r20-dev/free-10m-f5/f5-portable-archive.test.mjs
      - name: Verify fixed iPhone publish path uses same account-private IndexedDB for all three media-ID writers
        run: node r20-dev/free-10m-f5/f5-db-publish-regression.mjs
      - name: Preserve saved narration media IDs and cue times when reopening an existing iPhone memory
        run: node r20-dev/free-10m-f5/f5-edit-cue-regression.mjs
      - name: Verify cold first swipe uses no blank local media and keeps original RH19 animation
        run: node r20-dev/free-10m-f5/f5-neighbor-preview-regression.mjs
      - name: Diagnose the CURRENT approved inline presentation engine, not old iframe assumptions
        run: node r20-dev/free-10m-f5/f5-actual-present-diagnostic.mjs
      - name: Assert original TALERA editor remains intact and video picker reports every selected video
        run: node r20-dev/free-10m-f5/f5-video-picker-regression.mjs
        # Exact video-picker source inspected once before the narrow F5 hotfix
      - name: Verify F5 Worker and tests parse
        run: |
          node --check r20-dev/free-10m-f5/f5-independent-narrator.browser.js
          node --check r20-dev/free-10m-f5/f5-independent-narrator.test.mjs
          node --check r20-dev/free-10m-f5/f5-worker.mjs
          node --check r20-dev/free-10m-f5/f5-local-test.mjs
          node --check r20-dev/free-10m-f5/f5-public-assets.mjs
          node --check r20-dev/free-10m-f5/f5-video-picker.mjs
          node --check r20-dev/free-10m-f5/f5-edit-cue-rebind.mjs
          node --check r20-dev/free-10m-f5/f5-neighbor-preview.mjs
      - name: Verify Cloudflare compilation without deployment
        run: npx --no-install wrangler deploy --dry-run --config r20-dev/free-10m-f5/wrangler.jsonc --outdir .talera-f5-buildcheck
      - name: Install headless mobile browser and small synthetic video generator for the reported issue
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx --no-install playwright install --with-deps chromium
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Browser verify standalone voice/video narrator AND latest original presentation
        run: node r20-dev/free-10m-f5/f5-ordinary-presentation.browser.test.mjs
      - name: Browser verify existing real-account login, switching, privacy and original menu
        run: node r20-dev/free-10m-f5/f5-browser-account-isolation.mjs
      - name: Browser verify back-up panel, private session and two local browser contexts
        run: node r20-dev/free-10m-f5/f5-backup-ui.browser.test.mjs
      - name: Browser verify complete original-media export, checksum and nondestructive restore
        run: node r20-dev/free-10m-f5/f5-portable-idb.browser.test.mjs
      - name: Browser verify original ordinary video playback without narrated player
        run: node r20-dev/free-10m-f5/f5-ordinary-video-isolation.browser.test.mjs
      - name: Archive factual test result only
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: talera-free-f5-local-integration
          path: r20-dev/free-10m-f5/generated/f5-results.json
          retention-days: 14

  deploy_approved_backup:
    name: Publish 500-example removal to the SAME TALERA QA origin
    needs: f5_isolated_local
    if: ${{ github.event_name == 'push' && github.event.head_commit.message == 'qa-deploy-TALERA-free-500-examples-removed-20261112' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      F5_STAGE_NAME: talera-free-f5-storage-qa-20261109
      F5_STAGE_HOST: talera-free-f5-storage-qa-20261109.mark-a39.workers.dev
      F5_PREVIOUS_VERSION: 32a8b90b-40d1-4be3-941e-0228700b59dc
      F5_INVITE_HASH: d85c9339c034b39bd31a94c94bb92d4970dbe50685f74eb49952b19c79e880a2
      F5_INVITE_EXPIRES: '1794942000000'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Guard approved exact base, media sources and unchanged original presentation
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 985dd1be2886db12fc7164e1e3ab52977cd7ba5d HEAD
          git diff --exit-code 985dd1be2886db12fc7164e1e3ab52977cd7ba5d HEAD -- r20-dev/free-10m-delivery/ r20-dev/free-10m-f5/f5-worker.mjs r20-dev/free-10m-f5/f5-local-scope.mjs r20-dev/free-10m-f5/f5-portable-idb.mjs r20-dev/free-10m-f5/f5-portable-archive.mjs r20-dev/free-10m-f5/f5-backup-controller.mjs r20-dev/free-10m-f5/f5-local-backup-page.mjs
          ! grep -q 'installLifeGalleries' r20-dev/free-10m-f5/f5-public-assets.mjs
          test "$F5_STAGE_NAME" = talera-free-f5-storage-qa-20261109
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo 'CLOUDFLARE_API_TOKEN not configured'; exit 1; fi
          CLEAN_ID="$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr -cd 'a-fA-F0-9')"
          if [ "${#CLEAN_ID}" -ne 32 ]; then echo 'CLOUDFLARE_ACCOUNT_ID invalid after safe normalization'; exit 1; fi
          echo "::add-mask::$CLEAN_ID"
          echo "CLOUDFLARE_ACCOUNT_ID=$CLEAN_ID" >> "$GITHUB_ENV"
      - name: Check live version and exact original account, storage and secret bindings
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const root='https://api.cloudflare.com/client/v4/accounts/'+process.env.CLOUDFLARE_ACCOUNT_ID+'/workers/scripts/'+process.env.F5_STAGE_NAME;
          async function get(suffix){
            const r=await fetch(root+suffix,{headers:{authorization:'Bearer '+process.env.CLOUDFLARE_API_TOKEN}});
            assert.equal(r.status,200,'Cloudflare preflight '+suffix);
            const d=await r.json();assert.equal(d.success,true);
            return d.result;
          }
          const [current,settings,approved]=await Promise.all([
            get('/deployments'),get('/settings'),get('/versions/a02e1180-2c33-407e-a6b6-90d9fa0baab6')
          ]);
          assert.deepEqual(current.deployments[0].versions.map(v=>[v.version_id,v.percentage]),
            [[process.env.F5_PREVIOUS_VERSION,100]]);
          const simple=b=>({name:b.name,type:b.type,
            class_name:b.class_name||null,namespace_id:b.namespace_id||null,
            text:b.text||null});
          const observed=settings.bindings.map(simple).sort((a,b)=>a.name.localeCompare(b.name));
          const verified=approved.resources.bindings.map(simple).sort((a,b)=>a.name.localeCompare(b.name));
          assert.deepEqual(observed,verified,'Do not change original DO resources, secrets or bindings');
          assert.equal(observed.length,17);
          assert.equal(observed.find(b=>b.name==='F5_EASY_INVITE_SHA256')?.text,process.env.F5_INVITE_HASH);
          assert.equal(observed.find(b=>b.name==='F5_EASY_INVITE_EXPIRES')?.text,process.env.F5_INVITE_EXPIRES);
          assert.equal(observed.find(b=>b.name==='AUTH_STORAGE_JURISDICTION')?.text,'eu');
          console.log('EXACT_EXISTING_QA_WORKER_AND_APPROVED_BINDINGS_VERIFIED');
          NODE
      - name: Package existing Worker assets and unchanged approved Storage menu link
        run: |
          npm ci
          node r20-dev/free-10m-delivery/build.mjs
          node r20-dev/free-10m-f5/f5-public-assets.mjs
          node r20-dev/free-10m-f5/f5-account-switch-regression.mjs
      - name: Prepare existing seven-DO original-origin deployment config
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const file='r20-dev/free-10m-f5/wrangler.staging.jsonc';
          const c=JSON.parse(fs.readFileSync(file,'utf8'));
          const wanted=['FreeAuthAccount','FreeAuthEmail','FreeAuthHandle','FreeAuthSession','FreeAuthRate','FreeSocialMemory','FreeSocialSharePointer'];
          if(c.name!=='talera-free-f5-combined-stage-20261108'||
            JSON.stringify(c.durable_objects?.bindings?.map(b=>b.class_name))!==JSON.stringify(wanted)||
            c.d1_databases?.length||c.r2_buckets?.length||c.services?.length||
            c.vars?.AUTH_STORAGE_JURISDICTION!=='eu'||c.vars?.SOCIAL_STORAGE_JURISDICTION!=='eu'||
            Number(process.env.F5_INVITE_EXPIRES)<=Date.now())throw Error('Original source/QA config mismatch');
          c.name=process.env.F5_STAGE_NAME;
          c.migrations=[{tag:'free-f5-storage-iphone-qa-20261109-v1',new_sqlite_classes:wanted}];
          c.vars.F5_EASY_INVITE_SHA256=process.env.F5_INVITE_HASH;
          c.vars.F5_EASY_INVITE_EXPIRES=process.env.F5_INVITE_EXPIRES;
          c.keep_vars=true;
          fs.writeFileSync('r20-dev/free-10m-f5/wrangler.backup-iphone.generated.jsonc',JSON.stringify(c,null,2)+'\n');
          console.log('SAME_EXISTING_WORKER_ONLY_NO_NEW_APP_ORIGIN');
          NODE
      - name: Cloudflare immutable package dry-run, no resource write
        run: npx --no-install wrangler deploy --dry-run --config r20-dev/free-10m-f5/wrangler.backup-iphone.generated.jsonc --outdir .talera-approved-backup-dryrun
      - name: Publish only after all preceding tests, preserve original settings and media
        id: deploy
        run: npx --no-install wrangler deploy --keep-vars --config r20-dev/free-10m-f5/wrangler.backup-iphone.generated.jsonc
      - name: Verify real served menu is ORIGINAL design plus exactly one backup action
        shell: bash
        run: |
          set -euo pipefail
          for path in /mijn-leven /present; do
            test "$(curl --max-time 20 -sS -o /dev/null -w '%{http_code}' "https://$F5_STAGE_HOST$path")" = 200
          done
          test "$(curl --max-time 20 -sS -o /dev/null -w '%{http_code}' "https://$F5_STAGE_HOST/__f5/backup")" = 401
          curl --max-time 20 -fsS "https://$F5_STAGE_HOST/__clean/menu-integration.mjs" > /tmp/talera-just-backup-menu.mjs
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          const menu=fs.readFileSync('/tmp/talera-just-backup-menu.mjs','utf8');
          assert.equal(menu.split('data-action="open-backup"').length,2);
          assert.ok(menu.includes("state.view==='storage'&&state.account"));
          assert.ok(menu.includes("window.location.assign('/__f5/backup')"));
          assert.ok(menu.includes('data-action="storage-refresh"'));
          assert.ok(!menu.includes('Reservekopie en herstel worden nog ontwikkeld.'));
          for (const missing of ["option('accessibility'","case 'accessibility':","option('display'","case 'display':"]) {
            assert.ok(!menu.includes(missing), 'Unused setting still visible: '+missing);
          }
          for (const keep of ["option('language'","option('privacy'","option('storage'","option('account'"]) {
            assert.ok(menu.includes(keep), 'Existing setting lost: '+keep);
          }
          console.log('TALERA_SAME_ORIGIN_SETTINGS_CLEANUP_AND_BACKUP_VERIFIED');
          NODE
      - name: Verify private reference package and live anonymous shell without touching accounts
        shell: bash
        run: |
          set -euo pipefail
          curl --max-time 25 -fsS "https://$F5_STAGE_HOST/present" > /tmp/talera-unique-example-covers.html
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          // GET /present without login intentionally serves an ANONYMOUS
          // shell. The authenticated presentation must now contain only
          // account-owned memories, with no packaged sample records.
          const {referencePages}=await import('./r20-dev/free-10m-f5/generated/public-template-map.mjs');
          const ref=referencePages['/present'];
          assert.ok(ref?.startsWith('/__talera_free/f5references/') &&
            ref.endsWith('.html') && ref.split('/').at(-1).length===69,
            'Immutable authenticated presentation asset mapping missing');
          const html=fs.readFileSync('r20-dev/free-10m-delivery/public'+ref,'utf8');
          const anonymous=fs.readFileSync('/tmp/talera-unique-example-covers.html','utf8');
          assert.ok(!anonymous.includes('const fallback=mem._taleraLocal?('),
            'Anonymous visitors must not receive the account-private presentation');
          assert.ok(html.includes('let ownSerial=0,ordinaryVideo=null') &&
            html.includes('window.__taleraOrdinarySelectPhoto=') &&
            html.includes('window.__taleraOrdinaryActivate=') &&
            html.includes('tile.el.dataset.owner=owner'),
            'One ordinary image owner and own thumbnail required');
          assert.ok(html.includes("memory.thumbnail=photos.find((_,i)=>frames[i]?.kind==='photo')"),
            'A memory uses its own first photo as thumbnail');
          assert.ok(!html.includes('const fallback=mem._taleraLocal?(') &&
            !html.includes('readyNeighbour?.currentSrc') &&
            !html.includes('const fallback=base?.complete&&base.naturalWidth?'),
            'No other memory photo may be used as an image fallback');
          assert.ok(html.includes('const MEMORIES = [];') &&
            !html.includes('TALERA_STRESS_MEMORIES') &&
            !html.includes('talera-500-fotoband-') &&
            !html.includes('id:50, at:') &&
            !html.includes('const MEMORIES = [\n'),
            'All 50 fixed and 450 generated example photos must be absent');
          assert.ok(html.includes('runtime.registerMemories(memories)') &&
            html.includes('const memories=rows.map(toMemory).filter(Boolean)'),
            'Saved account-local memories remain the only presentation source');
          console.log('TALERA_500_EXAMPLES_REMOVED_OWN_IDB_PRESENTATION_INTACT');
          NODE
      - name: Verify restored ORIGINAL social import on existing Free presentation
        shell: bash
        run: |
          set -euo pipefail
          curl --max-time 20 -fsS "https://$F5_STAGE_HOST/__clean/social-controller.mjs" > /tmp/talera-unchanged-social.mjs
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const source=fs.readFileSync('/tmp/talera-unchanged-social.mjs','utf8');
          assert.match(source,/export class SocialController/);
          assert.ok(source.includes('load(memoryId)'));
          assert.ok(source.includes('mutate('));
          console.log('ORIGINAL_SOCIAL_CONTROLLER_ROUTE_RESTORED');
          NODE
      - name: Restore previous QA Worker if publish or postpublish verification fails
        if: ${{ failure() && (steps.deploy.outcome == 'success' || steps.deploy.outcome == 'failure') }}
        run: npx --no-install wrangler rollback --name "$F5_STAGE_NAME" --message "Restore prior TALERA QA on approved-backup deployment failure" --config r20-dev/free-10m-f5/wrangler.backup-iphone.generated.jsonc

  deploy_independent_narrator:
    name: Publish functional Free More menu on SAME existing TALERA F5 PWA
    needs: f5_isolated_local
    if: ${{ github.event_name == 'push' && github.ref_name == 'feature/free-f5-narrator-story-swipe-20261113' && github.event.head_commit.message == 'qa-deploy-TALERA-free-functional-menu-20261114' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      F5_STAGE_NAME: talera-free-f5-storage-qa-20261109
      F5_STAGE_HOST: talera-free-f5-storage-qa-20261109.mark-a39.workers.dev
      F5_PREVIOUS_VERSION: 18020034-7be7-488d-bf95-be1359aaf2a0
      F5_INVITE_HASH: d85c9339c034b39bd31a94c94bb92d4970dbe50685f74eb49952b19c79e880a2
      F5_INVITE_EXPIRES: '1794942000000'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Guard approved exact base, media sources and unchanged original presentation
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 3292ede23e7e4929ae4dd89fa9a10379c0583cb0 HEAD
          git diff --exit-code 3292ede23e7e4929ae4dd89fa9a10379c0583cb0 HEAD -- r20-dev/free-10m-delivery/ r20-dev/free-10m-f5/f5-local-scope.mjs r20-dev/free-10m-f5/f5-portable-idb.mjs r20-dev/free-10m-f5/f5-portable-archive.mjs r20-dev/free-10m-f5/f5-edit-cue-rebind.mjs
          # Lock exact approved backup UI copies; no unreviewed changes to archive/read/write.
          test "$(git rev-parse HEAD:r20-dev/free-10m-f5/f5-local-backup-page.mjs)" = "3d0fd5b8e290aa83347bf5c4eec2f1091777022f"
          test "$(git rev-parse HEAD:r20-dev/free-10m-f5/f5-backup-controller.mjs)" = "e01dc1b7bab00fc38125fc525f65a357a931c061"
          ! grep -q 'installLifeGalleries' r20-dev/free-10m-f5/f5-public-assets.mjs
          test "$GITHUB_REF_NAME" = feature/free-f5-narrator-story-swipe-20261113
          test "$F5_STAGE_NAME" = talera-free-f5-storage-qa-20261109
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo 'CLOUDFLARE_API_TOKEN not configured'; exit 1; fi
          CLEAN_ID="$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr -cd 'a-fA-F0-9')"
          if [ "${#CLEAN_ID}" -ne 32 ]; then echo 'CLOUDFLARE_ACCOUNT_ID invalid after safe normalization'; exit 1; fi
          echo "::add-mask::$CLEAN_ID"
          echo "CLOUDFLARE_ACCOUNT_ID=$CLEAN_ID" >> "$GITHUB_ENV"
      - name: Check live version and exact original account, storage and secret bindings
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const root='https://api.cloudflare.com/client/v4/accounts/'+process.env.CLOUDFLARE_ACCOUNT_ID+'/workers/scripts/'+process.env.F5_STAGE_NAME;
          async function get(suffix){
            const r=await fetch(root+suffix,{headers:{authorization:'Bearer '+process.env.CLOUDFLARE_API_TOKEN}});
            assert.equal(r.status,200,'Cloudflare preflight '+suffix);
            const d=await r.json();assert.equal(d.success,true);
            return d.result;
          }
          const [current,settings,approved]=await Promise.all([
            get('/deployments'),get('/settings'),get('/versions/'+process.env.F5_PREVIOUS_VERSION)
          ]);
          assert.deepEqual(current.deployments[0].versions.map(v=>[v.version_id,v.percentage]),
            [[process.env.F5_PREVIOUS_VERSION,100]]);
          const simple=b=>({name:b.name,type:b.type,
            class_name:b.class_name||null,namespace_id:b.namespace_id||null,
            text:b.text||null});
          const observed=settings.bindings.map(simple).sort((a,b)=>a.name.localeCompare(b.name));
          const verified=approved.resources.bindings.map(simple).sort((a,b)=>a.name.localeCompare(b.name));
          assert.deepEqual(observed,verified,'Do not change original DO resources, secrets or bindings');
          assert.equal(observed.length,17);
          assert.equal(observed.find(b=>b.name==='F5_EASY_INVITE_SHA256')?.text,process.env.F5_INVITE_HASH);
          assert.equal(observed.find(b=>b.name==='F5_EASY_INVITE_EXPIRES')?.text,process.env.F5_INVITE_EXPIRES);
          assert.equal(observed.find(b=>b.name==='AUTH_STORAGE_JURISDICTION')?.text,'eu');
          console.log('EXACT_EXISTING_QA_WORKER_AND_APPROVED_BINDINGS_VERIFIED');
