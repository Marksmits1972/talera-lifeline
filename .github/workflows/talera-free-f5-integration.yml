name: TALERA Free F5 - isolated single-origin integration tests

on:
  push:
    branches: [feature/free-10m-f5-integrated-staging-20261108, feature/free-f5-approved-20261111-backup-only, feature/free-f5-independent-narrator-20261112, feature/free-f5-narrator-story-swipe-20261113, feature/free-f5-library-boundary-20261117]
    paths:
      - 'r20-dev/free-10m-f5/**'
      - 'r20-dev/free-10m-auth-pilot/**'
      - '.github/workflows/talera-free-f5-integration.yml'
  pull_request:
    branches: [feature/free-10m-social-memory-do-20261108]
    paths:
      - 'r20-dev/free-10m-f5/**'
      - '.github/workflows/talera-free-f5-integration.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  f5_actual_registration_button:
    name: Diagnose real TALERA account confirmation button in SAME app
    if: ${{ github.ref_name == 'feature/free-f5-library-boundary-20261117' && github.event.head_commit.message != 'qa-deploy-TALERA-free-compact-backup-exact-tested-now-20261124' && github.event.head_commit.message != 'qa-restore-TALERA-free-official-morning-anchor-20261125' && github.event.head_commit.message != 'qa-deploy-TALERA-free-calendar-wheel-exact-tested-20261126' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Build exact original TALERA Free interface
        run: |
          npm ci
          node r20-dev/free-10m-delivery/build.mjs
          node r20-dev/free-10m-f5/f5-public-assets.mjs
      - name: Run existing synthetic account browser regression without unrelated photo-slider checks
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const path='r20-dev/free-10m-f5/f5-browser-account-isolation.mjs';
          const original=fs.readFileSync(path,'utf8');
          const token='chromium.launch({headless:true})';
          assert.equal(original.split(token).length,2);
          fs.writeFileSync(path,original.replace(token,
            'chromium.launch({channel:"chrome",headless:true})'));
          NODE
          node r20-dev/free-10m-f5/f5-browser-account-isolation.mjs

  f5_isolated_local:
    name: F5 - real local Worker, seven DOs, existing PWA anonymous shell
    if: ${{ github.event_name != 'push' || github.event.head_commit.message != 'qa-deploy-TALERA-free-compact-backup-exact-tested-now-20261124' && github.event.head_commit.message != 'qa-restore-TALERA-free-official-morning-anchor-20261125' && github.event.head_commit.message != 'qa-deploy-TALERA-free-calendar-wheel-exact-tested-20261126' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Required for exact 11-Nov approved restoration commit proof
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install existing locked Cloudflare Wrangler
        run: npm ci
      - name: Build approved public code using only six anonymous GETs
        run: node r20-dev/free-10m-delivery/build.mjs
      - name: Package only public PWA references and stable external JavaScript
        run: node r20-dev/free-10m-f5/f5-public-assets.mjs
      - name: Inspect exact existing service worker for safe offline design (read-only)
        run: node r20-dev/free-10m-f5/f5-sw-cache-audit.mjs
      - name: Verify read-only TALERA library gateway preserves original IDs and bytes
        run: |
          node r20-dev/free-10m-f5/f5-library-access.test.mjs
          node r20-dev/free-10m-f5/f5-geonames.test.mjs
          node r20-dev/free-10m-f5/f5-timeline-loupe.test.mjs
          node r20-dev/free-10m-f5/f5-storage-only-contract.test.mjs
      - name: Test account password recovery on same underlying Durable Objects with fake local mail
        run: |
          node --check r20-dev/free-10m-auth-pilot/auth-pilot-worker.mjs
          node --check r20-dev/free-10m-auth-pilot/auth-objects.mjs
          node --check r20-dev/free-10m-auth-pilot/auth-local-test.mjs
          node --check r20-dev/free-10m-f5/f5-password-reset-page.mjs
          node r20-dev/free-10m-auth-pilot/auth-local-test.mjs
      - name: Verify requested TALERA .app password recovery sender and protected bindings
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          for(const name of ['wrangler.jsonc','wrangler.staging.jsonc']){
            const config=JSON.parse(fs.readFileSync('r20-dev/free-10m-f5/'+name,'utf8'));
            assert.equal(config.vars.TALERA_RESET_FROM,'accountherstel@talera.app');
            assert.deepEqual(config.send_email,[{
              name:'EMAIL',allowed_sender_addresses:['accountherstel@talera.app']
            }]);
            assert.deepEqual(config.durable_objects.bindings.map(x=>x.class_name),[
              'FreeAuthAccount','FreeAuthEmail','FreeAuthHandle','FreeAuthSession',
              'FreeAuthRate','FreeSocialMemory','FreeSocialSharePointer'
            ]);
          }
          console.log('TALERA_RECOVERY_FROM_APP_DOMAIN_CONFIGURED_BUT_NOT_VERIFIED_FOR_DELIVERY');
          NODE
      - name: Verify library original bytes and voice cue IDs before any backup or restore
        run: node r20-dev/free-10m-f5/f5-library-integrity.test.mjs
      - name: Verify independent narration media IDs, timing and no shared presentation controls
        run: node r20-dev/free-10m-f5/f5-independent-narrator.test.mjs
      - name: Verify source-exact 11 November backup-only connection
        run: |
          if [ "$GITHUB_REF_NAME" = feature/free-f5-independent-narrator-20261112 ] || [ "$GITHUB_REF_NAME" = feature/free-f5-narrator-story-swipe-20261113 ] || [ "$GITHUB_REF_NAME" = feature/free-f5-library-boundary-20261117 ]; then
            git merge-base --is-ancestor 3292ede23e7e4929ae4dd89fa9a10379c0583cb0 HEAD
            if [ "$GITHUB_REF_NAME" = feature/free-f5-library-boundary-20261117 ]; then
              # Library I/O moved; approved schema, archive codec and media cue writer remain protected.
              # Owner-authorized archive-only fix; preserve all other original sources.
              git diff --exit-code 3292ede23e7e4929ae4dd89fa9a10379c0583cb0 HEAD -- r20-dev/free-10m-delivery/ r20-dev/free-10m-f5/f5-local-scope.mjs r20-dev/free-10m-f5/f5-edit-cue-rebind.mjs
              test "$(git rev-parse HEAD:r20-dev/free-10m-f5/f5-portable-archive.mjs)" = "58e715173508e3e0efd6f1ffae97505f3146c76d"
            test "$(git rev-parse HEAD:r20-dev/free-10m-f5/f5-portable-idb.mjs)" = "e7b5cc4617aa6755a71ca6960d2171cbfdaa3d0e"
            else
            git diff --exit-code 3292ede23e7e4929ae4dd89fa9a10379c0583cb0 HEAD -- r20-dev/free-10m-delivery/ r20-dev/free-10m-f5/f5-local-scope.mjs r20-dev/free-10m-f5/f5-portable-archive.mjs r20-dev/free-10m-f5/f5-edit-cue-rebind.mjs
            fi
            # Previous approved UI remains locked; on this same Free branch only,
            # the owner-requested ordered backup picker UI and controller are exact-blob guarded.
            # Archive codec, read/write adapter, owner data and presentation remain unchanged.
            if [ "$GITHUB_REF_NAME" = feature/free-f5-library-boundary-20261117 ]; then
              test "$(git rev-parse HEAD:r20-dev/free-10m-f5/f5-local-backup-page.mjs)" = "642ba9365b7d5a2bcc8e12770872ebc43077aa17"
              test "$(git rev-parse HEAD:r20-dev/free-10m-f5/f5-backup-controller.mjs)" = "ee5720f3766399404bf366c1b8eb3ce695973f09"
            elif [ "$GITHUB_REF_NAME" = feature/free-f5-narrator-story-swipe-20261113 ]; then
              test "$(git rev-parse HEAD:r20-dev/free-10m-f5/f5-local-backup-page.mjs)" = "3d0fd5b8e290aa83347bf5c4eec2f1091777022f"
              test "$(git rev-parse HEAD:r20-dev/free-10m-f5/f5-backup-controller.mjs)" = "e01dc1b7bab00fc38125fc525f65a357a931c061"
            else
              git diff --exit-code 3292ede23e7e4929ae4dd89fa9a10379c0583cb0 HEAD -- r20-dev/free-10m-f5/f5-backup-controller.mjs r20-dev/free-10m-f5/f5-local-backup-page.mjs
            fi
          else
          git merge-base --is-ancestor 985dd1be2886db12fc7164e1e3ab52977cd7ba5d HEAD
          git diff --exit-code 985dd1be2886db12fc7164e1e3ab52977cd7ba5d HEAD -- r20-dev/free-10m-f5/f5-worker.mjs r20-dev/free-10m-f5/f5-local-scope.mjs r20-dev/free-10m-f5/f5-portable-archive.mjs r20-dev/free-10m-f5/f5-backup-controller.mjs r20-dev/free-10m-f5/f5-local-backup-page.mjs
          fi
          node r20-dev/free-10m-f5/f5-account-switch-regression.mjs
          node r20-dev/free-10m-f5/f5-portable-archive.test.mjs
      - name: Verify fixed iPhone publish path uses same account-private IndexedDB for all three media-ID writers
        run: node r20-dev/free-10m-f5/f5-db-publish-regression.mjs
      - name: Preserve saved narration media IDs and cue times when reopening an existing iPhone memory
        run: node r20-dev/free-10m-f5/f5-edit-cue-regression.mjs
      - name: Verify cold first swipe uses no blank local media and keeps original RH19 animation
        run: node r20-dev/free-10m-f5/f5-neighbor-preview-regression.mjs
      - name: Diagnose the CURRENT approved inline presentation engine, not old iframe assumptions
        run: node r20-dev/free-10m-f5/f5-actual-present-diagnostic.mjs
      - name: Assert original TALERA editor remains intact and video picker reports every selected video
        run: node r20-dev/free-10m-f5/f5-video-picker-regression.mjs
        # Exact video-picker source inspected once before the narrow F5 hotfix
      - name: Verify F5 Worker and tests parse
        run: |
          node --check r20-dev/free-10m-f5/f5-independent-narrator.browser.js
          node --check r20-dev/free-10m-f5/f5-independent-narrator.test.mjs
          node --check r20-dev/free-10m-f5/f5-worker.mjs
          node --check r20-dev/free-10m-f5/f5-local-test.mjs
          node --check r20-dev/free-10m-f5/f5-public-assets.mjs
          node --check r20-dev/free-10m-f5/f5-video-picker.mjs
          node --check r20-dev/free-10m-f5/f5-edit-cue-rebind.mjs
          node --check r20-dev/free-10m-f5/f5-neighbor-preview.mjs
      - name: Verify Cloudflare compilation without deployment
        run: npx --no-install wrangler deploy --dry-run --config r20-dev/free-10m-f5/wrangler.jsonc --outdir .talera-f5-buildcheck
      - name: Verify prior FULL browser test on the exact same runtime SHA
        if: ${{ github.event_name == 'push' && github.event.head_commit.message == 'qa-deploy-TALERA-free-library-20261117' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 6865b59a6700242398538175174f71112ed117d3
          test "$(git diff --name-only 6865b59a6700242398538175174f71112ed117d3 HEAD)" = .github/workflows/talera-free-f5-integration.yml
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const api='https://api.github.com/repos/'+process.env.GITHUB_REPOSITORY+'/actions/runs/44314083212';
          const r=await fetch(api,{headers:{
            Authorization:'Bearer '+process.env.GH_TOKEN,
            Accept:'application/vnd.github+json'
          },signal:AbortSignal.timeout(20000)});
          assert.equal(r.status,200,'Cannot verify prior full browser CI success');
          const run=await r.json();
          assert.equal(run.head_sha,'f1c425053356d728928c8f8032d113137c64faa8');
          assert.equal(run.event,'push');
          assert.equal(run.status,'completed');
          assert.equal(run.conclusion,'success');
          assert.equal(run.name,'TALERA Free F5 - isolated single-origin integration tests');
          console.log('PREVIOUS_FULL_BROWSER_CI_EXACT_SOURCE_VERIFIED');
          NODE
      - name: Install headless mobile browser and small synthetic video generator for the reported issue
        if: ${{ github.event.head_commit.message != 'qa-deploy-TALERA-free-library-20261117' }}
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1 @ffmpeg-installer/linux-x64 @ffprobe-installer/linux-x64
          # Hosted Ubuntu already includes browser runtime libraries. Download
          # only the same Playwright Chromium version; do not repeat the entire
          # OS dependency installation that stalled the previous verification.
          # Use the Chromium-compatible Chrome already installed on
          # GitHub's Ubuntu runner. Avoid hanging Playwright CDN downloads.
          # This rewrites only the local CI browser launcher, not TALERA app code.
          if command -v google-chrome >/dev/null 2>&1; then
            node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import assert from 'node:assert/strict';
          const dir='r20-dev/free-10m-f5',changed=[];
          for(const name of fs.readdirSync(dir)){
            if(!/\.(?:mjs|js)$/.test(name))continue;
            const file=path.join(dir,name),original=fs.readFileSync(file,'utf8');
            if(!original.includes('chromium.launch({')&&!original.includes('chromium.launch()'))continue;
            assert.ok(/browser|account|presentation|video/i.test(name),
              'Non-test application source must not be patched');
            fs.writeFileSync(file,original
              .replaceAll('chromium.launch({','chromium.launch({channel:"chrome",')
              .replaceAll('chromium.launch()','chromium.launch({channel:"chrome"})'));
            changed.push(name);
          }
          assert.ok(changed.length>=2&&changed.length<=15,'Missing local browser tests');
          console.log('TALERA_SYSTEM_CHROME_BROWSER_TEST_ONLY',changed);
          NODE
          else
            npx --no-install playwright install chromium
          fi
          if ! command -v ffmpeg >/dev/null 2>&1; then
            # The Ubuntu apt mirror returned HTTP 503 before any browser
            # regression started. Use the NPM-shipped test-only FFmpeg binary.
            # Do not install OS packages or change the TALERA product code.
            ffmpeg_path="$PWD/node_modules/@ffmpeg-installer/linux-x64/ffmpeg"
            test -x "$ffmpeg_path"
            mkdir -p "$RUNNER_TEMP/talera-f5-test-bin"
            ln -s "$ffmpeg_path" "$RUNNER_TEMP/talera-f5-test-bin/ffmpeg"
            ffprobe_path="$PWD/node_modules/@ffprobe-installer/linux-x64/ffprobe"
            test -x "$ffprobe_path"
            ln -s "$ffprobe_path" "$RUNNER_TEMP/talera-f5-test-bin/ffprobe"
            echo "$RUNNER_TEMP/talera-f5-test-bin" >> "$GITHUB_PATH"
            "$RUNNER_TEMP/talera-f5-test-bin/ffmpeg" -version | head -n 1
          fi
      - name: Browser verify back-up panel, private session and two local browser contexts
        if: ${{ github.event.head_commit.message != 'qa-deploy-TALERA-free-library-20261117' }}
        run: node r20-dev/free-10m-f5/f5-backup-ui.browser.test.mjs
      - name: Browser verify encrypted offline same-PWA start and offline logout
        if: ${{ github.event.head_commit.message != 'qa-deploy-TALERA-free-library-20261117' }}
        run: |
          node --check r20-dev/free-10m-f5/f5-offline-sw.mjs
          node --check r20-dev/free-10m-f5/f5-offline-sw.browser.test.mjs
          node r20-dev/free-10m-f5/f5-offline-sw.browser.test.mjs
      - name: Browser verify standalone voice/video narrator AND latest original presentation
        if: ${{ github.event.head_commit.message != 'qa-deploy-TALERA-free-library-20261117' }}
        run: node r20-dev/free-10m-f5/f5-ordinary-presentation.browser.test.mjs
      - name: Diagnose same TALERA offline shell with WebKit iPhone browser engine
        if: ${{ github.event.head_commit.message != 'qa-deploy-TALERA-free-library-20261117' }}
        run: |
          # This is a second engine for the SAME local-origin Worker code, not an app.
          npx --no-install playwright install --with-deps webkit
          TALERA_OFFLINE_BROWSER=webkit node r20-dev/free-10m-f5/f5-offline-sw.browser.test.mjs
      - name: Browser diagnose ordinary sound, return-navigation and video hit targets
        if: ${{ github.event.head_commit.message != 'qa-deploy-TALERA-free-library-20261117' }}
        run: node r20-dev/free-10m-f5/f5-ordinary-video-isolation.browser.test.mjs
      - name: Browser verify existing real-account login, switching, privacy and original menu
        if: ${{ github.event.head_commit.message != 'qa-deploy-TALERA-free-library-20261117' }}
        run: node r20-dev/free-10m-f5/f5-browser-account-isolation.mjs
      - name: Browser verify complete original-media export, checksum and nondestructive restore
        if: ${{ github.event.head_commit.message != 'qa-deploy-TALERA-free-library-20261117' }}
        run: node r20-dev/free-10m-f5/f5-portable-idb.browser.test.mjs
      - name: Browser verify permanent original media IDs survive editor reorder and edit
        if: ${{ github.event.head_commit.message != 'qa-deploy-TALERA-free-library-20261117' }}
        run: node r20-dev/free-10m-f5/f5-library-editor.browser.test.mjs
      - name: Archive factual test result only
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: talera-free-f5-local-integration
          path: r20-dev/free-10m-f5/generated/f5-results.json
          retention-days: 14

  deploy_approved_backup:
    name: Publish 500-example removal to the SAME TALERA QA origin
    needs: f5_isolated_local
    if: ${{ github.event_name == 'push' && github.event.head_commit.message == 'qa-deploy-TALERA-free-500-examples-removed-20261112' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      F5_STAGE_NAME: talera-free-f5-storage-qa-20261109
      F5_STAGE_HOST: talera-free-f5-storage-qa-20261109.mark-a39.workers.dev
      F5_PREVIOUS_VERSION: 32a8b90b-40d1-4be3-941e-0228700b59dc
      F5_INVITE_HASH: d85c9339c034b39bd31a94c94bb92d4970dbe50685f74eb49952b19c79e880a2
      F5_INVITE_EXPIRES: '1794942000000'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Guard approved exact base, media sources and unchanged original presentation
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 985dd1be2886db12fc7164e1e3ab52977cd7ba5d HEAD
          git diff --exit-code 985dd1be2886db12fc7164e1e3ab52977cd7ba5d HEAD -- r20-dev/free-10m-delivery/ r20-dev/free-10m-f5/f5-worker.mjs r20-dev/free-10m-f5/f5-local-scope.mjs r20-dev/free-10m-f5/f5-portable-idb.mjs r20-dev/free-10m-f5/f5-portable-archive.mjs r20-dev/free-10m-f5/f5-backup-controller.mjs r20-dev/free-10m-f5/f5-local-backup-page.mjs
          ! grep -q 'installLifeGalleries' r20-dev/free-10m-f5/f5-public-assets.mjs
          test "$F5_STAGE_NAME" = talera-free-f5-storage-qa-20261109
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo 'CLOUDFLARE_API_TOKEN not configured'; exit 1; fi
          CLEAN_ID="$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr -cd 'a-fA-F0-9')"
          if [ "${#CLEAN_ID}" -ne 32 ]; then echo 'CLOUDFLARE_ACCOUNT_ID invalid after safe normalization'; exit 1; fi
          echo "::add-mask::$CLEAN_ID"
          echo "CLOUDFLARE_ACCOUNT_ID=$CLEAN_ID" >> "$GITHUB_ENV"
      - name: Check live version and exact original account, storage and secret bindings
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const root='https://api.cloudflare.com/client/v4/accounts/'+process.env.CLOUDFLARE_ACCOUNT_ID+'/workers/scripts/'+process.env.F5_STAGE_NAME;
          async function get(suffix){
            const r=await fetch(root+suffix,{headers:{authorization:'Bearer '+process.env.CLOUDFLARE_API_TOKEN}});
            assert.equal(r.status,200,'Cloudflare preflight '+suffix);
            const d=await r.json();assert.equal(d.success,true);
            return d.result;
          }
          const [current,settings,approved]=await Promise.all([
            get('/deployments'),get('/settings'),get('/versions/a02e1180-2c33-407e-a6b6-90d9fa0baab6')
          ]);
          assert.deepEqual(current.deployments[0].versions.map(v=>[v.version_id,v.percentage]),
            [[process.env.F5_PREVIOUS_VERSION,100]]);
          const simple=b=>({name:b.name,type:b.type,
            class_name:b.class_name||null,namespace_id:b.namespace_id||null,
            text:b.text||null});
          const observed=settings.bindings.map(simple).sort((a,b)=>a.name.localeCompare(b.name));
          const verified=approved.resources.bindings.map(simple).sort((a,b)=>a.name.localeCompare(b.name));
          assert.deepEqual(observed,verified,'Do not change original DO resources, secrets or bindings');
          assert.equal(observed.length,17);
          assert.equal(observed.find(b=>b.name==='F5_EASY_INVITE_SHA256')?.text,process.env.F5_INVITE_HASH);
          assert.equal(observed.find(b=>b.name==='F5_EASY_INVITE_EXPIRES')?.text,process.env.F5_INVITE_EXPIRES);
          assert.equal(observed.find(b=>b.name==='AUTH_STORAGE_JURISDICTION')?.text,'eu');
          console.log('EXACT_EXISTING_QA_WORKER_AND_APPROVED_BINDINGS_VERIFIED');
          NODE
      - name: Package existing Worker assets and unchanged approved Storage menu link
        run: |
          npm ci
          node r20-dev/free-10m-delivery/build.mjs
          node r20-dev/free-10m-f5/f5-public-assets.mjs
          node r20-dev/free-10m-f5/f5-account-switch-regression.mjs
      - name: Prepare existing seven-DO original-origin deployment config
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const file='r20-dev/free-10m-f5/wrangler.staging.jsonc';
          const c=JSON.parse(fs.readFileSync(file,'utf8'));
          const wanted=['FreeAuthAccount','FreeAuthEmail','FreeAuthHandle','FreeAuthSession','FreeAuthRate','FreeSocialMemory','FreeSocialSharePointer'];
          if(c.name!=='talera-free-f5-combined-stage-20261108'||
            JSON.stringify(c.durable_objects?.bindings?.map(b=>b.class_name))!==JSON.stringify(wanted)||
            c.d1_databases?.length||c.r2_buckets?.length||c.services?.length||
            c.vars?.AUTH_STORAGE_JURISDICTION!=='eu'||c.vars?.SOCIAL_STORAGE_JURISDICTION!=='eu'||
            Number(process.env.F5_INVITE_EXPIRES)<=Date.now())throw Error('Original source/QA config mismatch');
