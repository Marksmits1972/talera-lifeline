          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';import fs from 'node:fs';
          const home=fs.readFileSync('/tmp/talera-empty-home.html','utf8');
          assert.ok(home.includes('talera-untagged-memory-cards'),
            'Same TALERA Home lost the already-tested no-topic memory visibility patch');
          const present=fs.readFileSync('/tmp/talera-empty-present.html','utf8');
          assert.ok(home.includes('id="talera-f5-desktop-home-layout"')&&home.includes('id="talera-f5-desktop-memory-transition"'),'Desktop Home is not live on same origin');
          assert.ok(present.includes('id="talera-f5-desktop-presentation-layout"')&&present.includes('id="talera-f5-desktop-memory-transition"'),'Desktop presentation is not live on same origin');
          for(const html of [home,present]){
            assert.ok(html.includes('max-height: min(760px, calc(100dvh - 48px)) !important;'),
              'Exact new desktop dialog style not live');
          }
          assert.ok(home.includes('right: calc(100% - var(--talera-home-control-width) + 16px) !important;'));
          assert.ok(present.includes('width: min(420px, calc(100% - 32px)) !important;'));
          console.log('TALERA_LIVE_EXACT_DESKTOP_STYLES_SAME_ORIGIN_PASS');
          assert.ok(home.includes('window.__taleraReferenceMemories=[];')&&present.includes('const MEMORIES = [];'));
          assert.ok(present.includes('const rows=[]; // Login required: no local media read.'));
          for(const html of [home,present]){
            assert.ok(!/Test 081|talera-500-fotoband-|TALERA_STRESS_MEMORIES/i.test(html));
            assert.ok(!/https:\/\/picsum\.photos\/seed\/talera-(?:v11-clean|500-fotoband)-/i.test(html));
          }
          const accountId=process.env.CLOUDFLARE_ACCOUNT_ID.replace(/[^a-fA-F0-9]/g,'');
          const base='https://api.cloudflare.com/client/v4/accounts/'+accountId+
            '/workers/scripts/'+process.env.F5_STAGE_NAME;
          const get=async suffix=>{
            const r=await fetch(base+suffix,{headers:{Authorization:'Bearer '+process.env.CLOUDFLARE_API_TOKEN},
              signal:AbortSignal.timeout(20000)});
            assert.equal(r.status,200);const d=await r.json();assert.equal(d.success,true);return d.result;
          };
          const s=await get('/settings');
          // The publish CLI returns before the deployment listing is
          // guaranteed to reflect its new version. Never falsely fail and
          // roll back a healthy release because this read is briefly stale.
          // Bound the wait; if the new version never appears, fail closed.
          let d;
          for(let attempt=1;attempt<=12;attempt++){
            d=await get('/deployments');
            const active=d.deployments?.[0]?.versions||[];
            if(active.length===1&&active[0].percentage===100&&
               active[0].version_id!==process.env.F5_EXPECTED_LIVE_VERSION){
              console.log('TALERA_NEW_DEPLOYMENT_VERIFIED_AFTER_PROPAGATION_ATTEMPT='+attempt);
              break;
            }
            if(attempt<12){
              console.log('TALERA_DEPLOYMENT_LISTING_PROPAGATION_PENDING='+attempt);
              await new Promise(resolve=>setTimeout(resolve,3000));
            }
          }
          const norm=x=>({name:x.name,type:x.type,class_name:x.class_name||null,
            namespace_id:x.namespace_id||null,text:x.text||null});
          const sort=a=>a.map(norm).sort((a,b)=>a.name.localeCompare(b.name));
          const before=JSON.parse(fs.readFileSync('/tmp/talera-empty-stories-preflight.json','utf8')).bindings;
          assert.deepEqual(sort(s.bindings||[]),before,'Any secret/account binding difference must roll back');
          assert.equal(d.deployments?.[0]?.versions?.length,1);
          assert.equal(d.deployments[0].versions[0].percentage,100);
          assert.notEqual(d.deployments[0].versions[0].version_id,process.env.F5_EXPECTED_LIVE_VERSION);
          const deployed=await get('/versions/'+d.deployments[0].versions[0].version_id);
          assert.deepEqual(sort(deployed.resources?.bindings||[]),before,'New active version must retain all 18 original configured bindings');
          console.log('TALERA_ACTIVE_VERSION='+d.deployments[0].versions[0].version_id);
          console.log('OWNER_AUTHORIZED_EMPTY_TALERA_LIVE_SAME_ORIGIN_ZERO_EXAMPLES_18_BINDINGS_UNCHANGED');
