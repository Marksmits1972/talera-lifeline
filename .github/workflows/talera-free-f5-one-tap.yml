name: TALERA Free final one-click iPhone test stage

# Verified: deployed successfully. Keep iPhone stage stable: no automatic
# redeploy or key rotation while the owner is using the final one-click link.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: talera-free-f5-one-tap-final
  cancel-in-progress: false

jobs:
  deploy_isolated_one_tap:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 13
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install existing locked tools
        run: npm ci
      - name: Verify isolated staging target and one-time expiration
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const c=JSON.parse(fs.readFileSync('r20-dev/free-10m-f5/wrangler.staging.jsonc'));
          assert.equal(c.name,'talera-free-f5-combined-stage-20261108');
          assert.equal(c.durable_objects.bindings.length,7);
          assert.equal(c.vars.AUTH_STORAGE_JURISDICTION,'eu');
          assert.equal(c.vars.SOCIAL_STORAGE_JURISDICTION,'eu');
          assert.match(c.vars.F5_EASY_INVITE_SHA256,/^[a-f0-9]{64}$/);
          assert.ok(Number(c.vars.F5_EASY_INVITE_EXPIRES)>Date.now());
          assert.ok(!c.services&&!c.r2_buckets&&!c.d1_databases);
          JS
          test -n "$CLOUDFLARE_API_TOKEN"
          CLEAN_ID="$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr -cd 'a-fA-F0-9')"
          test "${#CLEAN_ID}" -eq 32
          echo "::add-mask::$CLEAN_ID"
          printf 'CLOUDFLARE_ACCOUNT_ID=%s\n' "$CLEAN_ID" >> "$GITHUB_ENV"
      - name: Build six verified anonymous PWA snapshots and media scripts
        run: |
          node r20-dev/free-10m-delivery/build.mjs
          node r20-dev/free-10m-f5/f5-public-assets.mjs
          node --check r20-dev/free-10m-f5/f5-worker.mjs
      - name: Deploy only separate EU F5 test Worker, retaining prior secrets
        run: npx --no-install wrangler deploy --config r20-dev/free-10m-f5/wrangler.staging.jsonc
      - name: Confirm real one-tap landing and reject forged invitations
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          const root='https://talera-free-f5-combined-stage-20261108.mark-a39.workers.dev';
          const signal=()=>AbortSignal.timeout(20000);
          let landing,html;
          for(let n=0;n<15;n++){
            landing=await fetch(root+'/__f5/start',{signal:signal(),cache:'no-store'});
            html=await landing.text();
            if(landing.status===200 && html.includes('location.hash'))break;
            await new Promise(r=>setTimeout(r,850));
          }
          assert.equal(landing.status,200);
          assert.match(html,/De testversie wordt geopend/);
          assert.ok(!html.includes('34c8d1e77ec9d476189a098422d3fb68f2493e89b3af26a24e0607855707db8d'),
            'Do not expose hashed allowlist to browser HTML');
          const headers={'content-type':'application/json'};
          const wrong=await fetch(root+'/__f5/start',{method:'POST',
            headers,body:JSON.stringify({invite:'0'.repeat(64)}),signal:signal()});
          assert.equal(wrong.status,403);
          assert.match((await wrong.json()).error,/niet geldig/);
          const external=await fetch(root+'/__f5/start',{method:'POST',
            headers:{...headers,origin:'https://attacker.example'},
            body:JSON.stringify({invite:'0'.repeat(64)}),signal:signal()});
          assert.equal(external.status,403);
          assert.match((await external.json()).error,/Ongeldige herkomst/);
          const blocked=await fetch(root+'/mijn-leven',{signal:signal()});
          assert.equal(blocked.status,403,'Normal access remains protected');
          console.log('TALERA_FREE_ONE_TAP_LIVE_READY',JSON.stringify({
            separateWorker:true,anonymousStartWorks:true,
            actualTicketNeverStoredInGitHub:true,
            fakeTicketsForbidden:true,externalSitesForbidden:true,
            originalTaleraUntouched:true,previousSecretsPreserved:true
          }));
          JS
