name: TALERA Free F5 - private voluntary local backup end-to-end QA
on:
  push:
    branches: [feature/free-f5-local-backup-ui-20261110]
    paths:
      - '.github/workflows/talera-free-f5-portable-archive-qa.yml'
      - 'r20-dev/free-10m-f5/f5-portable-archive.mjs'
      - 'r20-dev/free-10m-f5/f5-portable-archive.test.mjs'
      - 'r20-dev/free-10m-f5/f5-portable-idb.mjs'
      - 'r20-dev/free-10m-f5/f5-portable-idb.browser.test.mjs'
      - 'r20-dev/free-10m-f5/f5-backup-ui.browser.test.mjs'
      - 'r20-dev/free-10m-f5/f5-local-backup-page.mjs'
      - 'r20-dev/free-10m-f5/f5-backup-controller.mjs'
      - 'r20-dev/free-10m-f5/f5-public-assets.mjs'
      - 'r20-dev/free-10m-f5/f5-local-test.mjs'
      - 'r20-dev/free-10m-f5/f5-browser-account-isolation.mjs'
      - 'r20-dev/free-10m-f5/f5-worker.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  archive_codec:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Verify codec syntax, chunked 132MiB MOV, legacy restore and tamper checks
        run: |
          node --check r20-dev/free-10m-f5/f5-portable-archive.mjs
          node --check r20-dev/free-10m-f5/f5-portable-idb.mjs
          node --check r20-dev/free-10m-f5/f5-portable-archive.test.mjs
          node --check r20-dev/free-10m-f5/f5-backup-controller.mjs
          node --check r20-dev/free-10m-f5/f5-local-backup-page.mjs
          node --check r20-dev/free-10m-f5/f5-worker.mjs
          node r20-dev/free-10m-f5/f5-portable-archive.test.mjs
      - name: Rebuild original anonymous source and isolated F5 assets (no deployment)
        run: |
          node r20-dev/free-10m-delivery/build.mjs
          node r20-dev/free-10m-f5/f5-public-assets.mjs
      - name: Verify account-bound protected backup route on local Cloudflare Worker
        run: node r20-dev/free-10m-f5/f5-local-test.mjs
      - name: Install isolated mobile Chromium for realistic two-origin restore proof
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx --no-install playwright install --with-deps chromium
      - name: Test original 'Meer' button and real account separation in same Free app
        run: node r20-dev/free-10m-f5/f5-browser-account-isolation.mjs
      - name: Restore synthetic archive between two real browser origins without overwriting other memories
        run: node r20-dev/free-10m-f5/f5-portable-idb.browser.test.mjs
      - name: Test voluntary UI backup + conflict-safe restore across real browser origins
        run: node r20-dev/free-10m-f5/f5-backup-ui.browser.test.mjs
      - name: Verify only approved Free integration files and tests were modified
        shell: bash
        run: |
          set -euo pipefail
          BASE=e22ee597fd25bb277e17a9c8377afb3ea5d6c8d2
          git diff --name-only "$BASE" HEAD > /tmp/changed-files
          printf '%s\n' '.github/workflows/talera-free-f5-portable-archive-qa.yml' '.github/workflows/talera-free-f5-existing-qa-backup-iphone.yml' 'r20-dev/free-10m-f5/f5-portable-archive.mjs' 'r20-dev/free-10m-f5/f5-portable-idb.mjs' 'r20-dev/free-10m-f5/f5-public-assets.mjs' 'r20-dev/free-10m-f5/f5-worker.mjs' 'r20-dev/free-10m-f5/f5-local-test.mjs' 'r20-dev/free-10m-f5/f5-browser-account-isolation.mjs' 'r20-dev/free-10m-f5/f5-local-backup-page.mjs' 'r20-dev/free-10m-f5/f5-backup-controller.mjs' 'r20-dev/free-10m-f5/f5-backup-ui.browser.test.mjs' > /tmp/allowed-files
          if comm -23 <(sort /tmp/changed-files) <(sort /tmp/allowed-files) | grep .; then
            echo 'Unexpected TALERA modification; abort'
            exit 1
          fi
          git diff --exit-code "$BASE" HEAD -- r20-dev/free-10m-f5/f5-local-scope.mjs r20-dev/free-10m-f5/f5-editor-video-mute-guard.mjs r20-dev/free-10m-delivery/
          echo 'TALERA_FREE_BACKUP_ONLY_NO_APPROVED_PLAYER_OR_UI_CHANGES'
