name: TALERA Free F5b - separate real EU Cloudflare staging

on:
  push:
    branches: [feature/free-10m-f5-integrated-staging-20261108]
    paths:
      - '.github/workflows/talera-free-f5-real-eu.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: talera-free-f5-eu-isolated-once
  cancel-in-progress: false

jobs:
  f5_real_eu:
    name: Separate EU Worker, synthetic account+social+timeline readbacks
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install pinned tools
        run: npm ci
      - name: Confirm isolated config and no legacy D1/R2/worker binding
        run: |
          node -e "const fs=require('fs');const x=JSON.parse(fs.readFileSync('r20-dev/free-10m-f5/wrangler.staging.jsonc','utf8'));if(x.name!=='talera-free-f5-combined-stage-20261108'||x.services?.length||x.d1_databases?.length||x.r2_buckets?.length||x.durable_objects?.bindings?.length!==7||x.vars?.AUTH_STORAGE_JURISDICTION!=='eu'||x.vars?.SOCIAL_STORAGE_JURISDICTION!=='eu')process.exit(1)"
          test -n "$CLOUDFLARE_API_TOKEN"
          CLEAN_ID="$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr -cd 'a-fA-F0-9')"
          test "${#CLEAN_ID}" -eq 32
          echo "::add-mask::$CLEAN_ID"
          printf 'CLOUDFLARE_ACCOUNT_ID=%s\n' "$CLEAN_ID" >> "$GITHUB_ENV"
      - name: Package existing approved anonymous TALERA code
        run: |
          node r20-dev/free-10m-delivery/build.mjs
          node r20-dev/free-10m-f5/f5-public-assets.mjs
      - name: Check isolated new Worker compilation
        run: npx --no-install wrangler deploy --dry-run --config r20-dev/free-10m-f5/wrangler.staging.jsonc --outdir .talera-f5-eu-check
      - name: Deploy only uniquely named NEW EU staging, still fail-closed
        run: npx --no-install wrangler deploy --config r20-dev/free-10m-f5/wrangler.staging.jsonc
      - name: Create masked disposable staging-only access keys
        run: |
          for KEY in STAGING_F5_KEY STAGING_ACCESS_KEY STAGING_SOCIAL_KEY AUTH_NAMESPACE_KEY DEMO_IDENTITY_KEY; do
            VALUE="$(openssl rand -hex 32)"
            echo "::add-mask::$VALUE"
            printf '%s=%s\n' "$KEY" "$VALUE" >> "$GITHUB_ENV"
          done
      - name: Seal the isolated Worker with the five QA secrets
        run: |
          for KEY in STAGING_F5_KEY STAGING_ACCESS_KEY STAGING_SOCIAL_KEY AUTH_NAMESPACE_KEY DEMO_IDENTITY_KEY; do
            printf '%s' "${!KEY}" | npx --no-install wrangler secret put "$KEY" --config r20-dev/free-10m-f5/wrangler.staging.jsonc
          done
      - name: Allow Cloudflare edge settings to settle
        run: sleep 8
      - name: Verify genuine EU staging with ONLY synthetic data and bounded requests
        run: node r20-dev/free-10m-f5/f5-live-smoke.mjs
