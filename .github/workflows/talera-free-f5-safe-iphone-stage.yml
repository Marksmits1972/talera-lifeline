name: TALERA Free F5 - immutable baseline to separate protected iPhone QA
# This workflow runs only when its own file is first added to its isolated branch.
# Never runs on PR updates, changes production, or redeploys the existing 8-November F5 stage.
on:
  push:
    branches: [feature/free-f5-safe-iphone-stage-20261109]
    paths:
      - '.github/workflows/talera-free-f5-safe-iphone-stage.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: talera-free-f5-storage-only-iphone-qa-20261109
  cancel-in-progress: false

jobs:
  stage_and_verify:
    name: New isolated EU F5 Worker, five secret gates, synthetic mobile browser
    runs-on: ubuntu-24.04
    timeout-minutes: 33
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      F5_STAGE_NAME: talera-free-f5-storage-qa-20261109
      F5_STAGE_HOST: talera-free-f5-storage-qa-20261109.mark-a39.workers.dev
      F5_INVITE_HASH: 9e5da8ed7d8ad9f23dc0b3195c7fc47a6cc41444472af5931a499d09b3c52561
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Verify immutable user-approved development baseline and available credentials
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor b9fe0f9c8c7d7f27e49088fa6debc9928db37280 HEAD
          test -n "$CLOUDFLARE_API_TOKEN"
          CLEAN_ID="$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr -cd 'a-fA-F0-9')"
          test "${#CLEAN_ID}" -eq 32
          echo "::add-mask::$CLEAN_ID"
          echo "CLOUDFLARE_ACCOUNT_ID=$CLEAN_ID" >> "$GITHUB_ENV"
      - name: Confirm this exact Worker name was never previously deployed
        shell: bash
        run: |
          set -euo pipefail
          status="$(curl -sS -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$F5_STAGE_NAME")"
          test "$status" = "404"
          echo "Only a NEW isolated Worker name may be used; no old test or official Worker overwritten."
      - name: Install pinned project dependencies
        run: npm ci
      - name: Verify approved original UI and local media storage unchanged
        run: |
          node r20-dev/free-10m-f5/f5-storage-only-contract.test.mjs
          node r20-dev/free-10m-f5/f5-account-switch-regression.mjs
          node r20-dev/free-10m-f5/f5-sw-cache-audit.mjs
      - name: Build only approved anonymous TALERA assets and guard original account UI
        run: |
          node r20-dev/free-10m-delivery/build.mjs
          node r20-dev/free-10m-f5/f5-public-assets.mjs
          node r20-dev/free-10m-f5/f5-original-api-inventory.mjs
      - name: Prepare unique account-isolated stage config with only fingerprinted invite
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const configPath='r20-dev/free-10m-f5/wrangler.staging.jsonc';
          const outPath='r20-dev/free-10m-f5/wrangler.iphone-qa.generated.jsonc';
          const c=JSON.parse(fs.readFileSync(configPath,'utf8'));
          const expected='talera-free-f5-combined-stage-20261108';
          if(c.name!==expected || c.durable_objects?.bindings?.length!==7 ||
              c.services?.length || c.d1_databases?.length || c.r2_buckets?.length ||
              c.vars.AUTH_STORAGE_JURISDICTION!=='eu' || c.vars.SOCIAL_STORAGE_JURISDICTION!=='eu')
            throw Error('Fail closed: baseline storage contract changed');
          if(!/^[a-f0-9]{64}$/.test(process.env.F5_INVITE_HASH))throw Error('Invalid invitation hash');
          c.name=process.env.F5_STAGE_NAME;
          c.migrations=[{tag:'free-f5-storage-iphone-qa-20261109-v1',new_sqlite_classes:c.durable_objects.bindings.map(x=>x.class_name)}];
          c.vars.F5_EASY_INVITE_SHA256=process.env.F5_INVITE_HASH;
          if(Number(c.vars.F5_EASY_INVITE_EXPIRES)<Date.now()+86400000)throw Error('Invitation expires too early');
          fs.writeFileSync(outPath,JSON.stringify(c,null,2)+'\n');
          console.log('New isolated Worker config checked; only 7 EU DO classes, no D1/R2/services');
          NODE
      - name: Verify deployment bundle without deploying
        run: npx --no-install wrangler deploy --dry-run --config r20-dev/free-10m-f5/wrangler.iphone-qa.generated.jsonc --outdir .talera-f5-iphone-qa-bundle
      - name: Deploy exclusively the new protected test Worker
        run: npx --no-install wrangler deploy --config r20-dev/free-10m-f5/wrangler.iphone-qa.generated.jsonc
      - name: Generate masked staging-only keys (never log or upload)
        shell: bash
        run: |
          set -euo pipefail
          for KEY in STAGING_F5_KEY STAGING_ACCESS_KEY STAGING_SOCIAL_KEY AUTH_NAMESPACE_KEY DEMO_IDENTITY_KEY; do
            VALUE="$(openssl rand -hex 32)"
            echo "::add-mask::$VALUE"
            printf '%s=%s\n' "$KEY" "$VALUE" >> "$GITHUB_ENV"
          done
      - name: Seal isolated Worker with all five synthetic-only secrets
        shell: bash
        run: |
          set -euo pipefail
          for KEY in STAGING_F5_KEY STAGING_ACCESS_KEY STAGING_SOCIAL_KEY AUTH_NAMESPACE_KEY DEMO_IDENTITY_KEY; do
            printf '%s' "${!KEY}" | npx --no-install wrangler secret put "$KEY" --config r20-dev/free-10m-f5/wrangler.iphone-qa.generated.jsonc
          done
      - name: Allow deployment and Durable Objects to stabilize
        run: sleep 10
      - name: Check actual EU Worker with synthetic accounts, shares and revocation
        run: node r20-dev/free-10m-f5/f5-live-smoke.mjs
      - name: Install synthetic mobile browser tools
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx --no-install playwright install --with-deps chromium
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Real remote protected PWA + Chromium mobile photo-video-audio test
        env:
          F5_BROWSER_ENGINE: chromium
        run: node r20-dev/free-10m-f5/f5-webkit-browser-smoke.mjs
      - name: Publish public test evidence only when all checks passed
        if: success()
        shell: bash
        run: |
          echo "TALERA_F5_NEW_ISOLATED_STAGE_ALL_CHECKS_PASSED"
          echo "Branch isolated; approved visual source preserved; fictitious data; existing PWA untouched."
