name: TALERA - Free 10M and Premium 1M separate preflight (not load)

on:
  push:
    branches: [feature/free-premium-scale-gates-20261108]
    paths:
      - 'r20-dev/free-premium-scale-20261108/**'
      - '.github/workflows/talera-free-premium-scale-gates.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline_workload_math:
    name: OFFLINE model only - no million real sessions
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check model code
        run: |
          node --check r20-dev/free-premium-scale-20261108/scale-model.mjs
          node --check r20-dev/free-premium-scale-20261108/scale-model.test.mjs
          node --check r20-dev/free-premium-scale-20261108/run-offline.mjs
          node --check r20-dev/free-premium-scale-20261108/public-readonly-smoke.mjs
      - name: Run separate 10M Free and 1M Premium math assertions
        run: node --test r20-dev/free-premium-scale-20261108/scale-model.test.mjs
      - name: Generate explicit assumptions and NOT PROVEN verdict
        run: node r20-dev/free-premium-scale-20261108/run-offline.mjs
      - name: Archive offline scenario only
        uses: actions/upload-artifact@v4
        with:
          name: talera-free-premium-offline-envelope
          path: r20-dev/free-premium-scale-20261108/results-offline.json
          retention-days: 14

  anonymous_three_gets:
    name: 3 anonymous GETs only - existing TALERA preview
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Three public GETs, no accounts, no writes, NO load
        run: node r20-dev/free-premium-scale-20261108/public-readonly-smoke.mjs


  isolated_local_premium_runtime:
    name: Genuine Cloudflare local DO/R2 runtime - small bounded requests
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Fetch prior proven ISOLATED synthetic DO/R2 Worker at pinned commit
        uses: actions/checkout@v4
        with:
          ref: b28a459fa5d14d55fb4d836bb2674c9545f6a9f0
          path: isolated-synthetic-proof
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install test runtime only, do not deploy anything
        run: npm ci
      - name: Adjust only ephemeral local workerd compatibility date (pinned runner)
        run: |
          sed -i 's/"compatibility_date": "2026-11-08"/"compatibility_date": "2026-09-18"/' isolated-synthetic-proof/r20-dev/do-shortpath-compare-20261108/wrangler.jsonc
          grep '"compatibility_date": "2026-09-18"' isolated-synthetic-proof/r20-dev/do-shortpath-compare-20261108/wrangler.jsonc
      - name: Local-only routing adapter (no real EU jurisdiction in runner)
        run: |
          sed -i "s/const eu=env.ACCOUNT_HOME.jurisdiction('eu');/const eu=env.ACCOUNT_HOME;/" isolated-synthetic-proof/r20-dev/do-shortpath-compare-20261108/identity.mjs
          grep 'const eu=env.ACCOUNT_HOME;' isolated-synthetic-proof/r20-dev/do-shortpath-compare-20261108/identity.mjs
      - name: Exercise real Worker code locally, with 12 fake accounts and 6 fake media objects each
        run: node r20-dev/free-premium-scale-20261108/local-premium-runtime.mjs

      - name: Archive LOCAL-only genuine Worker runtime metrics
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: talera-premium-bounded-local-runtime
          path: r20-dev/free-premium-scale-20261108/results-local-runtime.json
          retention-days: 14
