name: TALERA isolated iPhone photo picker lab
on:
  push:
    branches: [experiment/iphone-picker-own-worker-20261106]
    paths:
      - 'r20-dev/ios-picker-lab/**'
      - '.github/workflows/talera-ios-picker-lab-deploy.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: talera-iphone-photo-picker-lab
  cancel-in-progress: false
jobs:
  isolated-lab:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout separate branch
        uses: actions/checkout@v4
      - name: Use pinned Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install pinned Wrangler
        run: npm ci
      - name: Test only independent iPhone picker lab
        run: node --test r20-dev/ios-picker-lab/worker.test.mjs
      - name: Verify isolated config
        run: |
          node -e "const c=JSON.parse(require('fs').readFileSync('r20-dev/ios-picker-lab/wrangler.jsonc','utf8')); if(c.name!=='talera-iphone-photo-picker-lab-20261106'||c.services||c.r2_buckets||c.d1_databases||c.vars||c.routes) process.exit(1); console.log('Own Worker name, no production bindings or routes confirmed');"
      - name: Require existing GitHub deployment credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing GitHub Cloudflare API token'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Missing GitHub Cloudflare account ID'; exit 1; }
      - name: Deploy new isolated lab ONLY
        run: |
          export CLOUDFLARE_ACCOUNT_ID="$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr -cd '[:alnum:]_-')"
          npx wrangler deploy --config r20-dev/ios-picker-lab/wrangler.jsonc
      - name: Verify dedicated live worker
        run: |
          URL='https://talera-iphone-photo-picker-lab-20261106.mark-a39.workers.dev'
          PASS=0
          for ATTEMPT in 1 2 3 4 5 6 7 8; do
            BODY="$(curl -fLsS --connect-timeout 6 --max-time 10 "$URL/health" 2>/dev/null || true)"
            if printf '%s' "$BODY" | grep -q '"isolated":true'; then PASS=1; break; fi
            sleep 3
          done
          test "$PASS" = 1 || { echo 'Worker deployed but dedicated URL health check failed'; exit 1; }
          curl -fLsS "$URL/" | grep -q 'Open echte iPhone' || { echo 'Lab HTML is missing'; exit 1; }
          printf '%s\n' "### Isolated iPhone layout lab" "$URL/" >> "$GITHUB_STEP_SUMMARY"
          echo "Dedicated test URL: $URL/"
