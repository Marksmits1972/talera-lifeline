name: TALERA isolated real photo-strip D1 vs Durable Objects latency benchmark
on:
  push:
    branches: [feature/photo-strip-d1-vs-do-speed-test-20261108]
    paths:
      - r20-dev/photo-speed-benchmark-20261108/*.mjs
      - .github/workflows/talera-photo-speed-benchmark-staging.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: talera-photo-speed-benchmark-exclusive-20261108
  cancel-in-progress: false
jobs:
  real_eu_photo_strip_comparison:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install repository Wrangler version
        run: npm ci
      - name: Validate offline Worker, provisioning and metric code
        run: |
          node --check r20-dev/photo-speed-benchmark-20261108/worker.mjs
          node --check r20-dev/photo-speed-benchmark-20261108/provision.mjs
          node --check r20-dev/photo-speed-benchmark-20261108/measure.mjs
      - name: Normalize and mask Cloudflare account scope
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          CLEAN_ID="$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr -cd 'a-fA-F0-9')"
          test "${#CLEAN_ID}" -eq 32
          echo "::add-mask::$CLEAN_ID"
          printf 'CLOUDFLARE_ACCOUNT_ID=%s\n' "$CLEAN_ID" >> "$GITHUB_ENV"
      - name: Idempotently create only new EU D1 and EU R2 test resources
        run: node r20-dev/photo-speed-benchmark-20261108/provision.mjs
      - name: Deploy same isolated Worker for D1 and DO comparison
        run: |
          npx --no-install wrangler deploy --config r20-dev/photo-speed-benchmark-20261108/wrangler.generated.jsonc
      - name: Generate private ephemeral synthetic-only benchmark bearer
        run: |
          KEY="$(openssl rand -hex 32)"
          echo "::add-mask::$KEY"
          printf 'BENCH_TOKEN=%s\n' "$KEY" >> "$GITHUB_ENV"
          printf '%s' "$KEY" | npx --no-install wrangler secret put BENCH_TOKEN --config r20-dev/photo-speed-benchmark-20261108/wrangler.generated.jsonc
      - name: Measure real 12-image transfer, matched SQL manifests and independent R2 path
        run: node r20-dev/photo-speed-benchmark-20261108/measure.mjs
      - name: Store only benchmark timings, no photos or user data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: talera-photo-strip-d1-do-timings-20261108
          path: r20-dev/photo-speed-benchmark-20261108/results/real-network-benchmark.json
          if-no-files-found: ignore
          retention-days: 14
