name: TALERA V11 — alleen onbesproken foto's

on:
  push:
    branches:
      - feature/talera-restfotos-eenvoudig-v11-20261105
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-standalone-v11:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Only one added function — syntax
        run: node --check r20-dev/restfotos-v11/restfotos.worker.mjs
      - name: Existing narrator/photo/video flow regression tests
        run: node --test r20-dev/restfotos-v11/restfotos.test.mjs
      - name: Compare real original player and new code byte for byte
        run: node r20-dev/restfotos-v11/smoke-live.mjs
      - name: Actual WAV spoken-cycle completion and photos in Chrome
        run: |
          BROWSER=$(command -v google-chrome-stable || command -v google-chrome || command -v chromium)
          "$BROWSER" --headless=new --no-sandbox --disable-dev-shm-usage --disable-gpu --autoplay-policy=no-user-gesture-required --remote-allow-origins='*' --remote-debugging-port=9224 --user-data-dir="$RUNNER_TEMP/talera-v11-check" about:blank >/tmp/talera-v11-chrome.log 2>&1 &
          CHROME_PID=$!
          trap 'kill "$CHROME_PID" 2>/dev/null || true' EXIT
          node r20-dev/restfotos-v11/browser-smoke.mjs
      - name: No storage writes, video overrides or extra state wrappers
        run: |
          node --input-type=module - <<'NODE'
          import {readFileSync} from 'node:fs';
          import assert from 'node:assert/strict';
          const source=readFileSync('r20-dev/restfotos-v11/restfotos.worker.mjs','utf8');
          assert.doesNotMatch(source,/taleraStartOriginalRound\s*=|indexedDB|localStorage|MEDIA\.put|D1\.prepare/);
          assert.match(source,/function taleraV11ShowRemainingPhotos/);
          console.log('V11: originele video onaangeroerd, geen nieuwe opslag of extra afspeellaag');
          NODE
