name: TALERA read-only production storage and Worker binding map
on:
  push:
    branches: [feature/storage-architecture-readonly-audit-20261108]
    paths:
      - r20-dev/storage-inventory-20261108/**
      - .github/workflows/talera-storage-inventory-readonly.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  read_only_inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify historic D1 R2 source paths and route contracts without data access
        run: |
          node --test r20-dev/storage-inventory-20261108/verify-source-contract.test.mjs
          node --check r20-dev/storage-inventory-20261108/read-only-cloudflare-bindings.mjs
      - name: Validate Cloudflare GitHub scope without printing secrets
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          CLEAN_ID="$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr -cd 'a-fA-F0-9')"
          test "${#CLEAN_ID}" -eq 32
          echo "::add-mask::$CLEAN_ID"
          printf 'CLOUDFLARE_ACCOUNT_ID=%s\n' "$CLEAN_ID" >> "$GITHUB_ENV"
      - name: GET ONLY reachable Worker binding labels, redact identifiers and secrets
        run: |
          node r20-dev/storage-inventory-20261108/read-only-cloudflare-bindings.mjs
      - name: Store sanitized metadata graph, never user data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: talera-worker-storage-routing-readonly-20261108
          path: r20-dev/storage-inventory-20261108/results/cloudflare-routing-sanitized.json
          if-no-files-found: ignore
          retention-days: 14
