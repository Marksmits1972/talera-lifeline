name: TALERA inspect tell header color (GitHub read-only)
on:
  push:
    branches: [feature/design-only-tell-header-fix-20261107]
    paths:
      - .github/workflows/talera-tell-header-inspect.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Inspect public HTML and header selectors without modifying app
        run: |
          node --input-type=module <<'NODE'
          const urls=[
          'https://talera-design-cleanup-fase3-test-20261107.mark-a39.workers.dev/tell',
          'https://talera-vijftalen-onderhoud-test-20261107.mark-a39.workers.dev/tell'
          ];
          for(const url of urls){
            const r=await fetch(url);
            const html=await r.text();
            console.log('SOURCE',url,'HTTP',r.status,'bytes',html.length);
            const body=html.match(/<body\b[^>]*>/i);
            console.log('BODY',body?.[0]?.slice(0,500)||'none');
            for(const token of ['flow-nav','class="top"','class="mast"','class="topbar"','TALERA','#F8F7F4','background:#f8f7f4','background-color:#FFFFFF']){
              let pos=0,at=[],max=0;
              while((pos=html.indexOf(token,pos))>=0){at.push(pos);pos+=token.length;if(++max>2000)break}
              console.log('MATCH',token,'count',at.length);
              for(const i of at.slice(0,3)){
                console.log('EXCERPT',html.slice(Math.max(0,i-180),Math.min(html.length,i+330)).replace(/\s+/g,' ').slice(0,520));
              }
            }
            const styles=[...html.matchAll(/<style\\b([^>]*)>([\\s\\S]*?)<\\/style>/gi)];
            console.log('STYLES_COUNT',styles.length);
            styles.forEach((block,idx)=>{
              const selectorRules=[...block[2].matchAll(/([^{}]+)\\{([^{}]*)\\}/g)]
                .map(x=>({selector:x[1].replace(/\\/\\*[\\s\\S]*?\\*\\//g,'').trim().replace(/\\s+/g,' '),body:x[2].trim().replace(/\\s+/g,' ')}))
                .filter(x=>/(^|[^\\w-])(header\\.top|header:not|\\.top(?:[\\s,:.#>]|$)|#app\\s*>\\s*header)/.test(x.selector))
                .slice(0,24);
              if(selectorRules.length)console.log('HEADER_CSS',idx,block[1].slice(0,120),JSON.stringify(selectorRules).slice(0,4800));
            });
            const headers=[...html.matchAll(/<header\b[^>]*>/gi)].map(x=>x[0].slice(0,350));
            console.log('HEADERS',JSON.stringify(headers.slice(0,30)));
          }
          NODE
