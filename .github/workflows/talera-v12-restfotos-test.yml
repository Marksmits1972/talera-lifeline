name: TALERA V12 — videos daarna restfoto's (geisoleerde kandidaat)

on:
  push:
    branches:
      - fix/talera-v12-restfotos-na-videos-20261105
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-isolated-v12:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - name: Syntax of isolated presentation-only wrapper
        run: node --check r20-dev/restfotos-v12/restfotos.worker.mjs
      - name: Regression tests — native video sound before remaining photos
        run: node --test r20-dev/restfotos-v12/restfotos.test.mjs
      - name: Verify exact read-only patch against the protected live V9 HTML
        run: node r20-dev/restfotos-v12/smoke-live.mjs
      - name: No extra player, recording change, storage write or Cloudflare publication
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          const s=readFileSync('r20-dev/restfotos-v12/restfotos.worker.mjs','utf8');
          assert.match(s,/function taleraInlineRemainingPhotos/);
          assert.match(s,/ORIGINAL_VIDEO_DONE/);
          assert.match(s,/ORIGINAL_NO_VIDEOS/);
          assert.doesNotMatch(s,/taleraStartOriginalRound\s*=|TaleraMemories\.save|indexedDB|localStorage|FRONT_DIAG_SCRIPT|taleraZeroIframe/);
          console.log('PASS: isolated native player candidate, no release');
          NODE
      - name: Scope and release status
        run: |
          echo "Only unit/regression validation. This workflow does NOT deploy."
          echo "Browser E2E and real iPhone acceptance are still required."
