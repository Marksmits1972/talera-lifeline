name: TALERA V62 cloud integrity only (guarded one-time release)
on:
  push:
    branches:
      - feature/v62-mijn-profiel-accountoverzicht-20261101
    paths:
      - 'releases/v62-cloud-integrity-20261102.json'
permissions:
  contents: read
concurrency:
  group: talera-v62-production-content-release
  cancel-in-progress: false
jobs:
  release:
    if: ${{ github.repository == 'Marksmits1972/talera-lifeline' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: talera-v62-production
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require exactly one reviewed release trigger and immutable base commit
        run: |
          node --input-type=module <<'EOF'
          import {execFileSync} from 'node:child_process';
          import {readFileSync} from 'node:fs';
          const approved=JSON.parse(readFileSync('releases/v62-cloud-integrity-20261102.json'));
          const current=execFileSync('git',['rev-parse','HEAD^'],{encoding:'utf8'}).trim();
          const changed=execFileSync('git',['diff-tree','--no-commit-id','--name-only','-r','HEAD'],{encoding:'utf8'}).trim();
          if(current!==approved.reviewedBaseCommit||
             changed!=='releases/v62-cloud-integrity-20261102.json'||
             approved.target!=='talera-pwa-v62-mijn-profiel-20261101'||
             approved.action!=='publish-cloud-integrity-only')
           throw Error('Release marker does not match exactly reviewed base commit and target');
          EOF
      - name: Install locked build dependencies
        run: npm ci
      - name: Check release script syntax and run existing Premium tests
        run: |
          node --check scripts/v62-cloud-integrity-release.mjs
          node --check --input-type=commonjs < src/mijn-talera/menu-integration.txt
          node --test test/premium-cloud-integrity.test.mjs
      - name: Build fixed 16-part Worker content without publishing
        run: node scripts/v62-package-preflight.mjs
      - name: Stop if any unchanged public module drifted
        run: node scripts/v62-live-drift-check.mjs
      - name: Live Cloudflare binding, version and source content guards (GET only)
        env:
          TALERA_V62_CF_TOKEN: ${{ secrets.TALERA_V62_CLOUDFLARE_READ_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/v62-cloud-integrity-release.mjs --check
      - name: Publish only reviewed V62 Worker modules and verify (or rollback)
        env:
          TALERA_V62_CF_TOKEN: ${{ secrets.TALERA_V62_CLOUDFLARE_READ_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/v62-cloud-integrity-release.mjs --publish
      - name: Preserve sanitized release evidence (never source or secrets)
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: talera-v62-one-time-release-${{ github.sha }}
          path: |
            .talera-v62-package/v62-release-result.json
            .talera-v62-package/release-inventory.json
            .talera-v62-package/live-drift-report.json
          if-no-files-found: warn
          retention-days: 60
