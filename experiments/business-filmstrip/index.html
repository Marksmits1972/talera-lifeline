function drawBand(nodes,parent,radius,thumb=false){const width=thumb?88:Math.min(innerWidth*.90,620)+14,base=Math.floor(pos),keep=new Set();for(let i=Math.max(0,base-radius);i<=Math.min(n-1,base+radius+1);i++){const off=i-pos;if(Math.abs(off)>radius+1)continue;keep.add(i);let el=nodes.get(i);if(!el){el=makeNode(i,thumb);nodes.set(i,el);parent.append(el)}const dx=off*width,scale=thumb?1:1-.085*Math.min(1,Math.abs(off));el.style.transform="translate(calc(-50% + "+dx.toFixed(2)+"px),-50%) scale("+scale.toFixed(3)+")";el.style.opacity=String(thumb?1:clamp(1-Math.max(0,Math.abs(off)-1)*.45,.18,1));if(thumb)el.classList.toggle("active",i===nearest());el.style.zIndex=String(100-Math.round(Math.abs(off)*8));}for(const [i,node] of nodes){if(!keep.has(i)){node.remove();nodes.delete(i)}}}

function tick(x,y,major,label="",sub=""){if(x<-65||x>canvas.clientWidth+65)return;ctx.strokeStyle=major?"rgba(15,39,71,.66)":"rgba(62,74,89,.24)";ctx.lineWidth=major?1.5:1;ctx.beginPath();ctx.moveTo(x,y-(major?11:5));ctx.lineTo(x,y+(major?10:5));ctx.stroke();if(major&&label){ctx.fillStyle="#0f2747";ctx.textAlign="center";ctx.font="700 12px -apple-system,sans-serif";ctx.fillText(label,x,y+23);if(sub){ctx.fillStyle="rgba(15,39,71,.55)";ctx.font="11px -apple-system,sans-serif";ctx.fillText(sub,x,y+36)}}}

function drawTimeline(){const r=canvas.getBoundingClientRect(),w=r.width,h=r.height;if(!w||!h)return;const dpr=Math.min(devicePixelRatio||1,2.4);canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,w,h);let span=spanDays()*DAY,center=visualTime,start=center-span/2,end=center+span/2,y=h-50;ctx.strokeStyle="rgba(91,143,185,.44)";ctx.beginPath();ctx.moveTo(0,y+.5);ctx.lineTo(w,y+.5);ctx.stroke();const xp=ms=>(ms-start)/span*w,lv=Math.round(zoom);

const label=document.getElementById("focusBlock");label.textContent=lv===5?new Date(center).toLocaleTimeString("nl-NL",{hour:"2-digit",minute:"2-digit"}):new Date(center).toLocaleDateString("nl-NL",{day:"numeric",month:"short",year:"numeric"});}

// Fullscreen is the actual r19h2 TALERA screen, not a recreated photo screen.
const nativePresentation=document.getElementById("nativePresentation");
function alignBusinessTimeline(){
  try{
    const timeline=nativePresentation.contentDocument?.querySelector('.timeline');
    if(!timeline)return;
    const height=Math.max(0,Math.min(innerHeight,timeline.getBoundingClientRect().bottom));
    if(height>70)app.style.setProperty('--business-timeline-height',height+'px');
  }catch(e){}
}

let lastNativeIndex=-1;
let nativeStoriesLoaded=false;
let nativeTimelineGesture=false;
let nativeTimelineHoldUntil=0;
let timelineLastCenter=NaN;
let timelineSamples=[],timelineMomentumRaf=0,timelineFlick=null;
function stopTimelineMomentum(){
  if(timelineMomentumRaf)cancelAnimationFrame(timelineMomentumRaf);
  timelineMomentumRaf=0;
}
function coastOriginalTimeline(){
  stopTimelineMomentum();
  if(timelineSamples.length<2)return;
  const last=timelineSamples[timelineSamples.length-1];
  const first=timelineSamples.find(p=>last.t-p.t<=125)||timelineSamples[0];
  const dt=Math.max(16,last.t-first.t),delta=last.ms-first.ms;
  let speed=delta/dt; // timeline milliseconds moved per real millisecond
  const span=Math.abs(data[n-1].ms-data[0].ms);
  const minimum=span/20000; // Slow, intentional drags stop precisely on release.
  if(Math.abs(speed)<minimum)return;
  const now=performance.now();
  const prior=timelineFlick;
  const chain=prior&&now-prior.t<1100&&Math.sign(prior.speed)===Math.sign(speed);
  const streak=chain?Math.min(5,(prior.streak||1)+1):1;

  // The ordinary slow-drag threshold and exact finger tracking stay unchanged.
  if(chain){
    speed=Math.sign(speed)*Math.max(Math.abs(speed),Math.abs(prior.speed)*.76+Math.abs(speed)*1.2);
  }
  const boost=streak===1?1:Math.min(4.2,1+Math.pow(streak-1,1.35)*.62);
  speed*=boost;

  const runtime=readyNative();if(!runtime)return;
  const limit=span/280;
  speed=clamp(speed,-limit,limit);
  timelineFlick={speed,t:now,streak};
  let prev=performance.now(),v=speed;
  const step=t=>{
    if(opened||nativeTimelineGesture){timelineMomentumRaf=0;return}
    const elapsed=Math.min(42,t-prev);prev=t;
    const next=clamp(runtime.centerMs()+v*elapsed,data[0].ms,data[n-1].ms);

    pos=clamp(positionForTime(runtime.centerMs()),0,n-1);
    nativeTimelineHoldUntil=t+140;
    render();
    v*=Math.exp(-elapsed/(streak>=3?1000:streak===2?780:550));

      timelineMomentumRaf=0;
      nativeTimelineHoldUntil=performance.now()+250;
    }

}

function syncNativeTimelineFromBrowse(){
  if(opened||nativeTimelineGesture||performance.now()<nativeTimelineHoldUntil||!nativeStoriesLoaded)return;
  const runtime=readyNative();if(!runtime)return;
  const target=timeAt(pos);
  if(Math.abs(runtime.centerMs()-target)>1000){
    runtime.setCenter(target);runtime.draw();
  }
}
function watchOriginalTimeline(){
  const runtime=readyNative();
  if(!opened&&runtime&&nativeStoriesLoaded){
    const current=runtime.centerMs();
    if(nativeTimelineGesture&&Number.isFinite(current)){
      timelineSamples.push({t:performance.now(),ms:current});
      if(timelineSamples.length>18)timelineSamples.shift();
    }
    if((nativeTimelineGesture||performance.now()<nativeTimelineHoldUntil)&&Number.isFinite(current)&&Math.abs(current-timelineLastCenter)>100){
      pos=clamp(positionForTime(current),0,n-1);render();
    }
    timelineLastCenter=current;
  }
  requestAnimationFrame(watchOriginalTimeline);
}
requestAnimationFrame(watchOriginalTimeline);

function readyNative(){
  try{return nativePresentation.contentWindow?.__taleraTimelineRuntime||null}catch(e){return null}
}
function syncNative(index){
  const runtime=readyNative();if(!runtime)return;
  const memory=data[clamp(index,0,n-1)];
  // Add only the selected prototype image/story to the isolated r19h2 runtime.
  // Existing r19h2 presentation, navigation and menus stay unmodified.
  if(!nativeStoriesLoaded&&typeof runtime.registerMemories==="function"){
    const imported=data.map((item,i)=>({id:900000+i,storyId:"business-demo-"+i,ms:item.ms,at:item.at,story:item.story,fullStory:item.story,title:item.story,image:item.image,photos:[item.image],_photoIndex:0}));
    runtime.registerMemories(imported);
    nativeStoriesLoaded=true;
  }
  runtime.setCenter(memory.ms);
  // Commit the selected memory to r19h2 immediately, not only after a gesture.
  const selected=runtime.findMemory({storyId:"business-demo-"+index});
  if(selected){
    runtime.writeMemory(selected);
    runtime.settlePhoto(selected);
  }
  runtime.draw();
  requestAnimationFrame(()=>{if(opened&&nearest()===index){
    runtime.setCenter(memory.ms);
    if(selected){runtime.writeMemory(selected);runtime.settlePhoto(selected)}
    runtime.draw();
  }});
  lastNativeIndex=index;
}
function openStory(){
  if(opened)return;
  cancelMotion();pos=nearest();render();opened=true;
  app.classList.add("presenting");
  nativePresentation.classList.add("open");
  try{nativePresentation.contentDocument.documentElement.classList.remove("business-browse")}catch(e){}
  const launch=()=>syncNative(nearest());
  if(readyNative())launch();
  else nativePresentation.addEventListener("load",launch,{once:true});
}
function closeStory(){
  if(!opened)return;
  const runtime=readyNative();
  if(runtime){const nativeMemory=runtime.currentMemory();if(nativeMemory&&String(nativeMemory.storyId||"").startsWith("business-demo-")){const idx=Number(String(nativeMemory.storyId).slice(14));if(Number.isInteger(idx)&&idx>=0&&idx<n)pos=idx;}}

}
window.addEventListener("message",event=>{
  if(event.origin!==location.origin||event.source!==nativePresentation.contentWindow)return;
  if(event.data?.type==="talera-business-return"&&opened)closeStory();
});
nativePresentation.addEventListener("load",()=>{
  // The original r19h2 timeline is the single timeline controller in browse and presentation.
  try{
    const doc=nativePresentation.contentDocument;
    doc.documentElement.classList.toggle("business-browse",!opened);
    requestAnimationFrame(alignBusinessTimeline);
    const timeline=doc.querySelector('.timeline');
    if(timeline){
      timeline.addEventListener('pointerdown',()=>{stopTimelineMomentum();timelineSamples=[];nativeTimelineGesture=true;nativeTimelineHoldUntil=Infinity;cancelMotion()},{capture:true});

nativePresentation.addEventListener("load",()=>{
  try{
    const doc=nativePresentation.contentDocument;
    let gesture=null;
    const excluded=target=>Boolean(target?.closest?.('.timeline,nav,button,input,textarea,select'));
    function begin(x,y,id,target){
      if(!opened||excluded(target)){gesture=null;return}
      gesture={x,y,id};
    }
    function move(x,y,id){
      if(!opened||!gesture||gesture.id!==id)return;
      const dx=x-gesture.x,dy=y-gesture.y;
      // Resolve during movement: r19h2 can capture/cancel the final touchend.
      if(dy>72&&dy>Math.abs(dx)*1.35){
        gesture=null;
        closeStory();
      }else if(Math.abs(dx)>45&&Math.abs(dx)>Math.abs(dy)*1.25){
        gesture=null; // horizontal gestures belong to the original presentation
      }
    }
    doc.addEventListener("touchstart",e=>{
      if(e.touches.length===1){const t=e.touches[0];begin(t.clientX,t.clientY,t.identifier,e.target)}

    },{capture:true,passive:true});
    doc.addEventListener("touchmove",e=>{
      if(e.touches.length!==1)return;
      const t=e.touches[0];move(t.clientX,t.clientY,t.identifier);
    },{capture:true,passive:true});
    doc.addEventListener("touchend",e=>{
      if(!gesture)return;
      const t=Array.from(e.changedTouches).find(t=>t.identifier===gesture.id);
      if(t)move(t.clientX,t.clientY,t.identifier);
      gesture=null;

    doc.addEventListener("touchcancel",()=>{gesture=null},{capture:true,passive:true});

    doc.addEventListener("pointerdown",e=>{
      if(e.pointerType!=="touch")begin(e.clientX,e.clientY,e.pointerId,e.target);
    },true);
    doc.addEventListener("pointermove",e=>{
      if(e.pointerType!=="touch")move(e.clientX,e.clientY,e.pointerId);
    },true);
    doc.addEventListener("pointerup",e=>{
      if(e.pointerType!=="touch")move(e.clientX,e.clientY,e.pointerId);
      if(gesture?.id===e.pointerId)gesture=null;
    },true);
  }catch(e){console.warn("Native r19h2 gesture bridge",e)}
});
