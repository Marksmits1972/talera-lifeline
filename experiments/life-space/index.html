[1972,1980,1990,2000,2010,2020,2026].forEach(y=>{const d=document.createElement("span");d.style.left=(tYear(y)*100)+"%";document.getElementById("ticks").appendChild(d)});
function toScreen(s){const depth=.84+s.z*.16;return{x:(s.x-cam.x)*cam.s*depth+W/2,y:(s.y-cam.y)*cam.s*depth+H/2}}
function nearest(){let bi=0,bd=Infinity;data.forEach((s,i)=>{const d=Math.hypot((s.x-cam.x)*.62,s.y-cam.y);if(d<bd){bd=d;bi=i}});return bi}
function visible(){const half=W/(2*cam.s);return[yT((cam.x-half-160)/(WW-320)),yT((cam.x+half-160)/(WW-320))]}
function isPresent(){return cam.s>=PRESENT}
function setBackdrop(i){const u=data[i].image;backdrop.style.backgroundImage="url('"+u+"')";presentImg.src=u}
function fmt(i){return new Date(data[i].at).toLocaleDateString("nl-NL",{day:"numeric",month:"long",year:"numeric"})}
function showStatus(t){status.textContent=t;status.classList.add("statusOn");clearTimeout(showStatus.t);showStatus.t=setTimeout(()=>status.classList.remove("statusOn"),900)}
function render(){
  active=nearest();
  const present=isPresent(),vr=visible(),centerYear=yT((cam.x-160)/(WW-320));
  presentation.classList.toggle("show",present);
  if(present){presentStory.textContent=data[active].story;presentDate.textContent=fmt(active);setBackdrop(active)}
  modeEl.textContent=present?"Presentatie":cam.s>.9?"Verhalen":cam.s>.48?"Periode":"Levensruimte";
  rangeEl.textContent=present?fmt(active):Math.max(BIRTH,Math.floor(vr[0]))+" – "+Math.min(END,Math.ceil(vr[1]));
  scaleLabel.textContent=Math.round(cam.s/MAX*100)+"%";
  const l=clamp(tYear(vr[0])*100,0,100),r=clamp(tYear(vr[1])*100,0,100);viewWindow.style.left=l+"%";viewWindow.style.width=Math.max(1,r-l)+"%";needle.style.left=clamp(tYear(centerYear)*100,0,100)+"%";
  nodes.forEach((el,i)=>{const s=data[i],p=toScreen(s),dist=Math.hypot(p.x-W/2,p.y-H/2),near=1-clamp(dist/Math.max(W,H),0,1);let opacity=present?0:clamp((cam.s-.23)/.75,0,1)*(.28+.72*near);if(cam.s<.4)opacity*=.5;const size=clamp(.48+cam.s*.38,.5,1.15)*(.92+s.z*.08);el.style.opacity=opacity.toFixed(3);el.style.pointerEvents=opacity>.08?"auto":"none";el.classList.toggle("nearest",i===active&&!present);el.style.zIndex=String(500+Math.round(s.z*100)+(i===active?100:0));el.style.transform="translate3d("+(p.x-72)+"px,"+(p.y-95)+"px,0) scale("+size+")"});
  hint.innerHTML=present?'Swipe links/rechts. <b>Knijp samen</b> om uit te zoomen.':'<b>Sleep met één vinger</b> door je leven. Knijp samen = verder uit, spreid = dichterbij.';
  drawRoute();
}
function drawRoute(){let d="";for(let i=0;i<=70;i++){const t=i/70,p={x:160+t*(WW-320),y:spine(t),z:1},q=toScreen(p),x=q.x/W*100,y=q.y/H*100;d+=(i?" L ":"M ")+x.toFixed(2)+" "+y.toFixed(2)}routePath.setAttribute("d",d)}
function resize(){const r=app.getBoundingClientRect();W=Math.max(1,r.width);H=Math.max(1,r.height);render()}
function setCam(x,y,s){cam.x=clamp(x,0,WW);cam.y=clamp(y,-300,WH+300);cam.s=clamp(s,MIN,MAX);render()}
function focus(i){active=clamp(i,0,data.length-1);setCam(data[active].x,data[active].y,MAX);setBackdrop(active);hint.style.display="none"}
function space(){setCam(cam.x,cam.y,.68);hint.style.display="none";showStatus("Levensruimte")}
function zoomAround(px,py,newScale){const old=cam.s,ns=clamp(newScale,MIN,MAX),wx=cam.x+(px-W/2)/old,wy=cam.y+(py-H/2)/old;setCam(wx-(px-W/2)/ns,wy-(py-H/2)/ns,ns)}
window.addEventListener("resize",resize,{passive:true});window.visualViewport&&visualViewport.addEventListener("resize",resize,{passive:true});
resize();setBackdrop(active);

// Pointer based gesture engine — Safari supports multiple active touch pointers.
// No snap-back or gesture-end recentering.
const pts=new Map();let oneStart=null,pinchStart=null;
function local(e){const r=app.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
function currentPair(){const a=[...pts.values()];return a.length>=2?[a[0],a[1]]:null}
function distance(a,b){return Math.hypot(b.x-a.x,b.y-a.y)}function midpoint(a,b){return{x:(a.x+b.x)/2,y:(a.y+b.y)/2}}
app.addEventListener("pointerdown",e=>{
  if(e.target.closest("button"))return;
  if(e.pointerType==="mouse"&&e.button!==0)return;
  e.preventDefault();app.setPointerCapture&&app.setPointerCapture(e.pointerId);
  const p=local(e);pts.set(e.pointerId,p);hint.style.display="none";
  if(pts.size===1){oneStart={p,cx:cam.x,cy:cam.y,s:cam.s,active}}
  if(pts.size===2){const [a,b]=currentPair(),m=midpoint(a,b);pinchStart={d:Math.max(8,distance(a,b)),s:cam.s,wx:cam.x+(m.x-W/2)/cam.s,wy:cam.y+(m.y-H/2)/cam.s};oneStart=null}
},{passive:false});
app.addEventListener("pointermove",e=>{
  if(!pts.has(e.pointerId))return;e.preventDefault();pts.set(e.pointerId,local(e));
  if(pts.size>=2&&pinchStart){const [a,b]=currentPair(),m=midpoint(a,b),ratio=distance(a,b)/pinchStart.d,ns=clamp(pinchStart.s*ratio,MIN,MAX);setCam(pinchStart.wx-(m.x-W/2)/ns,pinchStart.wy-(m.y-H/2)/ns,ns);return}
  if(pts.size===1&&oneStart&&!isPresent()){const p=[...pts.values()][0],dx=p.x-oneStart.p.x,dy=p.y-oneStart.p.y;setCam(oneStart.cx-dx/oneStart.s,oneStart.cy-dy/oneStart.s,oneStart.s)}
},{passive:false});
function endPointer(e){
  if(!pts.has(e.pointerId))return;e.preventDefault();
  const end=pts.get(e.pointerId);pts.delete(e.pointerId);
  if(pts.size===0&&oneStart&&oneStart.s>=PRESENT){const dx=end.x-oneStart.p.x,dy=end.y-oneStart.p.y;if(Math.abs(dx)>42&&Math.abs(dx)>Math.abs(dy)*1.2)focus(oneStart.active+(dx<0?1:-1))}
  oneStart=null;pinchStart=null;
  if(pts.size===1){const p=[...pts.values()][0];oneStart={p,cx:cam.x,cy:cam.y,s:cam.s,active}}
}
app.addEventListener("pointerup",endPointer,{passive:false});app.addEventListener("pointercancel",endPointer,{passive:false});
app.addEventListener("gesturestart",e=>e.preventDefault(),{passive:false});app.addEventListener("gesturechange",e=>e.preventDefault(),{passive:false});app.addEventListener("gestureend",e=>e.preventDefault(),{passive:false});

document.getElementById("storyBtn").onclick=()=>focus(active);
document.getElementById("spaceBtn").onclick=space;
document.getElementById("minusBtn").onclick=()=>zoomAround(W/2,H/2,cam.s*.72);
document.getElementById("plusBtn").onclick=()=>zoomAround(W/2,H/2,cam.s*1.38);
document.getElementById("lineBtn").onclick=()=>app.classList.toggle("showRoute");
})();
</script>
</body></html>
