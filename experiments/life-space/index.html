<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0d141a">
<title>Talera — Life Space + Timeline</title>
<style>
:root{
  --safeT:env(safe-area-inset-top,0px);
  --safeB:env(safe-area-inset-bottom,0px);
  --glass:rgba(8,14,19,.46);
  --border:rgba(255,255,255,.15);
  --muted:rgba(255,255,255,.68);
  --accent:#fff0ae;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0a1015;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;overscroll-behavior:none}
body{position:fixed;inset:0}
button{font:inherit;color:inherit}
#app{position:absolute;inset:0;overflow:hidden;touch-action:none;background:#0b1117;-webkit-user-select:none;user-select:none}
#bg{position:absolute;inset:-8%;background-position:center;background-size:cover;filter:blur(9px) saturate(.72) brightness(.34);transform:scale(1.12);transition:background-image .32s ease}
#bg:after{content:"";position:absolute;inset:0;background:
 radial-gradient(circle at 50% 48%,rgba(18,29,36,.025),rgba(7,11,15,.28) 58%,rgba(3,6,9,.8) 100%),
 linear-gradient(180deg,rgba(7,12,17,.015),rgba(7,12,17,.44))}
#world{position:absolute;inset:0;overflow:hidden;touch-action:none}

.memory{position:absolute;width:132px;height:174px;border-radius:18px;overflow:hidden;background:#26343b;border:1px solid rgba(255,255,255,.16);box-shadow:0 18px 50px rgba(0,0,0,.31);transform-origin:center;will-change:transform,opacity;pointer-events:none}
.memory img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#26343b}
.memoryShade{position:absolute;inset:0;background:linear-gradient(180deg,transparent 36%,rgba(0,0,0,.82) 100%)}
.memoryCopy{position:absolute;left:10px;right:10px;bottom:10px;text-shadow:0 2px 8px rgba(0,0,0,.78)}
.memoryText{font-size:10.6px;line-height:1.16;font-weight:710;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.memoryDate{font-size:8.8px;color:rgba(255,255,255,.7);margin-top:5px}
.memory.nearest{outline:1.5px solid rgba(255,255,255,.9);outline-offset:2px}
.memory.magnetic{box-shadow:0 17px 46px rgba(0,0,0,.42),0 0 0 1px rgba(255,240,174,.12)}

/* Presentation becomes the first point on the same zoom continuum. */
#presentation{position:absolute;z-index:18;inset:0;pointer-events:none;opacity:1;will-change:opacity}
#presentation img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#presentationVeil{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.02) 32%,rgba(0,0,0,.13) 56%,rgba(0,0,0,.82) 100%)}
#presentationCopy{position:absolute;left:22px;right:22px;bottom:calc(91px + var(--safeB));text-shadow:0 2px 11px rgba(0,0,0,.7);will-change:opacity,transform}
#presentationText{font-size:27px;line-height:1.05;font-weight:760;letter-spacing:-.03em}
#presentationDate{font-size:12px;margin-top:10px;color:rgba(255,255,255,.79)}

/* Original Talera timeline language: one continuous ruler with a fixed centre needle. */
#timelineShell{
  position:absolute;z-index:80;left:0;right:0;top:0;
  height:clamp(116px,16dvh,138px);
  padding-top:var(--safeT);
  overflow:hidden;touch-action:none;user-select:none;
  background:linear-gradient(180deg,rgba(255,254,252,.94) 0%,rgba(220,234,246,.70) 100%);
  border-bottom:1px solid rgba(15,39,71,.10);
  backdrop-filter:blur(13px);-webkit-backdrop-filter:blur(13px);
}
#timelineCanvas{position:absolute;left:0;right:0;top:calc(24px + var(--safeT));width:100%;height:calc(100% - 24px - var(--safeT));touch-action:none}
#needle{
  position:absolute;z-index:3;left:50%;top:calc(11px + var(--safeT));bottom:8px;width:2px;
  transform:translateX(-1px);pointer-events:none;
  background:linear-gradient(180deg,rgba(15,39,71,.05),#0F2747 15%,#0F2747 88%,rgba(15,39,71,.05));
}
#needle::before{
  content:"";position:absolute;left:50%;top:0;width:10px;height:10px;border-radius:50%;
  transform:translate(-50%,-50%);background:#E7A98B;
  box-shadow:0 0 0 4px rgba(231,169,139,.18),0 0 0 7px rgba(91,143,185,.07);
}
#focusBlock{
  position:absolute;z-index:5;left:50%;top:calc(16px + var(--safeT));transform:translateX(-50%);
  border-radius:999px;color:#0F2747;background:rgba(255,254,252,.95);
  border:1px solid rgba(91,143,185,.20);white-space:nowrap;pointer-events:none;
  box-shadow:0 5px 18px rgba(15,39,71,.07);
  will-change:font-size,padding,transform,opacity;
}
#focusRange{display:block;font-weight:700;letter-spacing:.005em;line-height:1}
#timelineHint{
  position:absolute;z-index:4;left:50%;bottom:4px;transform:translateX(-50%);
  font-size:8px;color:rgba(15,39,71,.40);pointer-events:none;white-space:nowrap;
}

#hint{position:absolute;z-index:75;left:50%;bottom:calc(72px + var(--safeB));transform:translateX(-50%);width:min(90vw,440px);padding:10px 13px;border-radius:16px;background:rgba(5,10,14,.48);border:1px solid rgba(255,255,255,.13);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);font-size:12px;line-height:1.35;text-align:center;color:rgba(255,255,255,.9);pointer-events:none}
#controls{position:absolute;z-index:78;left:11px;right:11px;bottom:calc(11px + var(--safeB));display:flex;align-items:center;justify-content:space-between;gap:7px}
.group{display:flex;gap:7px}
.btn{border:1px solid rgba(255,255,255,.15);background:rgba(5,10,14,.47);border-radius:999px;padding:9px 11px;font-size:11px;font-weight:720;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
#zoomRead{font-size:10px;color:rgba(255,255,255,.72);min-width:44px;text-align:center}
#toast{position:absolute;z-index:95;left:50%;top:calc(128px + var(--safeT));transform:translateX(-50%);padding:7px 11px;border-radius:999px;background:rgba(4,8,11,.73);font-size:10px;opacity:0;transition:opacity .15s;pointer-events:none;white-space:nowrap}
#toast.on{opacity:1}
#magnetDebug{position:absolute;z-index:2;inset:0;pointer-events:none;opacity:0}
.debug #magnetDebug{opacity:1}
#magnetRing{position:absolute;border:1px dashed rgba(255,244,196,.25);border-radius:24px}

@media(min-width:700px){
  #app{width:430px;height:min(900px,100vh);left:50%;top:50%;right:auto;bottom:auto;transform:translate(-50%,-50%);border-radius:36px;box-shadow:0 35px 100px rgba(0,0,0,.5)}
}
</style>
</head>
<body>
<div id="app">
  <div id="bg"></div>
  <div id="world"><div id="magnetDebug"><div id="magnetRing"></div></div></div>

  <div id="presentation">
    <img id="presentationImg" alt="">
    <div id="presentationVeil"></div>
    <div id="presentationCopy"><div id="presentationText"></div><div id="presentationDate"></div></div>
  </div>

  <div id="timelineShell" aria-label="Talera levenslijn">
    <canvas id="timelineCanvas"></canvas>
    <div id="needle"></div>
    <div id="focusBlock"><span id="focusRange">1972–2026</span></div>
    <div id="timelineHint">sleep door de tijd · knijp voor schaal</div>
  </div>

  <div id="hint">Gebruik de <b>tijdbalk bovenin</b> om gericht door je leven te bewegen, of zoek vrij met je vingers tussen de verhalen.</div>

  <div id="controls">
    <div class="group"><button class="btn" id="storyBtn">Verhaal</button><button class="btn" id="wideBtn">Ruimte</button></div>
    <span id="zoomRead">100%</span>
    <div class="group"><button class="btn" id="minusBtn">−</button><button class="btn" id="plusBtn">+</button><button class="btn" id="fieldBtn">Magneet</button></div>
  </div>
  <div id="toast"></div>
</div>

// 100 deterministic prototype memories. Their distribution is deliberately uneven:
// sparse early years, a very dense band around age 30, and mixed density later.
// This lets us test whether one continuous field can absorb strong local differences.
const EXTRA_MEMORIES=(()=>{
  const specs=[
    [8,3,12],[10,13,20],[12,21,27],[28,29.65,30.35],
    [15,31.6,38],[12,39,45],[10,46,51],[5,52,54]
  ];
  const snippets=[
    "Een gewoon moment dat later toch is blijven hangen.",
    "Even onderweg gestopt en zonder reden een foto gemaakt.",
    "Een middag waarop alles net wat lichter voelde.",
    "Met mensen om me heen waar ik toen veel mee optrok.",
    "Een klein uitstapje dat uiteindelijk een heel verhaal werd.",
    "Thuis, niets bijzonders, en juist daarom herkenbaar.",
    "Een dag buiten waarvan vooral het licht is bijgebleven.",
    "Een onverwacht moment dat ik later graag terugzag.",
    "Samen op pad zonder precies te weten waar we zouden eindigen.",
    "Zo'n beeld dat meteen een hele periode terugbrengt."
  ];
  const out=[];
  let n=0;
  for(const [count,a0,a1] of specs){
    for(let j=0;j<count;j++){
      n++;
      const q=(j+.35+fract(n*2.31)*.30)/count;
      const age=a0+(a1-a0)*q;
      let ms=LIFE_START+age*365.2425*DAY;
      const d=new Date(ms);
      d.setHours(8+Math.floor(fract(n+17)*12),Math.floor(fract(n+43)*60),0,0);
      ms=clamp(d.getTime(),LIFE_START,LIFE_END);
      const id=1000+n;
      out.push({
        id,
        at:new Date(ms).toISOString(),
        story:snippets[(n*7)%snippets.length],
        image:"https://picsum.photos/seed/talera-life-"+String(id)+"/720/960",
        synthetic:true
      });
    }
  }
  return out;
})();
const ALL_MEMORIES=[...MEMORIES,...EXTRA_MEMORIES];



// One continuous chronological field. There are no age boxes or decade boundaries.
// Age determines direction continuously; local story density determines how thick the
// field becomes and how far its local centre shifts outward.
const baseData=ALL_MEMORIES.map((s,i)=>{
  const ms=new Date(s.at).getTime();
  return {...s,i,ms,age:ageFromMs(ms)};
}).sort((a,b)=>a.ms-b.ms);

function densityAtAge(age){
  // Gaussian density prevents a hard 29/30/31 boundary even if age 30 is extremely busy.
  const sigma=1.55;
  let d=0;
  for(const s of baseData){
    const q=(s.age-age)/sigma;
    d+=Math.exp(-.5*q*q);
  }
  return d;
}
const DENSITIES=baseData.map(s=>densityAtAge(s.age));
const DENSITY_MIN=Math.min(...DENSITIES);
const DENSITY_MAX=Math.max(...DENSITIES);
const LIFE_YEARS=Math.max(1,(LIFE_END-LIFE_START)/(365.2425*DAY));

function densityNormAtAge(age){
  const d=densityAtAge(age);
  const raw=(d-DENSITY_MIN)/Math.max(.0001,DENSITY_MAX-DENSITY_MIN);
  return clamp(raw,0,1);
}

// Collection size changes the physical size of the whole life, but sub-linearly.
// 25–50 memories stay intentionally compact; hundreds and thousands get more room.
const COLLECTION_RADIUS=180+96*Math.log1p(baseData.length/25);
const COLLECTION_THICKNESS=34+18*Math.log1p(baseData.length/25);

function fieldAngleAtAge(age){
  const t=clamp(age/LIFE_YEARS,0,1);
  return -2.48+t*Math.PI*1.73;
}
function fieldThicknessAtAge(age){
  return COLLECTION_THICKNESS+178*Math.sqrt(densityNormAtAge(age));
}
function fieldCenterAtAge(age){
  const t=clamp(age/LIFE_YEARS,0,1);
  const angle=fieldAngleAtAge(age);
  const thickness=fieldThicknessAtAge(age);
  // Dense periods shift their navigational centre outward, but the centreline
  // itself is gently warped so chronology never renders as a visible ring/path.
  const radius=COLLECTION_RADIUS+thickness*.34;
  const warpX=(Math.sin(t*Math.PI*3.1+0.55)*58 + Math.sin(t*Math.PI*6.3+1.7)*26);
  const warpY=(Math.sin(t*Math.PI*2.5+2.1)*52 + Math.sin(t*Math.PI*5.4+0.2)*22);
  return {
    x:Math.cos(angle)*radius + warpX,
    y:Math.sin(angle)*radius*.78 + warpY,
    angle,
    radius,
    thickness,
    densityNorm:densityNormAtAge(age)
  };
}

const data=baseData.map((s,i)=>{
  const center=fieldCenterAtAge(s.age);
  const dNorm=center.densityNorm;
  const thickness=center.thickness;

  // Two deterministic layers of scatter make a cloud rather than a ribbon.
  const a1=fract(s.id+19)*Math.PI*2;
  const a2=fract(s.id+71)*Math.PI*2;
  const r1=Math.sqrt(fract(s.id+33))*thickness*.88;
  const r2=Math.sqrt(fract(s.id+121))*thickness*.38;
  const localX=Math.cos(a1)*r1 + Math.cos(a2)*r2;
  const localY=Math.sin(a1)*r1*.84 + Math.sin(a2)*r2*1.08;

  // A small age-dependent drift makes neighbouring dates overlap instead of
  // drawing a clean chronological edge between them.
  const driftX=Math.sin(s.age*.91+1.3)*thickness*.16;
  const driftY=Math.sin(s.age*1.17+2.2)*thickness*.14;
  const x=center.x+localX+driftX;
  const y=center.y+localY+driftY;

  // Sparse regions reveal stories earlier; dense regions progressively unpack.
  const reveal=.20+.58*fract(s.id+91)+.12*dNorm;
  const representative=fract(s.id+211); // stable priority for semantic zoom
  return {...s,x,y,z:.82+fract(s.id+70)*.38,reveal,density:dNorm,thickness,representative};
});

// The fully zoomed-out state is a true whole-life overview, not merely
// the current neighborhood rendered smaller.
const DATA_BOUNDS=data.reduce((b,s)=>({
  minX:Math.min(b.minX,s.x),maxX:Math.max(b.maxX,s.x),

const OVERVIEW_CENTER={

const WORLD_WIDTH=DATA_BOUNDS.maxX-DATA_BOUNDS.minX;
const WORLD_HEIGHT=DATA_BOUNDS.maxY-DATA_BOUNDS.minY;
const CAMERA_MARGIN=460;
function clampCamX(x){return clamp(x,DATA_BOUNDS.minX-CAMERA_MARGIN,DATA_BOUNDS.maxX+CAMERA_MARGIN)}

}
const overviewAnchorAges=[5,17,30,42,54];
const OVERVIEW_ANCHORS=overviewAnchorAges.map(age=>{

const OVERVIEW_ANCHOR_SET=new Set(OVERVIEW_ANCHORS);

let W=1,H=1;
let active=data.length-1;
const cam={x:data[active].x,y:data[active].y,s:SPACE_MAX};
let timeCenter=data[active].ms;
let timelineSpanYears=15;
let timelineUser=false;
let lastMagneticIds=new Set(),magneticIds=new Set();
let renderedCards=[];
let spatialPinchTarget=null;
let spatialPinchStrength=0;

function screenPoint(x,y){return{x:(x-cam.x)*cam.s+W/2,y:(y-cam.y)*cam.s+H/2}}
function worldPoint(x,y){return{x:cam.x+(x-W/2)/cam.s,y:cam.y+(y-H/2)/cam.s}}
function nearestMemoryToWorld(){
  let best=0,bd=Infinity;data.forEach((s,i)=>{const d=Math.hypot(s.x-cam.x,s.y-cam.y);if(d<bd){bd=d;best=i}});return best;
}
function nearestMemoryToTime(ms=timeCenter){
  let lo=0,hi=data.length-1;
  while(lo<hi){const mid=(lo+hi)>>1;if(data[mid].ms<ms)lo=mid+1;else hi=mid}
  if(lo>0&&Math.abs(data[lo-1].ms-ms)<Math.abs(data[lo].ms-ms))return lo-1;

function setBg(i){const u=data[i].image;bg.style.backgroundImage="url('"+u+"')";presentationImg.src=u}
function toastMsg(t){toast.textContent=t;toast.classList.add("on");clearTimeout(toastMsg.t);toastMsg.t=setTimeout(()=>toast.classList.remove("on"),900)}
function presentationAlpha(){return smooth(1.16,1.92,cam.s)}
function overviewBlendForScale(s=cam.s){return 1-smooth(.22,.50,s)}
function spanYearsForScale(s=cam.s){
  const t=clamp((s-SPACE_MIN)/(SPACE_MAX-SPACE_MIN),0,1);
  const shaped=t*t*(3-2*t);
  return Math.exp(lerp(Math.log(54),Math.log(1/365.2425),shaped));
}
function scaleForSpanYears(years){
  const target=Math.log(clamp(years,1/365.2425,54));
  const lo=Math.log(54),hi=Math.log(1/365.2425);
  const shaped=clamp((target-lo)/(hi-lo),0,1);

  let a=0,b=1;
  for(let i=0;i<18;i++){const m=(a+b)/2,v=m*m*(3-2*m);if(v<shaped)a=m;else b=m}

}
function syncSpanFromSpace(){
  timelineSpanYears=spanYearsForScale(cam.s);

}
function syncSpaceScaleFromSpan(){
  cam.s=scaleForSpanYears(timelineSpanYears);
}
function timelineSpanMs(){return timelineSpanYears*365.2425*DAY}
function clampTime(ms){return clamp(ms,LIFE_START,LIFE_END)}
function setCam(x,y,s){
  cam.x=clampCamX(x);cam.y=clampCamY(y);cam.s=clamp(s,SPACE_MIN,SPACE_MAX);

function zoomAround(px,py,newScale){const wp=worldPoint(px,py),ns=clamp(newScale,SPACE_MIN,SPACE_MAX);setCam(wp.x-(px-W/2)/ns,wp.y-(py-H/2)/ns,ns)}

function wide(){
  cam.x=OVERVIEW_CENTER.x;cam.y=OVERVIEW_CENTER.y;cam.s=SPACE_MIN;
  syncSpanFromSpace();
  hint.style.display="none";toastMsg("Hele leven");render();
}
function ageNearestFieldPoint(x,y){
  let bestAge=0,bestD=Infinity;
  // Coarse search over the continuous chronological backbone.
  for(let age=0;age<=LIFE_YEARS;age+=.35){
    const p=fieldCenterAtAge(age);
    const dx=p.x-x,dy=p.y-y,d=dx*dx+dy*dy;
    if(d<bestD){bestD=d;bestAge=age}
  }
  // Refine locally so the date moves continuously even through a huge density bulge.
  let lo=Math.max(0,bestAge-.55),hi=Math.min(LIFE_YEARS,bestAge+.55);
  for(let k=0;k<11;k++){
    const a=lo+(hi-lo)/3,b=hi-(hi-lo)/3;
    const pa=fieldCenterAtAge(a),pb=fieldCenterAtAge(b);
    const da=(pa.x-x)*(pa.x-x)+(pa.y-y)*(pa.y-y);
    const db=(pb.x-x)*(pb.x-x)+(pb.y-y)*(pb.y-y);
    if(da<db)hi=b;else lo=a;
  }

function syncTimeFromSpace(){
  const age=ageNearestFieldPoint(cam.x,cam.y);

}
function worldCenterForTime(ms){
  const targetAge=ageFromMs(ms);
  const spine=fieldCenterAtAge(targetAge);
  const sigmaYears=clamp(timelineSpanYears*.13,.32,2.8);
  let x=0,y=0,den=0;
  for(const s of data){
    const q=(s.age-targetAge)/sigmaYears;
    if(Math.abs(q)>4)continue;
    const w=Math.exp(-.5*q*q);
    x+=s.x*w;y+=s.y*w;den+=w;
  }
  if(den<=.0001)return{x:spine.x,y:spine.y};
  const contentX=x/den,contentY=y/den;
  // Content may gently shift the centre, but can never overpower chronology.
  const pull=.16+.22*spine.densityNorm;
  return{x:lerp(spine.x,contentX,pull),y:lerp(spine.y,contentY,pull)};

function driveSpaceFromTime(ms,instant=false){
  timeCenter=clampTime(ms);

  else {cam.x=lerp(cam.x,p.x,.34);cam.y=lerp(cam.y,p.y,.34)}

  if(cam.s>1.28) cam.s=lerp(cam.s,1.08,.28);

/* ------------------- ACTIVE TIMELINE ------------------- */
let timelineTouches=new Map();
let tlDrag=null,tlPinch=null;
let tlVelocity=0,tlLastX=0,tlLastT=0;
let spanTarget=timelineSpanYears;

function timelineLocalX(clientX){const r=timelineShell.getBoundingClientRect();return clientX-r.left}
function chooseSpanForVelocity(v){
  // Completely continuous: calm movement narrows the ruler, fast movement widens it.
  // 0 px/ms ~= 3 years; >= 1.0 px/ms ~= almost whole life.
  const t=clamp(v/1.0,0,1);
  const curved=t*t*(3-2*t);
  return 3 + curved*48;
}
function reanchorTimeline(x){
  tlDrag={x,center:timeCenter,span:timelineSpanYears};
}
function updateTimelineSpanToward(target,dt){
  spanTarget=clamp(target,1/365.2425,54);
  const a=1-Math.exp(-dt/180);
  timelineSpanYears=lerp(timelineSpanYears,spanTarget,a);
  syncSpaceScaleFromSpan();
  timeCenter=clampTime(timeCenter);
}
function timelinePointerDown(e){
  e.preventDefault();e.stopPropagation();
  timelineShell.setPointerCapture&&timelineShell.setPointerCapture(e.pointerId);
  timelineTouches.set(e.pointerId,{x:e.clientX,y:e.clientY});
  timelineUser=true;hint.style.display="none";
  if(timelineTouches.size===1){
    const x=timelineLocalX(e.clientX);reanchorTimeline(x);tlLastX=x;tlLastT=performance.now();tlVelocity=0;spanTarget=timelineSpanYears;
  }else if(timelineTouches.size===2){
    const p=[...timelineTouches.values()],r=timelineShell.getBoundingClientRect();
    const d=Math.max(20,Math.hypot(p[1].x-p[0].x,p[1].y-p[0].y)),mid=(p[0].x+p[1].x)/2-r.left;
    tlPinch={d,span:timelineSpanYears,center:timeCenter,mid};
  }
}
function timelinePointerMove(e){
  if(!timelineTouches.has(e.pointerId))return;
  e.preventDefault();e.stopPropagation();
  timelineTouches.set(e.pointerId,{x:e.clientX,y:e.clientY});
  const r=timelineShell.getBoundingClientRect();
  if(timelineTouches.size===1&&tlDrag){
    const x=timelineLocalX(e.clientX),now=performance.now(),dxSeg=x-tlLastX,dt=clamp(now-tlLastT,8,60);
    const inst=Math.abs(dxSeg)/dt,a=1-Math.exp(-dt/(inst>tlVelocity?75:300));
    tlVelocity=tlVelocity?lerp(tlVelocity,inst,a):inst;
    const desired=chooseSpanForVelocity(tlVelocity);
    updateTimelineSpanToward(desired,dt);
    // The time itself keeps following the finger every frame. The only thing
    // that changes with speed is how much time one pixel represents.
    const ms=timeCenter-(dxSeg/r.width)*(timelineSpanYears*365.2425*DAY);
    driveSpaceFromTime(ms,false);
    tlLastX=x;tlLastT=now;
  } else if(timelineTouches.size===2&&tlPinch){
    const p=[...timelineTouches.values()];
    const d=Math.max(20,Math.hypot(p[1].x-p[0].x,p[1].y-p[0].y));
    const mid=(p[0].x+p[1].x)/2-r.left;
    const ratio=d/tlPinch.d;
    const oldSpan=tlPinch.span,newSpan=clamp(oldSpan/ratio,1/365.2425,54);
    const oldRel=tlPinch.mid/r.width-.5;
    const anchor=tlPinch.center+oldRel*oldSpan*365.2425*DAY;
    const newRel=mid/r.width-.5;
    timelineSpanYears=newSpan;spanTarget=newSpan;
    syncSpaceScaleFromSpan();
    timeCenter=clampTime(anchor-newRel*newSpan*365.2425*DAY);
    driveSpaceFromTime(timeCenter,false);
  }
}
function timelinePointerEnd(e){
  if(timelineTouches.has(e.pointerId))timelineTouches.delete(e.pointerId);
  e.preventDefault();e.stopPropagation();
  if(timelineTouches.size===0){
    timelineUser=false;tlDrag=null;tlPinch=null;tlVelocity=0;
    // settle camera exactly at the selected time without snapping the time itself
    const p=worldCenterForTime(timeCenter);cam.x=lerp(cam.x,p.x,.55);cam.y=lerp(cam.y,p.y,.55);render();
  }else if(timelineTouches.size===1){
    const p=[...timelineTouches.values()][0],x=timelineLocalX(p.x);reanchorTimeline(x);tlLastX=x;tlLastT=performance.now();tlVelocity=0;
  }
}
timelineShell.addEventListener("pointerdown",timelinePointerDown,{passive:false});
timelineShell.addEventListener("pointermove",timelinePointerMove,{passive:false});
timelineShell.addEventListener("pointerup",timelinePointerEnd,{passive:false});

function chooseTickStep(spanYears){
  if(spanYears>35)return{years:10,minor:5};
  if(spanYears>16)return{years:5,minor:1};
  if(spanYears>7)return{years:2,minor:1};
  if(spanYears>3)return{years:1,minor:.25};
  if(spanYears>1.3)return{months:3,minorMonths:1};
  return{months:1,minorDays:14};
}
function visibleTimeBounds(){
  const overview=overviewBlendForScale();
  if(overview>.72)return[LIFE_START,LIFE_END];
  const half=timelineSpanMs()/2;
  return[clamp(timeCenter-half,LIFE_START,LIFE_END),clamp(timeCenter+half,LIFE_START,LIFE_END)];
}
function formatFocusRange(){
  const [start,end]=visibleTimeBounds();
  const spanDays=Math.max(1,(end-start)/DAY);
  const a=new Date(start),b=new Date(end);
  if(overviewBlendForScale()>.72)return BIRTH_YEAR+"–"+END_YEAR;
  if(spanDays>365*7)return a.getFullYear()+"–"+b.getFullYear();
  if(spanDays>365*1.6){
    if(a.getFullYear()===b.getFullYear())return String(a.getFullYear());
    return a.getFullYear()+"–"+b.getFullYear();
  }
  if(spanDays>120){
    const ma=a.toLocaleDateString("nl-NL",{month:"short"});
    const mb=b.toLocaleDateString("nl-NL",{month:"short",year:"numeric"});
    return ma+" – "+mb;
  }
  if(spanDays>10){
    const sameMonth=a.getMonth()===b.getMonth()&&a.getFullYear()===b.getFullYear();
    if(sameMonth)return a.getDate()+"–"+b.getDate()+" "+b.toLocaleDateString("nl-NL",{month:"long",year:"numeric"});
    return a.toLocaleDateString("nl-NL",{day:"numeric",month:"short"})+" – "+b.toLocaleDateString("nl-NL",{day:"numeric",month:"short",year:"numeric"});
  }
  return new Date(timeCenter).toLocaleDateString("nl-NL",{day:"numeric",month:"long",year:"numeric"});
}

}

function drawTimeline(){
  const r=canvas.getBoundingClientRect(),dpr=Math.min(devicePixelRatio||1,2.5),w=r.width,h=r.height;
  if(!w||!h)return;
  canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,w,h);
  const overview=overviewBlendForScale();

  ctx.strokeStyle="rgba(91,143,185,.44)";ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(0,axisY+.5);ctx.lineTo(w,axisY+.5);ctx.stroke();

    if(s.ms<start||s.ms>end)return;
    const x=(s.ms-start)/(end-start)*w;
    ctx.strokeStyle="rgba(91,143,185,.52)";ctx.lineWidth=1.5;
    ctx.beginPath();ctx.moveTo(x,axisY-2);ctx.lineTo(x,axisY-10);ctx.stroke();
    ctx.fillStyle="rgba(91,143,185,.82)";ctx.beginPath();ctx.arc(x,axisY-11,1.8,0,Math.PI*2);ctx.fill();
  });

  const cfg=chooseTickStep(timelineSpanYears);
  const drawTick=(ms,major,label)=>{
    if(ms<start||ms>end)return;
    const x=(ms-start)/(end-start)*w;
    ctx.strokeStyle=major?"rgba(15,39,71,.62)":"rgba(62,74,89,.24)";
    ctx.lineWidth=major?1.25:1;ctx.beginPath();ctx.moveTo(x,axisY-(major?8:4));ctx.lineTo(x,axisY+(major?8:4));ctx.stroke();
    if(major&&label){ctx.fillStyle="rgba(15,39,71,.86)";ctx.font="10px -apple-system,sans-serif";ctx.textAlign="center";ctx.fillText(label,x,axisY+22)}
  };

  if(cfg.years){
    const sy=new Date(start).getFullYear()-1,ey=new Date(end).getFullYear()+1;
    for(let y=sy;y<=ey;y++){
      const ms=new Date(y,0,1).getTime(),major=y%cfg.years===0;
      if(major||cfg.minor===1)drawTick(ms,major,major?String(y):"");
    }
  } else {
    let d=new Date(start);d=new Date(d.getFullYear(),d.getMonth(),1);
    for(let guard=0;guard<120;guard++){
      const ms=d.getTime();if(ms>end)break;
      const major=cfg.months?d.getMonth()%cfg.months===0:true;
      drawTick(ms,major,major?d.toLocaleDateString("nl-NL",{month:"short",year:timelineSpanYears<1.3?"2-digit":undefined}):"");
      d=new Date(d.getFullYear(),d.getMonth()+1,1);
    }
  }
}

/* ------------------- MAGNETIC SPACE ------------------- */
function visibleBudgetForScale(){
  // The timeline window is the primary information filter.
  // Even with thousands of memories, the viewport remains deliberately calm.
  const years=Math.max(1/365.2425,timelineSpanYears);
  if(years>=20)return 7;
  if(years>=8)return 8;
  if(years>=4)return 9;
  if(years>=1.5)return 10;
  if(years>=.35)return 11;
  return 12;
}
function chooseVisibleRepresentatives(raw,alpha){
  if(alpha>.92)return new Set([active]);

  const budget=visibleBudgetForScale();
  const overview=overviewBlendForScale();
  const halfWindow=Math.max(timelineSpanMs()/2,DAY*.5);
  const softWindow=halfWindow*1.35;
  const candidates=[];

  data.forEach((s,i)=>{
    const r=raw[i];
    const dt=Math.abs(s.ms-timeCenter);
    // Primary rule: what is visible belongs to the time window the user is
    // currently looking through. A soft fringe prevents hard pop-in at edges.
    if(dt>softWindow && !OVERVIEW_ANCHOR_SET.has(i) && spatialPinchTarget!==i)return;

    const nearScreen=r.x>-150&&r.x<W+150&&r.y>105&&r.y<H+145;
    if(!nearScreen&&overview<.62&&spatialPinchTarget!==i)return;

    const temporal=Math.exp(-.5*Math.pow(dt/Math.max(halfWindow*.62,DAY*.35),2));
    const worldD=Math.hypot(s.x-cam.x,s.y-cam.y);
    const screenD=Math.hypot(r.x-W/2,r.y-H/2);
    const spatial=1-clamp(worldD/1050,0,1);
    const centre=1-clamp(screenD/(Math.max(W,H)*.86),0,1);
    const edgeFade=dt<=halfWindow?1:1-clamp((dt-halfWindow)/(softWindow-halfWindow),0,1);

    const overviewAnchor=OVERVIEW_ANCHOR_SET.has(i)?2.0*overview:0;
    const targetBoost=spatialPinchTarget===i?3.2:0;
    const activeBoost=i===active?2.0:0;
    const stable=.18*(1-s.representative);
    const score=(temporal*.72+spatial*.48+centre*.24+stable+overviewAnchor+targetBoost+activeBoost)*(.72+.28*edgeFade);
    candidates.push({i,score,x:r.x,y:r.y,dt});
  });
  candidates.sort((a,b)=>b.score-a.score||a.i-b.i);

  const chosen=new Set();
  if(overview>.58){
    // Whole-life view: a few broad anchors only.
    for(const i of OVERVIEW_ANCHORS){
      if(chosen.size>=Math.min(5,budget))break;
      chosen.add(i);
    }
  }
  if(spatialPinchTarget!=null)chosen.add(spatialPinchTarget);
  chosen.add(active);

  // Spread representatives over the screen. We select from spatial sectors,
  // rather than filling the budget with several almost-identical positions.
  const sectorCols=3,sectorRows=3;
  const sectorUse=new Map();
  const placed=[];
  for(const i of chosen){
    const r=raw[i];
    if(r)placed.push({x:r.x,y:r.y});
  }

  const z=clamp((cam.s-SPACE_MIN)/(SPACE_MAX-SPACE_MIN),0,1);
  const minGap=lerp(128,76,z);

  function sectorKey(x,y){
    const col=clamp(Math.floor(x/Math.max(1,W)*sectorCols),0,sectorCols-1);
    const row=clamp(Math.floor((y-115)/Math.max(1,H-190)*sectorRows),0,sectorRows-1);
    return row*sectorCols+col;
  }
  for(const i of chosen){
    const r=raw[i];if(!r)continue;
    const key=sectorKey(r.x,r.y);
    sectorUse.set(key,(sectorUse.get(key)||0)+1);
  }

  // First pass: favour empty/quiet screen regions and sufficient spacing.
  for(const cand of candidates){
    if(chosen.size>=budget)break;
    if(chosen.has(cand.i))continue;

    let nearest=Infinity;
    for(const p of placed)nearest=Math.min(nearest,Math.hypot(cand.x-p.x,cand.y-p.y));
    const key=sectorKey(cand.x,cand.y);
    const used=sectorUse.get(key)||0;
    const densityAllowance=1-data[cand.i].density*.12;

    if(nearest<minGap*densityAllowance)continue;
    if(used>=2)continue;

    chosen.add(cand.i);
    placed.push({x:cand.x,y:cand.y});
    sectorUse.set(key,used+1);
  }

  // Second pass is deliberately conservative: only add well-spaced cards.
  // We do NOT force the viewport to reach its maximum count.
  for(const cand of candidates){
    if(chosen.size>=budget)break;
    if(chosen.has(cand.i))continue;
    let nearest=Infinity;
    for(const p of placed)nearest=Math.min(nearest,Math.hypot(cand.x-p.x,cand.y-p.y));
    if(nearest<minGap*.72)continue;
    chosen.add(cand.i);
    placed.push({x:cand.x,y:cand.y});
  }

  return chosen;
}

function chooseMagneticSet(raw,alpha){
  const overview=overviewBlendForScale();
  if(overview>.52){
    magneticIds=new Set();
    lastMagneticIds=new Set();
    return;
  }
  if(alpha>.94){magneticIds=new Set([active]);return}
  const natural=[],ranked=[];
  raw.forEach((p,i)=>{
    const inside=p.x>62&&p.x<W-62&&p.y>145&&p.y<H-125&&p.opacity>.07;
    if(inside)natural.push(i);
    const spatial=Math.hypot(data[i].x-cam.x,data[i].y-cam.y)/900;
    ranked.push({i,score:spatial});
  });
  ranked.sort((a,b)=>a.score-b.score||a.i-b.i);
  const minVisible=3,maxGuide=5,chosen=new Set(natural.slice(0,4));
  for(const id of lastMagneticIds){if(chosen.size>=minVisible)break;const rank=ranked.findIndex(r=>r.i===id);if(rank>=0&&rank<maxGuide+4)chosen.add(id)}
  for(const r of ranked){if(chosen.size>=minVisible)break;chosen.add(r.i)}
  magneticIds=chosen;lastMagneticIds=new Set(chosen);
}
function pullToViewport(p){
  const xMin=62,xMax=W-62,yMin=148,yMax=H-128;
  let x=p.x,y=p.y,magnetic=false;
  if(x<xMin||x>xMax||y<yMin||y>yMax){
    magnetic=true;const dx=p.x-W/2,dy=p.y-H/2;
    const tx=dx===0?9999:(dx>0?(xMax-W/2)/dx:(xMin-W/2)/dx);
    const ty=dy===0?9999:(dy>0?(yMax-H/2)/dy:(yMin-H/2)/dy);
    const t=clamp(Math.min(Math.abs(tx),Math.abs(ty)),0,1);
    x=W/2+dx*t;y=H/2+dy*t;
  }
  return{x,y,magnetic};
}
function render(){
  active=spatialPinchTarget!=null ? spatialPinchTarget : nearestMemoryToTime(timeCenter);
  const alpha=presentationAlpha(),overview=overviewBlendForScale(),near=data[active];
  presentation.style.opacity=alpha.toFixed(3);
  presentationText.textContent=near.story;presentationDate.textContent=fullDate(near);
  presentationCopy.style.opacity=String(clamp((alpha-.10)/.9,0,1));
  presentationCopy.style.transform="translateY("+((1-alpha)*18)+"px)";
  if(alpha>.48)setBg(active);
  else if(overview<.65){
    const idx=nearestMemoryToWorld();setBg(idx);
  }

  updateFocusBlock();
  zoomRead.textContent=Math.round(cam.s/SPACE_MAX*100)+"%";

  const raw=data.map((s,i)=>{
    const q=screenPoint(s.x,s.y);
    const worldDist=Math.hypot(s.x-cam.x,s.y-cam.y);
    const localRadius=Math.max(430,COLLECTION_RADIUS*2.15);
    const local=1-clamp(worldDist/localRadius,0,1);
    let reveal=smooth(s.reveal-.20-local*.20,s.reveal+.16-local*.20,cam.s);
    if(OVERVIEW_ANCHOR_SET.has(i)) reveal=Math.max(reveal,overview);
    // Fixed-world behaviour: photos do not disappear merely because the
    // timeline centre changes. They enter/leave because the camera moves.
    const spatialPresence=.22+.78*local;
    return{x:q.x,y:q.y,temporal:1,reveal,opacity:reveal*spatialPresence};
  });
  const visibleSet=chooseVisibleRepresentatives(raw,alpha);
  chooseMagneticSet(raw,alpha);

  const relevance=data.map((s,i)=>({
    i,
    score:
      (visibleSet.has(i)?1.5:0)+
      (1-clamp(Math.hypot(s.x-cam.x,s.y-cam.y)/900,0,1))+
      Math.exp(-.5*Math.pow(Math.abs(s.ms-timeCenter)/Math.max(timelineSpanMs()*.42,DAY),2))*.65
  })).filter(r=>visibleSet.has(r.i)).sort((a,b)=>b.score-a.score);

  const hero1=overview>.62
    ? OVERVIEW_ANCHORS.find(i=>visibleSet.has(i))
    : (spatialPinchTarget!=null ? spatialPinchTarget : relevance[0]?.i);
  const hero2=relevance.find(r=>r.i!==hero1)?.i;
  const visualRank=new Map(relevance.map((r,rank)=>[r.i,rank]));
  renderedCards=[];

  data.forEach((s,i)=>{
    const selected=visibleSet.has(i);
    const mag=magneticIds.has(i)&&alpha<.96&&overview<.52;
    const r=raw[i],placed=mag?pullToViewport(r):{x:r.x,y:r.y,magnetic:false};
    const onscreen=placed.x>-220&&placed.x<W+220&&placed.y>-260&&placed.y<H+260;
    const rank=visualRank.has(i)?visualRank.get(i):99;
    const isHero=i===hero1;
    const isSecond=i===hero2;
    const isFront=selected&&(isHero||isSecond||rank===2);
    const isMiddle=selected&&rank>=3&&rank<=6;

    let opacity=0;
    if(selected){
      // Front photographs are genuinely readable, not translucent ghosts.
      if(isHero)opacity=.99;
      else if(isSecond)opacity=.94;
      else if(rank===2)opacity=.90;
      else if(isMiddle)opacity=.78;
      else opacity=.62;

      // Presentation overlay itself may still fade the spatial layer.
      opacity*=1-alpha*.93;
    }
    if(mag&&!selected)opacity=Math.max(opacity,.18*(1-alpha));
    if(!onscreen&&!mag)opacity=0;
    if(i===active)opacity=Math.max(opacity,(1-alpha)*.94);
    if(selected&&OVERVIEW_ANCHOR_SET.has(i))opacity=Math.max(opacity,overview*.94);

    // Deliberate size variation gives the field rhythm and direction.
    const baseZoom=lerp(.78,1.04,clamp((cam.s-SPACE_MIN)/(SPACE_MAX-SPACE_MIN),0,1));
    let scale;
    if(isHero)scale=1.28;
    else if(isSecond)scale=1.08;
    else if(rank===2)scale=.98;
    else if(isMiddle)scale=.82+.05*fract(s.id+501);
    else scale=.66+.08*fract(s.id+601);
    scale*=baseZoom;

    if(spatialPinchTarget===i)scale*=1+.18*smooth(.08,.92,spatialPinchStrength);
    if(placed.magnetic)scale*=.94;
    if(overview>.62&&OVERVIEW_ANCHOR_SET.has(i))scale=Math.max(scale,.98+.14*fract(s.id+702));
    scale=clamp(scale,.48,1.50);

    if(selected&&(opacity>.025||OVERVIEW_ANCHOR_SET.has(i)||i===active))ensureCardImage(i);
    const el=nodes[i];
    el.style.opacity=opacity.toFixed(3);el.style.pointerEvents=opacity>.22?"auto":"none";
    const layerZ=isHero?920:isSecond?840:rank===2?780:isMiddle?620-rank*6:430-rank;
    el.style.zIndex=String(layerZ+(placed.magnetic?8:0));
    el.style.transform="translate3d("+(placed.x-66)+"px,"+(placed.y-87)+"px,0) scale("+scale+")";
    el.classList.toggle("nearest",i===active&&alpha<.6);el.classList.toggle("magnetic",placed.magnetic);
    renderedCards[i]={x:placed.x,y:placed.y,opacity,magnetic:placed.magnetic,selected};
  });

  magnetRing.style.left="16px";magnetRing.style.right="16px";magnetRing.style.top="140px";magnetRing.style.bottom="92px";
  drawTimeline();

  hint.innerHTML=timelineUser
    ? '<b>De tijdbalk stuurt nu de ruimte.</b> Rustig slepen verfijnt de tijd; sneller bewegen vergroot automatisch je zoekbereik.'
    : alpha>.82
      ? 'Knijp uit het verhaal of <b>pak de tijdbalk bovenin</b> om direct naar een andere periode te reizen.'
      : '<b>Één doorlopend leven:</b> rustige periodes blijven compact; drukke periodes waaieren vloeiend breder uit.';
}
function resize(){
  const r=app.getBoundingClientRect();W=Math.max(1,r.width);H=Math.max(1,r.height);
  const oldMin=SPACE_MIN;
  SPACE_MIN=fitOverviewScale();
  if(cam.s<=oldMin+.015)cam.s=SPACE_MIN;
  else cam.s=Math.max(cam.s,SPACE_MIN);
  const cr=canvas.getBoundingClientRect(),dpr=Math.min(devicePixelRatio||1,2.5);
  canvas.width=Math.max(1,Math.round(cr.width*dpr));canvas.height=Math.max(1,Math.round(cr.height*dpr));
  syncSpanFromSpace();
  render();
}
window.addEventListener("resize",resize,{passive:true});
window.visualViewport&&visualViewport.addEventListener("resize",resize,{passive:true});

/* ------------------- SPACE TOUCH ------------------- */
let touch=null;
function localTouch(t){const r=app.getBoundingClientRect();return{x:t.clientX-r.left,y:t.clientY-r.top}}
function dist(a,b){return Math.hypot(b.x-a.x,b.y-a.y)}
function mid(a,b){return{x:(a.x+b.x)/2,y:(a.y+b.y)/2}}
function storyAtScreenPoint(p){
  let best=null,bd=Infinity;
  renderedCards.forEach((r,i)=>{
    if(!r||r.opacity<.13)return;
    const d=Math.hypot(r.x-p.x,r.y-p.y);
    if(d<bd){bd=d;best=i}
  });
  const radius=overviewBlendForScale()>.45?185:125;
  return bd<=radius?best:null;
}
app.addEventListener("touchstart",e=>{
  if(e.target.closest("button,#timelineShell"))return;
  e.preventDefault();hint.style.display="none";
  if(e.touches.length===1){const p=localTouch(e.touches[0]);touch={kind:"one",start:p,last:p,cx:cam.x,cy:cam.y,s:cam.s,active}}
  else if(e.touches.length>=2){
    const a=localTouch(e.touches[0]),b=localTouch(e.touches[1]),m=mid(a,b);
    const target=storyAtScreenPoint(m);
    spatialPinchTarget=target;
    spatialPinchStrength=0;
    const free=worldPoint(m.x,m.y);
    if(target!=null){
      const s=data[target];
      touch={kind:"pinch",d:Math.max(10,dist(a,b)),s:cam.s,target,wx:s.x,wy:s.y,freeWx:free.x,freeWy:free.y};
    }else{
      touch={kind:"pinch",d:Math.max(10,dist(a,b)),s:cam.s,target:null,wx:free.x,wy:free.y,freeWx:free.x,freeWy:free.y};
    }
  }
},{passive:false});
app.addEventListener("touchmove",e=>{
  if(!touch)return;e.preventDefault();
  if(e.touches.length>=2){
    const a=localTouch(e.touches[0]),b=localTouch(e.touches[1]),m=mid(a,b);
    if(touch.kind!=="pinch"){
      const target=storyAtScreenPoint(m);
      spatialPinchTarget=target;
      spatialPinchStrength=0;
      const free=worldPoint(m.x,m.y);
      if(target!=null){
        const s=data[target];
        touch={kind:"pinch",d:Math.max(10,dist(a,b)),s:cam.s,target,wx:s.x,wy:s.y,freeWx:free.x,freeWy:free.y};
      }else{
        touch={kind:"pinch",d:Math.max(10,dist(a,b)),s:cam.s,target:null,wx:free.x,wy:free.y,freeWx:free.x,freeWy:free.y};
      }
    }
    const rawRatio=dist(a,b)/touch.d;
    // Damped pinch response: spreading fingers still zooms toward the same place,
    // but requires a larger gesture for the same scale change.
    const gentleRatio=Math.pow(rawRatio,.54);
    const ns=clamp(touch.s*gentleRatio,SPACE_MIN,SPACE_MAX);
    spatialPinchStrength=clamp(Math.abs(Math.log(Math.max(.001,gentleRatio)))*1.45,0,1);
    const zoomingIn=rawRatio>=1;
    if(touch.target!=null&&zoomingIn){
      const target=data[touch.target];
      // Zooming IN honours the exact story under the fingers.
      const nextS=ns;
      cam.x=target.x-(m.x-W/2)/nextS;
      cam.y=target.y-(m.y-H/2)/nextS;
      cam.s=nextS;
      syncSpanFromSpace();
      timeCenter=lerp(timeCenter,target.ms,.10);
    }else{
      spatialPinchTarget=null;
      const fx=touch.freeWx??touch.wx,fy=touch.freeWy??touch.wy;
      const zoomingOut=rawRatio<1;
      if(!zoomingOut){
        // Map contract: whatever world point sits between the fingers stays
        // there. Direction is therefore felt from the first millimetre.
        cam.s=ns;
        cam.x=fx-(m.x-W/2)/cam.s;
        cam.y=fy-(m.y-H/2)/cam.s;
        syncSpanFromSpace();
        syncTimeFromSpace();
      }else{
        // Only zooming OUT may gently return to the whole-life framing.
        const localX=fx-(m.x-W/2)/ns;
        const localY=fy-(m.y-H/2)/ns;
        const ov=overviewBlendForScale(ns);
        cam.s=ns;
        cam.x=lerp(localX,OVERVIEW_CENTER.x,ov*.72);
        cam.y=lerp(localY,OVERVIEW_CENTER.y,ov*.72);
        syncSpanFromSpace();
        if(ov<.72)syncTimeFromSpace();
      }
    }
    render();
  }else if(e.touches.length===1&&touch.kind==="one"){
    const p=localTouch(e.touches[0]);
    if(cam.s<SWIPE_SPACE){
      const dx=p.x-touch.last.x,dy=p.y-touch.last.y;
      cam.x=clampCamX(cam.x-dx/cam.s);
      cam.y=clampCamY(cam.y-dy/cam.s);
      syncSpanFromSpace();
      syncTimeFromSpace();
      render();
    }
    touch.last=p;
  }
},{passive:false});
app.addEventListener("touchend",e=>{
  if(!touch)return;e.preventDefault();
  if(e.touches.length===0&&touch.kind==="one"&&touch.s>=SWIPE_SPACE){
    const p=touch.last||touch.start,dx=p.x-touch.start.x,dy=p.y-touch.start.y;
    if(Math.abs(dx)>42&&Math.abs(dx)>Math.abs(dy)*1.2)focusStory(touch.active+(dx<0?1:-1));
  }
  if(e.touches.length===0&&touch.kind==="pinch"&&touch.target!=null&&cam.s>touch.s){
    const target=data[touch.target];
    const commit=smooth(.28,.88,spatialPinchStrength);
    timeCenter=lerp(timeCenter,target.ms,.18+.42*commit);
    if(commit>.56) active=touch.target;
  }
  touch=null;
  spatialPinchTarget=null;
  spatialPinchStrength=0;
  render();
},{passive:false});
app.addEventListener("touchcancel",()=>{touch=null;spatialPinchTarget=null;spatialPinchStrength=0;render()},{passive:false});

document.getElementById("storyBtn").onclick=()=>focusStory(nearestMemoryToTime(timeCenter));
document.getElementById("wideBtn").onclick=wide;
document.getElementById("minusBtn").onclick=()=>zoomAround(W/2,H/2,cam.s*.82);
document.getElementById("plusBtn").onclick=()=>zoomAround(W/2,H/2,cam.s*1.22);
document.getElementById("fieldBtn").onclick=()=>app.classList.toggle("debug");

OVERVIEW_ANCHORS.forEach(ensureCardImage);
for(let i=Math.max(0,active-5);i<=Math.min(data.length-1,active+5);i++)ensureCardImage(i);
syncSpanFromSpace();resize();setBg(active);render();
})();
</script>
