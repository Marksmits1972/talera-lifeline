<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0d141a">
<title>Talera — Life Globe / Photo Galaxy</title>
<style>
:root{
  --safeT:env(safe-area-inset-top,0px);
  --safeB:env(safe-area-inset-bottom,0px);
  --glass:rgba(8,14,19,.46);
  --border:rgba(255,255,255,.15);
  --muted:rgba(255,255,255,.68);
  --accent:#fff0ae;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0a1015;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;overscroll-behavior:none}
body{position:fixed;inset:0}
button{font:inherit;color:inherit}
#app{position:absolute;inset:0;overflow:hidden;touch-action:none;background:#0b1117;-webkit-user-select:none;user-select:none}
#bg{
  position:absolute;z-index:0;inset:0;
  background:radial-gradient(circle at 52% 40%,#224457 0%,#153648 42%,#0c2432 72%,#071720 100%);
}
#spaceCanvas{position:absolute;z-index:1;inset:0;width:100%;height:100%;pointer-events:none}
#world{position:absolute;z-index:2;inset:0;overflow:hidden;touch-action:none;isolation:isolate}

#farEchoLayer{position:absolute;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.farMemoryEcho{position:absolute;width:46px;height:34px;border-radius:5px;overflow:hidden;background:#1b2d38;border:1px solid rgba(255,255,255,.17);box-shadow:0 3px 12px rgba(0,0,0,.12),0 0 12px rgba(129,184,213,.06);will-change:transform,opacity;opacity:0;transform-origin:center}
.farMemoryEcho img{width:100%;height:100%;object-fit:cover;filter:saturate(1.18) brightness(1.06) contrast(1.10)}
.farMemoryEcho:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.012),rgba(0,0,0,.018))}

#echoLayer{position:absolute;inset:0;z-index:1;pointer-events:none;overflow:hidden}
.memoryEcho{position:absolute;width:62px;height:46px;border-radius:7px;overflow:hidden;background:#20313b;border:1px solid rgba(255,255,255,.24);box-shadow:0 5px 18px rgba(0,0,0,.16),0 0 16px rgba(129,184,213,.07);will-change:transform,opacity;opacity:0;transform-origin:center}
.memoryEcho img{width:100%;height:100%;object-fit:cover;filter:blur(.005px) saturate(1.20) brightness(1.10) contrast(1.14)}
.memoryEcho:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.012),rgba(0,0,0,.015))}

.memory{position:absolute;z-index:3;width:132px;height:174px;border-radius:18px;overflow:hidden;background:#26343b;border:1px solid rgba(255,255,255,.18);box-shadow:0 18px 50px rgba(0,0,0,.38);transform-origin:center;will-change:transform,opacity;pointer-events:none}
.memory img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#26343b}
.memoryShade{position:absolute;inset:0;background:linear-gradient(180deg,transparent 36%,rgba(0,0,0,.82) 100%)}
.memoryCopy{position:absolute;left:10px;right:10px;bottom:10px;text-shadow:0 2px 8px rgba(0,0,0,.78)}
.memoryText{font-size:10.6px;line-height:1.16;font-weight:710;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.memoryDate{font-size:8.8px;color:rgba(255,255,255,.7);margin-top:5px}
.memory.nearest{outline:1px solid rgba(255,255,255,.72);outline-offset:2px}
.memory.magnetic{box-shadow:0 17px 46px rgba(0,0,0,.42),0 0 0 1px rgba(255,240,174,.12)}

/* Presentation becomes the first point on the same zoom continuum. */
#presentation{position:absolute;z-index:18;inset:0;pointer-events:none;opacity:0;will-change:opacity,transform;transform-origin:center}
.storyMorph{position:absolute!important;z-index:70!important;margin:0!important;pointer-events:none!important;transform:none!important;transform-origin:center!important;will-change:left,top,width,height,border-radius,box-shadow;transition:left .54s cubic-bezier(.20,.72,.18,1),top .54s cubic-bezier(.20,.72,.18,1),width .54s cubic-bezier(.20,.72,.18,1),height .54s cubic-bezier(.20,.72,.18,1),border-radius .54s cubic-bezier(.20,.72,.18,1),box-shadow .54s ease!important}
.storyMorph .memoryCopy{transition:opacity .22s ease!important}
.storyMorph .memoryShade{transition:opacity .26s ease!important}
#presentation img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#presentationVeil{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.02) 32%,rgba(0,0,0,.13) 56%,rgba(0,0,0,.82) 100%)}
#presentationCopy{position:absolute;left:22px;right:22px;bottom:calc(91px + var(--safeB));text-shadow:0 2px 11px rgba(0,0,0,.7);will-change:opacity,transform}
#presentationText{font-size:27px;line-height:1.05;font-weight:760;letter-spacing:-.03em}
#presentationDate{font-size:12px;margin-top:10px;color:rgba(255,255,255,.79)}

/* Original Talera timeline language: one continuous ruler with a fixed centre needle. */
#timelineShell{
  position:absolute;z-index:80;left:0;right:0;top:0;
  height:clamp(116px,16dvh,138px);
  padding-top:var(--safeT);
  overflow:hidden;touch-action:none;user-select:none;
  background:linear-gradient(180deg,rgba(255,254,252,.94) 0%,rgba(220,234,246,.70) 100%);
  border-bottom:1px solid rgba(15,39,71,.10);
  backdrop-filter:blur(13px);-webkit-backdrop-filter:blur(13px);
}
#timelineCanvas{position:absolute;left:0;right:0;top:calc(24px + var(--safeT));width:100%;height:calc(100% - 24px - var(--safeT));touch-action:none}
#needle{
  position:absolute;z-index:3;left:50%;top:calc(11px + var(--safeT));bottom:8px;width:2px;
  transform:translateX(-1px);pointer-events:none;
  background:linear-gradient(180deg,rgba(15,39,71,.05),#0F2747 15%,#0F2747 88%,rgba(15,39,71,.05));
}
#needle::before{
  content:"";position:absolute;left:50%;top:0;width:10px;height:10px;border-radius:50%;
  transform:translate(-50%,-50%);background:#E7A98B;
  box-shadow:0 0 0 4px rgba(231,169,139,.18),0 0 0 7px rgba(91,143,185,.07);
}
#focusBlock{
  position:absolute;z-index:5;left:50%;top:calc(16px + var(--safeT));transform:translateX(-50%);
  border-radius:999px;color:#0F2747;background:rgba(255,254,252,.95);
  border:1px solid rgba(91,143,185,.20);white-space:nowrap;pointer-events:none;
  box-shadow:0 5px 18px rgba(15,39,71,.07);
  will-change:font-size,padding,transform,opacity;
}
#focusRange{display:block;font-weight:700;letter-spacing:.005em;line-height:1}
#timelineHint{
  position:absolute;z-index:4;left:50%;bottom:4px;transform:translateX(-50%);
  font-size:8px;color:rgba(15,39,71,.40);pointer-events:none;white-space:nowrap;
}

#hint{position:absolute;z-index:75;left:50%;bottom:calc(72px + var(--safeB));transform:translateX(-50%);width:min(90vw,440px);padding:10px 13px;border-radius:16px;background:rgba(5,10,14,.48);border:1px solid rgba(255,255,255,.13);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);font-size:12px;line-height:1.35;text-align:center;color:rgba(255,255,255,.9);pointer-events:none}
#controls{display:none}
.group{display:flex;gap:7px}
.btn{border:1px solid rgba(255,255,255,.15);background:rgba(5,10,14,.47);border-radius:999px;padding:9px 11px;font-size:11px;font-weight:720;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
#zoomRead{display:none}
#minusBtn,#plusBtn{display:none}
#toast{position:absolute;z-index:95;left:50%;top:calc(128px + var(--safeT));transform:translateX(-50%);padding:7px 11px;border-radius:999px;background:rgba(4,8,11,.73);font-size:10px;opacity:0;transition:opacity .15s;pointer-events:none;white-space:nowrap}
#toast.on{opacity:1}
#magnetDebug{position:absolute;z-index:2;inset:0;pointer-events:none;opacity:0}
.debug #magnetDebug{opacity:1}
#magnetRing{position:absolute;border:1px dashed rgba(255,244,196,.25);border-radius:24px}

@media(min-width:700px){
  #app{width:430px;height:min(900px,100vh);left:50%;top:50%;right:auto;bottom:auto;transform:translate(-50%,-50%);border-radius:36px;box-shadow:0 35px 100px rgba(0,0,0,.5)}
}
</style>
</head>
<body>
<div id="app">
  <div id="bg"></div>
  <canvas id="spaceCanvas" aria-hidden="true"></canvas>
  <div id="world"><div id="farEchoLayer"></div><div id="echoLayer"></div><div id="magnetDebug"><div id="magnetRing"></div></div></div>

  <div id="presentation">
    <img id="presentationImg" alt="">
    <div id="presentationVeil"></div>
    <div id="presentationCopy"><div id="presentationText"></div><div id="presentationDate"></div></div>
  </div>

  <div id="timelineShell" aria-label="Talera levenslijn">
    <canvas id="timelineCanvas"></canvas>
    <div id="needle"></div>
    <div id="focusBlock"><span id="focusRange">1972–2026</span></div>

  </div>

  <div id="hint">Gebruik de <b>tijdbalk bovenin</b> om gericht door je leven te bewegen, of zoek vrij met je vingers tussen de verhalen.</div>


  <div id="toast"></div>
</div>

<script>
const MEMORIES=[{"id":1,"at":"1982-05-14T15:20:00","story":"De eerste keer alleen naar school. Vooral die veel te grote tas is blijven hangen.","image":"https://images.unsplash.com/photo-1778142867112-ac896c976245?auto=format&fit=max&fm=jpg&q=76&w=1400"},{"id":2,"at":"1983-12-24T18:10:00","story":"Kerst bij opa en oma, met iedereen veel te dicht rond één tafel.","image":"https://images.unsplash.com/photo-1774688168997-2a82d06a6188?auto=format&fit=max&fm=jpg&q=76&w=1400"},{"id":3,"at":"1985-07-18T11:30:00","story":"Een middag aan het water waarop de zomer eindeloos leek te duren.","image":"https://images.unsplash.com/photo-1779518083320-b7b21edc8d2b?auto=format&fit=max&fm=jpg&q=76&w=1400"},{"id":4,"at":"1987-04-30T13:15:00","story":"Koninginnedag in de stad. Overal muziek, kleedjes en muntjes in mijn zak.","image":"https://images.unsplash.com/photo-1784654433247-a52f3f204509?auto=format&fit=max&fm=jpg&q=76&w=1400"},{"id":5,"at":"1989-08-12T16:40:00","story":"De vakantie waarop ik voor het eerst echt zelf op ontdekking ging.","image":"https://images.unsplash.com/photo-1783995343989-23f10b526f46?auto=format&fit=max&fm=jpg&q=76&w=1400"},{"id":6,"at":"1991-06-01T20:05:00","story":"Een lange avond buiten met vrienden. Niemand wilde als eerste naar huis.","image":"https://images.unsplash.com/photo-1780329904432-e022b066526b?auto=format&fit=max&fm=jpg&q=76&w=1400"},{"id":7,"at":"1993-09-06T08:15:00","story":"Nieuwe school, nieuwe gezichten en vooral doen alsof ik niet zenuwachtig was.","image":"https://images.unsplash.com/photo-1780329935489-b7b4d5d834e4?auto=format&fit=max&fm=jpg&q=76&w=1400"},{"id":8,"at":"1994-07-22T19:00:00","story":"De eerste avond van een vakantie die achteraf veel belangrijker bleek dan gedacht.","image":"https://images.unsplash.com/photo-1786048079501-7243455ab7aa?auto=format&fit=max&fm=jpg&q=76&w=1400"},{"id":9,"at":"1995-07-23T09:20:00","story":"Vroeg wakker, brood halen en daarna zonder plan op pad.","image":"https://images.unsplash.com/photo-1780329912791-05c5a05d4eeb?auto=format&fit=max&fm=jpg&q=76&w=1400"},{"id":10,"at":"1995-07-24T14:10:00","story":"Een onverwachte omweg werd uiteindelijk het mooiste deel van de dag.","image":"https://images.unsplash.com/photo-1780992632886-9f1af7aec50a?auto=format&fit=max&fm=jpg&q=76&w=1400"},{"id":11,"at":"1995-07-25T21:30:00","story":"Met z'n allen buiten blijven zitten tot het echt donker was.","image":"https://images.unsplash.com/photo-1781750428131-cc7848996d90?auto=format&fit=max&fm=jpg&q=76&w=1400"},{"id":12,"at":"1996-01-01T00:20:00","story":"Nieuwjaarsnacht. Het gevoel dat er ineens van alles mogelijk was.","image":"https://images.unsplash.com/photo-1769117438403-4d22358c8132?auto=format&fit=max&fm=jpg&q=76&w=1400"},{"id":13,"at":"1997-05-17T17:45:00","story":"Een kleine overwinning waar ik toen veel trotser op was dan ik liet merken.","image":"https://images.unsplash.com/photo-1760115112683-3bedf5bc68a7?auto=format&fit=max&fm=jpg&q=76&w=1400"},{"id":14,"at":"1998-10-04T12:00:00","story":"Een zondagse wandeling die later vooral door één gesprek is blijven hangen.","image":"https://images.unsplash.com/photo-1767595666159-48794b9e9a7e?auto=format&fit=max&fm=jpg&q=76&w=1400"},{"id":15,"at":"2000-03-12T10:30:00","story":"De sleutel van mijn eerste eigen plek in mijn hand.","image":"https://images.unsplash.com/photo-1769421162757-a07a7c942c3c?auto=format&fit=max&fm=jpg&q=76&w=1400"},{"id":16,"at":"2001-06-30T18:50:00","story":"Een tuin vol mensen en het besef dat een nieuwe fase echt begonnen was.","image":"https://images.unsplash.com/photo-1770563182237-915707b86c9e?auto=format&fit=max&fm=jpg&q=76&w=1400"},{"id":17,"at":"2002-07-01T08:40:00","story":"De ochtend erna: koffie, rommel en vooral heel veel nagenieten.","image":"https://images.unsplash.com/photo-1752650143275-fb7ef0c27dfc?auto=format&fit=max&fm=jpg&q=76&w=1400"},{"id":18,"at":"2003-11-08T16:15:00","story":"Een regenachtige dag die onverwacht gezellig werd.","image":"https://images.unsplash.com/photo-1760574761811-9f6861243d35?auto=format&fit=max&fm=jpg&q=76&w=1400"},{"id":19,"at":"2005-04-19T13:30:00","story":"Een besluit genomen waar ik weken tegenaan had gehikt.","image":"https://images.unsplash.com/photo-1783904984083-19d6dd72aa11?auto=format&fit=max&fm=jpg&q=76&w=1400"},{"id":20,"at":"2006-09-16T07:10:00","story":"Heel vroeg vertrekken met een auto vol spullen en veel te weinig koffie.","image":"https://images.unsplash.com/photo-1774800879603-dced24dee8f7?auto=format&fit=max&fm=jpg&q=76&w=1400"},{"id":21,"at":"2007-09-17T10:00:00","story":"De eerste wandeldag. Alles voelde nog nieuw en een beetje onwennig.","image":"https://images.unsplash.com/photo-1769415000137-dec30081dd2d?auto=format&fit=max&fm=jpg&q=76&w=1400"},{"id":22,"at":"2007-09-18T16:20:00","story":"Moe aankomen en toch nog uren napraten over de dag.","image":"https://images.unsplash.com/photo-1752650143569-fdde2123653d?auto=format&fit=max&fm=jpg&q=76&w=1400"},{"id":23,"at":"2008-12-31T23:50:00","story":"Tien minuten voor middernacht leek iedereen ineens tegelijk stil te worden.","image":"https://images.unsplash.com/photo-1776893019497-4ccb79f5b14a?auto=format&fit=max&fm=jpg&q=76&w=1400"},{"id":24,"at":"2010-05-22T12:25:00","story":"Een lunch die uitliep tot ver in de middag.","image":"https://images.unsplash.com/photo-1758613171233-f4e9a58a558a?auto=format&fit=max&fm=jpg&q=76&w=1400"},{"id":25,"at":"2011-08-14T09:45:00","story":"De ochtendmist trok langzaam weg en ineens lag het hele landschap open.","image":"https://images.unsplash.com/photo-1782212790904-5b658b182ffc?auto=format&fit=max&fm=jpg&q=76&w=1400"},{"id":26,"at":"2012-08-15T11:10:00","story":"Zonder haast door een onbekend dorp gelopen.","image":"https://images.unsplash.com/photo-1761839271800-f44070ff0eb9?auto=format&fit=max&fm=jpg&q=76&w=1400"},{"id":27,"at":"2012-08-16T15:35:00","story":"Een terras gevonden waar we uiteindelijk veel langer bleven dan gepland.","image":"https://images.unsplash.com/photo-1770564512486-c2f7cd3f853b?auto= const ELLIPSE_MAX_VERTICAL_RATIO=1.63;
function ellipseRatioForLifeYears(years){
  if(years<=ELLIPSE_BASE_LIFE_YEARS)return ELLIPSE_BASE_VERTICAL_RATIO;
  const growthPerYear=
    (ELLIPSE_REFERENCE_VERTICAL_RATIO-ELLIPSE_BASE_VERTICAL_RATIO)/
    (ELLIPSE_REFERENCE_LIFE_YEARS-ELLIPSE_BASE_LIFE_YEARS);
  return clamp(
    ELLIPSE_BASE_VERTICAL_RATIO+
      (years-ELLIPSE_BASE_LIFE_YEARS)*growthPerYear,
    ELLIPSE_BASE_VERTICAL_RATIO,
    ELLIPSE_MAX_VERTICAL_RATIO
  );
}
const ELLIPSE_VERTICAL_RATIO=ellipseRatioForLifeYears(LIFE_YEARS);
const ELLIPSE_HORIZONTAL_RADIUS=SHELL_REFERENCE_RADIUS*WORLD_DENSITY_SCALE;
const ELLIPSE_VERTICAL_RADIUS=ELLIPSE_HORIZONTAL_RADIUS*ELLIPSE_VERTICAL_RATIO;
const TAU=Math.PI*2;
const GLOBE_EQUATOR_CIRCUMFERENCE=TAU*ELLIPSE_HORIZONTAL_RADIUS;

// Human input is defined as distance travelled over the outer photo shell.
// Horizontal travel follows the equator. Vertical travel follows the stretched
// ellipse meridian, whose local arc length changes with latitude.
function shellLonDistanceToRotation(distance){
  return (distance/GLOBE_EQUATOR_CIRCUMFERENCE)*TAU;
}
function rotationToShellLonDistance(rotation){
  return (rotation/TAU)*GLOBE_EQUATOR_CIRCUMFERENCE;
}
function ellipseMeridianRadiusAt(lat){
  const a=ELLIPSE_HORIZONTAL_RADIUS,b=ELLIPSE_VERTICAL_RADIUS;
  const sn=Math.sin(lat),cs=Math.cos(lat);
  return Math.sqrt((a*sn)*(a*sn)+(b*cs)*(b*cs));
}
function shellLatDistanceToRotation(distance,lat){
  return distance/ellipseMeridianRadiusAt(lat);
}
function rotationToShellLatDistance(rotation,midLat){
  return rotation*ellipseMeridianRadiusAt(midLat);
}
function shellSurfaceDistanceFromCamera(s){
  const dLon=wrapLon(s.lon-cam.x);
  const dLat=s.lat-cam.y;
  const dx=rotationToShellLonDistance(dLon);
  const dy=rotationToShellLatDistance(dLat,(s.lat+cam.y)/2);
  return Math.hypot(dx,dy);
}

// Ergonomic finger->surface calibration. The previous 2.455 value made the
// foreground outrun the finger once the 10/7/3 depth bands were introduced.
// 1.72 is ~70% of that travel: the front layer now follows the hand directly,
// while the middle (0.70) and far (0.30) bands visibly lag behind it.
const SHELL_DRAG_PER_PX=1.72;

// Drag stays direct under the finger, but a released "push" must not launch the
// foreground like a slingshot. Lower top speed + longer decay = calmer motion
// that still travels a useful distance after a firm flick.
const SHELL_MAX_COAST=1.55;
const SHELL_STOP_SPEED=.018;
const SHELL_COAST_DECAY_MS=760;
const SHELL_RELEASE_DAMPING=.58;

// Time stays chronologically correct, but visually empty eras take less room on
// the globe. This keeps a sparse life compact while a dense life naturally grows.
const MEMORY_AGES=baseData.map(s=>s.age);
const TIME_DENSITY_BLEND=.58;

function memoryFractionAtAge(age){
  let lo=0,hi=MEMORY_AGES.length;
  while(lo<hi){
    const mid=(lo+hi)>>1;
    if(MEMORY_AGES[mid]<=age)lo=mid+1;
    else hi=mid;
  }
  return MEMORY_AGES.length?lo/MEMORY_AGES.length:clamp(age/LIFE_YEARS,0,1);
}
function spatialProgressForAge(age){
  const chronological=clamp(age/LIFE_YEARS,0,1);
  const populated=memoryFractionAtAge(age);
  return lerp(chronological,populated,TIME_DENSITY_BLEND);
}

function wrapLon(a){
  const tau=Math.PI*2;
  return ((a+Math.PI)%tau+tau)%tau-Math.PI;
}
function sphereLatAtAge(age){
  const t=spatialProgressForAge(age);
  return lerp(GLOBE_LAT_LIMIT,-GLOBE_LAT_LIMIT,t);
}
function ageAtSphereLat(lat){
  const target=clamp((GLOBE_LAT_LIMIT-lat)/(GLOBE_LAT_LIMIT*2),0,1);
  let lo=0,hi=LIFE_YEARS;
  for(let i=0;i<22;i++){
    const mid=(lo+hi)/2;
    if(spatialProgressForAge(mid)<target)lo=mid;
    else hi=mid;
  }
  return (lo+hi)/2;
}
function angularLonDistance(a,b){
  return Math.abs(wrapLon(a-b));
}

const data=baseData.map((s,i)=>{
  const baseLat=sphereLatAtAge(s.age);
  // Tiny latitude jitter prevents mechanical rows, while chronology remains obvious.
  const lat=clamp(baseLat+(fract(s.id+41)-.5)*.052,-GLOBE_LAT_LIMIT,GLOBE_LAT_LIMIT);
  // Stable longitudes distribute one life-period all around the globe.
  const band=Math.floor(s.age*1.35);
  const lon=wrapLon(i*GOLDEN_ANGLE + band*.31 + (fract(s.id+73)-.5)*1.15);
  // A subtle radial shell variation makes the photo field feel volumetric,
  // without breaking the underlying globe.
  const shell=1+(fract(s.id+117)-.5)*.085;
  return {
    ...s,
    lat,lon,shell,
    z:.82+fract(s.id+70)*.38,
    reveal:.24+.56*fract(s.id+91),
    representative:fract(s.id+211)
  };
});

function fitOverviewScale(){
  const responsive=Math.min(W/430,Math.max(.72,(H-150)/720));
  return clamp(.58*responsive,.52,.66);
}

const overviewAnchorAges=[5,17,30,42,54].map(age=>age/55*LIFE_YEARS);
const OVERVIEW_ANCHORS=overviewAnchorAges.map(age=>{
  let best=0,bd=Infinity;
  data.forEach((s,i)=>{
    const d=Math.abs(s.age-age);
    if(d<bd){bd=d;best=i}
  });
  return best;
}).filter((v,i,a)=>a.indexOf(v)===i);
const OVERVIEW_ANCHOR_SET=new Set(OVERVIEW_ANCHORS);

// With large libraries, data can contain thousands of memories while only a
// handful of real DOM cards exist. Foreground cards are virtualized and created
// only when they are actually part of the current view.
function thumbUrl(s){
  return s.synthetic?s.image:s.image.replace("w=1400","w=620");
}

const nodes=new Map();
const preloadedThumbs=new Set();

function createMemoryNode(i){
  const s=data[i];
  if(!s)return null;
  const el=document.createElement("article");
  el.className="memory";
  el.dataset.memoryIndex=String(i);
  el.innerHTML='<img alt=""><div class="memoryShade"></div><div class="memoryCopy"><div class="memoryText"></div><div class="memoryDate"></div></div>';
  const img=el.querySelector("img");
  img.loading="lazy";
  img.decoding="async";
  img.onerror=()=>img.style.opacity=".15";
  el.querySelector(".memoryText").textContent=s.story;
  el.querySelector(".memoryDate").textContent=shortDate(s);
  el.addEventListener("click",e=>{
    e.stopPropagation();
    const index=Number(el.dataset.memoryIndex);
    if(Number.isInteger(index))openStorySmooth(index);
  });
  world.appendChild(el);
  nodes.set(i,el);
  return el;
}

function memoryNode(i,create=true){
  let el=nodes.get(i)||null;
  if(!el&&create)el=createMemoryNode(i);
  return el;
}

const nodeLastVisibleAt=new Map();
const NODE_LINGER_MS=1400;
const MAX_MEMORY_NODES=32;

function releaseUnusedMemoryNodes(keepSet,now=performance.now()){
  for(const i of keepSet)nodeLastVisibleAt.set(i,now);

  const removable=[];
  for(const [i,el] of nodes){
    if(keepSet.has(i))continue;

    // Keep the already-decoded card around briefly. If it becomes relevant
    // again during the same pass, the browser does not rebuild/repaint it.
    el.style.opacity="0";
    el.style.pointerEvents="none";

    const last=nodeLastVisibleAt.get(i)||0;
    removable.push({i,el,last,expired:now-last>NODE_LINGER_MS});
  }

  // Normal cleanup after the linger window.
  for(const item of removable){
    if(!item.expired)continue;
    item.el.remove();
    nodes.delete(item.i);
    nodeLastVisibleAt.delete(item.i);
  }

  // Hard safety cap for long sessions: keep the newest inactive cards.
  if(nodes.size>MAX_MEMORY_NODES){
    const leftovers=[...nodes.entries()]
      .filter(([i])=>!keepSet.has(i))
      .map(([i,el])=>({i,el,last:nodeLastVisibleAt.get(i)||0}))
      .sort((a,b)=>a.last-b.last);
    while(nodes.size>MAX_MEMORY_NODES&&leftovers.length){
      const item=leftovers.shift();
      item.el.remove();
      nodes.delete(item.i);
      nodeLastVisibleAt.delete(item.i);
    }
  }
}

function preloadThumb(i){
  if(i<0||i>=data.length||preloadedThumbs.has(i))return;
  preloadedThumbs.add(i);
  const img=new Image();
  img.decoding="async";
  img.src=thumbUrl(data[i]);
}

function ensureCardImage(i){
  const el=memoryNode(i,true);
  if(!el)return;
  const img=el.querySelector("img");
  if(img&&!img.dataset.loaded){
    img.dataset.loaded="1";
    img.src=thumbUrl(data[i]);
    preloadedThumbs.add(i);
  }
}

let lastShellPreloadAt=0;
function currentShellVelocity(){
  if(touch&&touch.kind==="one"){
    return{x:touch.vShellLon||0,y:touch.vShellLat||0};
  }
  if(globeInertiaRaf){
    return{x:globeMomentumShellLon||0,y:globeMomentumShellLat||0};
  }
  return{x:0,y:0};
}

function preloadNearbyMemories(){
  const now=performance.now();
  if(now-lastShellPreloadAt<140)return;
  lastShellPreloadAt=now;

  const velocity=currentShellVelocity();
  const speed=Math.hypot(velocity.x,velocity.y);
  const lookAhead=clamp(220+speed*620,220,1500);
  const moving=speed>.035;
  const candidates=[];

  data.forEach((s,i)=>{
    if(preloadedThumbs.has(i))return;

    const dLon=wrapLon(s.lon-cam.x);
    const dLat=s.lat-cam.y;
    const dx=rotationToShellLonDistance(dLon);
    const dy=rotationToShellLatDistance(dLat,(s.lat+cam.y)/2);
    const distance=Math.hypot(dx,dy);
    if(distance>lookAhead)return;

    // During motion, favor memories lying ahead on the current surface path.
    // At rest, simply warm a small local ring around the user's position.
    let forward=1;
    if(moving){
      forward=(dx*velocity.x+dy*velocity.y)/(Math.max(.001,distance*speed));
      if(forward<-.12)return;
    }

    const timePenalty=Math.abs(s.ms-timeCenter)/Math.max(timelineSpanMs(),365*DAY);
    const score=distance/lookAhead+timePenalty*.16-(moving?forward*.30:0);
    candidates.push({i,score});
  });

  candidates.sort((a,b)=>a.score-b.score);
  for(let n=0;n<Math.min(6,candidates.length);n++)preloadThumb(candidates[n].i);
}


const ECHO_REFERENCE_RATIO=1.25;
const ECHO_DENSITY_FACTOR=clamp(ELLIPSE_VERTICAL_RATIO/ECHO_REFERENCE_RATIO,1,1.22);

// Three visual depth bands use independent virtual cameras.
// Foreground camera = 100% of the hand movement.
// Middle camera: horizontal motion is deliberately reversed and made strong
// enough to be unmistakable; vertical motion stays almost still.
// Far camera continues slowly in the normal direction.
const FOREGROUND_CAMERA_RATE=1.00;
const MIDDLE_CAMERA_RATE_X=-.22;
const MIDDLE_CAMERA_RATE_Y=.04;
const FAR_CAMERA_RATE_X=.26;
const FAR_CAMERA_RATE_Y=.22;

const ECHO_COUNT=Math.round(96*ECHO_DENSITY_FACTOR);
const echoNodes=Array.from({length:ECHO_COUNT},(_,slot)=>{
  const el=document.createElement("div");
  el.className="memoryEcho";
  el.innerHTML='<img alt="">';
  echoLayer.appendChild(el);
  return el;
});
const echoAssignments=new Array(ECHO_COUNT).fill(-1);

const FAR_ECHO_COUNT=7;
const farEchoNodes=Array.from({length:FAR_ECHO_COUNT},()=>{
  const el=document.createElement("div");
  el.className="farMemoryEcho";
  el.innerHTML='<img alt="">';
  farEchoLayer.appendChild(el);
  return el;
});
const farEchoAssignments=new Array(FAR_ECHO_COUNT).fill(-1);


let W=1,H=1;
let active=data.length-1;
const cam={x:data[active].lon,y:data[active].lat,s:SPACE_MAX}; // x=longitude, y=latitude
let timeCenter=data[active].ms;
let timelineSpanYears=15;
let timelineUser=false;
let lastMagneticIds=new Set(),magneticIds=new Set();
let renderedCards=new Map();
let stableForegroundSet=new Set();
let stableHeroIndex=null;
let spatialPinchTarget=null;
let spatialPinchStrength=0;

// Independent camera tracks make parallax real instead of merely scaling the
// already-projected screen coordinates. That guarantees true counter-motion.
const middleCam={x:cam.x,y:cam.y};
const farCam={x:cam.x,y:cam.y};
let lastLayerSourceCamX=cam.x,lastLayerSourceCamY=cam.y;

function syncDepthCameras(){
  const dx=wrapLon(cam.x-lastLayerSourceCamX);
  const dy=cam.y-lastLayerSourceCamY;

  // Large jumps are programmatic navigation (opening/closing/focusing a story),
  // not a hand-driven pan. Re-anchor the depth cameras instead of throwing them.
  if(Math.abs(dx)>.48||Math.abs(dy)>.34){
    middleCam.x=cam.x;middleCam.y=cam.y;
    farCam.x=cam.x;farCam.y=cam.y;
  }else{
    middleCam.x=wrapLon(middleCam.x+dx*MIDDLE_CAMERA_RATE_X);
    middleCam.y=clampCamY(middleCam.y+dy*MIDDLE_CAMERA_RATE_Y);
    farCam.x=wrapLon(farCam.x+dx*FAR_CAMERA_RATE_X);
    farCam.y=clampCamY(farCam.y+dy*FAR_CAMERA_RATE_Y);
  }

  lastLayerSourceCamX=cam.x;
  lastLayerSourceCamY=cam.y;
}

function clampCamX(x){return wrapLon(x)}
function clampCamY(y){return clamp(y,-GLOBE_LAT_LIMIT,GLOBE_LAT_LIMIT)}

function cameraBasis(){
  const lon=cam.x,lat=cam.y;
  const co=Math.cos(lon),so=Math.sin(lon),cl=Math.cos(lat),sl=Math.sin(lat);
  return {
    forward:{x:cl*co,y:sl,z:cl*so},
    right:{x:-so,y:0,z:co},
    up:{x:-sl*co,y:cl,z:-sl*so}
  };
}
function projectMemoryAt(s,cameraX,cameraY){
  // The sphere remains the invisible navigation model, but every depth band can
  // now observe it through its own virtual camera.
  const top=(timelineShell?.getBoundingClientRect().height||126)+12;
  const bottom=H-78;
  const usable=Math.max(220,bottom-top);
  const cy=(top+bottom)/2;

  const lonDelta=wrapLon(s.lon-cameraX);
  const latDelta=s.lat-cameraY;
  const zoom=Math.max(.74,cam.s/SPACE_MIN)*WORLD_DENSITY_SCALE;

  const xNorm=Math.tanh(lonDelta*.78);
  const yNorm=Math.tanh(latDelta*1.38);
  const x=W/2+xNorm*(W*.57)*zoom;
  const y=cy-yNorm*(usable*.48)*zoom*ELLIPSE_VERTICAL_RATIO;

  const distance=Math.hypot(lonDelta*.50,latDelta*1.18*ELLIPSE_VERTICAL_RATIO);
  const shellLift=((s.shell||1)-1)*1.9;
  const depth=clamp(1-distance*.34+shellLift,0,1);
  const facing=clamp(1-distance*.42,-.35,1);

  return {x,y,facing,depth,perspective:lerp(.82,1.06,depth)};
}
function projectMemory(s){
  return projectMemoryAt(s,cam.x,cam.y);
}
function angularDistanceToCamera(s){
  const co=Math.cos(s.lon),so=Math.sin(s.lon),cl=Math.cos(s.lat),sl=Math.sin(s.lat);
  const b=cameraBasis();
  const dot=cl*co*b.forward.x+sl*b.forward.y+cl*so*b.forward.z;
  return Math.acos(clamp(dot,-1,1));
}
function nearestMemoryToWorld(){
  let best=0,bd=Infinity;
  data.forEach((s,i)=>{
    const d=angularDistanceToCamera(s);
    if(d<bd){bd=d;best=i}
  });
  return best;
}
function nearestMemoryToTime(ms=timeCenter){
  let lo=0,hi=data.length-1;
  while(lo<hi){const mid=(lo+hi)>>1;if(data[mid].ms<ms)lo=mid+1;else hi=mid}
  if(lo>0&&Math.abs(data[lo-1].ms-ms)<Math.abs(data[lo].ms-ms))return lo-1;
  return lo;
}
function nearestMemoryToFocus(){
  // The timeline date is authoritative. First find stories near that date,
  // then choose the one on the most reachable side of the globe.
  let windowMs=Math.max(120*DAY,timelineSpanMs()*.46);
  let candidates=[];
  for(let pass=0;pass<5;pass++){
    candidates=data.map((s,i)=>({s,i,dt:Math.abs(s.ms-timeCenter)})).filter(v=>v.dt<=windowMs);
    if(candidates.length)break;
    windowMs*=1.8;
  }
  if(!candidates.length)return nearestMemoryToTime(timeCenter);
  let best=candidates[0].i,score=Infinity;
  for(const v of candidates){
    const temporal=v.dt/Math.max(DAY,windowMs);
    const shellDistance=shellSurfaceDistanceFromCamera(v.s);
    const shellProximity=clamp(shellDistance/(Math.PI*SHELL_REFERENCE_RADIUS),0,4);
    const q=temporal*3.4+shellProximity*.42;
    if(q<score){score=q;best=v.i}
  }
  return best;
}
function setBg(i){
  // The universe remains a space backdrop. A photograph only becomes the
  // background once the actual story presentation takes over.
  presentationImg.src=data[i].image;
}
function toastMsg(t){toast.textContent=t;toast.classList.add("on");clearTimeout(toastMsg.t);toastMsg.t=setTimeout(()=>toast.classList.remove("on"),900)}
function presentationAlpha(){return smooth(1.64,1.94,cam.s)}
function overviewBlendForScale(s=cam.s){return 1-smooth(SPACE_MIN+.035,SPACE_MIN+.30,s)}
function spanYearsForScale(s=cam.s){
  const t=clamp((s-SPACE_MIN)/(SPACE_MAX-SPACE_MIN),0,1);
  const shaped=t*t*(3-2*t);
  return Math.exp(lerp(Math.log(54),Math.log(1/365.2425),shaped));
}
function scaleForSpanYears(years){
  const target=Math.log(clamp(years,1/365.2425,54));
  const lo=Math.log(54),hi=Math.log(1/365.2425);
  const shaped=clamp((target-lo)/(hi-lo),0,1);
  let a=0,b=1;
  for(let i=0;i<18;i++){const m=(a+b)/2,v=m*m*(3-2*m);if(v<shaped)a=m;else b=m}
  return lerp(SPACE_MIN,SPACE_MAX,(a+b)/2);
}
function syncSpanFromSpace(){
  // Deliberately decoupled: the Free timeline owns its own scale.
  // Globe zoom must never rewrite timeline sensitivity.
}
function syncSpaceScaleFromSpan(){
  // Deliberately decoupled from the photo-space camera.
}
function timelineSpanMs(){return timelineSpanYears*365.2425*DAY}
function clampTime(ms){return clamp(ms,LIFE_START,LIFE_END)}
function setCam(x,y,s){
  cam.x=wrapLon(x);cam.y=clampCamY(y);cam.s=clamp(s,SPACE_MIN,SPACE_MAX);
  
  if(!timelineUser)syncTimeFromSpace();
  render();
}
function zoomAround(px,py,newScale){
  // Zoom is intentionally simple on the globe: direction stays stable;
  // the story under a real pinch is handled by the gesture code below.
  cam.s=clamp(newScale,SPACE_MIN,SPACE_MAX);
  render();
}
let storyOpenRaf=0;
let storyMorphNode=null;
let spaceReturnState=null;

function resetPresentationDrag(animate=false){
  presentation.style.transition=animate?"transform .20s ease":"";
  presentation.style.transform="";
  if(animate)setTimeout(()=>{presentation.style.transition=""},220);
}
function clearStoryMorph(){
  if(storyMorphNode){storyMorphNode.remove();storyMorphNode=null}
  world.style.transition="";
  world.style.opacity="";
  world.style.filter="";
  resetPresentationDrag(false);
}
function focusStory(i){
  cancelAnimationFrame(storyOpenRaf);
  clearStoryMorph();
  active=clamp(i,0,data.length-1);
  timeCenter=data[active].ms;
  if(typeof centerMs!=="undefined")centerMs=timeCenter;
  cam.x=data[active].lon;cam.y=data[active].lat;cam.s=SPACE_MAX;
  setBg(active);hint.style.display="none";render();
}
function openStorySmooth(i){
  const targetIndex=clamp(i,0,data.length-1);
  const target=data[targetIndex];
  const source=memoryNode(targetIndex,false);
  if(!target||!source)return;

  stopGlobeInertia();
  cancelAnimationFrame(storyOpenRaf);
  clearStoryMorph();
  hint.style.display="none";
  ensureCardImage(targetIndex);
  setBg(targetIndex);

  // Remember the exact universe view so the same card can later be sent
  // back to the exact place it came from.
  if(cam.s<SWIPE_SPACE){
    spaceReturnState={
      storyIndex:targetIndex,
      camX:cam.x,
      camY:cam.y,
      camS:cam.s,
      timeCenter,
      centerMs:typeof centerMs!=="undefined"?centerMs:timeCenter
    };
  }

  const appRect=app.getBoundingClientRect();
  const sourceRect=source.getBoundingClientRect();

  // If the card is somehow not measurable, fall back to the same target,
  // never to another story.
  if(sourceRect.width<8||sourceRect.height<8){
    focusStory(targetIndex);return;
  }

  const clone=source.cloneNode(true);
  clone.classList.add("storyMorph");
  clone.classList.remove("nearest","magnetic");
  clone.style.left=(sourceRect.left-appRect.left)+"px";
  clone.style.top=(sourceRect.top-appRect.top)+"px";
  clone.style.width=sourceRect.width+"px";
  clone.style.height=sourceRect.height+"px";
  clone.style.opacity="1";
  clone.style.borderRadius=getComputedStyle(source).borderRadius||"18px";
  clone.style.boxShadow=getComputedStyle(source).boxShadow;
  clone.querySelectorAll("img").forEach(img=>{img.loading="eager";img.style.opacity="1"});
  app.appendChild(clone);
  storyMorphNode=clone;

  world.style.transition="opacity .52s ease,filter .52s ease";
  world.style.opacity=".16";
  world.style.filter="blur(3px)";

  spatialPinchTarget=targetIndex;
  active=targetIndex;
  timeCenter=target.ms;
  if(typeof centerMs!=="undefined")centerMs=timeCenter;

  requestAnimationFrame(()=>{
    requestAnimationFrame(()=>{
      if(storyMorphNode!==clone)return;
      clone.style.left="0px";
      clone.style.top="0px";
      clone.style.width=appRect.width+"px";
      clone.style.height=appRect.height+"px";
      clone.style.borderRadius="0px";
      clone.style.boxShadow="0 0 0 rgba(0,0,0,0)";
      const copy=clone.querySelector(".memoryCopy");
      const shade=clone.querySelector(".memoryShade");
      if(copy)copy.style.opacity="0";
      if(shade)shade.style.opacity=".18";
    });
  });

  let morphStartedAt=0;
  storyOpenRaf=requestAnimationFrame(function settle(now){
    if(!morphStartedAt)morphStartedAt=now;
    const elapsed=now-morphStartedAt;
    if(elapsed<545){
      storyOpenRaf=requestAnimationFrame(settle);
      return;
    }
    spatialPinchTarget=null;spatialPinchStrength=0;
    cam.x=target.lon;cam.y=target.lat;cam.s=SPACE_MAX;
    active=targetIndex;timeCenter=target.ms;
    if(typeof centerMs!=="undefined")centerMs=timeCenter;
    render();
    if(storyMorphNode===clone){
      clone.style.opacity="0";
      setTimeout(()=>{if(storyMorphNode===clone)clearStoryMorph()},90);
    }
  });
}
function closeStorySmooth(i=active){

// Stable visual search gears + direct timeline grip: copied from Free.
const pointers=new Map();
let dragStartX=0,dragStartCenter=0,dragSpanDays=spanForZoom(zoomPos),pinchStartDist=0,pinchStartZoom=0,pinchStartCenter=0,pinchStartMidX=0;
let visualZoomPos=zoomPos;
let visualScaleRaf=0;
let visualScaleTransitioning=false;
let visualIntentLevel=0;
let visualIntentSince=performance.now();
let visualGearHoldUntil=0;
let scaleLastX=0,scaleLastT=0,searchVelocity=0;
let gestureUsedPinch=false;
let spaceVisualIntentLevel=Math.round(Math.min(visualZoomPos,1));
let spaceVisualIntentSince=performance.now();

const VISUAL_AUTO_MAX_ZOOM=1;
const VISUAL_GEAR_HOLD_MS=1200;
const VISUAL_ZOOM_IN_DWELL_MS=[0,750];
const VISUAL_ZOOM_OUT_DWELL_MS=170;

function visualStageForZoom(z){return clamp(Math.round(Math.min(z,VISUAL_AUTO_MAX_ZOOM)),0,VISUAL_AUTO_MAX_ZOOM)}
function visualTargetForLevel(level){return clamp(level,0,VISUAL_AUTO_MAX_ZOOM)}
activeLevel=function(){return clamp(Math.round(visualZoomPos),0,5)};
bounds=function(){
  const span=spanForZoom(visualZoomPos),half=span*MS_DAY/2;
  return[centerMs-half,centerMs+half,span];
};
function dragSpanForCurrentVisual(){return visualZoomPos>=.82?spanForZoom(visualZoomPos):spanForZoom(zoomPos)}
function reanchorDragAt(x,spanDays=dragSpanForCurrentVisual()){
  dragStartX=x;dragStartCenter=centerMs;dragSpanDays=spanDays;
}
function visualLevelForSpeed(speed){return Math.max(0,speed)>=.60?0:1}
function resetVisualIntent(now=performance.now()){
  visualIntentLevel=visualStageForZoom(visualZoomPos);visualIntentSince=now;
}
function cancelVisualScaleAnimation(){
  cancelAnimationFrame(visualScaleRaf);visualScaleRaf=0;visualScaleTransitioning=false;
}
function animateVisualScaleTo(target,duration){
  cancelAnimationFrame(visualScaleRaf);
  const from=visualZoomPos,start=performance.now();visualScaleTransitioning=true;
  function frame(now){
    const t=clamp((now-start)/duration,0,1);
    visualZoomPos=lerp(from,target,1-Math.pow(1-t,3));
    commitFreeTimeline();
    if(t<1)visualScaleRaf=requestAnimationFrame(frame);
    else{
      visualZoomPos=target;visualScaleTransitioning=false;
      const settledAt=performance.now();
      visualIntentLevel=visualStageForZoom(target);visualIntentSince=settledAt;
      visualGearHoldUntil=settledAt+VISUAL_GEAR_HOLD_MS;
      if(pointers.size===1){
        const span=target>=.82?spanForZoom(target):spanForZoom(zoomPos);
        reanchorDragAt(scaleLastX,span);

      commitFreeTimeline();
    }

}
function syncTimelineVisualFromSpace(speed,dt,now=performance.now()){
  // Globe and timeline share one navigation intent, but the timeline must never
  // sit halfway between its two automatic gears: that creates unreadable mixed labels.
  if(visualScaleTransitioning)cancelVisualScaleAnimation();

  const current=visualStageForZoom(visualZoomPos);
  const s=Math.max(0,speed);

  // Hysteresis: the middle band keeps the current gear so tiny speed changes do
  // not make the timeline chatter between overview and precise search.
  let desired=current;
  if(s>=.34)desired=0;       // clearly travelling
  else if(s<=.16)desired=1;  // clearly searching precisely

  if(desired===current){
    spaceVisualIntentLevel=current;
    spaceVisualIntentSince=now;
    if(visualZoomPos!==current)visualZoomPos=current;
  }else{
    if(desired!==spaceVisualIntentLevel){
      spaceVisualIntentLevel=desired;
      spaceVisualIntentSince=now;
      return;
    }

    // Coarsening should react quickly; precision gets a short confirmation
    // delay so an accidental momentary slowdown does not open the fine scale.
    const dwell=desired===0?85:240;
    if(now-spaceVisualIntentSince<dwell)return;

    visualZoomPos=desired; // snap to a valid gear; never render an in-between scale
    spaceVisualIntentSince=now;
  }

  timelineSpanYears=spanForZoom(visualZoomPos)/DAYS_YEAR;
  visualIntentLevel=visualStageForZoom(visualZoomPos);
  visualIntentSince=now;
  visualGearHoldUntil=0;
}

function considerVisualScale(speed,now){
  if(visualScaleTransitioning||pointers.size!==1)return;
  const current=visualStageForZoom(visualZoomPos),desired=visualLevelForSpeed(speed);
  if(desired===current){visualIntentLevel=current;visualIntentSince=now;return}
  const strongOverview=desired===0&&current>0&&speed>=.85;
  if(desired!==visualIntentLevel){
    visualIntentLevel=desired;visualIntentSince=strongOverview?now:Math.max(now,visualGearHoldUntil);return;
  }
  if(now<visualGearHoldUntil&&!strongOverview)return;
  if(desired<current){
    const dwell=strongOverview?90:VISUAL_ZOOM_OUT_DWELL_MS;
    if(now-visualIntentSince<dwell)return;
    animateVisualScaleTo(visualTargetForLevel(desired),260);return;
  }
  const next=Math.min(VISUAL_AUTO_MAX_ZOOM,current+1);
  if(now-visualIntentSince<VISUAL_ZOOM_IN_DWELL_MS[next])return;
  animateVisualScaleTo(visualTargetForLevel(next),360);
}

timelineShell.addEventListener("pointerdown",e=>{
  if(e.target.closest("button"))return;
  stopGlobeInertia();
  e.preventDefault();e.stopPropagation();
  userIsMoving=true;timelineUser=true;hint.style.display="none";
  timelineShell.setPointerCapture&&timelineShell.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pointers.size===1){
    reanchorDragAt(e.clientX);
    scaleLastX=e.clientX;scaleLastT=performance.now();searchVelocity=0;
    resetVisualIntent(scaleLastT);gestureUsedPinch=false;
  }else if(pointers.size===2){
    gestureUsedPinch=true;cancelVisualScaleAnimation();visualZoomPos=zoomPos;visualGearHoldUntil=0;
    const p=[...pointers.values()];
    pinchStartDist=Math.hypot(p[1].x-p[0].x,p[1].y-p[0].y);
    pinchStartZoom=zoomPos;pinchStartCenter=centerMs;pinchStartMidX=(p[0].x+p[1].x)/2;

  e.preventDefault();e.stopPropagation();
  pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  const r=timelineShell.getBoundingClientRect();

  if(pointers.size===1){
    const now=performance.now();
    const segmentDx=e.clientX-scaleLastX;
    const dt=clamp(now-scaleLastT,8,48);
    const instantVelocity=Math.abs(segmentDx)/dt;
    const velocityTau=instantVelocity>searchVelocity?70:380;
    const velocityAlpha=1-Math.exp(-dt/velocityTau);

    const dx=e.clientX-dragStartX;

    scaleLastX=e.clientX;scaleLastT=now;
    considerVisualScale(searchVelocity,now);
    keepCenterValid();commitFreeTimeline();
  }else if(pointers.size===2){
    const p=[...pointers.values()];
    const dist=Math.max(20,Math.hypot(p[1].x-p[0].x,p[1].y-p[0].y));
    const mid=(p[0].x+p[1].x)/2;

    visualZoomPos=zoomPos;

    const oldSpan=spanForZoom(pinchStartZoom),newSpan=spanForZoom(zoomPos);
    const oldRel=(pinchStartMidX-r.left)/r.width-.5;
    const anchor=pinchStartCenter+oldRel*oldSpan*MS_DAY;
    const newRel=(mid-r.left)/r.width-.5;
    centerMs=anchor-newRel*newSpan*MS_DAY;

    keepCenterValid();commitFreeTimeline();
  }
},{passive:false});

function pointerEnd(e){
  if(pointers.has(e.pointerId))pointers.delete(e.pointerId);
  e.preventDefault();e.stopPropagation();
  if(pointers.size===0){
    userIsMoving=false;timelineUser=false;
    if(cam.s<SWIPE_SPACE)cam.s=SPACE_VIEW_SCALE;

    commitFreeTimeline();
  }else if(pointers.size===1){
    const p=[...pointers.values()][0];
    reanchorDragAt(p.x);scaleLastX=p.x;scaleLastT=performance.now();searchVelocity=0;
    resetVisualIntent(scaleLastT);
  }
}

timelineShell.addEventListener("pointercancel",pointerEnd,{passive:false});

function scheduleSnap(syncVisual=false){
  clearTimeout(snapTimer);

function animateZoomTo(target,duration,syncVisual=false){
  cancelAnimationFrame(timelineRaf);
  const from=zoomPos,start=performance.now();
  if(syncVisual)cancelVisualScaleAnimation();
  function frame(now){
    const t=clamp((now-start)/duration,0,1);
    zoomPos=lerp(from,target,1-Math.pow(1-t,3));
    if(syncVisual)visualZoomPos=zoomPos;
    keepCenterValid();commitFreeTimeline();
    if(t<1)timelineRaf=requestAnimationFrame(frame);
  }
  timelineRaf=requestAnimationFrame(frame);
}

/* ------------------- MAGNETIC SPACE ------------------- *//* ------------------- MAGNETIC SPACE ------------------- */
function foregroundStoryRoles(raw){
  const timelineBottom=(timelineShell?.getBoundingClientRect().height||126)+22;
  const scanPerSide=90;

  // Keep one genuinely large photo present much more often. Instead of making
  // the currently-active story large even when it is mostly off-screen, choose
  // the best nearby story that is already travelling through the visible field.
  // Hold that hero until it is comfortably gone so the large card does not flicker.
  const nearestTimeIndex=nearestMemoryToTime(timeCenter);
  const heroWindow=Math.min(
    Math.max(timelineSpanMs()*.58,420*DAY),
    4.2*365.2425*DAY
  );

  function heroUsable(i,loose=false){
    if(i==null||!data[i]||!raw[i])return false;
    if(Math.abs(data[i].ms-timeCenter)>heroWindow*(loose?1.25:1))return false;
    const q=raw[i];
    const xPad=loose?W*.20:26;
    const topPad=loose?90:18;
    const bottomPad=loose?115:44;
    return q.x>-xPad&&q.x<W+xPad&&
      q.y>timelineBottom-topPad&&q.y<H+bottomPad;
  }

  let hero=null;
  if(heroUsable(stableHeroIndex,true)){
    hero=stableHeroIndex;
  }else{
    let bestScore=Infinity;
    const start=Math.max(0,nearestTimeIndex-120);
    const end=Math.min(data.length-1,nearestTimeIndex+120);

    for(let i=start;i<=end;i++){
      if(!heroUsable(i,false))continue;
      const q=raw[i];
      const temporal=Math.abs(data[i].ms-timeCenter)/Math.max(DAY,heroWindow);
      const centre=Math.hypot(
        (q.x-W/2)/Math.max(1,W),
        (q.y-H*.56)/Math.max(1,H)
      );
      const depthPenalty=(1-clamp(q.depth,0,1))*.12;
      const score=temporal*.62+centre*.32+depthPenalty;
      if(score<bestScore){
        bestScore=score;
        hero=i;
      }
    }
  }

  if(hero==null){
    hero=(active!=null&&data[active])?active:nearestTimeIndex;
  }
  stableHeroIndex=hero;
  if(hero==null||!data[hero])return [];

  function pickSide(direction,count){
    const readable=[];
    const approaching=[];

    for(let step=1;step<=scanPerSide;step++){
      const i=hero+direction*step;
      if(i<0||i>=data.length)break;
      const q=raw[i];
      if(!q)continue;

      const onScreen=
        q.x>-34&&q.x<W+34&&
        q.y>timelineBottom-18&&q.y<H+44;
      const nearScreen=
        q.x>-W*.32&&q.x<W*1.32&&
        q.y>timelineBottom-110&&q.y<H+135;

      if(onScreen)readable.push({i,step});
      else if(nearScreen)approaching.push({i,step});

      if(readable.length>=count)break;
    }

    return [...readable,...approaching]
      .sort((a,b)=>a.step-b.step)
      .slice(0,count)
      .map(v=>v.i);
  }

  const before=pickSide(-1,2);
  const after=pickSide(1,2);
  const supports=[...before,...after]
    .filter((i,pos,arr)=>i!==hero&&arr.indexOf(i)===pos);

  // Fill edge cases from the nearest chronological neighbours that are still
  // in the broad approach zone. They retain their real projected path and fade.
  if(supports.length<4){
    for(let step=1;step<=scanPerSide&&supports.length<4;step++){
      for(const i of [hero-step,hero+step]){
        if(i<0||i>=data.length||supports.includes(i))continue;
        const q=raw[i];
        if(!q)continue;
        const nearScreen=
          q.x>-W*.42&&q.x<W*1.42&&
          q.y>timelineBottom-135&&q.y<H+165;
        if(nearScreen)supports.push(i);
        if(supports.length>=4)break;
      }
    }
  }

  return [hero,...supports.slice(0,4)];
}

function visibleBudgetForScale(){
  // One dominant story + four readable chronological neighbours.
  // Very close to presentation the existing morph still takes over naturally.
  const z=clamp((cam.s-SPACE_MIN)/(SPACE_MAX-SPACE_MIN),0,1);
  if(z>.92)return 3;
  return 5;
}

function chooseVisibleRepresentatives(raw,alpha,foregroundRoles=[]){
  if(alpha>.92){
    stableForegroundSet=new Set([active]);
    return new Set(stableForegroundSet);
  }

  const budget=visibleBudgetForScale();
  const temporalBase=Math.max(timelineSpanMs(),180*DAY);
  let clearWindow=Math.max(240*DAY,temporalBase*.72);
  const maxWindow=Math.max(3.2*365.2425*DAY,temporalBase*1.2);
  let candidates=[];

  // Expand only as much as necessary to obtain a useful set. We never jump
  // decades merely to fill the screen.
  for(let pass=0;pass<5;pass++){
    candidates=[];
    data.forEach((s,i)=>{
      const r=raw[i];
      const dt=Math.abs(s.ms-timeCenter);
      if(dt>clearWindow&&spatialPinchTarget!==i)return;
      const nearScreen=r.x>-W*.35&&r.x<W*1.35&&r.y>90&&r.y<H+120;
      if(!nearScreen&&spatialPinchTarget!==i)return;

      const temporal=Math.exp(-.5*Math.pow(dt/Math.max(DAY,clearWindow*.48),2));
      const depth=clamp(r.depth,0,1);
      const centre=1-clamp(Math.hypot(r.x-W/2,r.y-H*.53)/(Math.max(W,H)*.84),0,1);
      const targetBoost=spatialPinchTarget===i?5:0;
      const score=temporal*1.34+depth*.42+centre*.18+.10*(1-s.representative)+targetBoost;
      candidates.push({i,score,x:r.x,y:r.y,dt});
    });
    if(candidates.length>=budget||clearWindow>=maxWindow)break;
    clearWindow=Math.min(maxWindow,clearWindow*1.52);
  }
  candidates.sort((a,b)=>b.score-a.score||a.dt-b.dt||a.i-b.i);

  const chosen=new Set();
  if(spatialPinchTarget!=null)chosen.add(spatialPinchTarget);

  // Timeline hierarchy has first claim on the readable foreground:
  // one needle-led hero plus up to four chronological neighbours.
  for(const i of foregroundRoles){
    if(i!=null&&data[i])chosen.add(i);
  }

  // Hysteresis for the clear foreground: once a photo has earned a place,
  // keep it until it is comfortably outside the useful time/screen envelope.
  // This prevents dense libraries from choosing a different card every frame.
  for(const i of stableForegroundSet){
    if(chosen.size>=budget)break;
    if(chosen.has(i)||!data[i]||!raw[i])continue;
    const r=raw[i];
    const dt=Math.abs(data[i].ms-timeCenter);
    const looseTime=dt<=clearWindow*1.35;
    const looseScreen=r.x>-W*.55&&r.x<W*1.55&&r.y>35&&r.y<H+180;
    if(looseTime&&looseScreen)chosen.add(i);
  }

  // On the first frame, seed the stable set with the current focus. Afterwards
  // the candidate ranking may change without immediately replacing the scene.
  if(chosen.size===0&&raw[active]&&Math.abs(data[active].ms-timeCenter)<=clearWindow){
    chosen.add(active);
  }

  // Fill only genuinely empty slots. Diversity still keeps cards from piling
  // into one small screen patch.
  while(chosen.size<budget){
    let best=null,bestValue=-Infinity;
    for(const cand of candidates){
      if(chosen.has(cand.i))continue;
      let minD=Infinity;
      for(const i of chosen){
        const q=raw[i];
        if(q)minD=Math.min(minD,Math.hypot(cand.x-q.x,cand.y-q.y));
      }
      const diversity=chosen.size?clamp(minD/180,0,1):1;
      const value=cand.score+diversity*.34;
      if(value>bestValue){bestValue=value;best=cand}
    }
    if(!best)break;
    chosen.add(best.i);
  }

  stableForegroundSet=new Set(chosen);
  return chosen;
}

// The magnetic layer is allowed to compose the *screen*, never to change which
// memory the user is actually navigating toward.
function composeForeground(raw,visibleSet){
  const map=new Map();
  const top=(timelineShell?.getBoundingClientRect().height||126)+64;
  const bottom=H-118;
  const outerMinX=-96,outerMaxX=W+96;
  const outerMinY=top-112,outerMaxY=H+96;

  for(const i of visibleSet){
    const r=raw[i];
    // Keep the story on its real projected path. It may live just outside the
    // viewport and physically roll in; only absurdly distant positions are capped.
    const homeX=clamp(r.x,outerMinX,outerMaxX);
    const homeY=clamp(r.y,outerMinY,outerMaxY);
    map.set(i,{x:homeX,y:homeY,homeX,homeY});
  }

  const ids=[...map.keys()];
  const desiredGap=Math.min(154,Math.max(116,W*.31));

  // Repulsion only becomes meaningful once cards are near the actual viewport.
  // Outside cards therefore keep their true approach path instead of teleporting in.
  for(let step=0;step<7;step++){
    for(let a=0;a<ids.length;a++){
      for(let b=a+1;b<ids.length;b++){
        const pa=map.get(ids[a]),pb=map.get(ids[b]);
        const aNear=pa.x>-46&&pa.x<W+46&&pa.y>top-55&&pa.y<bottom+70;
        const bNear=pb.x>-46&&pb.x<W+46&&pb.y>top-55&&pb.y<bottom+70;
        if(!aNear&&!bNear)continue;

        let dx=pb.x-pa.x,dy=pb.y-pa.y;
        let d=Math.hypot(dx,dy);
        if(d<1){dx=((ids[b]-ids[a])%3)-1;dy=1;d=Math.hypot(dx,dy)}
        if(d>=desiredGap)continue;
        const push=(desiredGap-d)*.19;
        const ux=dx/d,uy=dy/d;
        pa.x-=ux*push;pa.y-=uy*push;
        pb.x+=ux*push;pb.y+=uy*push;
      }
    }
    for(const i of ids){
      const p=map.get(i);
      p.x=lerp(p.x,p.homeX,.07);
      p.y=lerp(p.y,p.homeY,.07);
      p.x=clamp(p.x,outerMinX,outerMaxX);
      p.y=clamp(p.y,outerMinY,outerMaxY);
    }
  }
  return map;
}

function chooseMagneticSet(){
  // No screen-space magnet on the globe. A photo stays where it actually is
  // on the sphere, so everything the user sees remains spatially trustworthy.
  magneticIds=new Set();lastMagneticIds=new Set();
}
function pullToViewport(p){return{x:p.x,y:p.y,magnetic:false}}

function renderEchoField(raw,visibleSet,alpha){
  const candidates=[];
  const centreY=H*.54;

  data.forEach((s,i)=>{
    if(visibleSet.has(i))return;
    const r=projectMemoryAt(s,middleCam.x,middleCam.y);
    const d=clamp(r.depth,0,1);

    // True reverse parallax: this entire layer uses a camera that travels
    // opposite to the foreground camera at 10% of its speed.
    const scatterX=(fract(s.id+1301)-.5)*W*lerp(.26,.08,d);
    const scatterY=(fract(s.id+1499)-.5)*H*lerp(.17,.05,d);
    const x=r.x+scatterX;
    const echoVerticalCompensation=Math.min(1,ECHO_REFERENCE_RATIO/ELLIPSE_VERTICAL_RATIO);
    const y=centreY+
      (r.y-centreY)*echoVerticalCompensation+
      scatterY;

    if(x<-95||x>W+95||y<92||y>H+100)return;

    const temporal=Math.exp(-.5*Math.pow(
      Math.abs(s.ms-timeCenter)/Math.max(timelineSpanMs()*1.7,365*DAY*5),2
    ));
    const score=d*.44+temporal*.22+.22*(1-s.representative)+.12*fract(s.id+1781);
    candidates.push({i,score,x,y,depth:d});
  });

  candidates.sort((a,b)=>b.score-a.score||a.i-b.i);

  const chosen=[];
  for(const cand of candidates){
    if(chosen.length>=ECHO_COUNT)break;
    let tooClose=false;
    const localGap=lerp(13,27,cand.depth);
    for(const p of chosen){
      if(Math.hypot(cand.x-p.x,cand.y-p.y)<localGap){tooClose=true;break}
    }
    if(!tooClose)chosen.push(cand);
  }

  const chosenById=new Map(chosen.map(c=>[c.i,c]));
  const slotCandidates=new Array(ECHO_COUNT).fill(null);
  const usedIds=new Set();

  // First preserve existing slot->photo assignments whenever that photo is
  // still wanted. A small ranking change must not replace 96 image sources.
  for(let slot=0;slot<ECHO_COUNT;slot++){
    const current=echoAssignments[slot];
    const cand=chosenById.get(current);
    if(cand){
      slotCandidates[slot]=cand;
      usedIds.add(current);
    }
  }

  // Fill only genuinely free slots with newly chosen echoes.
  let next=0;
  for(let slot=0;slot<ECHO_COUNT;slot++){
    if(slotCandidates[slot])continue;
    while(next<chosen.length&&usedIds.has(chosen[next].i))next++;
    if(next<chosen.length){
      slotCandidates[slot]=chosen[next];
      usedIds.add(chosen[next].i);
      next++;
    }
  }

  for(let slot=0;slot<ECHO_COUNT;slot++){
    const el=echoNodes[slot],cand=slotCandidates[slot];
    if(!cand){
      el.style.opacity="0";echoAssignments[slot]=-1;continue;
    }

    const s=data[cand.i];
    if(echoAssignments[slot]!==cand.i){
      echoAssignments[slot]=cand.i;
      el.querySelector("img").src=thumbUrl(s);
    }

    const d=clamp(cand.depth,0,1);
    const random=.78+.44*fract(s.id+901);
    const size=lerp(.38,1.22,d)*random;

    // Distant memories must still read as photographs. Keep their small scale
    // for depth, but preserve enough colour, contrast and image information
    // that they never collapse into vague blue/grey patches.
    const op=(1-alpha)*lerp(.33,.53,d)*(.91+.09*cand.score);
    const blur=lerp(.016,0,d);
    const sat=lerp(1.22,1.17,d);
    const bright=lerp(1.10,1.11,d);
    const contrast=lerp(1.16,1.10,d);
    const img=el.querySelector("img");
    img.style.filter="blur("+blur.toFixed(3)+"px) saturate("+sat.toFixed(2)+") brightness("+bright.toFixed(2)+") contrast("+contrast.toFixed(2)+")";
    el.style.opacity=clamp(op,.28,.56).toFixed(3);
    el.style.borderColor="rgba(255,255,255,"+lerp(.30,.24,d).toFixed(3)+")";
    el.style.transform="translate3d("+(cand.x-31)+"px,"+(cand.y-23)+"px,0) scale("+size.toFixed(3)+")";
    el.style.zIndex=String(25+Math.round(d*118));
    const warm=fract(s.id+2077)>.62;
    el.style.boxShadow=warm
      ?"0 5px 18px rgba(0,0,0,.15),0 0 "+Math.round(12+18*d)+"px rgba(227,166,118,"+(0.035+.06*d).toFixed(3)+")"
      :"0 5px 18px rgba(0,0,0,.15),0 0 "+Math.round(12+18*d)+"px rgba(122,184,216,"+(0.04+.07*d).toFixed(3)+")";
  }

  return new Set(chosen.map(c=>c.i));
}

function renderFarEchoField(raw,visibleSet,middleSet,alpha){
  const centreY=H*.54;
  const candidates=[];

  data.forEach((s,i)=>{
    if(visibleSet.has(i)||middleSet.has(i))return;
    const r=projectMemoryAt(s,farCam.x,farCam.y);
    const d=clamp(r.depth,0,1);

    // Third layer uses its own slow 30% camera in the normal direction.
    const scatterX=(fract(s.id+3109)-.5)*W*.54;
    const scatterY=(fract(s.id+3251)-.5)*H*.42;
    const x=r.x+scatterX;
    const echoVerticalCompensation=Math.min(1,ECHO_REFERENCE_RATIO/ELLIPSE_VERTICAL_RATIO);
    const y=centreY+
      (r.y-centreY)*echoVerticalCompensation+
      scatterY;

    if(x<-60||x>W+60||y<100||y>H+60)return;

    const temporal=Math.exp(-.5*Math.pow(
      Math.abs(s.ms-timeCenter)/Math.max(timelineSpanMs()*2.2,365*DAY*8),2
    ));
    const farBias=1-d;
    const score=farBias*.46+temporal*.20+.22*(1-s.representative)+.12*fract(s.id+3413);
    candidates.push({i,score,x,y,depth:d});
  });

  candidates.sort((a,b)=>b.score-a.score||a.i-b.i);

  const chosen=[];
  for(const cand of candidates){
    if(chosen.length>=FAR_ECHO_COUNT)break;
    let tooClose=false;
    for(const p of chosen){
      if(Math.hypot(cand.x-p.x,cand.y-p.y)<52){tooClose=true;break}
    }
    if(!tooClose)chosen.push(cand);
  }

  for(let slot=0;slot<FAR_ECHO_COUNT;slot++){
    const el=farEchoNodes[slot],cand=chosen[slot];
    if(!cand){
      el.style.opacity="0";
      farEchoAssignments[slot]=-1;
      continue;
    }

    const s=data[cand.i];
    if(farEchoAssignments[slot]!==cand.i){
      farEchoAssignments[slot]=cand.i;
      const img=el.querySelector("img");
      img.src=thumbUrl(s);
      img.decoding="async";
    }

    const d=clamp(cand.depth,0,1);
    const random=.86+.28*fract(s.id+3511);
    const size=lerp(.42,.68,d)*random;
    const opacity=(1-alpha)*lerp(.25,.35,d);

    const img=el.querySelector("img");
    img.style.filter="blur(.01px) saturate(1.18) brightness(1.06) contrast(1.10)";
    el.style.opacity=clamp(opacity,.19,.34).toFixed(3);
    el.style.transform="translate3d("+(cand.x-23)+"px,"+(cand.y-17)+"px,0) scale("+size.toFixed(3)+")";
    el.style.zIndex="1";
  }
}

function render(){
  syncDepthCameras();
  if(!timelineUser&&typeof centerMs!=="undefined")centerMs=timeCenter;
  active=spatialPinchTarget!=null?spatialPinchTarget:nearestMemoryToFocus();
  const alpha=presentationAlpha(),overview=overviewBlendForScale(),near=data[active];

  presentation.style.opacity=alpha.toFixed(3);
  presentationText.textContent=near.story;
  presentationDate.textContent=fullDate(near);
  presentationCopy.style.opacity=String(clamp((alpha-.10)/.9,0,1));
  presentationCopy.style.transform="translateY("+((1-alpha)*18)+"px)";
  if(alpha>.34)setBg(active);

  updateFocusBlock();
  if(zoomRead)zoomRead.textContent=Math.round(cam.s/SPACE_MAX*100)+"%";

  const raw=data.map((s,i)=>{
    const q=projectMemory(s);
    const face=smooth(-.18,.90,q.facing);
    const temporal=Math.exp(-.5*Math.pow(Math.abs(s.ms-timeCenter)/Math.max(timelineSpanMs(),365*DAY*1.5),2));
    let reveal=.22+.78*face;
    if(overview>.55)reveal=Math.max(reveal,.26+.34*temporal);
    return{
      x:q.x,y:q.y,facing:q.facing,depth:q.depth,perspective:q.perspective,
      temporal,reveal,opacity:reveal*(.28+.72*face)
    };
  });

  const foregroundRoles=foregroundStoryRoles(raw);
  const visibleSet=chooseVisibleRepresentatives(raw,alpha,foregroundRoles);
  const middleSet=renderEchoField(raw,visibleSet,alpha);
  renderFarEchoField(raw,visibleSet,middleSet,alpha);
  chooseMagneticSet(raw,alpha);
  const composed=composeForeground(raw,visibleSet);

  const roleRank=new Map(foregroundRoles.map((i,rank)=>[i,rank]));
  renderedCards.clear();

  // Keep only the current readable foreground stories as real DOM elements.
  releaseUnusedMemoryNodes(visibleSet);

  for(const i of visibleSet){
    const s=data[i];
    const r=raw[i],p=composed.get(i)||r;
    const rank=roleRank.has(i)?roleRank.get(i):99;
    const depth=clamp(r.depth,0,1);

    const timelineBottom=(timelineShell?.getBoundingClientRect().height||126)+22;
    const edgeX=Math.min(
      smooth(-104,42,r.x),
      1-smooth(W-42,W+104,r.x)
    );
    const edgeY=Math.min(
      smooth(timelineBottom-106,timelineBottom+36,r.y),
      1-smooth(H-72,H+106,r.y)
    );
    const edgeReveal=clamp(Math.min(edgeX,edgeY),0,1);

    let opacity=[1,.97,.95,.93,.91,.80][Math.min(rank,5)]||.80;
    opacity*=lerp(.88,1,depth)*(1-alpha*.94)*edgeReveal;
    if(i===active)opacity=Math.max(opacity,(1-alpha)*.98);

    // Exactly one story leads the scene. Four chronological neighbours remain
    // readable; everything else supports the wider photo universe.
    let scale=lerp(.72,1.02,depth);
    const rankScale=[1.56,1.20,1.18,1.16,1.14,.87][Math.min(rank,5)]||.87;
    scale*=rankScale;
    const zoomBreath=lerp(.86,1.04,clamp((cam.s-SPACE_MIN)/(SPACE_MAX-SPACE_MIN),0,1));
    scale*=zoomBreath;
    scale*=lerp(.86,1,smooth(.08,.92,edgeReveal));
    if(spatialPinchTarget===i)scale*=1+.18*smooth(.08,.92,spatialPinchStrength);
    scale=clamp(scale,.64,1.54);

    const el=memoryNode(i,true);
    if(opacity>.025)ensureCardImage(i);
    const img=el.querySelector("img");
    if(img)img.style.filter=rank===0
      ?"contrast(1.07) saturate(1.045)"
      :rank<5
        ?"contrast(1.02) saturate(1.01)"
        :"contrast(.985) saturate(.97)";
    el.style.opacity=opacity.toFixed(3);
    el.style.pointerEvents=opacity>.24?"auto":"none";
    el.style.zIndex=String(540+Math.round(depth*180)+(rank===0?118:rank<5?42:0)-Math.min(30,rank*4));
    el.style.transform="translate3d("+(p.x-66)+"px,"+(p.y-87)+"px,0) scale("+scale.toFixed(3)+")";
    el.classList.toggle("nearest",i===active&&alpha<.6);
    el.classList.remove("magnetic");
    renderedCards.set(i,{x:p.x,y:p.y,opacity,magnetic:false,selected:true});
  }

  preloadNearbyMemories();

  magnetRing.style.left="16px";magnetRing.style.right="16px";magnetRing.style.top="140px";magnetRing.style.bottom="92px";
  drawTimeline();

  hint.innerHTML=timelineUser
    ? '<b>De tijdbalk beweegt over de levensas.</b> Je longitude blijft staan terwijl je door de jaren gaat.'
    : alpha>.82
      ? 'Knijp uit het verhaal om terug te keren naar het <b>foto-stelsel</b>.'
      : '<b>Foto-stelsel:</b> beweeg vrij tussen de herinneringen · tik op een foto om het verhaal te openen.';
}
function resize(){
  const r=app.getBoundingClientRect();W=Math.max(1,r.width);H=Math.max(1,r.height);
  resizeSpaceFx();
  const oldMin=SPACE_MIN;
  SPACE_MIN=fitOverviewScale();
  if(cam.s<=oldMin+.015)cam.s=SPACE_MIN;
  else cam.s=Math.max(cam.s,SPACE_MIN);
  const cr=canvas.getBoundingClientRect(),dpr=Math.min(devicePixelRatio||1,2.5);
  canvas.width=Math.max(1,Math.round(cr.width*dpr));canvas.height=Math.max(1,Math.round(cr.height*dpr));
  render();
}
window.addEventListener("resize",resize,{passive:true});
window.visualViewport&&visualViewport.addEventListener("resize",resize,{passive:true});

/* ------------------- LIFE GLOBE TOUCH ------------------- */
let touch=null;
let globeInertiaRaf=0;
let globeMomentumShellLon=0,globeMomentumShellLat=0;

function localTouch(t){const r=app.getBoundingClientRect();return{x:t.clientX-r.left,y:t.clientY-r.top}}
function dist(a,b){return Math.hypot(b.x-a.x,b.y-a.y)}
function mid(a,b){return{x:(a.x+b.x)/2,y:(a.y+b.y)/2}}
function lerpLon(a,b,t){return wrapLon(a+wrapLon(b-a)*t)}

function storyAtScreenPoint(p){
  let best=null,bd=Infinity;
  for(const [i,r] of renderedCards){
    if(!r||!r.selected||r.opacity<.20)continue;
    const d=Math.hypot(r.x-p.x,r.y-p.y);
    if(d<bd){bd=d;best=i}
  }
  const radius=overviewBlendForScale()>.45?105:88;
  return bd<=radius?best:null;
}

function stopGlobeInertia(keepMomentum=false){
  cancelAnimationFrame(globeInertiaRaf);
  globeInertiaRaf=0;
  if(!keepMomentum){
    globeMomentumShellLon=0;
    globeMomentumShellLat=0;
  }
}

function startGlobeInertia(vShellLon,vShellLat,carryShellLon=0,carryShellLat=0){
  stopGlobeInertia();
  if(cam.s>=SWIPE_SPACE)return;

  // Gesture speed is observed only as the real shell velocity the finger built.
  // There is no extra launch multiplier and no special vertical brake.
  const fingerEqX=Math.abs(vShellLon)/SHELL_DRAG_PER_PX;
  const fingerEqY=Math.abs(vShellLat)/SHELL_DRAG_PER_PX;
  const launchIntent=clamp(Math.hypot(fingerEqX,fingerEqY),0,1.2);
  syncTimelineVisualFromSpace(launchIntent,34,performance.now());

  // A second push may still add momentum, but only gently. This keeps repeated
  // flicks useful without letting them build into a very fast spin.
  const carryEqX=Math.abs(carryShellLon)/SHELL_DRAG_PER_PX;
  if(carryEqX>.016&&Math.sign(carryShellLon)===Math.sign(vShellLon)){
    const carryStrength=.34*smooth(.016,.45,carryEqX);
    vShellLon+=carryShellLon*carryStrength;
  }
  const carryEqY=Math.abs(carryShellLat)/SHELL_DRAG_PER_PX;
  if(carryEqY>.016&&Math.sign(carryShellLat)===Math.sign(vShellLat)){
    const carryStrength=.34*smooth(.016,.45,carryEqY);
    vShellLat+=carryShellLat*carryStrength;
  }

  // Reduce only the released fling. Direct finger tracking above is untouched.
  vShellLon*=SHELL_RELEASE_DAMPING;
  vShellLat*=SHELL_RELEASE_DAMPING;

  vShellLon=clamp(vShellLon,-SHELL_MAX_COAST,SHELL_MAX_COAST);
  vShellLat=clamp(vShellLat,-SHELL_MAX_COAST,SHELL_MAX_COAST);
  if(Math.hypot(vShellLon,vShellLat)<SHELL_STOP_SPEED)return;

  globeMomentumShellLon=vShellLon;
  globeMomentumShellLat=vShellLat;

  let last=performance.now();
  let lived=0;

  function frame(now){
    const dt=clamp(now-last,8,34);
    last=now;lived+=dt;

    // First travel a distance over the shell; circumference then determines
    // the internal rotation necessary to realize exactly that travel.
    const lonTravel=globeMomentumShellLon*dt;
    const latTravel=globeMomentumShellLat*dt;
    cam.x=wrapLon(cam.x+shellLonDistanceToRotation(lonTravel));

    const wantedY=cam.y+shellLatDistanceToRotation(latTravel,cam.y);
    const nextY=clampCamY(wantedY);
    if(nextY!==wantedY)globeMomentumShellLat=0;
    cam.y=nextY;

    syncTimeFromSpace();
    render();

    // Surface friction is size-independent. The resulting angular braking is
    // automatically stronger or weaker because circumference handles conversion.
    globeMomentumShellLon*=Math.exp(-dt/SHELL_COAST_DECAY_MS);
    globeMomentumShellLat*=Math.exp(-dt/SHELL_COAST_DECAY_MS);

    if(lived<2600&&Math.hypot(globeMomentumShellLon,globeMomentumShellLat)>SHELL_STOP_SPEED){
      globeInertiaRaf=requestAnimationFrame(frame);
    }else{
      globeInertiaRaf=0;
      globeMomentumShellLon=0;
      globeMomentumShellLat=0;
    }
  }
  globeInertiaRaf=requestAnimationFrame(frame);
}
app.addEventListener("touchstart",e=>{
  if(e.target.closest("button,#timelineShell"))return;
  const carryShellLon=globeInertiaRaf?globeMomentumShellLon:0;
  const carryShellLat=globeInertiaRaf?globeMomentumShellLat:0;
  stopGlobeInertia(true);
  e.preventDefault();hint.style.display="none";

  if(e.touches.length===1){
    if(cam.s<SWIPE_SPACE)cancelVisualScaleAnimation();
    const p=localTouch(e.touches[0]);
    const card=e.target.closest(".memory");
    const directIndex=card?Number(card.dataset.memoryIndex):-1;
    const tapTarget=Number.isInteger(directIndex)&&directIndex>=0?directIndex:storyAtScreenPoint(p);
    touch={
      kind:"one",
      start:p,last:p,
      lon:cam.x,lat:cam.y,s:cam.s,active,
      tapTarget,
      travel:0,
      lastT:performance.now(),
      vShellLon:0,vShellLat:0,
      dragSpeed:0,
      carryShellLon,carryShellLat
    };
  }else if(e.touches.length>=2){
    if(cam.s<SWIPE_SPACE){
      spatialPinchTarget=null;spatialPinchStrength=0;
      touch={kind:"spaceNoZoom",s:SPACE_VIEW_SCALE};
    }else{
      const a=localTouch(e.touches[0]),b=localTouch(e.touches[1]),m=mid(a,b);
      const target=storyAtScreenPoint(m);
      spatialPinchTarget=target;spatialPinchStrength=0;
      touch={
        kind:"pinch",
        d:Math.max(10,dist(a,b)),
        s:cam.s,
        lon:cam.x,
        lat:cam.y,
        target,
        mid:m
      };
    }
  }
},{passive:false});

app.addEventListener("touchmove",e=>{
  if(!touch)return;
  e.preventDefault();

  if(e.touches.length>=2){
    // No pinch zoom on the life globe. A pinch that started in presentation
    // may still be used to leave the story; the timeline has its own handler.
    if(touch.kind==="spaceNoZoom"||(touch.kind!=="pinch"&&cam.s<SWIPE_SPACE)){
      touch={kind:"spaceNoZoom",s:SPACE_VIEW_SCALE};
      spatialPinchTarget=null;spatialPinchStrength=0;
      cam.s=SPACE_VIEW_SCALE;
      return;
    }

    const a=localTouch(e.touches[0]),b=localTouch(e.touches[1]),m=mid(a,b);

    if(touch.kind!=="pinch"){
      const target=storyAtScreenPoint(m);
      spatialPinchTarget=target;spatialPinchStrength=0;
      touch={kind:"pinch",d:Math.max(10,dist(a,b)),s:cam.s,lon:cam.x,lat:cam.y,target,mid:m};
    }

    const rawRatio=dist(a,b)/touch.d;
    const gentleRatio=Math.pow(rawRatio,.58);
    const ns=clamp(touch.s*gentleRatio,SPACE_MIN,SPACE_MAX);
    const zoomingIn=rawRatio>=1;
    spatialPinchStrength=clamp(Math.abs(Math.log(Math.max(.001,gentleRatio)))*1.6,0,1);
    cam.s=ns;

    if(touch.target!=null&&zoomingIn){
      const target=data[touch.target];
      const commit=smooth(.06,.80,spatialPinchStrength);
      cam.x=lerpLon(touch.lon,target.lon,commit*.88);
      cam.y=lerp(touch.lat,target.lat,commit*.88);
      timeCenter=lerp(timeCenter,target.ms,.10+.26*commit);
      if(typeof centerMs!=="undefined")centerMs=timeCenter;
    }else{
      cam.x=touch.lon;cam.y=touch.lat;
      syncTimeFromSpace();
    }

    render();
    return;
  }

  if(e.touches.length===1&&touch.kind==="one"){
    const p=localTouch(e.touches[0]);
    touch.travel=Math.max(touch.travel,dist(touch.start,p));

    if(touch.s>=SWIPE_SPACE){
      const dy=Math.max(0,p.y-touch.start.y);
      const pull=clamp(dy/240,0,1);
      presentation.style.transition="none";
      presentation.style.transform="translate3d(0,"+(dy*.16).toFixed(1)+"px,0) scale("+(1-pull*.035).toFixed(4)+")";
    }

    if(touch.s<SWIPE_SPACE){
      const now=performance.now();
      const dt=clamp(now-touch.lastT,8,48);
      const dx=p.x-touch.last.x,dy=p.y-touch.last.y;
      const nav=1/Math.max(.60,cam.s);

      // One gesture, three natural gears:
      // slow = precision under the thumb, normal = direct navigation,
      // fast = full-speed push that can continue into inertia.
      const instFingerSpeed=Math.hypot(dx,dy)/dt;
      const speedAlpha=1-Math.exp(-dt/70);
      touch.dragSpeed=lerp(touch.dragSpeed||0,instFingerSpeed,speedAlpha);
      syncTimelineVisualFromSpace(touch.dragSpeed,dt,now);

      const gear=smooth(.035,.30,touch.dragSpeed);
      const timelinePrecision=smooth(.48,.96,visualZoomPos);
      const precisionWeight=(1-gear)*timelinePrecision;

      const shellGain=lerp(.56,1.06,gear)*lerp(1,.76,precisionWeight);

      // Both directions move the same concrete distance over the shell.
      // The age-driven vertical ellipse converts that distance into less
      // north/south rotation, creating proportionate physical room for life time.
      const dShellLon=-dx*SHELL_DRAG_PER_PX*nav*shellGain;
      const dShellLat=dy*SHELL_DRAG_PER_PX*nav*shellGain;
      cam.x=wrapLon(cam.x+shellLonDistanceToRotation(dShellLon));
      cam.y=clampCamY(cam.y+shellLatDistanceToRotation(dShellLat,cam.y));

      const instShellLon=dShellLon/dt,instShellLat=dShellLat/dt;
      const velocityAlpha=1-Math.exp(-dt/62);
      touch.vShellLon=lerp(touch.vShellLon,instShellLon,velocityAlpha);
      touch.vShellLat=lerp(touch.vShellLat,instShellLat,velocityAlpha);

      syncTimeFromSpace();
      render();
      touch.lastT=now;
    }

    touch.last=p;
  }
},{passive:false});

app.addEventListener("touchend",e=>{
  if(!touch)return;
  e.preventDefault();

  const finished=touch;

  // Space: a still tap opens exactly that card; a drag can continue with momentum.
  if(e.touches.length===0&&finished.kind==="one"&&finished.s<SWIPE_SPACE){
    const p=finished.last||finished.start;
    const moved=Math.max(finished.travel||0,dist(finished.start,p));

    touch=null;spatialPinchTarget=null;spatialPinchStrength=0;

    if(moved<=14&&finished.tapTarget!=null){
      globeMomentumShellLon=0;globeMomentumShellLat=0;
      openStorySmooth(finished.tapTarget);
      return;
    }

    render();
    if(moved>7)startGlobeInertia(finished.vShellLon,finished.vShellLat,finished.carryShellLon||0,finished.carryShellLat||0);
    else{globeMomentumShellLon=0;globeMomentumShellLat=0}
    return;
  }

  // Presentation: swipe down sends the photo back into the universe.
  // Horizontal swipes still move exactly one story at a time.
  if(e.touches.length===0&&finished.kind==="one"&&finished.s>=SWIPE_SPACE){
    const p=finished.last||finished.start;
    const dx=p.x-finished.start.x,dy=p.y-finished.start.y;

    touch=null;spatialPinchTarget=null;spatialPinchStrength=0;

    if(dy>62&&dy>Math.abs(dx)*1.05){
      resetPresentationDrag(false);
      closeStorySmooth(finished.active);
      return;
    }

    resetPresentationDrag(true);
    if(Math.abs(dx)>42&&Math.abs(dx)>Math.abs(dy)*1.2){
      focusStory(finished.active+(dx<0?1:-1));
    }
    return;
  }

  if(e.touches.length===0&&finished.kind==="pinch"&&finished.target!=null&&cam.s>finished.s){
    const target=data[finished.target];
    const commit=smooth(.30,.88,spatialPinchStrength);
    timeCenter=lerp(timeCenter,target.ms,.24+.50*commit);
    if(typeof centerMs!=="undefined")centerMs=timeCenter;
    if(commit>.58)active=finished.target;
  }
  if(e.touches.length===0&&finished.kind==="pinch"&&finished.s>=SWIPE_SPACE&&cam.s<SWIPE_SPACE){
    cam.s=SPACE_VIEW_SCALE;
    syncTimeFromSpace();
  }
  if(e.touches.length===0&&finished.kind==="spaceNoZoom"){
    cam.s=SPACE_VIEW_SCALE;
  }

  touch=null;spatialPinchTarget=null;spatialPinchStrength=0;
  render();
},{passive:false});

app.addEventListener("touchcancel",()=>{
  touch=null;spatialPinchTarget=null;spatialPinchStrength=0;render();
},{passive:false});

const storyBtn=document.getElementById("storyBtn");
const wideBtn=document.getElementById("wideBtn");
const minusBtn=document.getElementById("minusBtn");
const plusBtn=document.getElementById("plusBtn");
const fieldBtn=document.getElementById("fieldBtn");
if(storyBtn)storyBtn.onclick=()=>focusStory(nearestMemoryToFocus());
if(wideBtn)wideBtn.onclick=wide;
if(minusBtn)minusBtn.onclick=()=>{};
if(plusBtn)plusBtn.onclick=()=>{};

OVERVIEW_ANCHORS.forEach(preloadThumb);
for(let i=Math.max(0,active-5);i<=Math.min(data.length-1,active+5);i++)preloadThumb(i);
centerMs=timeCenter;
visualZoomPos=zoomPos;
timelineSpanYears=spanForZoom(visualZoomPos)/DAYS_YEAR;
resize();setBg(active);render();
spaceFxRaf=requestAnimationFrame(spaceFxLoop);
})();
