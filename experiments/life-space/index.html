<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0d141a">
<title>Talera — Life Globe / Photo Galaxy</title>
<style>
:root{
  --safeT:env(safe-area-inset-top,0px);
  --safeB:env(safe-area-inset-bottom,0px);
  --glass:rgba(8,14,19,.46);
  --border:rgba(255,255,255,.15);
  --muted:rgba(255,255,255,.68);
  --accent:#fff0ae;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0a1015;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;overscroll-behavior:none}
body{position:fixed;inset:0}
button{font:inherit;color:inherit}
#app{position:absolute;inset:0;overflow:hidden;touch-action:none;background:#0b1117;-webkit-user-select:none;user-select:none}
#bg{position:absolute;inset:-8%;background:
  radial-gradient(circle at 48% 39%,rgba(112,151,177,.30),transparent 23%),
  radial-gradient(circle at 18% 67%,rgba(116,84,143,.18),transparent 30%),
  radial-gradient(circle at 84% 72%,rgba(58,122,142,.18),transparent 29%),
  radial-gradient(circle at 72% 18%,rgba(198,176,126,.08),transparent 22%),
  radial-gradient(circle at 50% 50%,rgba(15,29,39,.54),rgba(6,12,18,.83) 66%,#02060a 100%);
  transform:scale(1.08);overflow:hidden}
#bg:before{content:"";position:absolute;inset:0;opacity:.74;background-image:
  radial-gradient(circle at 9% 16%,rgba(255,255,255,.55) 0 1px,transparent 1.5px),
  radial-gradient(circle at 22% 76%,rgba(194,223,240,.38) 0 1px,transparent 1.6px),
  radial-gradient(circle at 34% 31%,rgba(255,255,255,.34) 0 1px,transparent 1.4px),
  radial-gradient(circle at 47% 87%,rgba(255,255,255,.30) 0 1px,transparent 1.5px),
  radial-gradient(circle at 57% 12%,rgba(196,220,237,.42) 0 1px,transparent 1.6px),
  radial-gradient(circle at 69% 58%,rgba(255,255,255,.35) 0 1px,transparent 1.5px),
  radial-gradient(circle at 78% 23%,rgba(255,255,255,.50) 0 1px,transparent 1.6px),
  radial-gradient(circle at 91% 81%,rgba(191,220,238,.38) 0 1px,transparent 1.5px),
  radial-gradient(circle at 14% 49%,rgba(255,255,255,.25) 0 1px,transparent 1.5px),
  radial-gradient(circle at 63% 38%,rgba(255,255,255,.23) 0 1px,transparent 1.4px);
  filter:blur(.15px)}
#bg:after{content:"";position:absolute;inset:0;background:
  linear-gradient(118deg,transparent 0 34%,rgba(136,176,198,.055) 42%,transparent 50%),
  linear-gradient(72deg,transparent 0 58%,rgba(207,186,137,.035) 66%,transparent 74%),
  radial-gradient(ellipse at center,rgba(26,48,61,.10) 0 28%,transparent 48%,rgba(1,4,7,.46) 100%)}
#world{position:absolute;inset:0;overflow:hidden;touch-action:none}
#echoLayer{position:absolute;inset:0;z-index:1;pointer-events:none;overflow:hidden}
.memoryEcho{position:absolute;width:56px;height:42px;border-radius:7px;overflow:hidden;background:#1c2931;border:1px solid rgba(255,255,255,.10);box-shadow:0 5px 18px rgba(0,0,0,.22),0 0 16px rgba(114,167,198,.055);will-change:transform,opacity;opacity:0;transform-origin:center}
.memoryEcho img{width:100%;height:100%;object-fit:cover;filter:blur(.16px) saturate(.88) brightness(.88)}
.memoryEcho:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.04),rgba(0,0,0,.08))}

.memory{position:absolute;z-index:3;width:132px;height:174px;border-radius:18px;overflow:hidden;background:#26343b;border:1px solid rgba(255,255,255,.18);box-shadow:0 18px 50px rgba(0,0,0,.38);transform-origin:center;will-change:transform,opacity;pointer-events:none}
.memory img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#26343b}
.memoryShade{position:absolute;inset:0;background:linear-gradient(180deg,transparent 36%,rgba(0,0,0,.82) 100%)}
.memoryCopy{position:absolute;left:10px;right:10px;bottom:10px;text-shadow:0 2px 8px rgba(0,0,0,.78)}
.memoryText{font-size:10.6px;line-height:1.16;font-weight:710;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.memoryDate{font-size:8.8px;color:rgba(255,255,255,.7);margin-top:5px}
.memory.nearest{outline:1.5px solid rgba(255,255,255,.9);outline-offset:2px}
.memory.magnetic{box-shadow:0 17px 46px rgba(0,0,0,.42),0 0 0 1px rgba(255,240,174,.12)}

/* Presentation becomes the first point on the same zoom continuum. */
#presentation{position:absolute;z-index:18;inset:0;pointer-events:none;opacity:1;will-change:opacity}
#presentation img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#presentationVeil{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.02) 32%,rgba(0,0,0,.13) 56%,rgba(0,0,0,.82) 100%)}
#presentationCopy{position:absolute;left:22px;right:22px;bottom:calc(91px + var(--safeB));text-shadow:0 2px 11px rgba(0,0,0,.7);will-change:opacity,transform}
#presentationText{font-size:27px;line-height:1.05;font-weight:760;letter-spacing:-.03em}
#presentationDate{font-size:12px;margin-top:10px;color:rgba(255,255,255,.79)}

/* Original Talera timeline language: one continuous ruler with a fixed centre needle. */
#timelineShell{
  position:absolute;z-index:80;left:0;right:0;top:0;
  height:clamp(116px,16dvh,138px);
  padding-top:var(--safeT);
  overflow:hidden;touch-action:none;user-select:none;
  background:linear-gradient(180deg,rgba(255,254,252,.94) 0%,rgba(220,234,246,.70) 100%);
  border-bottom:1px solid rgba(15,39,71,.10);
  backdrop-filter:blur(13px);-webkit-backdrop-filter:blur(13px);
}
#timelineCanvas{position:absolute;left:0;right:0;top:calc(24px + var(--safeT));width:100%;height:calc(100% - 24px - var(--safeT));touch-action:none}
#needle{
  position:absolute;z-index:3;left:50%;top:calc(11px + var(--safeT));bottom:8px;width:2px;
  transform:translateX(-1px);pointer-events:none;
  background:linear-gradient(180deg,rgba(15,39,71,.05),#0F2747 15%,#0F2747 88%,rgba(15,39,71,.05));
}
#needle::before{
  content:"";position:absolute;left:50%;top:0;width:10px;height:10px;border-radius:50%;
  transform:translate(-50%,-50%);background:#E7A98B;
  box-shadow:0 0 0 4px rgba(231,169,139,.18),0 0 0 7px rgba(91,143,185,.07);
}
#focusBlock{
  position:absolute;z-index:5;left:50%;top:calc(16px + var(--safeT));transform:translateX(-50%);
  border-radius:999px;color:#0F2747;background:rgba(255,254,252,.95);
  border:1px solid rgba(91,143,185,.20);white-space:nowrap;pointer-events:none;
  box-shadow:0 5px 18px rgba(15,39,71,.07);
  will-change:font-size,padding,transform,opacity;
}
#focusRange{display:block;font-weight:700;letter-spacing:.005em;line-height:1}
#timelineHint{
  position:absolute;z-index:4;left:50%;bottom:4px;transform:translateX(-50%);
  font-size:8px;color:rgba(15,39,71,.40);pointer-events:none;white-space:nowrap;
}

#hint{position:absolute;z-index:75;left:50%;bottom:calc(72px + var(--safeB));transform:translateX(-50%);width:min(90vw,440px);padding:10px 13px;border-radius:16px;background:rgba(5,10,14,.48);border:1px solid rgba(255,255,255,.13);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);font-size:12px;line-height:1.35;text-align:center;color:rgba(255,255,255,.9);pointer-events:none}
#controls{position:absolute;z-index:78;left:11px;right:11px;bottom:calc(11px + var(--safeB));display:flex;align-items:center;justify-content:space-between;gap:7px}
.group{display:flex;gap:7px}
.btn{border:1px solid rgba(255,255,255,.15);background:rgba(5,10,14,.47);border-radius:999px;padding:9px 11px;font-size:11px;font-weight:720;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
#zoomRead{font-size:10px;color:rgba(255,255,255,.72);min-width:44px;text-align:center}
#toast{position:absolute;z-index:95;left:50%;top:calc(128px + var(--safeT));transform:translateX(-50%);padding:7px 11px;border-radius:999px;background:rgba(4,8,11,.73);font-size:10px;opacity:0;transition:opacity .15s;pointer-events:none;white-space:nowrap}
#toast.on{opacity:1}
#magnetDebug{position:absolute;z-index:2;inset:0;pointer-events:none;opacity:0}
.debug #magnetDebug{opacity:1}
#magnetRing{position:absolute;border:1px dashed rgba(255,244,196,.25);border-radius:24px}

@media(min-width:700px){
  #app{width:430px;height:min(900px,100vh);left:50%;top:50%;right:auto;bottom:auto;transform:translate(-50%,-50%);border-radius:36px;box-shadow:0 35px 100px rgba(0,0,0,.5)}
}
</style>
</head>
<body>
<div id="app">
  <div id="bg"></div>
  <div id="world"><div id="echoLayer"></div><div id="magnetDebug"><div id="magnetRing"></div></div></div>

  <div id="presentation">
    <img id="presentationImg" alt="">
    <div id="presentationVeil"></div>
    <div id="presentationCopy"><div id="presentationText"></div><div id="presentationDate"></div></div>
  </div>

  <div id="timelineShell" aria-label="Talera levenslijn">
    <canvas id="timelineCanvas"></canvas>
    <div id="needle"></div>
    <div id="focusBlock"><span id="focusRange">1972–2026</span></div>
    <div id="timelineHint">sleep door de tijd · knijp voor schaal</div>
  </div>

  <div id="hint">Gebruik de <b>tijdbalk bovenin</b> om gericht door je leven te bewegen, of zoek vrij met je vingers tussen de verhalen.</div>

  <div id="controls">
    <div class="group"><button class="btn" id="storyBtn">Verhaal</button><button class="btn" id="wideBtn">Ruimte</button></div>
    <span id="zoomRead">100%</span>
    <div class="group"><button class="btn" id="minusBtn">−</button><button class="btn" id="plusBtn">+</button><button class="btn" id="fieldBtn">Magneet</button></div>
  </div>
  <div id="toast"></div>
</div>

<script>
const MEMORIES=[{"id":1,"at":"1982-05-14T15:20:00","story":"De eerste keer alleen naar school. Vooral die veel te grote tas is blijven hangen.","image":"https://images.unsplash.com/photo-1778142867112-ac896c976245?auto=format&fit=max&fm=jpg&q=76&w=1400"},{"id":2,"at":"1983-12-24T18:10:00","story":"Kerst bij opa en oma, met iedereen veel te dicht rond één tafel.","image":"https://images.unsplash.com/photo-1774688168997-2a82d06a6188?auto=format&fit=max&fm=jpg&q=76&w=1400"},{"id":3,"at":"1985-07-18T11:30:00","story":"Een middag aan het water waarop de zomer eindeloos leek te duren.","image":"https://images.unsplash.com/photo-1779518083320-b7b21edc8d2b?auto=format&fit=max&fm=jpg&q=76&w=1400"},{"id":4,"at":"1987-04-30T13:15:00","story":"Koninginnedag in de stad. Overal muziek, kleedjes en muntjes in mijn zak.","image":"https://images.unsplash.com/photo-1784654433247-a52f3f204509?auto=format&fit=max&fm=jpg&q=76&w=1400"},{"id":5,"at":"1989-08-12T16:40:00","story":"De vakantie waarop ik voor het eerst echt zelf op ontdekking ging.","image":"https://images.unsplash.com/photo-1783995343989-23f10b526f46?auto=format&fit=max&fm=jpg&q=76&w=1400"},{"id":6,"at":"1991-06-01T20:05:00","story":"Een lange avond buiten met vrienden. Niemand wilde als eerste naar huis.","image":"https://images.unsplash.com/photo-1780329904432-e022b066526b?auto=format&fit=max&fm=jpg&q=76&w=1400"},{"id":7,"at":"1993-09-06T08:15:00","story":"Nieuwe school, nieuwe gezichten en vooral doen alsof ik niet zenuwachtig was.","image":"https://images.unsplash.com/photo-1780329935489-b7b4d5d834e4?auto=format&fit=max&fm=jpg&q=76&w=1400"},{"id":8,"at":"1994-07-22T19:00:00","story":"De eerste avond van een vakantie die achteraf veel belangrijker bleek dan gedacht.","image":"https://images.unsplash.com/photo-1786048079501-7243455ab7aa?auto=format&fit=max&fm=jpg&q=76&w=1400"},{"id":9,"at":"1995-07-23T09:20:00","story":"Vroeg wakker, brood halen en daarna zonder plan op pad.","image":"https://images.unsplash.com/photo-1780329912791-05c5a05d4eeb?auto=format&fit=max&fm=jpg&q=76&w=1400"},{"id":10,"at":"1995-07-24T14:10:00","story":"Een onverwachte omweg werd uiteindelijk het mooiste deel van de dag.","image":"https://images.unsplash.com/photo-1780992632886-9f1af7aec50a?auto=format&fit=max&fm=jpg&q=76&w=1400"},{"id":11,"at":"1995-07-25T21:30:00","story":"Met z'n allen buiten blijven zitten tot het echt donker was.","image":"https://images.unsplash.com/photo-1781750428131-cc7848996d90?auto=format&fit=max&fm=jpg&q=76&w=1400"},{"id":12,"at":"1996-01-01T00:20:00","story":"Nieuwjaarsnacht. Het gevoel dat er ineens van alles mogelijk was.","image":"https://images.unsplash.com/photo-1769117438403-4d22358c8132?auto=format&fit=max&fm=jpg&q=76&w=1400"},{"id":13,"at":"1997-05-17T17:45:00","story":"Een kleine overwinning waar ik toen veel trotser op was dan ik liet merken.","image":"https://images.unsplash.com/photo-1760115112683-3bedf5bc68a7?auto=format&fit=max&fm=jpg&q=76&w=1400"},{"id":14,"at":"1998-10-04T12:00:00","story":"Een zondagse wandeling die later vooral door één gesprek is blijven hangen.","image":"https://images.unsplash.com/photo-1767595666159-48794b9e9a7e?auto=format&fit=max&fm=jpg&q=76&w=1400"},{"id":15,"at":"2000-03-12T10:30:00","story":"De sleutel van mijn eerste eigen plek in mijn hand.","image":"https://images.unsplash.com/photo-1769421162757-a07a7c942c3c?auto=format&fit=max&fm=jpg&q=76&w=1400"},{"id":16,"at":"2001-06-30T18:50:00","story":"Een tuin vol mensen en het besef dat een nieuwe fase echt begonnen was.","image":"https://images.unsplash.com/photo-1770563182237-915707b86c9e?auto=format&fit=max&fm=jpg&q=76&w=1400"},{"id":17,"at":"2002-07-01T08:40:00","story":"De ochtend erna: koffie, rommel en vooral heel veel nagenieten.","image":"https://images.unsplash.com/photo-1752650143275-fb7ef0c27dfc?auto=format&fit=max&fm=jpg&q=76&w=1400"},{"id":18,"at":"2003-11-08T16:15:00","story":"Een regenachtige dag die onverwacht gezellig werd.","image":"https://images.unsplash.com/photo-1760574761811-9f6861243d35?auto=format&fit=max&fm=jpg&q=76&w=1400"},{"id":19,"at":"2005-04-19T13:30:00","story":"Een besluit genomen waar ik weken tegenaan had gehikt.","image":"https://images.unsplash.com/photo-1783904984083-19d6dd72aa11?auto=format&fit=max&fm=jpg&q=76&w=1400"},{"id":20,"at":"2006-09-16T07:10:00","story":"Heel vroeg vertrekken met een auto vol spullen en veel te weinig koffie.","image":"https://images.unsplash.com/photo-1774800879603-dced24dee8f7?auto=format&fit=max&fm=jpg&q=76&w=1400"},{"id":21,"at":"2007-09-17T10:00:00","story":"De eerste wandeldag. Alles voelde nog nieuw en een beetje onwennig.","image":"https://images.unsplash.com/photo-1769415000137-dec30081dd2d?auto=format&fit=max&fm=jpg&q=76&w=1400"},{"id":22,"at":"2007-09-18T16:20:00","story":"Moe aankomen en toch nog uren napraten over de dag.","image":"https://images.unsplash.com/photo-1752650143569-fdde2123653d?auto=format&fit=max&fm=jpg&q=76&w=1400"},{"id":23,"at":"2008-12-31T23:50:00","story":"Tien minuten voor middernacht leek iedereen ineens tegelijk stil te worden.","image":"https://images.unsplash.com/photo-1776893019497-4ccb79f5b14a?auto=format&fit=max&fm=jpg&q=76&w=1400"},{"id":24,"at":"2010-05-22T12:25:00","story":"Een lunch die uitliep tot ver in de middag.","image":"https://images.unsplash.com/photo-1758613171233-f4e9a58a558a?auto=format&fit=max&fm=jpg&q=76&w=1400"},{"id":25,"at":"2011-08-14T09:45:00","story":"De ochtendmist trok langzaam weg en ineens lag het hele landschap open.","image":"https://images.unsplash.com/photo-1782212790904-5b658b182ffc?auto=format&fit=max&fm=jpg&q=76&w=1400"},{"id":26,"at":"2012-08-15T11:10:00","story":"Zonder haast door een onbekend dorp gelopen.","image":"https://images.unsplash.com/photo-1761839271800-f44070ff0eb9?auto=format&fit=max&fm=jpg&q=76&w=1400"},{"id":27,"at":"2012-08-16T15:35:00","story":"Een terras gevonden waar we uiteindelijk veel langer bleven dan gepland.","image":"https://images.unsplash.com/photo-1770564512486-c2f7cd3f853b?auto=   if(z>=4)return 1;
  const i=Math.floor(z),t=z-i;
  return Math.exp(lerp(Math.log(LEVELS[i].spanDays),Math.log(LEVELS[i+1].spanDays),t));
}
function activeLevel(){return clamp(Math.round(zoomPos),0,5)}
function bounds(){
  const span=spanForZoom(zoomPos);
  const half=span*MS_DAY/2;
  return[centerMs-half,centerMs+half,span];
}
function keepCenterValid(){
  const span=spanForZoom(zoomPos);
  const half=span*MS_DAY/2;
  const minCenter=LIFE_START+Math.min(half,(LIFE_END-LIFE_START)/2);
  centerMs=clamp(centerMs,minCenter,LIFE_END);
}
function syncGlobeFromFreeTimeline(){
  timeCenter=clampTime(centerMs);
  timelineSpanYears=spanForZoom(visualZoomPos)/DAYS_YEAR;
  // Timeline navigation changes latitude/date only. Longitude and globe zoom stay put.
  cam.y=sphereLatAtAge(ageFromMs(timeCenter));
}
function commitFreeTimeline(){
  syncGlobeFromFreeTimeline();
  timelineUser=userIsMoving;
  render();
}

function rr(x,y,w,h,r){
  r=Math.min(r,w/2,h/2);
  ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();
}
function aggregatePerDay(a,b){
  const i0=clamp(Math.floor(a),0,TOTAL_DAYS),i1=clamp(Math.ceil(b),0,TOTAL_DAYS);
  if(i1<=i0)return 0;
  let n=0;for(let i=i0;i<i1;i++)n+=dayCounts[i];
  return n/(i1-i0);
}
function densityBucket(level){return[60,7,1,1,1,null][level]}
function drawDensity(level,startMs,endMs,w,axisY){
  const startDay=(startMs-LIFE_START)/MS_DAY;
  const endDay=(endMs-LIFE_START)/MS_DAY;
  if(level===5){
    const stacks=new Map();
    for(const o of EVENT_OFFSETS){
      if(o<startDay||o>endDay)continue;
      const x=((LIFE_START+o*MS_DAY-startMs)/(endMs-startMs))*w;
      const slot=Math.floor(o*48);
      const s=stacks.get(slot)||0;stacks.set(slot,s+1);
      ctx.fillStyle="rgba(91,143,185,.88)";
      ctx.beginPath();ctx.arc(x,axisY-9-s*7,2.8,0,Math.PI*2);ctx.fill();
    }
    return;
  }
  const bucket=densityBucket(level);
  const visible=endDay-startDay;
  let bs=Math.floor(startDay/bucket)*bucket;
  for(;bs<endDay;bs+=bucket){
    const be=bs+bucket;
    const rate=aggregatePerDay(bs,be);
    if(rate<=0)continue;
    const intensity=1-Math.exp(-rate/(level===0?.055:.48));
    const mid=(bs+be)/2;
    const x=((LIFE_START+mid*MS_DAY-startMs)/(endMs-startMs))*w;
    const bw=Math.max(level<2?2.2:3.2,bucket/visible*w*.64);
    const bh=5+intensity*56;
    ctx.fillStyle="rgba(91,143,185,"+(.24+intensity*.66).toFixed(3)+")";
    rr(x-bw/2,axisY-bh,bw,bh,Math.min(4,bw/2));ctx.fill();
  }
}
function drawMemoryBeacons(level,startMs,endMs,w,axisY){
  const configs=[
    {stem:8,width:1.8,alpha:.46,r:1.8},
    {stem:13,width:2.4,alpha:.58,r:2.0},
    {stem:20,width:3.0,alpha:.68,r:2.2},
    {stem:27,width:3.5,alpha:.75,r:2.5},
    {stem:34,width:4.0,alpha:.82,r:2.8},
    {stem:0,width:0,alpha:0,r:0}
  ];
  if(level===5)return;
  const cfg=configs[level];
  for(const m of data){
    if(m.ms<startMs||m.ms>endMs)continue;
    const x=((m.ms-startMs)/(endMs-startMs))*w;
    ctx.strokeStyle="rgba(91,143,185,"+cfg.alpha+")";
    ctx.lineWidth=cfg.width;ctx.lineCap="round";
    ctx.beginPath();ctx.moveTo(x,axisY-3);ctx.lineTo(x,axisY-cfg.stem);ctx.stroke();
    ctx.fillStyle="rgba(91,143,185,"+Math.min(.92,cfg.alpha+.12)+")";
    ctx.beginPath();ctx.arc(x,axisY-cfg.stem,cfg.r,0,Math.PI*2);ctx.fill();
  }
}
function tick(x,axisY,major,label="",sub="",strongSub=false){
  if(x<-55||x>canvas.clientWidth+55)return;
  ctx.strokeStyle=major?"rgba(15,39,71,.66)":"rgba(62,74,89,.24)";
  ctx.lineWidth=major?1.5:1;
  ctx.beginPath();ctx.moveTo(x,axisY-(major?11:5));ctx.lineTo(x,axisY+(major?10:5));ctx.stroke();
  if(major&&label){
    ctx.textAlign="center";ctx.fillStyle="rgba(15,39,71,.90)";
    ctx.font="700 13px Inter,-apple-system,sans-serif";ctx.fillText(label,x,axisY+22);
    if(sub){
      ctx.fillStyle=strongSub?"rgba(15,39,71,.82)":"rgba(62,74,89,.58)";
      ctx.font=strongSub?"650 11.5px Inter,-apple-system,sans-serif":"11px Inter,-apple-system,sans-serif";
      ctx.fillText(sub,x,axisY+34);
    }
  }
}
function drawLevel0(startMs,endMs,w,axisY){
  const first=Math.floor(ageAt(startMs)),last=Math.ceil(ageAt(endMs));
  for(let age=first;age<=last;age++){
    if(age<0||age>60)continue;
    const ms=LIFE_START+age*DAYS_YEAR*MS_DAY;
    const x=((ms-startMs)/(endMs-startMs))*w;
    const major=age%5===0;
    tick(x,axisY,major,major?(age+" jaar"):"",major?String(new Date(ms).getFullYear()):"");
  }
}
function drawLevel1(startMs,endMs,w,axisY){
  let d=new Date(startMs),y=d.getFullYear(),m=d.getMonth()-1;
  for(let guard=0;guard<40;guard++){
    m++;if(m>11){m=0;y++}
    const ms=new Date(y,m,1).getTime();if(ms>endMs)break;
    const major=m%3===0,x=((ms-startMs)/(endMs-startMs))*w;
    tick(x,axisY,major,major?new Date(ms).toLocaleDateString("nl-NL",{month:"short"}):"",major?String(y):"",true);
  }
}
function drawLevel2(startMs,endMs,w,axisY){
  let month=new Date(new Date(startMs).getFullYear(),new Date(startMs).getMonth(),1);
  while(month.getTime()<=endMs){
    const ms=month.getTime(),x=((ms-startMs)/(endMs-startMs))*w;
    tick(x,axisY,true,month.toLocaleDateString("nl-NL",{month:"short"}),String(month.getFullYear()));
    month=new Date(month.getFullYear(),month.getMonth()+1,1);
  }
  let monday=new Date(startMs);monday.setHours(0,0,0,0);monday.setDate(monday.getDate()-((monday.getDay()+6)%7));
  for(let ms=monday.getTime();ms<=endMs;ms+=7*MS_DAY){
    const x=((ms-startMs)/(endMs-startMs))*w;tick(x,axisY,false);
  }
}
function drawLevel3(startMs,endMs,w,axisY){
  let d=new Date(startMs);d=new Date(d.getFullYear(),d.getMonth(),d.getDate());let i=0;
  for(let ms=d.getTime();ms<=endMs;ms+=MS_DAY,i++){
    const x=((ms-startMs)/(endMs-startMs))*w,major=i%2===0,dt=new Date(ms);
    tick(x,axisY,major,major?dt.toLocaleDateString("nl-NL",{weekday:"short",day:"numeric"}):"",major?dt.toLocaleDateString("nl-NL",{month:"short"}):"");
  }
}
function drawLevel4(startMs,endMs,w,axisY){
  const s=new Date(startMs);
  const dayStart=new Date(s.getFullYear(),s.getMonth(),s.getDate(),0,0,0,0).getTime();
  const points=[[dayStart,"00:00","nacht"],[dayStart+6*3600000,"06:00","ochtend"],[dayStart+12*3600000,"12:00","middag"],[dayStart+18*3600000,"18:00","avond"],[dayStart+24*3600000,"24:00","volgende dag"]];
  for(const [ms,label,sub] of points){
    const x=((ms-startMs)/(endMs-startMs))*w;tick(x,axisY,true,label,sub);
  }
}
function drawLevel5(startMs,endMs,w,axisY){
  let d=new Date(startMs);d.setSeconds(0,0);d.setMinutes(d.getMinutes()<30?0:30);
  for(let ms=d.getTime();ms<=endMs;ms+=30*60*1000){
    const dt=new Date(ms),major=dt.getMinutes()===0,x=((ms-startMs)/(endMs-startMs))*w;
    tick(x,axisY,major,major?dt.toLocaleTimeString("nl-NL",{hour:"2-digit",minute:"2-digit"}):"");
  }
}
function drawScale(level,startMs,endMs,w,axisY){
  ctx.strokeStyle="rgba(91,143,185,.44)";ctx.lineWidth=1.2;
  ctx.beginPath();ctx.moveTo(0,axisY+.5);ctx.lineTo(w,axisY+.5);ctx.stroke();
  if(level===0)drawLevel0(startMs,endMs,w,axisY);
  else if(level===1)drawLevel1(startMs,endMs,w,axisY);
  else if(level===2)drawLevel2(startMs,endMs,w,axisY);
  else if(level===3)drawLevel3(startMs,endMs,w,axisY);
  else if(level===4)drawLevel4(startMs,endMs,w,axisY);
  else drawLevel5(startMs,endMs,w,axisY);
}

// Stable visual search gears + direct timeline grip: copied from Free.
const pointers=new Map();
let dragStartX=0,dragStartCenter=0,dragSpanDays=spanForZoom(zoomPos),pinchStartDist=0,pinchStartZoom=0,pinchStartCenter=0,pinchStartMidX=0;
let visualZoomPos=zoomPos;
let visualScaleRaf=0;
let visualScaleTransitioning=false;
let visualIntentLevel=0;
let visualIntentSince=performance.now();
let visualGearHoldUntil=0;
let scaleLastX=0,scaleLastT=0,searchVelocity=0;
let gestureUsedPinch=false;

const VISUAL_AUTO_MAX_ZOOM=1;
const VISUAL_GEAR_HOLD_MS=1200;
const VISUAL_ZOOM_IN_DWELL_MS=[0,750];
const VISUAL_ZOOM_OUT_DWELL_MS=170;

function visualStageForZoom(z){return clamp(Math.round(Math.min(z,VISUAL_AUTO_MAX_ZOOM)),0,VISUAL_AUTO_MAX_ZOOM)}
function visualTargetForLevel(level){return clamp(level,0,VISUAL_AUTO_MAX_ZOOM)}
activeLevel=function(){return clamp(Math.round(visualZoomPos),0,5)};
bounds=function(){
  const span=spanForZoom(visualZoomPos),half=span*MS_DAY/2;
  return[centerMs-half,centerMs+half,span];
};
function dragSpanForCurrentVisual(){return visualZoomPos>=.82?spanForZoom(visualZoomPos):spanForZoom(zoomPos)}
function reanchorDragAt(x,spanDays=dragSpanForCurrentVisual()){
  dragStartX=x;dragStartCenter=centerMs;dragSpanDays=spanDays;
}
function visualLevelForSpeed(speed){return Math.max(0,speed)>=.60?0:1}
function resetVisualIntent(now=performance.now()){
  visualIntentLevel=visualStageForZoom(visualZoomPos);visualIntentSince=now;
}
function cancelVisualScaleAnimation(){
  cancelAnimationFrame(visualScaleRaf);visualScaleRaf=0;visualScaleTransitioning=false;
}
function animateVisualScaleTo(target,duration){
  cancelAnimationFrame(visualScaleRaf);
  const from=visualZoomPos,start=performance.now();visualScaleTransitioning=true;
  function frame(now){
    const t=clamp((now-start)/duration,0,1);
    visualZoomPos=lerp(from,target,1-Math.pow(1-t,3));
    commitFreeTimeline();
    if(t<1)visualScaleRaf=requestAnimationFrame(frame);
    else{
      visualZoomPos=target;visualScaleTransitioning=false;
      const settledAt=performance.now();
      visualIntentLevel=visualStageForZoom(target);visualIntentSince=settledAt;
      visualGearHoldUntil=settledAt+VISUAL_GEAR_HOLD_MS;
      if(pointers.size===1){
        const span=target>=.82?spanForZoom(target):spanForZoom(zoomPos);
        reanchorDragAt(scaleLastX,span);
      }
      commitFreeTimeline();
    }
  }
  visualScaleRaf=requestAnimationFrame(frame);
}
function considerVisualScale(speed,now){
  if(visualScaleTransitioning||pointers.size!==1)return;
  const current=visualStageForZoom(visualZoomPos),desired=visualLevelForSpeed(speed);
  if(desired===current){visualIntentLevel=current;visualIntentSince=now;return}
  const strongOverview=desired===0&&current>0&&speed>=.85;
  if(desired!==visualIntentLevel){
    visualIntentLevel=desired;visualIntentSince=strongOverview?now:Math.max(now,visualGearHoldUntil);return;
  }
  if(now<visualGearHoldUntil&&!strongOverview)return;
  if(desired<current){
    const dwell=strongOverview?90:VISUAL_ZOOM_OUT_DWELL_MS;
    if(now-visualIntentSince<dwell)return;
    animateVisualScaleTo(visualTargetForLevel(desired),260);return;
  }
  const next=Math.min(VISUAL_AUTO_MAX_ZOOM,current+1);
  if(now-visualIntentSince<VISUAL_ZOOM_IN_DWELL_MS[next])return;
  animateVisualScaleTo(visualTargetForLevel(next),360);
}

timelineShell.addEventListener("pointerdown",e=>{
  if(e.target.closest("button"))return;
  e.preventDefault();e.stopPropagation();
  userIsMoving=true;timelineUser=true;hint.style.display="none";
  timelineShell.setPointerCapture&&timelineShell.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pointers.size===1){
    reanchorDragAt(e.clientX);
    scaleLastX=e.clientX;scaleLastT=performance.now();searchVelocity=0;
    resetVisualIntent(scaleLastT);gestureUsedPinch=false;
  }else if(pointers.size===2){
    gestureUsedPinch=true;cancelVisualScaleAnimation();visualZoomPos=zoomPos;visualGearHoldUntil=0;
    const p=[...pointers.values()];
    pinchStartDist=Math.hypot(p[1].x-p[0].x,p[1].y-p[0].y);
    pinchStartZoom=zoomPos;pinchStartCenter=centerMs;pinchStartMidX=(p[0].x+p[1].x)/2;
  }
},{passive:false});

timelineShell.addEventListener("pointermove",e=>{
  if(!pointers.has(e.pointerId))return;
  e.preventDefault();e.stopPropagation();
  pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  const r=timelineShell.getBoundingClientRect();

  if(pointers.size===1){
    const now=performance.now();
    const segmentDx=e.clientX-scaleLastX;
    const dt=clamp(now-scaleLastT,8,48);
    const instantVelocity=Math.abs(segmentDx)/dt;
    const velocityTau=instantVelocity>searchVelocity?70:380;
    const velocityAlpha=1-Math.exp(-dt/velocityTau);
    searchVelocity=searchVelocity===0?instantVelocity:lerp(searchVelocity,instantVelocity,velocityAlpha);

    const dx=e.clientX-dragStartX;
    centerMs=dragStartCenter-(dx/r.width)*dragSpanDays*MS_DAY;

    scaleLastX=e.clientX;scaleLastT=now;
    considerVisualScale(searchVelocity,now);
    keepCenterValid();commitFreeTimeline();
  }else if(pointers.size===2){
    const p=[...pointers.values()];
    const dist=Math.max(20,Math.hypot(p[1].x-p[0].x,p[1].y-p[0].y));
    const mid=(p[0].x+p[1].x)/2;
    zoomPos=clamp(pinchStartZoom+Math.log(dist/pinchStartDist)*1.8,0,5);
    visualZoomPos=zoomPos;

    const oldSpan=spanForZoom(pinchStartZoom),newSpan=spanForZoom(zoomPos);
    const oldRel=(pinchStartMidX-r.left)/r.width-.5;
    const anchor=pinchStartCenter+oldRel*oldSpan*MS_DAY;
    const newRel=(mid-r.left)/r.width-.5;
    centerMs=anchor-newRel*newSpan*MS_DAY;

    keepCenterValid();commitFreeTimeline();
  }
},{passive:false});

function pointerEnd(e){
  if(pointers.has(e.pointerId))pointers.delete(e.pointerId);
  e.preventDefault();e.stopPropagation();
  if(pointers.size===0){
    userIsMoving=false;timelineUser=false;
    scheduleSnap(gestureUsedPinch);searchVelocity=0;
    commitFreeTimeline();
  }else if(pointers.size===1){
    const p=[...pointers.values()][0];
    reanchorDragAt(p.x);scaleLastX=p.x;scaleLastT=performance.now();searchVelocity=0;
    resetVisualIntent(scaleLastT);
  }
}
timelineShell.addEventListener("pointerup",pointerEnd,{passive:false});
timelineShell.addEventListener("pointercancel",pointerEnd,{passive:false});

function scheduleSnap(syncVisual=false){
  clearTimeout(snapTimer);
  snapTimer=setTimeout(()=>animateZoomTo(Math.round(zoomPos),280,syncVisual),170);
}
function animateZoomTo(target,duration,syncVisual=false){
  cancelAnimationFrame(timelineRaf);
  const from=zoomPos,start=performance.now();
  if(syncVisual)cancelVisualScaleAnimation();
  function frame(now){
    const t=clamp((now-start)/duration,0,1);
    zoomPos=lerp(from,target,1-Math.pow(1-t,3));
    if(syncVisual)visualZoomPos=zoomPos;
    keepCenterValid();commitFreeTimeline();
    if(t<1)timelineRaf=requestAnimationFrame(frame);
  }
  timelineRaf=requestAnimationFrame(frame);
}

function updateFocusBlock(){
  const level=activeLevel();
  if(Math.abs(centerMs-LIFE_END)<60000)focusRange.textContent="vandaag";
  else if(level===5)focusRange.textContent=new Date(centerMs).toLocaleTimeString("nl-NL",{hour:"2-digit",minute:"2-digit"});
  else focusRange.textContent=new Date(centerMs).toLocaleDateString("nl-NL",{day:"numeric",month:"short",year:"numeric"});

  // Keep our current visual glass shell, but use the exact Free date content.

  focusBlock.style.padding=lerp(7,4,deep).toFixed(1)+"px "+lerp(14,8,deep).toFixed(1)+"px";
  focusBlock.style.opacity=String(lerp(.98,.82,deep));
  focusBlock.style.transform="translateX(-50%) scale("+lerp(1,.95,deep).toFixed(3)+")";
}

function drawTimeline(){
  const r=canvas.getBoundingClientRect(),dpr=Math.min(devicePixelRatio||1,2.4),w=r.width,h=r.height;
  if(!w||!h)return;
  canvas.width=Math.max(1,Math.round(w*dpr));canvas.height=Math.max(1,Math.round(h*dpr));
  ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,w,h);

  const [startMs,endMs]=bounds();
  const axisY=h-64;
  const level=activeLevel();
  drawDensity(level,startMs,endMs,w,axisY);
  drawMemoryBeacons(level,startMs,endMs,w,axisY);
  drawScale(level,startMs,endMs,w,axisY);
}

/* ------------------- MAGNETIC SPACE ------------------- *//* ------------------- MAGNETIC SPACE ------------------- */
function visibleBudgetForScale(){
  // Five or six clear stories is the hard ceiling of the globe view.
  const z=clamp((cam.s-SPACE_MIN)/(SPACE_MAX-SPACE_MIN),0,1);
  return z<.22?5:6;
}

function chooseVisibleRepresentatives(raw,alpha){
  if(alpha>.92)return new Set([active]);

  const budget=visibleBudgetForScale();
  const overview=overviewBlendForScale();
  const candidates=[];

  data.forEach((s,i)=>{
    const r=raw[i];
    if(r.facing<-.035 && spatialPinchTarget!==i)return;
    const nearScreen=r.x>-150&&r.x<W+150&&r.y>105&&r.y<H+130;
    if(!nearScreen&&spatialPinchTarget!==i)return;

    const temporalWindow=Math.max(timelineSpanMs(),120*DAY);
    const dt=Math.abs(s.ms-timeCenter);
    const clearWindow=Math.max(100*DAY,temporalWindow*.68);
    if(dt>clearWindow && spatialPinchTarget!==i)return;
    const temporal=Math.exp(-.5*Math.pow(dt/(temporalWindow*.40),2));
    const face=smooth(-.04,.92,r.facing);
    const centre=1-clamp(Math.hypot(r.x-W/2,r.y-H*.52)/(Math.max(W,H)*.80),0,1);
    const targetBoost=spatialPinchTarget===i?4:0;
    const stable=.22*(1-s.representative);
    const broad=overview*(.22+.25*(1-Math.abs(s.age-LIFE_YEARS*.5)/(LIFE_YEARS*.5)));
    const score=face*.88+temporal*.56+centre*.26+stable+broad+targetBoost;
    candidates.push({i,score,x:r.x,y:r.y,facing:r.facing});
  });
  candidates.sort((a,b)=>b.score-a.score||a.i-b.i);

  const chosen=new Set();
  if(spatialPinchTarget!=null)chosen.add(spatialPinchTarget);
  if(raw[active]?.facing>-.02)chosen.add(active);

  const placed=[];
  for(const i of chosen){
    const r=raw[i];if(r)placed.push({x:r.x,y:r.y});
  }
  const minGap=overview>.55?128:148;

  // Strong spacing is intentional: empty space is part of the design.
  for(const cand of candidates){
    if(chosen.size>=budget)break;
    if(chosen.has(cand.i))continue;
    let nearest=Infinity;
    for(const p of placed)nearest=Math.min(nearest,Math.hypot(cand.x-p.x,cand.y-p.y));
    if(nearest<minGap)continue;
    chosen.add(cand.i);
    placed.push({x:cand.x,y:cand.y});
  }

  // If the sphere curvature leaves us with too few cards, relax slightly but never stack.
  if(chosen.size<Math.min(4,budget)){
    for(const cand of candidates){
      if(chosen.size>=Math.min(4,budget))break;
      if(chosen.has(cand.i))continue;
      let nearest=Infinity;
      for(const p of placed)nearest=Math.min(nearest,Math.hypot(cand.x-p.x,cand.y-p.y));
      if(nearest<92)continue;
      chosen.add(cand.i);placed.push({x:cand.x,y:cand.y});
    }
  }
  return chosen;
}

function chooseMagneticSet(){
  // No screen-space magnet on the globe. A photo stays where it actually is
  // on the sphere, so everything the user sees remains spatially trustworthy.
  magneticIds=new Set();lastMagneticIds=new Set();
}
function pullToViewport(p){return{x:p.x,y:p.y,magnetic:false}}

function renderEchoField(raw,visibleSet,alpha){
  // The echo field is the photo-galaxy: dozens of distant memories reveal
  // curvature and depth, but never compete with the 5–6 navigable stories.
  const overview=overviewBlendForScale();
  const candidates=[];

  data.forEach((s,i)=>{
    if(visibleSet.has(i))return;
    const r=raw[i];
    if(r.facing<-.26)return;
    if(r.x<-80||r.x>W+80||r.y<95||r.y>H+90)return;
    const temporal=Math.exp(-.5*Math.pow(Math.abs(s.ms-timeCenter)/Math.max(timelineSpanMs()*1.45,365*DAY*3),2));
    const depth=smooth(-.24,.96,r.facing);
    const score=depth*.74+temporal*.25+.10*(1-s.representative);
    candidates.push({i,score,x:r.x,y:r.y,facing:r.facing,depth:r.depth});
  });
  candidates.sort((a,b)=>b.score-a.score||a.i-b.i);

  const targetCount=Math.round(lerp(34,ECHO_COUNT,1-overview*.30));
  const chosen=[];
  for(const cand of candidates){
    if(chosen.length>=targetCount)break;
    let tooClose=false;
    const localGap=lerp(24,44,smooth(-.2,.9,cand.facing));
    for(const p of chosen){
      if(Math.hypot(cand.x-p.x,cand.y-p.y)<localGap){tooClose=true;break}
    }
    if(!tooClose)chosen.push(cand);
  }

  for(let slot=0;slot<ECHO_COUNT;slot++){
    const el=echoNodes[slot],cand=chosen[slot];
    if(!cand){
      el.style.opacity="0";echoAssignments[slot]=-1;continue;
    }
    const s=data[cand.i];
    if(echoAssignments[slot]!==cand.i){
      echoAssignments[slot]=cand.i;
      el.querySelector("img").src=thumbUrl(s);
    }
    const d=smooth(-.25,1,cand.facing);
    const random=.82+.36*fract(s.id+901);
    const size=lerp(.30,1.02,d)*random;
    const op=(1-alpha)*lerp(.065,.29,d)*(.80+.20*cand.score);
    const img=el.querySelector("img");
    img.style.filter="blur("+lerp(.72,.05,d).toFixed(2)+"px) saturate("+lerp(.72,1.02,d).toFixed(2)+") brightness("+lerp(.70,.98,d).toFixed(2)+")";
    el.style.opacity=clamp(op,.045,.31).toFixed(3);
    el.style.transform="translate3d("+(cand.x-28)+"px,"+(cand.y-21)+"px,0) scale("+size.toFixed(3)+")";
    el.style.zIndex=String(30+Math.round(d*90));
  }
}

function render(){
  active=spatialPinchTarget!=null?spatialPinchTarget:nearestMemoryToFocus();
  const alpha=presentationAlpha(),overview=overviewBlendForScale(),near=data[active];

  presentation.style.opacity=alpha.toFixed(3);
  presentationText.textContent=near.story;
  presentationDate.textContent=fullDate(near);
  presentationCopy.style.opacity=String(clamp((alpha-.10)/.9,0,1));
  presentationCopy.style.transform="translateY("+((1-alpha)*18)+"px)";
  if(alpha>.34)setBg(active);

  updateFocusBlock();
  zoomRead.textContent=Math.round(cam.s/SPACE_MAX*100)+"%";

  const raw=data.map((s,i)=>{
    const q=projectMemory(s);
    const face=smooth(-.18,.90,q.facing);
    const temporal=Math.exp(-.5*Math.pow(Math.abs(s.ms-timeCenter)/Math.max(timelineSpanMs(),365*DAY*1.5),2));
    let reveal=.22+.78*face;
    if(overview>.55)reveal=Math.max(reveal,.26+.34*temporal);
    return{
      x:q.x,y:q.y,facing:q.facing,depth:q.depth,perspective:q.perspective,
      temporal,reveal,opacity:reveal*(.28+.72*face)
    };
  });

  const visibleSet=chooseVisibleRepresentatives(raw,alpha);
  renderEchoField(raw,visibleSet,alpha);
  chooseMagneticSet(raw,alpha);

  const relevance=[...visibleSet].map(i=>{
    const s=data[i],r=raw[i];
    const temporal=Math.exp(-.5*Math.pow(Math.abs(s.ms-timeCenter)/Math.max(timelineSpanMs()*.55,DAY),2));
    const face=smooth(-.02,.96,r.facing);
    const centre=1-clamp(Math.hypot(r.x-W/2,r.y-H*.52)/(Math.max(W,H)*.72),0,1);
    return{i,score:face*.95+temporal*.48+centre*.28+(i===spatialPinchTarget?3:0)};
  }).sort((a,b)=>b.score-a.score);

  const hero1=spatialPinchTarget!=null?spatialPinchTarget:relevance[0]?.i;
  const hero2=relevance.find(r=>r.i!==hero1)?.i;
  const roleRank=new Map(relevance.map((r,rank)=>[r.i,rank]));
  renderedCards=[];

  data.forEach((s,i)=>{
    const selected=visibleSet.has(i);
    const r=raw[i];
    const onscreen=r.x>-220&&r.x<W+220&&r.y>-240&&r.y<H+220;
    const rank=roleRank.has(i)?roleRank.get(i):99;
    const depth=smooth(-.03,.98,r.facing);

    let opacity=0;
    if(selected){
      if(i===hero1)opacity=.995;
      else if(i===hero2)opacity=.94;
      else if(rank===2)opacity=.88;
      else opacity=.78;
      opacity*=lerp(.72,1,depth)*(1-alpha*.94);
    }
    if(!onscreen||r.facing<-.055)opacity=0;
    if(i===active&&selected)opacity=Math.max(opacity,(1-alpha)*.96);

    // Curvature creates the size hierarchy first; role adds just a little emphasis.
    let scale=lerp(.54,1.10,depth);
    if(i===hero1)scale*=1.20;
    else if(i===hero2)scale*=1.05;
    else if(rank===2)scale*=.96;
    else scale*=.82+.08*fract(s.id+701);

    const zoomBreath=lerp(.82,1.06,clamp((cam.s-SPACE_MIN)/(SPACE_MAX-SPACE_MIN),0,1));
    scale*=zoomBreath;
    if(spatialPinchTarget===i)scale*=1+.22*smooth(.08,.92,spatialPinchStrength);
    scale=clamp(scale,.46,1.46);

    if(selected&&opacity>.025)ensureCardImage(i);
    const el=nodes[i];
    el.style.opacity=opacity.toFixed(3);
    el.style.pointerEvents=opacity>.24?"auto":"none";
    el.style.zIndex=String(520+Math.round(depth*260)+(i===hero1?180:i===hero2?90:0)-Math.min(90,rank*8));
    el.style.transform="translate3d("+(r.x-66)+"px,"+(r.y-87)+"px,0) scale("+scale.toFixed(3)+")";
    el.classList.toggle("nearest",i===active&&alpha<.6);
    el.classList.remove("magnetic");
    renderedCards[i]={x:r.x,y:r.y,opacity,magnetic:false,selected};
  });

  magnetRing.style.left="16px";magnetRing.style.right="16px";magnetRing.style.top="140px";magnetRing.style.bottom="92px";
  drawTimeline();

  hint.innerHTML=timelineUser
    ? '<b>De tijdbalk beweegt over de levensas.</b> Je longitude blijft staan terwijl je door de jaren gaat.'
    : alpha>.82
      ? 'Knijp uit het verhaal om terug te keren naar het <b>foto-stelsel</b>.'
      : '<b>Foto-stelsel:</b> links/rechts draait de levensbol eindeloos · omhoog/omlaag beweegt door je leven.';
}
function resize(){
  const r=app.getBoundingClientRect();W=Math.max(1,r.width);H=Math.max(1,r.height);
  const oldMin=SPACE_MIN;
  SPACE_MIN=fitOverviewScale();
  if(cam.s<=oldMin+.015)cam.s=SPACE_MIN;
  else cam.s=Math.max(cam.s,SPACE_MIN);
  const cr=canvas.getBoundingClientRect(),dpr=Math.min(devicePixelRatio||1,2.5);
  canvas.width=Math.max(1,Math.round(cr.width*dpr));canvas.height=Math.max(1,Math.round(cr.height*dpr));
  render();
}
window.addEventListener("resize",resize,{passive:true});
window.visualViewport&&visualViewport.addEventListener("resize",resize,{passive:true});

/* ------------------- LIFE GLOBE TOUCH ------------------- */
let touch=null;
function localTouch(t){const r=app.getBoundingClientRect();return{x:t.clientX-r.left,y:t.clientY-r.top}}
function dist(a,b){return Math.hypot(b.x-a.x,b.y-a.y)}
function mid(a,b){return{x:(a.x+b.x)/2,y:(a.y+b.y)/2}}
function lerpLon(a,b,t){return wrapLon(a+wrapLon(b-a)*t)}

function storyAtScreenPoint(p){
  let best=null,bd=Infinity;
  renderedCards.forEach((r,i)=>{
    if(!r||!r.selected||r.opacity<.20)return;
    const d=Math.hypot(r.x-p.x,r.y-p.y);
    if(d<bd){bd=d;best=i}
  });
  const radius=overviewBlendForScale()>.45?170:125;
  return bd<=radius?best:null;
}

app.addEventListener("touchstart",e=>{
  if(e.target.closest("button,#timelineShell"))return;
  e.preventDefault();hint.style.display="none";

  if(e.touches.length===1){
    const p=localTouch(e.touches[0]);
    touch={kind:"one",start:p,last:p,lon:cam.x,lat:cam.y,s:cam.s,active};
  }else if(e.touches.length>=2){
    const a=localTouch(e.touches[0]),b=localTouch(e.touches[1]),m=mid(a,b);
    const target=storyAtScreenPoint(m);
    spatialPinchTarget=target;spatialPinchStrength=0;
    touch={
      kind:"pinch",
      d:Math.max(10,dist(a,b)),
      s:cam.s,
      lon:cam.x,
      lat:cam.y,
      target,
      mid:m
    };
  }
},{passive:false});

app.addEventListener("touchmove",e=>{
  if(!touch)return;
  e.preventDefault();

  if(e.touches.length>=2){
    const a=localTouch(e.touches[0]),b=localTouch(e.touches[1]),m=mid(a,b);

    if(touch.kind!=="pinch"){
      const target=storyAtScreenPoint(m);
      spatialPinchTarget=target;spatialPinchStrength=0;
      touch={kind:"pinch",d:Math.max(10,dist(a,b)),s:cam.s,lon:cam.x,lat:cam.y,target,mid:m};
    }

    const rawRatio=dist(a,b)/touch.d;
    const gentleRatio=Math.pow(rawRatio,.58);
    const ns=clamp(touch.s*gentleRatio,SPACE_MIN,SPACE_MAX);
    const zoomingIn=rawRatio>=1;
    spatialPinchStrength=clamp(Math.abs(Math.log(Math.max(.001,gentleRatio)))*1.6,0,1);

    cam.s=ns;

    if(touch.target!=null&&zoomingIn){
      // Rotate the globe toward exactly the story held between the fingers.
      // This preserves the "what I see is where I zoom" contract.
      const target=data[touch.target];
      const commit=smooth(.06,.80,spatialPinchStrength);
      cam.x=lerpLon(touch.lon,target.lon,commit*.88);
      cam.y=lerp(touch.lat,target.lat,commit*.88);
      timeCenter=lerp(timeCenter,target.ms,.10+.26*commit);
    }else{
      // A free pinch keeps the current globe direction stable.
      cam.x=touch.lon;cam.y=touch.lat;
      syncTimeFromSpace();
    }

    render();
    return;
  }

  if(e.touches.length===1&&touch.kind==="one"){
    const p=localTouch(e.touches[0]);

    // Story presentation keeps the familiar previous/next swipe.
    if(touch.s<SWIPE_SPACE){
      const dx=p.x-touch.last.x,dy=p.y-touch.last.y;
      const nav=1/Math.max(.60,cam.s);
      const contentFactor=Math.sqrt(330/SPHERE_RADIUS);

      // Horizontal = rotation around the axis. wrapLon makes it literally endless.
      cam.x=wrapLon(cam.x-dx*.0068*nav*contentFactor);

      // Vertical = travel over the life axis. There are real endpoints:
      // north = early life, south = later life.
      cam.y=clampCamY(cam.y+dy*.0047*nav*contentFactor);

      syncTimeFromSpace();
      render();
    }

    touch.last=p;
  }
},{passive:false});

app.addEventListener("touchend",e=>{
  if(!touch)return;
  e.preventDefault();

  if(e.touches.length===0&&touch.kind==="one"&&touch.s>=SWIPE_SPACE){
    const p=touch.last||touch.start,dx=p.x-touch.start.x,dy=p.y-touch.start.y;
    if(Math.abs(dx)>42&&Math.abs(dx)>Math.abs(dy)*1.2){
      focusStory(touch.active+(dx<0?1:-1));
    }
  }

  if(e.touches.length===0&&touch.kind==="pinch"&&touch.target!=null&&cam.s>touch.s){
    const target=data[touch.target];
    const commit=smooth(.30,.88,spatialPinchStrength);
    timeCenter=lerp(timeCenter,target.ms,.24+.50*commit);
    if(commit>.58)active=touch.target;
  }

  touch=null;spatialPinchTarget=null;spatialPinchStrength=0;
  render();
},{passive:false});

app.addEventListener("touchcancel",()=>{
  touch=null;spatialPinchTarget=null;spatialPinchStrength=0;render();
},{passive:false});

document.getElementById("storyBtn").onclick=()=>focusStory(nearestMemoryToFocus());
document.getElementById("wideBtn").onclick=wide;
document.getElementById("minusBtn").onclick=()=>zoomAround(W/2,H/2,cam.s*.82);
document.getElementById("plusBtn").onclick=()=>zoomAround(W/2,H/2,cam.s*1.22);
document.getElementById("fieldBtn").onclick=()=>app.classList.toggle("debug");

OVERVIEW_ANCHORS.forEach(ensureCardImage);
for(let i=Math.max(0,active-5);i<=Math.min(data.length-1,active+5);i++)ensureCardImage(i);
centerMs=timeCenter;
visualZoomPos=zoomPos;
timelineSpanYears=spanForZoom(visualZoomPos)/DAYS_YEAR;
resize();setBg(active);render();
})();
</script>
