<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0d141a">
<title>Talera — Magnetic Life Space</title>
<style>
:root{
  --safeT:env(safe-area-inset-top,0px);
  --safeB:env(safe-area-inset-bottom,0px);
  --glass:rgba(8,14,19,.42);
  --border:rgba(255,255,255,.14);
  --muted:rgba(255,255,255,.68);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0a1015;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;overscroll-behavior:none}
body{position:fixed;inset:0}
button{font:inherit;color:inherit}
#app{position:absolute;inset:0;overflow:hidden;touch-action:none;background:#0b1117;-webkit-user-select:none;user-select:none}
#bg{position:absolute;inset:-8%;background-position:center;background-size:cover;filter:blur(9px) saturate(.72) brightness(.34);transform:scale(1.12);transition:background-image .35s ease}
#bg:after{content:"";position:absolute;inset:0;background:
 radial-gradient(circle at 50% 48%,rgba(18,29,36,.03),rgba(7,11,15,.28) 57%,rgba(3,6,9,.8) 100%),
 linear-gradient(180deg,rgba(7,12,17,.02),rgba(7,12,17,.43))}
#world{position:absolute;inset:0;overflow:hidden;touch-action:none}

/* Soft directional cues only. They do not define regions or zoom layers. */
#directionField{position:absolute;z-index:3;inset:0;pointer-events:none}
.dir{position:absolute;font-size:10px;color:rgba(255,255,255,.24);letter-spacing:.01em;text-shadow:0 1px 8px rgba(0,0,0,.58);transition:opacity .18s,transform .18s}
.dir strong{display:block;font-size:12px;color:rgba(255,255,255,.38);font-weight:720}
.dir small{font-size:8.5px}
#d0{left:16px;top:23%} #d1{left:43%;top:15%}
#d2{right:15px;top:25%;text-align:right} #d3{right:13px;bottom:30%;text-align:right}
#d4{left:39%;bottom:20%;text-align:center} #d5{left:15px;bottom:31%}

/* Memory cards stay fixed in world space. The viewport may only pull them toward the screen edge. */
.memory{position:absolute;width:126px;height:166px;border-radius:18px;overflow:hidden;background:#26343b;border:1px solid rgba(255,255,255,.16);box-shadow:0 18px 50px rgba(0,0,0,.31);transform-origin:center;will-change:transform,opacity;pointer-events:none;transition:box-shadow .12s}
.memory img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#26343b}
.memoryShade{position:absolute;inset:0;background:linear-gradient(180deg,transparent 37%,rgba(0,0,0,.81) 100%)}
.memoryCopy{position:absolute;left:10px;right:10px;bottom:10px;text-shadow:0 2px 8px rgba(0,0,0,.78)}
.memoryText{font-size:10.5px;line-height:1.17;font-weight:710;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.memoryDate{font-size:8.7px;color:rgba(255,255,255,.7);margin-top:5px}
.memory.nearest{outline:1.5px solid rgba(255,255,255,.87);outline-offset:2px}
.memory.magnetic{box-shadow:0 16px 44px rgba(0,0,0,.38),0 0 0 1px rgba(255,244,196,.12)}
.memory.anchor{width:172px;height:218px;border-radius:23px}
.memory.anchor .memoryText{font-size:12px}
.memory.anchor .memoryDate{font-size:9.3px}

/* One story presentation smoothly dissolves into the same spatial world. */
#presentation{position:absolute;z-index:18;inset:0;pointer-events:none;opacity:1;will-change:opacity}
#presentation img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#presentationVeil{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.02) 32%,rgba(0,0,0,.13) 56%,rgba(0,0,0,.82) 100%)}
#presentationCopy{position:absolute;left:22px;right:22px;bottom:calc(91px + var(--safeB));text-shadow:0 2px 11px rgba(0,0,0,.7);will-change:opacity,transform}
#presentationText{font-size:27px;line-height:1.05;font-weight:760;letter-spacing:-.03em}
#presentationDate{font-size:12px;margin-top:10px;color:rgba(255,255,255,.79)}

#top{position:absolute;z-index:70;left:11px;right:11px;top:calc(9px + var(--safeT));height:73px;border-radius:21px;padding:10px 12px;background:var(--glass);border:1px solid var(--border);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);pointer-events:none}
#topRow{display:flex;justify-content:space-between;align-items:center;gap:12px}
#mode{font-size:12px;font-weight:760}
#where{font-size:10px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:right}
#lifeBar{position:relative;height:27px;margin-top:7px}
#lifeLine{position:absolute;left:0;right:0;top:12px;height:1px;background:rgba(255,255,255,.24)}
#lifeLabels span{position:absolute;top:2px;transform:translateX(-50%);font-size:8px;color:rgba(255,255,255,.46)}
#lifeWindow{position:absolute;top:4px;height:17px;border:1.5px solid rgba(255,255,255,.82);border-radius:10px;background:rgba(255,255,255,.065);min-width:6px}
#lifeNeedle{position:absolute;top:1px;height:23px;width:2px;background:#fff0ae;box-shadow:0 0 8px rgba(255,240,174,.7);transform:translateX(-50%)}

#hint{position:absolute;z-index:75;left:50%;bottom:calc(72px + var(--safeB));transform:translateX(-50%);width:min(90vw,440px);padding:10px 13px;border-radius:16px;background:rgba(5,10,14,.48);border:1px solid rgba(255,255,255,.13);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);font-size:12px;line-height:1.35;text-align:center;color:rgba(255,255,255,.9);pointer-events:none}
#controls{position:absolute;z-index:78;left:11px;right:11px;bottom:calc(11px + var(--safeB));display:flex;align-items:center;justify-content:space-between;gap:7px}
.group{display:flex;gap:7px}
.btn{border:1px solid rgba(255,255,255,.15);background:rgba(5,10,14,.47);border-radius:999px;padding:9px 11px;font-size:11px;font-weight:720;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
#zoomRead{font-size:10px;color:rgba(255,255,255,.72);min-width:44px;text-align:center}
#toast{position:absolute;z-index:95;left:50%;top:calc(91px + var(--safeT));transform:translateX(-50%);padding:7px 11px;border-radius:999px;background:rgba(4,8,11,.73);font-size:10px;opacity:0;transition:opacity .15s;pointer-events:none;white-space:nowrap}
#toast.on{opacity:1}

#magnetDebug{position:absolute;z-index:2;inset:0;pointer-events:none;opacity:0}
.debug #magnetDebug{opacity:1}
#magnetRing{position:absolute;border:1px dashed rgba(255,244,196,.25);border-radius:24px}
.debugLine{position:absolute;height:1px;transform-origin:0 50%;background:rgba(255,244,196,.19)}

@media(min-width:700px){
 #app{width:430px;height:min(900px,100vh);left:50%;top:50%;right:auto;bottom:auto;transform:translate(-50%,-50%);border-radius:36px;box-shadow:0 35px 100px rgba(0,0,0,.5)}
}
</style>
</head>
<body>
<div id="app">
  <div id="bg"></div>
  <div id="world"><div id="magnetDebug"><div id="magnetRing"></div></div></div>

  <div id="directionField">
    <div class="dir" id="d0"><strong>↖ Jeugd</strong><small>0–10</small></div>
    <div class="dir" id="d1"><strong>↑ Tieners</strong><small>10–20</small></div>
    <div class="dir" id="d2"><strong>Twintigers ↗</strong><small>20–30</small></div>
    <div class="dir" id="d3"><strong>Dertigers →</strong><small>30–40</small></div>
    <div class="dir" id="d4"><strong>↓ Veertigers</strong><small>40–50</small></div>
    <div class="dir" id="d5"><strong>↙ Vijftigers</strong><small>50+</small></div>
  </div>

  <div id="presentation">
    <img id="presentationImg" alt="">
    <div id="presentationVeil"></div>
    <div id="presentationCopy"><div id="presentationText"></div><div id="presentationDate"></div></div>
  </div>

  <div id="top">
    <div id="topRow"><span id="mode">Presentatie</span><span id="where"></span></div>
    <div id="lifeBar">
      <div id="lifeLine"></div><div id="lifeLabels"></div><div id="lifeWindow"></div><div id="lifeNeedle"></div>
    </div>
  </div>

  <div id="hint">Swipe links/rechts voor het volgende verhaal. <b>Knijp langzaam samen</b>: dit verhaal blijft je anker terwijl de ruimte eromheen verschijnt.</div>

  <div id="controls">
    <div class="group"><button class="btn" id="storyBtn">Verhaal</button><button class="btn" id="wideBtn">Ruimte</button></div>
    <span id="zoomRead">100%</span>
    <div class="group"><button class="btn" id="minusBtn">−</button><button class="btn" id="plusBtn">+</button><button class="btn" id="fieldBtn">Magneet</button></div>
  </div>

  <div id="toast"></div>
</div>

fit=max&fm=jpg&q=76&w=1400"},{"id":46,"at":"2023-05-13T08:05:00","story":"De eerste kilometers. Altijd weer dat fijne gevoel van onderweg zijn.","image":"https://images.unsplash.com/photo-1776613049786-0054c719b453?auto=format&fit=max&fm=jpg&q=76&w=1400"},{"id":47,"at":"2024-01-20T14:30:00","story":"Een gewone zaterdag die door één goed gesprek bijzonder werd.","image":"https://images.unsplash.com/photo-1774194647558-713c89f149d8?auto=format&fit=max&fm=jpg&q=76&w=1400"},{"id":48,"at":"2024-08-28T17:20:00","story":"Laat in de zomer nog één lange avond buiten.","image":"https://images.unsplash.com/photo-1755809732667-9ff30c2cae9e?auto=format&fit=max&fm=jpg&q=76&w=1400"},{"id":49,"at":"2025-11-02T12:15:00","story":"Een oude plek opnieuw bezocht en gemerkt hoeveel er ondertussen veranderd was.","image":"https://images.unsplash.com/photo-1768511771143-73e862326f04?auto=format&fit=max&fm=jpg&q=76&w=1400"},{"id":50,"at":"2026-09-06T09:15:00","story":"Terugkijken op al die losse momenten die samen langzaam een leven beginnen te vormen.","image":"https://images.unsplash.com/photo-1772033085549-032412902a23?auto=format&fit=max&fm=jpg&q=76&w=1400"}];

const app=document.getElementById("app"),world=document.getElementById("world"),bg=document.getElementById("bg");
const presentation=document.getElementById("presentation"),presentationImg=document.getElementById("presentationImg"),presentationText=document.getElementById("presentationText"),presentationDate=document.getElementById("presentationDate"),presentationCopy=document.getElementById("presentationCopy");
const modeEl=document.getElementById("mode"),whereEl=document.getElementById("where"),lifeWindow=document.getElementById("lifeWindow"),lifeNeedle=document.getElementById("lifeNeedle"),zoomRead=document.getElementById("zoomRead"),hint=document.getElementById("hint"),toast=document.getElementById("toast"),magnetRing=document.getElementById("magnetRing");

const BIRTH=1972,END=2026;
const MIN_SCALE=.20,MAX_SCALE=2.0;
const SWIPE_SCALE=1.68;

// Soft bearings; chronology influences direction but never creates hard areas.
const BEARINGS=[
 {from:0,to:10,name:"Jeugd",x:-820,y:-500},
 {from:10,to:20,name:"Tienerjaren",x:-100,y:-760},
 {from:20,to:30,name:"Twintiger jaren",x:740,y:-490},
 {from:30,to:40,name:"Dertiger jaren",x:840,y:260},
 {from:40,to:50,name:"Veertiger jaren",x:120,y:760},
 {from:50,to:60,name:"Vijftiger jaren",x:-750,y:430}
];

const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const smooth=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t)};
const fract=n=>{const x=Math.sin(n*79.271+4.91)*43758.5453;return x-Math.floor(x)};
const ageOf=s=>{const d=new Date(s.at);return(d.getFullYear()-BIRTH)+d.getMonth()/12+d.getDate()/365};
const dateLabel=s=>new Date(s.at).toLocaleDateString("nl-NL",{day:"numeric",month:"long",year:"numeric"});
const shortDate=s=>new Date(s.at).toLocaleDateString("nl-NL",{month:"short",year:"numeric"});
const bearingForAge=a=>BEARINGS.find((b,i)=>a>=b.from&&(a<b.to||i===BEARINGS.length-1))||BEARINGS[BEARINGS.length-1];

// More compact world than v3: still spatial, but no giant dead oceans.
const data=MEMORIES.map((s,i)=>{
 const age=ageOf(s),b=bearingForAge(age),u=clamp((age-b.from)/(b.to-b.from),0,1);
 const ang=(u-.5)*1.65+(fract(s.id+2)-.5)*1.0;
 const spread=100+u*210+fract(s.id+33)*270;
 const cross=(fract(s.id+19)-.5)*360;
 const x=b.x+Math.cos(ang)*spread+cross*.32;
 const y=b.y+Math.sin(ang)*spread*.72+cross*.60;
 const anchor=(i===0||i===5||i===14||i===23||i===32||i===38||i===44||i===49);
 const reveal=anchor ? .22+.07*fract(s.id+7) : .30+.68*fract(s.id+91);
 return {...s,i,age,bearing:b,x,y,z:.82+fract(s.id+70)*.38,anchor,reveal};
});

[1972,1980,1990,2000,2010,2020,2026].forEach(y=>{
 const span=document.createElement("span");span.style.left=((y-BIRTH)/(END-BIRTH)*100)+"%";span.textContent=y;document.getElementById("lifeLabels").appendChild(span);
});

const nodes=data.map(s=>{
 const el=document.createElement("article");
 el.className="memory"+(s.anchor?" anchor":"");
 el.innerHTML='<img alt=""><div class="memoryShade"></div><div class="memoryCopy"><div class="memoryText"></div><div class="memoryDate"></div></div>';
 const img=el.querySelector("img");
 img.src=s.image.replace("w=1400","w=620");
 img.loading="eager";
 if(s.anchor) img.fetchPriority="high";
 img.onerror=()=>img.style.opacity=".15";
 el.querySelector(".memoryText").textContent=s.story;
 el.querySelector(".memoryDate").textContent=shortDate(s);
 el.addEventListener("click",e=>{e.stopPropagation();focusStory(s.i)});
 world.appendChild(el);
 return el;
});

// Light prefetch of the first screen and anchors.
data.filter((s,i)=>s.anchor||i>40).forEach(s=>{const im=new Image();im.src=s.image.replace("w=1400","w=820")});

let W=1,H=1,active=data.length-1;
const cam={x:data[active].x,y:data[active].y,s:MAX_SCALE};
let magneticIds=new Set();
let lastMagneticIds=new Set();

function screenPoint(x,y){return{x:(x-cam.x)*cam.s+W/2,y:(y-cam.y)*cam.s+H/2}}
function worldPoint(x,y){return{x:cam.x+(x-W/2)/cam.s,y:cam.y+(y-H/2)/cam.s}}
function nearestMemory(){
 let best=0,dist=Infinity;
 data.forEach((s,i)=>{const d=Math.hypot(s.x-cam.x,s.y-cam.y);if(d<dist){dist=d;best=i}});
 return best;
}
function estimateAge(){
 const sorted=data.map(s=>({s,d:Math.hypot(s.x-cam.x,s.y-cam.y)})).sort((a,b)=>a.d-b.d).slice(0,6);
 let num=0,den=0;sorted.forEach(o=>{const w=1/(80+o.d);num+=o.s.age*w;den+=w});
 return den?num/den:data[nearestMemory()].age;
}
function nearestBearing(){
 let best=BEARINGS[0],dist=Infinity;BEARINGS.forEach(b=>{const d=Math.hypot(b.x-cam.x,b.y-cam.y);if(d<dist){dist=d;best=b}});return best;
}
function setBg(i){const u=data[i].image;bg.style.backgroundImage="url('"+u+"')";presentationImg.src=u}
function toastMsg(t){toast.textContent=t;toast.classList.add("on");clearTimeout(toastMsg.t);toastMsg.t=setTimeout(()=>toast.classList.remove("on"),900)}
function setCam(x,y,s){cam.x=clamp(x,-1700,1700);cam.y=clamp(y,-1350,1350);cam.s=clamp(s,MIN_SCALE,MAX_SCALE);render()}
function zoomAround(px,py,newScale){const wp=worldPoint(px,py),ns=clamp(newScale,MIN_SCALE,MAX_SCALE);setCam(wp.x-(px-W/2)/ns,wp.y-(py-H/2)/ns,ns)}
function focusStory(i){active=clamp(i,0,data.length-1);setBg(active);setCam(data[active].x,data[active].y,MAX_SCALE);hint.style.display="none"}
function wide(){setCam(-10,10,.24);hint.style.display="none";toastMsg("Hele levensruimte")}
function ageToPct(a){return clamp(a/60*100,0,100)}

function presentationAlpha(){
 // Long, gentle dissolve instead of a threshold jump.
 return smooth(1.18,1.92,cam.s);
}

function chooseMagneticSet(rawPositions,alpha){
 if(alpha>.92){magneticIds=new Set([active]);return}
 const topInset=108,bottomInset=83,leftInset=18,rightInset=18;
 const visible=[];
 const ranked=[];
 rawPositions.forEach((p,i)=>{
   const s=data[i];
   const natural=p.x>leftInset+40&&p.x<W-rightInset-40&&p.y>topInset+35&&p.y<H-bottomInset-45;
   if(natural&&p.revealOpacity>.08) visible.push(i);
   const d=Math.hypot(s.x-cam.x,s.y-cam.y);
   ranked.push({i,d,natural,score:d-(s.anchor?90:0)});
 });
 ranked.sort((a,b)=>a.score-b.score||a.i-b.i);

 // Four is the floor; natural density can be much higher.
 const minVisible=cam.s<.38?5:4;
 const chosen=new Set(visible);

 // Hysteresis: retain previously magnetized stories if they are still reasonably nearby.
 for(const id of lastMagneticIds){
   if(chosen.size>=minVisible)break;
   const rank=ranked.findIndex(r=>r.i===id);
   if(rank>=0&&rank<minVisible+5) chosen.add(id);
 }
 for(const r of ranked){
   if(chosen.size>=minVisible)break;
   chosen.add(r.i);
 }
 magneticIds=chosen;
 lastMagneticIds=new Set(chosen);
}

function pullToViewport(p,i){
 const top=112,bottom=88,left=16,right=16;
 const xMin=left+54,xMax=W-right-54,yMin=top+58,yMax=H-bottom-62;
 let x=p.x,y=p.y,magnetic=false;
 if(x<xMin||x>xMax||y<yMin||y>yMax){
   magnetic=true;
   // Preserve the true direction from screen center while pulling to the nearest safe edge.
   const dx=p.x-W/2,dy=p.y-H/2;
   const tx=dx===0?9999:(dx>0?(xMax-W/2)/dx:(xMin-W/2)/dx);
   const ty=dy===0?9999:(dy>0?(yMax-H/2)/dy:(yMin-H/2)/dy);
   let t=Math.min(Math.abs(tx),Math.abs(ty));
   if(!Number.isFinite(t))t=1;
   t=clamp(t,0,1);
   x=W/2+dx*t;y=H/2+dy*t;
 }
 return{x,y,magnetic};
}

function render(){
 const alpha=presentationAlpha();
 active=nearestMemory();
 const near=data[active],bearing=nearestBearing(),centerAge=estimateAge();

 presentation.style.opacity=alpha.toFixed(3);
 presentationText.textContent=near.story;
 presentationDate.textContent=dateLabel(near);
 presentationCopy.style.opacity=String(clamp((alpha-.15)/.85,0,1));
 presentationCopy.style.transform="translateY("+((1-alpha)*22)+"px)";
 if(alpha>.55)setBg(active); else {
   const same=data.filter(s=>s.bearing===bearing);
   let rep=same[0]||near,bd=Infinity;
   same.forEach(s=>{const d=Math.hypot(s.x-cam.x,s.y-cam.y);if(d<bd){bd=d;rep=s}});
   setBg(rep.i);
 }

 let mode="Levensruimte";
 if(alpha>.86)mode="Presentatie";
 else if(cam.s>.95)mode="Dichtbij";
 else if(cam.s>.48)mode="Verkennen";
 modeEl.textContent=mode;
 whereEl.textContent=alpha>.86?dateLabel(near):bearing.name+" · rond "+Math.round(centerAge)+" jaar";
 zoomRead.textContent=Math.round(cam.s/MAX_SCALE*100)+"%";

 const visibleYears=clamp(8/cam.s,2,60);
 const l=ageToPct(centerAge-visibleYears/2),r=ageToPct(centerAge+visibleYears/2);
 lifeWindow.style.left=l+"%";lifeWindow.style.width=Math.max(1,r-l)+"%";lifeNeedle.style.left=ageToPct(centerAge)+"%";

 document.querySelectorAll(".dir").forEach((el,i)=>{
   const b=BEARINGS[i],d=Math.hypot(b.x-cam.x,b.y-cam.y),strength=1-clamp(d/1700,0,1);
   const overview=1-smooth(.75,1.5,cam.s);
   el.style.opacity=String((.12+.5*strength)*overview);
   el.style.transform="scale("+(0.94+.08*strength)+")";
 });

 const rawPositions=data.map((s,i)=>{
   const q=screenPoint(s.x,s.y);
   const distWorld=Math.hypot(s.x-cam.x,s.y-cam.y);
   const distScreen=Math.hypot(q.x-W/2,q.y-H/2);
   const localBoost=(1-clamp(distWorld/900,0,1))*.22;
   const revealOpacity=smooth(s.reveal-.18-localBoost,s.reveal+.18-localBoost,cam.s);
   return{x:q.x,y:q.y,distWorld,distScreen,revealOpacity};
 });

 chooseMagneticSet(rawPositions,alpha);

 data.forEach((s,i)=>{
   const el=nodes[i],raw=rawPositions[i];
   const magnet=magneticIds.has(i)&&alpha<.95;
   const placed=magnet?pullToViewport(raw,i):{x:raw.x,y:raw.y,magnetic:false};
   const onscreen=placed.x>-240&&placed.x<W+240&&placed.y>-280&&placed.y<H+280;
   const focus=.25+.75*(1-clamp(Math.hypot(placed.x-W/2,placed.y-H/2)/(Math.max(W,H)*1.05),0,1));
   let opacity=(1-alpha)*raw.revealOpacity*focus;

   // Magnetic floor: selected stories remain visible even when naturally outside the viewport.
   if(magnet) opacity=Math.max(opacity,.36*(1-alpha)+.12);
   if(!onscreen&&!magnet)opacity=0;

   // Current story persists underneath presentation, creating a visual morph instead of a jump.
   if(i===active){
     const currentFloor=(1-alpha)*.72;
     opacity=Math.max(opacity,currentFloor);
   }

   const depth=.82+s.z*.18;
   let scale=(s.anchor?1:.77)*(.47+cam.s*.45)*depth;
   // Current card grows while presentation fades, bridging the two states.
   if(i===active) scale*=1+smooth(1.05,1.78,cam.s)*.75;
   if(placed.magnetic) scale*=.9;
   scale=clamp(scale,.40,s.anchor?1.45:1.38);

   el.style.opacity=opacity.toFixed(3);
   el.style.pointerEvents=opacity>.16?"auto":"none";
   el.style.zIndex=String(300+Math.round(s.z*100)+(i===active?100:0)+(placed.magnetic?20:0));
   const hw=s.anchor?86:63,hh=s.anchor?109:83;
   el.style.transform="translate3d("+(placed.x-hw)+"px,"+(placed.y-hh)+"px,0) scale("+scale+")";
   el.classList.toggle("nearest",i===active&&alpha<.6);
   el.classList.toggle("magnetic",placed.magnetic);
 });

 // Debug: visible safe area of the magnetic viewport.
 magnetRing.style.left="16px";magnetRing.style.right="16px";magnetRing.style.top="112px";magnetRing.style.bottom="88px";

 hint.innerHTML=alpha>.82
   ? 'Knijp <b>langzaam samen</b>. Dit verhaal blijft staan terwijl de eerste nabije herinneringen eromheen verschijnen.'
   : magneticIds.size<=5
     ? '<b>Het scherm werkt als magneet.</b> Ook in rustige stukken blijven de dichtstbijzijnde herinneringen richting geven.'
     : '<b>Vrij bewegen.</b> In een dichter levensgebied verschijnen vanzelf meer verhalen; in rustige gebieden blijven er minimaal enkele zichtbaar.';
}

function resize(){const r=app.getBoundingClientRect();W=Math.max(1,r.width);H=Math.max(1,r.height);render()}
window.addEventListener("resize",resize,{passive:true});
window.visualViewport&&visualViewport.addEventListener("resize",resize,{passive:true});

// Stable iPhone pinch/pan, no snap on release.
let touch=null;
function localTouch(t){const r=app.getBoundingClientRect();return{x:t.clientX-r.left,y:t.clientY-r.top}}
function dist(a,b){return Math.hypot(b.x-a.x,b.y-a.y)}
function mid(a,b){return{x:(a.x+b.x)/2,y:(a.y+b.y)/2}}

app.addEventListener("touchstart",e=>{
 if(e.target.closest("button"))return;
 e.preventDefault();hint.style.display="none";
 if(e.touches.length===1){
   const p=localTouch(e.touches[0]);touch={kind:"one",start:p,last:p,cx:cam.x,cy:cam.y,s:cam.s,active};
 }else if(e.touches.length>=2){
   const a=localTouch(e.touches[0]),b=localTouch(e.touches[1]),m=mid(a,b),wp=worldPoint(m.x,m.y);
   touch={kind:"pinch",d:Math.max(10,dist(a,b)),s:cam.s,wx:wp.x,wy:wp.y};
 }
},{passive:false});

app.addEventListener("touchmove",e=>{
 if(!touch)return;
 e.preventDefault();
 if(e.touches.length>=2){
   const a=localTouch(e.touches[0]),b=localTouch(e.touches[1]),m=mid(a,b);
   if(touch.kind!=="pinch"){
     const wp=worldPoint(m.x,m.y);touch={kind:"pinch",d:Math.max(10,dist(a,b)),s:cam.s,wx:wp.x,wy:wp.y};
   }
   const ns=clamp(touch.s*(dist(a,b)/touch.d),MIN_SCALE,MAX_SCALE);
   setCam(touch.wx-(m.x-W/2)/ns,touch.wy-(m.y-H/2)/ns,ns);
 }else if(e.touches.length===1&&touch.kind==="one"&&cam.s<SWIPE_SCALE){
   const p=localTouch(e.touches[0]),dx=p.x-touch.start.x,dy=p.y-touch.start.y;
   setCam(touch.cx-dx/touch.s,touch.cy-dy/touch.s,touch.s);touch.last=p;
 }
},{passive:false});

app.addEventListener("touchend",e=>{
 if(!touch)return;
 e.preventDefault();
 if(e.touches.length===0&&touch.kind==="one"&&touch.s>=SWIPE_SCALE){
   const p=touch.last||touch.start,dx=p.x-touch.start.x,dy=p.y-touch.start.y;
   if(Math.abs(dx)>42&&Math.abs(dx)>Math.abs(dy)*1.2)focusStory(touch.active+(dx<0?1:-1));
 }
 touch=null;
},{passive:false});
app.addEventListener("touchcancel",()=>touch=null,{passive:false});

document.getElementById("storyBtn").onclick=()=>focusStory(active);
document.getElementById("wideBtn").onclick=wide;
document.getElementById("minusBtn").onclick=()=>zoomAround(W/2,H/2,cam.s*.82);
document.getElementById("plusBtn").onclick=()=>zoomAround(W/2,H/2,cam.s*1.22);
document.getElementById("fieldBtn").onclick=()=>app.classList.toggle("debug");

resize();setBg(active);render();
})();
</script>
</body>
</html>
