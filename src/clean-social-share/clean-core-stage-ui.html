<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>TALERA · Integratietest</title><style>body{background:#f4f7fa;color:#21394d;font:15px/1.5 system-ui;margin:0}.wrap{max-width:650px;margin:auto;padding:22px}section{background:white;border-radius:20px;padding:20px;margin:14px 0;box-shadow:0 5px 30px #19334a12}input,textarea,select{box-sizing:border-box;width:100%;padding:11px;margin:5px 0 12px;border:1px solid #bccbd5;border-radius:9px;font:inherit}button{background:#315b7c;color:white;padding:11px 16px;border:0;border-radius:10px;font:600 14px system-ui;cursor:pointer;margin:4px 5px 4px 0}button:disabled{opacity:.5}small{color:#63798a}#result{overflow-wrap:anywhere;white-space:pre-wrap;background:#e6eff6;padding:12px;border-radius:10px}#timeline button{background:#e9f1f5;color:#26455d}a{overflow-wrap:anywhere}label{display:block;margin:6px 0;font-weight:600}</style></head><body><main class="wrap"><h1>TALERA · Schone bouwtest</h1><p>Afzonderlijke testomgeving. Geen Cloudflare-aanmelding.</p><section id="login"><h2>Account</h2><label>E-mailadres<input id="email" type="email" autocomplete="email"></label><label>Naam<input id="display" value="Testgebruiker"></label><label>Wachtwoord<input id="pass" type="password" minlength="12"></label><button id="register">Testaccount maken</button><button id="signin">Aanmelden</button><button id="logout">Uitloggen</button><p id="identity"></p></section><section><h2>Herinnering</h2><label>Titel<input id="title" value="Mijn testherinnering"></label><label>Verhaal<textarea id="story" rows="4">Een herinnering uit mijn leven.</textarea></label><button id="create">Herinnering opslaan</button><button id="refresh">Mijn herinneringen ophalen</button><div id="timeline"></div></section><section><h2>Reacties bij gekozen herinnering</h2><label>Reactie<textarea id="comment" rows="2"></textarea></label><button id="postComment">Reactie versturen</button><button id="heart">Hartje geven of weghalen</button><button id="readComments">Reacties lezen</button><div id="comments"></div></section><section><h2>WhatsApp-link</h2><label>Geldigheid<select id="hours"><option value="1">1 uur</option><option value="24">1 dag</option><option value="168">7 dagen</option><option value="720">30 dagen</option></select></label><label><input id="consent" type="checkbox" style="width:auto"> Ik wil deze testherinnering tijdelijk delen</label><button id="makeLink">Unieke link maken</button><div id="shareResult"></div><button id="revoke" disabled>Link intrekken</button></section><p id="result" role="status">Klaar voor test.</p><small>Testversie: geen productie, geen mediabestanden en geen publieke klantregistratie.</small></main><script>
let chosen=null,shareId=null,shareLink=null;
const $=id=>document.getElementById(id);
const show=s=>$('result').textContent=String(s);
async function call(path,method='GET',payload){const r=await fetch(path,{method,credentials:'same-origin',headers:{'content-type':'application/json'},body:payload===undefined?undefined:JSON.stringify(payload)});let data;try{data=await r.json()}catch{data={error:'Geen JSON-antwoord'}}if(!r.ok)throw Error(data.error||'Aanvraag afgewezen: '+r.status);return data}
async function run(task){try{show('Bezig…');await task()}catch(e){show(e.message)}}
async function identify(){try{const d=await call('/api/me');$('identity').textContent='Aangemeld: '+d.account.displayName;show('TALERA-account actief')}catch{$('identity').textContent='Nog niet aangemeld'}}
$('register').onclick=()=>run(async()=>{await call('/api/register','POST',{email:$('email').value,displayName:$('display').value,password:$('pass').value});await identify()});
$('signin').onclick=()=>run(async()=>{await call('/api/login','POST',{email:$('email').value,password:$('pass').value});await identify()});
$('logout').onclick=()=>run(async()=>{await call('/api/logout','POST',{});chosen=null;$('timeline').replaceChildren();await identify();show('Uitgelogd')});
$('create').onclick=()=>run(async()=>{const d=await call('/api/memories','POST',{title:$('title').value,storyText:$('story').value});chosen=d.id;show('Herinnering opgeslagen: '+d.title);await refresh()});
async function refresh(){const d=await call('/api/memories');$('timeline').replaceChildren();for(const item of d.items){const button=document.createElement('button');button.type='button';button.textContent=(item.id===chosen?'✓ ':'')+item.title;button.onclick=()=>{chosen=item.id;show('Gekozen: '+item.title)};$('timeline').append(button)}show(d.items.length+' herinnering(en) in je TALERA-account')}
$('refresh').onclick=()=>run(refresh);
$('postComment').onclick=()=>run(async()=>{if(!chosen)throw Error('Kies eerst een herinnering');await call('/api/memories/'+chosen+'/comments','POST',{body:$('comment').value});$('comment').value='';show('Reactie opgeslagen bij gekozen herinnering');await comments()});
$('heart').onclick=()=>run(async()=>{if(!chosen)throw Error('Kies eerst een herinnering');const d=await call('/api/memories/'+chosen+'/like','POST',{});show(d.liked?'Hartje gegeven':'Hartje weggehaald')});
async function comments(){if(!chosen)throw Error('Kies eerst een herinnering');const d=await call('/api/memories/'+chosen+'/comments');$('comments').replaceChildren();for(const c of d.items){const p=document.createElement('p');p.textContent=c.display_name+': '+c.body;$('comments').append(p)}show(d.items.length+' reactie(s) voor deze herinnering')}
$('readComments').onclick=()=>run(comments);
$('makeLink').onclick=()=>run(async()=>{if(!chosen)throw Error('Kies eerst een herinnering');const d=await call('/api/memories/'+chosen+'/shares','POST',{hours:Number($('hours').value),consent:$('consent').checked});shareId=d.id;shareLink=d.link;const a=document.createElement('a');a.href=d.link;a.target='_blank';a.rel='noopener noreferrer';a.textContent='Open de tijdelijke gastlink';const whatsapp=document.createElement('a');whatsapp.href='https://wa.me/?text='+encodeURIComponent('Ik deel één herinnering met je via TALERA: '+d.link);whatsapp.target='_blank';whatsapp.rel='noopener noreferrer';whatsapp.textContent='Open WhatsApp';$('shareResult').replaceChildren(a,document.createElement('p'),whatsapp);$('revoke').disabled=false;show('Link aangemaakt, geldig tot '+d.expiresAt)});
$('revoke').onclick=()=>run(async()=>{if(!shareId)return;const d=await call('/api/shares/'+shareId+'/revoke','POST',{});$('revoke').disabled=true;show(d.revoked?'Link ingetrokken':'Link was al ingetrokken')});
identify();
</script></body></html>
