<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<title>__TITLE__ · TALERA</title>
__OG_META__
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:#0e2638;color:#fff;min-height:100%;overscroll-behavior-x:none}
button,input,textarea{font:inherit}button{cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #72b5e8;outline-offset:2px}
.stage{position:relative;width:100%;height:100dvh;min-height:540px;overflow:hidden;isolation:isolate;background:linear-gradient(155deg,#193b52,#092031)}
.photo{position:absolute;inset:0;display:block;width:100%;height:100%;object-fit:cover;filter:brightness(.84);z-index:-2}
.shade{position:absolute;inset:0;z-index:-1;pointer-events:none;background:linear-gradient(180deg,rgba(5,18,29,.62) 0%,transparent 25%,rgba(6,20,32,.14) 51%,rgba(4,17,29,.90) 100%)}
.header{padding:calc(20px + env(safe-area-inset-top)) 20px 12px;display:flex;align-items:center;gap:10px;max-width:1080px;margin:auto}
.mark{font-weight:850;letter-spacing:.06em;font-size:17px;text-shadow:0 2px 8px #0006}
.single{font-size:12px;line-height:1.25;opacity:.9;margin-left:auto;padding:7px 12px;border-radius:18px;border:1px solid #fff6;background:#132c3e88}
.cover-copy{position:absolute;bottom:calc(118px + env(safe-area-inset-bottom));width:100%;max-width:1080px;padding:15px 22px 0;left:50%;transform:translateX(-50%)}
.kicker{font-weight:700;color:#e3ebf0;font-size:13px;letter-spacing:.03em;margin:0 0 9px}
.cover-copy h1{font-weight:800;font-size:clamp(29px,7.5vw,53px);letter-spacing:-.025em;line-height:1.12;margin:0 0 14px;text-shadow:0 2px 18px #0008}
.date{font-size:14px;opacity:.88;margin:0 0 16px}
.story-open{background:#fff;border:0;border-radius:22px;padding:12px 18px;color:#173951;font-weight:750}
.listen{display:inline-flex;margin:0 0 13px;max-width:100%;align-items:center;gap:10px}
.listen audio{max-width:min(75vw,320px);height:37px}
.watch-video{display:inline-flex;align-items:center;border:1px solid #fff8;border-radius:19px;padding:11px 16px;background:#173951cc;color:#fff;font-weight:750;margin:0 0 13px}
.video-panel[hidden]{display:none!important}
.video-panel{position:fixed;inset:0;z-index:30;background:#091925f5;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:calc(24px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom));gap:14px}
.video-panel video{width:min(100%,920px);max-height:calc(100dvh - 145px);background:#000}
.video-close{align-self:flex-end;margin-right:max(0px,calc((100vw - 920px)/2));padding:11px 16px;border:0;border-radius:16px;background:#fff;color:#173951;font-weight:750}
.controls{position:absolute;bottom:calc(19px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:calc(100% - 38px);max-width:530px;display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:9px;border-radius:23px;border:1px solid #ffffff66;background:#183b50bb;backdrop-filter:blur(17px);-webkit-backdrop-filter:blur(17px)}
.control{display:flex;justify-content:center;align-items:center;gap:8px;border:0;border-radius:17px;background:#ffffff10;color:white;min-height:53px;font-weight:750;font-size:16px}
.control svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.control[aria-pressed=true]{color:#f7bbc1;background:#7a3a5370}
.control .count{font-size:13px;font-weight:700;opacity:.9}
.sheet[hidden]{display:none!important}
.sheet{position:fixed;z-index:10;inset:0;display:flex;align-items:flex-end;justify-content:center;background:#061722aa}
.sheet-wrap{height:min(80dvh,790px);width:min(100%,640px);border-radius:27px 27px 0 0;background:#fbfcfd;color:#243b4c;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom);box-shadow:0 -10px 36px #0003}
.sheet-head{display:flex;align-items:center;gap:10px;padding:13px 17px;border-bottom:1px solid #e2e9ed;flex-shrink:0}
.sheet-head h2{margin:0;font-size:17px;text-align:center;flex:1}
.close{background:#eaf0f3;color:#24495e;border:0;border-radius:50%;width:43px;height:43px;font-size:24px}
.sheet-body{overflow-y:auto;overscroll-behavior:contain;flex:1;padding:19px 23px 40px}
.sheet-body h3{font-size:25px;line-height:1.19;margin:0 0 15px}
.story{white-space:pre-wrap;line-height:1.75;font-size:16px;margin:17px 0}
.comment{padding:13px 0;border-bottom:1px solid #e2e9ed}
.comment strong{display:block;margin-bottom:5px}
.comment p{margin:0;white-space:pre-wrap;line-height:1.48}
.muted{color:#687d8e;font-size:14px}
.notice{background:#ebf2f6;padding:12px;border-radius:13px;margin:12px 0;color:#34516b}
.notice.error{background:#ffeae8;color:#9e2d25}
form label{display:block;margin:12px 0 5px;font-size:14px;font-weight:700}
input,textarea{border:1px solid #b8c9d4;border-radius:11px;padding:12px 13px;width:100%;background:#fff;color:#18364a}
textarea{min-height:90px;resize:vertical}
.primary{border:0;background:#315f7e;color:#fff;font-weight:750;border-radius:13px;padding:13px 18px;min-height:47px;margin:10px 0;width:100%}
.secondary{border:1px solid #d9e6eb;color:#315f7e;background:#fff;border-radius:13px;padding:12px 18px;margin-top:8px;width:100%}
body.dialog-open{overflow:hidden}
@media(min-width:780px){.stage{height:100dvh}.photo{object-fit:contain;background:#17374b}.cover-copy{padding-bottom:8px}}
</style>
</head>
<body>
<main class="stage" aria-label="Gedeelde TALERA-herinnering">
__PHOTO__
<div class="shade"></div>
<header class="header"><span class="mark">TALERA</span><span class="single">Persoonlijk gedeeld · één herinnering</span></header>
<div class="cover-copy">
<p class="kicker">Een herinnering voor jou</p>
<h1>__TITLE__</h1>
<p class="date">__DATE__</p>
__AUDIO__
__VIDEO_BUTTON__
<button class="story-open" id="readStory" type="button">Lees het verhaal</button>
</div>
__VIDEO_PLAYER__
<div class="controls" aria-label="Reageren op deze herinnering">
<button class="control" id="heart" type="button" aria-pressed="false" aria-label="Hartje geven">
<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.8 4.8c-2-2.1-5.2-2.1-7.3 0L12 6.3l-1.5-1.5c-2.1-2.1-5.3-2.1-7.3 0-2.3 2.2-2.3 5.6 0 7.8L12 21l8.8-8.4c2.2-2.2 2.2-5.6 0-7.8z"/></svg>
<span class="count" id="heartCount">0</span>
</button>
<button class="control" id="replies" type="button" aria-label="Reacties bekijken">
<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 11.5a8.5 8.5 0 0 1-8.5 8.5c-1.5 0-2.8-.3-4-.9L3 21l1.6-4.8A8.5 8.5 0 1 1 20.5 11.5z"/></svg>
<span class="count" id="replyCount">0</span>
</button>
</div>
</main>
<section class="sheet" id="sheet" hidden aria-label="TALERA-herinnering">
<div class="sheet-wrap" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" tabindex="-1">
<div class="sheet-head"><button class="close" id="close" type="button" aria-label="Sluiten">×</button><h2 id="sheetTitle">Herinnering</h2><span style="width:43px"></span></div>
<div class="sheet-body" id="sheetBody"></div>
</div>
</section>
<script>
(()=>{
'use strict';
const title=__TITLE_JSON__,story=__STORY_JSON__,date=__DATE_JSON__;
const token=location.pathname.split('/')[2];
const $=id=>document.getElementById(id);
const panel=$('sheet'),body=$('sheetBody');
const signed={account:null,intent:null};
let mode='story',thread={items:[],heartCount:0,hearted:false},busy=false,loading=false,commentStamp='';
const api=async(path,method='GET',data)=>{
 const opts={method,credentials:'same-origin',cache:'no-store',headers:{accept:'application/json'}};
 if(data!==undefined){opts.headers['content-type']='application/json';opts.body=JSON.stringify(data)}
 const res=await fetch(path,opts),json=await res.json().catch(()=>({}));
 if(!res.ok){const err=new Error(json.error||'De aanvraag is niet gelukt');err.status=res.status;throw err}
 return json;
};
const base='/api/guest/threads/'+encodeURIComponent(token);
function create(tag,text,cls){const x=document.createElement(tag);if(text!==undefined)x.textContent=text;if(cls)x.className=cls;return x}
function clear(){body.replaceChildren()}
function alertText(text,error){const n=create('p',text,'notice'+(error?' error':''));body.prepend(n)}
function field(label,type,name,auto){
 const wrap=create('label',label);
 const input=create('input');input.type=type;input.name=name;input.required=true;input.autocomplete=auto;
 if(type==='password')input.minLength=8;
 wrap.append(input);return wrap;
}
function button(text,fn,cls='primary'){
 const n=create('button',text,cls);n.type='button';n.addEventListener('click',fn);return n;
}
function formButton(text){const b=create('button',text,'primary');b.type='submit';return b}
function open(next){
 mode=next;panel.hidden=false;document.body.classList.add('dialog-open');
 render();panel.querySelector('.sheet-wrap').focus({preventScroll:true});
}
function close(){panel.hidden=true;document.body.classList.remove('dialog-open')}
function formatComments(){
 const list=create('div');
 if(!thread.items.length)list.append(create('p','Er zijn nog geen reacties.','muted'));
 for(const c of thread.items){
  const row=create('div',undefined,'comment');
  row.append(create('strong',c.display_name||'TALERA-gebruiker'),create('p',c.body||''));
  list.append(row);
 }
 return list;
}
function render(){
 $('sheetTitle').textContent=({story:'Het verhaal',comments:'Reacties',login:'Aanmelden',register:'Account aanmaken'})[mode]||'TALERA';
 clear();
 if(mode==='story'){
  body.append(create('h3',title),create('p',date,'muted'),create('p',story,'story'));
  return;
 }
 if(mode==='comments'){
  commentStamp=JSON.stringify(thread.items.map(x=>[x.id,x.body]));
  body.append(formatComments());
  if(!signed.account){
   body.append(create('p','Meld je met je TALERA-account aan om een hartje of reactie achter te laten.','notice'));
   body.append(button('Aanmelden om te reageren',()=>{signed.intent='comments';open('login')}));
   body.append(button('Account aanmaken',()=>{signed.intent='comments';open('register')},'secondary'));
  }else{
   const form=create('form');
   const label=create('label','Jouw reactie'),input=create('textarea');
   input.name='body';input.required=true;input.maxLength=4000;label.append(input);
   form.append(label,formButton('Reactie plaatsen'));
   form.addEventListener('submit',async e=>{
    e.preventDefault();if(busy)return;busy=true;
    try{await api(base+'/comments','POST',{body:input.value});await refresh();render()}
    catch(err){if(err.status===401){signed.account=null;signed.intent='comments';open('login')}else alertText(err.message,true)}
    finally{busy=false}
   });
   body.append(form);
  }
  return;
 }
 const registering=mode==='register',form=create('form');
 body.append(create('p','Gebruik jouw TALERA-account. Na aanmelden keer je terug naar dezelfde herinnering.','muted'));
 if(registering){
  form.append(field('Naam','text','displayName','name'),field('Unieke gebruikersnaam','text','username','username'));
 }
 form.append(field('E-mailadres','email','email','email'),field('Wachtwoord','password','password',registering?'new-password':'current-password'));
 form.append(formButton(registering?'Account aanmaken':'Aanmelden'));
 form.addEventListener('submit',async e=>{
  e.preventDefault();if(busy)return;busy=true;
  const data=Object.fromEntries(new FormData(form).entries());
  try{
   const r=await api(registering?'/api/register':'/api/login','POST',data);
   signed.account=r.account;await refresh();const intention=signed.intent;
   if(intention==='heart'){signed.intent=null;busy=false;await toggleHeart();close()}
   else{signed.intent=null;open('comments')}
  }catch(err){alertText(err.message,true)}finally{busy=false}
 });
 body.append(form);
 body.append(button(registering?'Ik heb al een account':'Account aanmaken',()=>open(registering?'login':'register'),'secondary'));
}
function syncCounts(){
 $('heartCount').textContent=String(thread.heartCount||0);
 $('replyCount').textContent=String(thread.items?.length||0);
 $('heart').setAttribute('aria-pressed',String(!!thread.hearted));
}
async function refresh(){
 if(loading)return;loading=true;
 try{
  const result=await api(base);
  thread=result;signed.account=result.account||null;syncCounts();
  if(mode==='comments'&&!panel.hidden){
   const latest=JSON.stringify(thread.items.map(x=>[x.id,x.body]));
   const writing=!!body.querySelector('textarea')?.value;
   if(!writing&&latest!==commentStamp)render();
  }
 }catch(err){if(err.status===404){$('readStory').textContent='Deze deellink is verlopen';$('readStory').disabled=true;close()}}
 finally{loading=false}
}
async function toggleHeart(){
 if(busy)return;
 busy=true;
 try{
  await api(base+'/like','POST',{});
  await refresh();
 }catch(err){
  if(err.status===401){signed.account=null;signed.intent='heart';open('login')}
  else{open('comments');alertText(err.message,true)}
 }finally{busy=false}
}
const videoPanel=$('videoPanel');
if(videoPanel){
 const player=$('guestVideo');
 $('watchVideo').addEventListener('click',()=>{videoPanel.hidden=false;player.load();});
 $('closeVideo').addEventListener('click',()=>{player.pause();videoPanel.hidden=true;});
}
$('readStory').addEventListener('click',()=>open('story'));
$('replies').addEventListener('click',()=>{open('comments');void refresh()});
$('heart').addEventListener('click',()=>{if(!signed.account){signed.intent='heart';open('login')}else void toggleHeart()});
$('close').addEventListener('click',close);
panel.addEventListener('click',e=>{if(e.target===panel)close()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!panel.hidden)close()});
void refresh();
setInterval(()=>{if(!document.hidden)void refresh()},8000);
})();
</script>
</body>
</html>
